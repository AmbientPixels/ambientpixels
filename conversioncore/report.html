<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conversion Audit Report — ConversionCore</title>
  <link rel="icon" href="/images/favicon.ico">
  <link rel="stylesheet" href="/conversioncore/css/conversioncore.css">
  <style>
    /* Report-specific styles */
    .cc-report-header { text-align: center; padding: 40px 0 32px; }
    .cc-report-url { font-size: 14px; color: var(--cc-text-muted); margin-top: 8px; word-break: break-all; }
    .cc-report-date { font-size: 12px; color: var(--cc-text-muted); }

    .cc-section { margin-bottom: 32px; }
    .cc-section h2 { font-size: 20px; margin-bottom: 16px; padding-bottom: 8px; border-bottom: 1px solid var(--cc-border); }

    .cc-exec-summary { font-size: 15px; line-height: 1.7; color: var(--cc-text-secondary); }
    .cc-health-assessment { font-size: 13px; color: var(--cc-text-muted); margin-top: 12px; padding: 12px 16px; background: var(--cc-surface); border-radius: var(--cc-radius-sm); }

    /* Dimension bars */
    .cc-dim-bar { margin-bottom: 16px; }
    .cc-dim-bar-header { display: flex; justify-content: space-between; margin-bottom: 6px; }
    .cc-dim-bar-label { font-size: 14px; }
    .cc-dim-bar-score { font-size: 14px; font-weight: 600; }
    .cc-dim-bar-track { height: 10px; background: #1e293b; border-radius: 5px; overflow: hidden; }
    .cc-dim-bar-fill { height: 100%; border-radius: 5px; transition: width 0.8s ease-out; }

    /* Priority cards */
    .cc-priority { background: var(--cc-surface); border: 1px solid var(--cc-border); border-radius: var(--cc-radius); padding: 20px; margin-bottom: 12px; }
    .cc-priority-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .cc-priority h4 { font-size: 16px; margin: 0; }
    .cc-priority-desc { font-size: 14px; color: var(--cc-text-secondary); margin-bottom: 8px; }
    .cc-priority-impact { font-size: 12px; color: var(--cc-accent); }
    .cc-effort-badge { padding: 2px 10px; border-radius: 4px; font-size: 11px; font-weight: 600; }
    .cc-effort-quick { background: var(--cc-accent-soft); color: var(--cc-accent); }
    .cc-effort-medium { background: var(--cc-warning-soft); color: var(--cc-warning); }
    .cc-effort-rebuild { background: var(--cc-danger-soft); color: var(--cc-danger); }

    /* Rewrites */
    .cc-rewrite { background: var(--cc-surface); border-left: 3px solid var(--cc-accent); padding: 14px 18px; margin-bottom: 10px; border-radius: 0 var(--cc-radius-sm) var(--cc-radius-sm) 0; }
    .cc-rewrite-label { font-size: 11px; color: var(--cc-text-muted); margin-bottom: 4px; }
    .cc-rewrite-current { font-size: 14px; color: #f87171; text-decoration: line-through; margin-bottom: 8px; }
    .cc-rewrite-suggested { font-size: 14px; color: var(--cc-accent); font-weight: 600; margin-bottom: 8px; }
    .cc-rewrite-rationale { font-size: 12px; color: var(--cc-text-muted); }

    /* Findings table */
    .cc-findings-table { width: 100%; border-collapse: collapse; }
    .cc-findings-table th { padding: 10px 12px; text-align: left; font-size: 11px; color: var(--cc-text-muted); text-transform: uppercase; border-bottom: 2px solid #1e293b; }
    .cc-findings-table td { padding: 10px 12px; font-size: 13px; border-bottom: 1px solid rgba(255,255,255,0.04); }

    /* Upsell */
    .cc-report-upsell { background: linear-gradient(135deg, var(--cc-surface), #1a2332); border: 1px solid rgba(16,185,129,0.2); border-radius: var(--cc-radius); padding: 32px; text-align: center; }
    .cc-report-upsell h3 { font-size: 20px; margin-bottom: 8px; }
    .cc-report-upsell p { font-size: 14px; color: var(--cc-text-secondary); margin-bottom: 20px; }
    .cc-report-upsell a { display: inline-block; padding: 12px 28px; background: var(--cc-accent); color: #fff; font-weight: 600; border-radius: var(--cc-radius-sm); }

    /* Actions bar */
    .cc-actions { display: flex; justify-content: center; gap: 12px; margin-bottom: 32px; }
    .cc-action-btn { padding: 10px 20px; font-size: 13px; font-weight: 600; border-radius: var(--cc-radius-sm); cursor: pointer; border: 1px solid var(--cc-border); background: transparent; color: var(--cc-text-secondary); font-family: var(--cc-font); transition: all 0.2s; }
    .cc-action-btn:hover { border-color: var(--cc-accent); color: var(--cc-accent); }

    /* Methodology */
    .cc-methodology { font-size: 11px; color: var(--cc-text-muted); padding: 16px; background: var(--cc-surface); border-radius: var(--cc-radius-sm); }

    /* Report loading */
    .cc-report-loading { text-align: center; padding: 80px 0; }

    /* Paywall */
    .cc-paywall { text-align: center; padding: 60px 24px; }

    @media print {
      .cc-brand-bar, .cc-actions, .cc-report-upsell, .cc-footer { display: none; }
      body { background: #fff; color: #1a1a1a; }
      .cc-dim-bar-track { background: #e5e7eb; }
      .cc-section h2 { border-bottom-color: #d1d5db; }
    }
  </style>
</head>
<body>

  <!-- Brand Bar -->
  <header class="cc-brand-bar">
    <div class="cc-container">
      <a href="/conversioncore/" class="cc-brand-name" style="text-decoration:none;">ConversionCore</a>
      <a href="https://ambientpixels.ai" class="cc-brand-link">by AmbientPixels</a>
    </div>
  </header>

  <!-- Loading -->
  <div id="cc-report-loading" class="cc-report-loading">
    <div class="cc-container">
      <div class="cc-spinner"></div>
      <p class="cc-loading-text">Loading your report...</p>
    </div>
  </div>

  <!-- Report Content (injected by JS) -->
  <div id="cc-report-content" class="cc-container" style="display:none;"></div>

  <!-- Footer -->
  <footer class="cc-footer">
    <div class="cc-container">
      <p>&copy; 2026 ConversionCore by <a href="https://ambientpixels.ai">AmbientPixels</a></p>
    </div>
  </footer>

  <script src="/conversioncore/js/report.js"></script>
</body>
</html>
