<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Ambient Pixels</title>
  <link rel="icon" href="/images/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ap-bg: #071019;
      --ap-surface: #0d1a28;
      --ap-border: #1a2a3a;
      --ap-text: #D8E0E5;
      --ap-text-muted: #8a95a0;
      --ap-accent: #6366f1;
      --ap-accent-hover: #5558e6;
      --ap-google: #4285f4;
      --ap-google-hover: #3574e0;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--ap-bg);
      color: var(--ap-text);
      font-family: 'Inter', -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .ap-login {
      text-align: center;
      max-width: 420px;
      width: 90%;
      padding: 2rem;
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .ap-login__logo {
      width: 48px;
      height: 48px;
      margin: 0 auto 0.75rem;
    }

    .ap-login__logo img {
      width: 100%;
      height: 100%;
      border-radius: 8px;
    }

    .ap-login__title {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 0.25rem;
    }

    .ap-login__subtitle {
      font-size: 0.85rem;
      color: var(--ap-text-muted);
      margin-bottom: 2rem;
    }

    .ap-login__card {
      background: var(--ap-surface);
      border: 1px solid var(--ap-border);
      border-radius: 12px;
      padding: 2rem 1.5rem;
      margin-bottom: 1.5rem;
    }

    .ap-login__btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      width: 100%;
      padding: 0.85rem 1.5rem;
      border-radius: 8px;
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem;
      font-weight: 500;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .ap-login__btn--google {
      background: var(--ap-google);
      color: #fff;
      border: none;
    }

    .ap-login__btn--google:hover {
      background: var(--ap-google-hover);
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(66, 133, 244, 0.3);
    }

    .ap-login__divider {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin: 1.25rem 0;
    }

    .ap-login__divider hr {
      flex: 1;
      border: none;
      border-top: 1px solid var(--ap-border);
    }

    .ap-login__divider span {
      font-size: 0.75rem;
      color: var(--ap-text-muted);
    }

    .ap-login__btn--ms {
      background: transparent;
      border: 1px solid var(--ap-border);
      color: var(--ap-text-muted);
    }

    .ap-login__btn--ms:hover {
      border-color: var(--ap-accent);
      color: var(--ap-text);
    }

    .ap-login__footer {
      font-size: 0.8rem;
      color: var(--ap-text-muted);
    }

    .ap-login__footer a {
      color: var(--ap-text-muted);
      text-decoration: none;
      opacity: 0.8;
    }

    .ap-login__footer a:hover {
      opacity: 1;
      color: var(--ap-text);
    }

    /* Subtle background grid */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: -1;
      background-image:
        radial-gradient(circle at 20% 50%, rgba(99, 102, 241, 0.05) 0%, transparent 50%),
        radial-gradient(circle at 80% 50%, rgba(99, 102, 241, 0.03) 0%, transparent 50%);
    }
  </style>
</head>
<body>
  <div class="ap-login">
    <div class="ap-login__logo">
      <img src="/images/ambient-pixel-logo-rainbow.png" alt="Ambient Pixels">
    </div>
    <h1 class="ap-login__title">Ambient Pixels</h1>
    <p class="ap-login__subtitle">Sign in to continue</p>

    <div class="ap-login__card">
      <a href="/.auth/login/google?post_login_redirect_uri=/" class="ap-login__btn ap-login__btn--google" id="ap-login-google">
        <i class="fab fa-google"></i>
        Sign in with Google
      </a>

      <div class="ap-login__divider">
        <hr><span>or</span><hr>
      </div>

      <a href="/.auth/login/aad?post_login_redirect_uri=/" class="ap-login__btn ap-login__btn--ms" id="ap-login-ms">
        <i class="fab fa-microsoft"></i>
        Sign in with Microsoft
      </a>
    </div>

    <p class="ap-login__footer">
      <a href="/"><i class="fas fa-arrow-left"></i> Back to Ambient Pixels</a>
    </p>
  </div>

  <script>
    (function() {
      var params = new URLSearchParams(window.location.search);
      var redirect = params.get('redirect') || '/';
      var encoded = encodeURIComponent(redirect);
      var google = document.getElementById('ap-login-google');
      var ms = document.getElementById('ap-login-ms');
      if (google) google.href = '/.auth/login/google?post_login_redirect_uri=' + encoded;
      if (ms) ms.href = '/.auth/login/aad?post_login_redirect_uri=' + encoded;
    })();
  </script>
</body>
</html>
