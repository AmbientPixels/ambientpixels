<!DOCTYPE html>
<html lang="en">

<body class="blog-wrapper">
  <!-- Branded Header -->
  <div class="ap-brand-bar">
    <div class="ap-brand-inner">
      <a href="/" class="ap-brand-logo">
        <img src="/images/ambient-pixel-logo-rainbow.png" alt="Ambient Pixels" />
        <span class="ap-brand-name">Ambient Pixels</span>
      </a>
      <nav class="ap-brand-nav">
        <a href="/">Home</a>
        <a href="/blog/" class="ap-brand-nav--active">Blog</a>

        <a href="/projects/">Projects</a>
      </nav>
    </div>
    <div class="blog-spectrum-line"></div>
  </div>

  <div class="blog-container">

    <div id="blog-loading" class="blog-loading">
      <i class="fas fa-spinner fa-spin"></i> Loading...

    <div id="blog-error" style="display:none;"></div>

    <div id="blog-header" style="display:none;"></div>
    <div id="blog-content" style="display:none;"></div>

    <div class="blog-footer">

        <img src="/images/ambient-pixel-logo-rainbow.png" alt="Ambient Pixels" />

      <div class="ap-footer-links">
        <a href="/">Home</a> · <a href="/blog/">Blog</a> · <a href="/log/">Activity Log</a> · <a href="/nova/">Nova</a>
      </div>
      <div class="ap-footer-legal">
        &copy; 2026 AmbientPixels.ai · <a href="/privacy.html">Privacy</a> · <a href="/terms.html">Terms</a>
      </div>

  <script src="/blog/blog.js"></script>
