<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="StoryForge Gallery — Browse completed adventures from players around the world. Filter by genre, sort by level, and share your stories." />
  <link rel="icon" href="/images/favicon.ico" type="image/x-icon" />
  <link rel="canonical" href="https://www.ambientpixels.ai/storyforge/gallery.html" />
  <title>Gallery — StoryForge</title>
  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="StoryForge Gallery — Player Adventures" />
  <meta property="og:description" content="Browse completed adventures from players around the world. Filter by genre, sort by level, and share your stories." />
  <meta property="og:image" content="https://www.ambientpixels.ai/storyforge/images/hero-banner01.webp" />
  <meta property="og:url" content="https://www.ambientpixels.ai/storyforge/gallery.html" />
  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="StoryForge Gallery — Player Adventures" />
  <meta name="twitter:description" content="Browse completed adventures from players around the world. Filter by genre, sort by level, and share your stories." />
  <meta name="twitter:image" content="https://www.ambientpixels.ai/storyforge/images/hero-banner01.webp" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Russo+One&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/base.css?v=20260310b" />
  <link rel="stylesheet" href="/css/theme.css?v=20260310b" />
  <link rel="stylesheet" href="css/adventure-base.css?v=20260310b" />
  <link rel="stylesheet" href="css/adventure-gallery.css?v=20260310b" />
  <link rel="stylesheet" href="css/adventure-effects.css?v=20260310b" />
  <link rel="stylesheet" href="css/adventure-responsive.css?v=20260310b" />
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "CollectionPage",
    "name": "StoryForge Gallery — Player Adventures",
    "description": "Browse completed adventures from players around the world. Filter by genre, sort by level, and share your stories.",
    "url": "https://www.ambientpixels.ai/storyforge/gallery.html",
    "isPartOf": { "@type": "WebSite", "name": "AmbientPixels", "url": "https://www.ambientpixels.ai" }
  }
  </script>
</head>
<body style="background:#0F0F23" data-theme="dark">
  <div class="adv-app">

    <!-- Header -->
    <header class="adv-header">
      <a href="/storyforge/" class="adv-header__logo">
        <i class="fas fa-book-open-reader"></i>
        <span>StoryForge</span>
      </a>
      <nav class="adv-header__nav">
        <a href="/storyforge/" class="adv-header__link">Hub</a>
        <a href="/storyforge/gallery.html" class="adv-header__link adv-header__link--active">Gallery</a>
        <a id="adv-login-btn" class="adv-header__link" href="/.auth/login/aad?post_login_redirect_uri=/storyforge/gallery.html">
          <i class="fas fa-sign-in-alt"></i> Sign In
        </a>
        <span id="adv-user-status" class="adv-user-status" style="display:none;">
          <span class="adv-user-dot"></span>
          <span id="adv-user-name"></span>
          <a id="adv-logout-btn" class="adv-header__link" href="#"><i class="fas fa-sign-out-alt"></i></a>
        </span>
      </nav>
    </header>

    <main class="adv-gallery">

      <!-- Hero -->
      <div class="adv-gallery__hero">
        <h1><i class="fas fa-images"></i> Adventure Gallery</h1>
        <p>Browse completed adventures from players around the world.</p>
      </div>

      <!-- Stats Bar -->
      <div class="adv-gallery__stats-bar" id="galleryStatsBar">
        <!-- Injected by JS -->
      </div>

      <!-- Toolbar: Filters + Sort + Search -->
      <div class="adv-gallery__toolbar">
        <div class="adv-gallery__filters" id="galleryFilters">
          <!-- Injected by JS -->
        </div>
        <div class="adv-gallery__controls">
          <div class="adv-gallery__search">
            <i class="fas fa-search"></i>
            <input type="text" id="gallerySearch" placeholder="Search adventures..." autocomplete="off" aria-label="Search adventures" />
          </div>
          <div class="adv-gallery__sort">
            <i class="fas fa-arrow-down-short-wide"></i>
            <select id="gallerySort" aria-label="Sort adventures">
              <option value="newest">Newest</option>
              <option value="oldest">Oldest</option>
              <option value="longest">Most Turns</option>
              <option value="shortest">Fewest Turns</option>
              <option value="level">Highest Level</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Adventure Grid (Masonry) -->
      <div class="adv-gallery__grid" id="galleryGrid">
        <!-- Injected by JS -->
      </div>

      <!-- Load More -->
      <div class="adv-gallery__load-more" id="loadMoreWrap" style="display:none;">
        <button class="adv-btn" id="loadMoreBtn">
          <i class="fas fa-chevron-down"></i> Load More
        </button>
      </div>

      <!-- Empty State -->
      <div class="adv-gallery__empty" id="galleryEmpty" style="display:none;">
        <i class="fas fa-compass"></i>
        <p>No adventures found. Start your own journey!</p>
        <a href="/storyforge/" class="adv-btn adv-btn--primary" style="margin-top:1rem;">
          <i class="fas fa-play"></i> Start Adventure
        </a>
      </div>

    </main>

    <footer class="sf-footer">
      <p>&copy; 2026 StoryForge by <a href="https://ambientpixels.ai">AmbientPixels</a></p>
      <p class="sf-footer__links">More from AmbientPixels: <a href="https://ambientpixels.ai/cardforge/">CardForge</a></p>
    </footer>
    <div class="adv-toast-container" id="toastContainer"></div>
  </div>

  <script src="js/adventure-ui.js" defer></script>
  <script src="js/adventure-share.js" defer></script>
  <script src="js/adventure-gallery.js" defer></script>
  <script>
  (function () {
    async function checkAuth() {
      try {
        var resp = await fetch('/.auth/me');
        if (!resp.ok) return;
        var data = await resp.json();
        var cp = data.clientPrincipal;
        if (!cp) return;
        var name = (cp.userDetails || '').split('@')[0] || 'User';
        sessionStorage.setItem('isAuthenticated', 'true');
        sessionStorage.setItem('userInfo', JSON.stringify({ userId: cp.userId, name: name, email: cp.userDetails }));
        var loginBtn = document.getElementById('adv-login-btn');
        var userStatus = document.getElementById('adv-user-status');
        var userName = document.getElementById('adv-user-name');
        if (loginBtn) loginBtn.style.display = 'none';
        if (userStatus) userStatus.style.display = 'inline-flex';
        if (userName) userName.textContent = name;
      } catch (e) { /* not authenticated */ }
    }
    var logoutBtn = document.getElementById('adv-logout-btn');
    if (logoutBtn) {
      logoutBtn.addEventListener('click', function (e) {
        e.preventDefault();
        sessionStorage.removeItem('isAuthenticated');
        sessionStorage.removeItem('userInfo');
        window.location.href = '/.auth/logout?post_logout_redirect_uri=/storyforge/gallery.html';
      });
    }
    checkAuth();
  })();
  </script>
</body>
</html>
