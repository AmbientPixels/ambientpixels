name: Azure Static Web Apps CI/CD (Demo - DISABLED)
# To re-enable: change 'demo-deploy' back to 'master' on both branches below
on:
  push:
    branches:
      - demo-deploy
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - demo-deploy

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false

      - name: Prepare demo build
        run: |
          # Build lean static output (same approach as prod workflow)
          mkdir -p demo_build
          rsync -av \
            --exclude='api' \
            --exclude='node_modules' \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.windsurf' \
            --exclude='images' \
            --exclude='video' \
            --exclude='downloads' \
            --exclude='hanson' \
            ./ demo_build/

          # Strip external API rewrites from staticwebapp.config.json
          # so API calls go to SWA managed functions (with demo env vars), not prod
          node -e "
            const fs = require('fs');
            const cfg = JSON.parse(fs.readFileSync('demo_build/staticwebapp.config.json', 'utf8'));

            // Strip external API rewrites — use SWA managed functions instead
            cfg.routes = cfg.routes.filter(r => !r.rewrite || !r.rewrite.includes('ambientpixels-nova-api'));
            cfg.allowedForwardedHosts = [];

            // Redirect root to company dashboard
            cfg.routes.unshift({ route: '/', redirect: '/modules/company/', statusCode: 302 });

            // Open ALL routes to anonymous (no auth in demo)
            cfg.routes.forEach(r => {
              if (r.allowedRoles) {
                r.allowedRoles = ['anonymous'];
              }
            });

            // Remove auth provider config (not needed for demo)
            delete cfg.auth;

            // Remove 401 response override (no login page in demo)
            if (cfg.responseOverrides) {
              delete cfg.responseOverrides['401'];
            }

            fs.writeFileSync('demo_build/staticwebapp.config.json', JSON.stringify(cfg, null, 2));
          "

          # Rebrand for demo: AmbientPixels → Story Stream
          find demo_build -type f \( -name '*.html' -o -name '*.js' -o -name '*.css' -o -name '*.json' \) \
            -exec sed -i 's/AmbientPixels/Story Stream/g' {} +

          # Rebrand CEO agent: Pixelpusher → Will (display names only, not the API secret)
          find demo_build -type f \( -name '*.html' -o -name '*.js' -o -name '*.json' \) \
            -exec sed -i \
              -e "s/Pixelpusher (Chad)/Will Frasier/g" \
              -e "s/Chad (Pixelpusher)/Will Frasier/g" \
              -e "s/Chad Martin (Pixelpusher)/Will Frasier/g" \
              -e "s/\"name\": \"Pixelpusher\"/\"name\": \"Will\"/g" \
              -e "s/\"ceo\": \"Pixelpusher.*\"/\"ceo\": \"Will Frasier\"/g" \
              -e "s/approved_by = 'Pixelpusher'/approved_by = 'Will'/g" \
              -e "s/origin_agent: 'pixelpusher'/origin_agent: 'will'/g" \
              -e "s/created_by: 'pixelpusher'/created_by: 'will'/g" \
              {} +

          # Remove Nova Nexus and CardForge tools from demo
          sed -i '/nova-nexus/d' demo_build/js/agent-engine.js
          sed -i '/cardforge/d' demo_build/js/agent-engine.js

          # Prepare API: remove timer-triggered functions (SWA only supports HTTP triggers)
          rm -rf api/companyHeartbeat
          rm -rf api/companyMorningReport
          rm -rf api/actionsScheduler
          rm -rf api/actionsMetricsPull
          rm -rf api/socialEngagementPull
          rm -rf api/formIntakeDigestTimer
          rm -rf api/companyTrendIngest

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_KIND_OCEAN_06C6F7B10 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "demo_build"
          api_location: "api"
          output_location: "."
          skip_app_build: true

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_KIND_OCEAN_06C6F7B10 }}
          action: "close"
