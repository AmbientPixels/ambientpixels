name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - master

permissions:
  contents: read
  pull-requests: write

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Regenerate site manifest digest
        run: node scripts/buildSiteManifest.js

      - name: Build Static Artifacts
        run: |
          mkdir app_build
          rsync -av \
            --exclude='api' \
            --exclude='node_modules' \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.windsurf' \
            --exclude='downloads' \
            --exclude='images/deviant-source.png' \
            --exclude='images/artwork/hearts*.png' \
            ./ app_build/
          echo "--- app_build size ---"
          du -sh app_build/

      - name: Generate build version metadata
        run: |
          VERSION=$(node -p "require('./package.json').version || 'v--'")
          SHORT_SHA=$(git rev-parse --short HEAD)
          UPDATED=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          mkdir -p app_build/data
          cat > app_build/data/version.json <<EOF
          {
            "version": "v${VERSION}",
            "build": "${SHORT_SHA}",
            "updated": "${UPDATED}"
          }
          EOF

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_CALM_SKY_05CC8E110 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "app_build" # Only static files
          skip_app_build: true

      # Deploy /api to Azure Function App (standalone)
      # Note: Azure/functions-action@v1 was disabled by GitHub staff for a
      # ToS violation (discovered June 2026). Switched to a direct Kudu
      # zip-deploy using the existing publish-profile secret. No external
      # action dependency.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'

      - name: Install dependencies for API
        run: |
          cd api
          npm install

      - name: Deploy API to Azure Functions (Kudu zip-deploy)
        env:
          PUBLISH_PROFILE: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
          APP_NAME: ambientpixels-nova-api
        run: |
          set -euo pipefail

          # Build deploy zip
          cd api
          zip -qr ../api-deploy.zip . -x "node_modules/.cache/*"
          cd ..
          echo "Built api-deploy.zip ($(du -h api-deploy.zip | cut -f1))"

          # Parse MSDeploy credentials from publish-profile XML
          cat > /tmp/parse_creds.py <<'PY'
          import os, sys, xml.etree.ElementTree as ET
          root = ET.fromstring(os.environ['PUBLISH_PROFILE'])
          for prof in root.findall('publishProfile'):
              if prof.get('publishMethod') == 'MSDeploy':
                  print(prof.get('userName'))
                  print(prof.get('userPWD'))
                  sys.exit(0)
          sys.stderr.write('No MSDeploy profile in publish-profile XML\n')
          sys.exit(1)
          PY
          CREDS=$(python3 /tmp/parse_creds.py)
          USER=$(echo "$CREDS" | sed -n '1p')
          PASS=$(echo "$CREDS" | sed -n '2p')

          if [ -z "$USER" ] || [ -z "$PASS" ]; then
            echo "::error::Failed to parse MSDeploy credentials from publish profile"
            exit 1
          fi

          # Push to Kudu zipdeploy
          HTTP=$(curl -sS -w "%{http_code}" -o deploy-response.log \
            -X POST \
            -u "$USER:$PASS" \
            -H "Content-Type: application/zip" \
            --max-time 600 \
            --data-binary @api-deploy.zip \
            "https://${APP_NAME}.scm.azurewebsites.net/api/zipdeploy")

          echo "Kudu HTTP status: $HTTP"
          echo "--- Kudu response ---"
          cat deploy-response.log || true
          echo ""
          echo "---"

          if [ "$HTTP" -lt 200 ] || [ "$HTTP" -ge 300 ]; then
            echo "::error::Kudu zipdeploy failed (HTTP $HTTP)"
            exit 1
          fi
          echo "API deployed to ${APP_NAME}"

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_CALM_SKY_05CC8E110 }}
          action: "close"
          app_location: "app_build"
          api_location: "/api"
