name: keepalive

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping healthz
        id: ping
        run: |
          start=$(date +%s%3N)
          http_code=$(curl -sS --max-time 30 -o /tmp/healthz.json -w "%{http_code}" \
            https://ambientpixels-nova-api.azurewebsites.net/api/healthz || echo "000")
          end=$(date +%s%3N)
          latency=$((end - start))
          if [ "$http_code" = "200" ]; then
            status=ok
          else
            status=fail
            echo "::warning::healthz returned $http_code after ${latency}ms"
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "latency=$latency" >> "$GITHUB_OUTPUT"
          echo "http_code=$http_code" >> "$GITHUB_OUTPUT"
          echo "healthz: http=$http_code status=$status latency=${latency}ms"
          cat /tmp/healthz.json 2>/dev/null || true

      - name: Record result
        env:
          COMPANY_SECRET: ${{ secrets.COMPANY_WRITE_SECRET }}
        run: |
          payload=$(printf '{"status":"%s","latencyMs":%s}' \
            "${{ steps.ping.outputs.status }}" \
            "${{ steps.ping.outputs.latency }}")
          echo "posting: $payload"
          curl -sS --max-time 30 -X POST \
            https://ambientpixels-nova-api.azurewebsites.net/api/keepalive-record \
            -H "Content-Type: application/json" \
            -H "x-company-secret: $COMPANY_SECRET" \
            -d "$payload"
          echo ""
