name: Daily Standup (Auto)

# Schedule: Weekdays at 7:30am America/Los_Angeles
# UTC conversion: 7:30am PST = 15:30 UTC (during PST, Nov-Mar)
#                 7:30am PDT = 14:30 UTC (during PDT, Mar-Nov)
# Using 15:30 UTC (PST). During PDT this will run at 8:30am PT.
# Acceptable 1-hour drift; no DST logic needed.
on:
  schedule:
    - cron: '30 15 * * 1-5'  # Mon-Fri at 15:30 UTC (7:30am PST / 8:30am PDT)
  workflow_dispatch:  # Allow manual trigger

jobs:
  run-standup:
    runs-on: ubuntu-latest
    steps:
      - name: Log trigger
        run: |
          echo "🗓️ Daily Standup trigger: ${{ github.event_name }}"
          echo "🕐 UTC time: $(date -u)"

      - name: Run Daily Standup
        id: standup
        run: |
          # POST directly to the Azure Function App (SWA only proxies GET)
          HTTP_CODE=$(curl -s -o response.json -w "%{http_code}" \
            --max-time 300 \
            -X POST \
            -H "Content-Type: application/json" \
            -H "x-standup-key: ${{ secrets.STANDUP_API_KEY }}" \
            "https://ambientpixels-nova-api.azurewebsites.net/api/company-standup-run")

          echo "::group::Response"
          echo "HTTP status: $HTTP_CODE"
          cat response.json 2>/dev/null || echo "(no response body)"
          echo ""
          echo "::endgroup::"

          # ── Evaluate result ──
          # Success: 200 (ran or skipped) and 409 (concurrent run already in progress)
          # Failure: 401 (auth), 5xx (server error), network error, anything else
          case "$HTTP_CODE" in
            200)
              if grep -q '"skipped":true' response.json 2>/dev/null; then
                echo "✅ Standup already ran today — skipped (success)."
              else
                echo "✅ Standup completed successfully."
              fi
              ;;
            409)
              echo "⚠️ Standup already in progress (409) — treating as success."
              ;;
            401)
              echo "❌ Unauthorized (401). Check STANDUP_API_KEY secret."
              exit 1
              ;;
            000)
              echo "❌ Network error — could not reach Function App."
              exit 1
              ;;
            *)
              echo "❌ Standup failed with HTTP $HTTP_CODE"
              exit 1
              ;;
          esac

      - name: Log completion
        if: always()
        run: echo "🏁 Daily standup workflow finished at $(date -u)"
