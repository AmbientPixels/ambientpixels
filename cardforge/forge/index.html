<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CardForge — The Forge</title>

  <!-- Fonts:
       Unbounded (display), Space Grotesk (sans), JetBrains Mono (mono) — chrome + hero.
       Fraunces (Monograph), Cinzel (Codex + Arcade), Archivo Black (Press) — card styles. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;500;600;700;800&family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Fraunces:ital,wght@0,400..900;1,400..900&family=Cinzel:wght@400;500;600;700&family=Archivo+Black&display=swap" rel="stylesheet">

  <!-- Font Awesome (stage buttons + chevrons + overlays + arcade icons) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- CSS load order: tokens → chrome → editor → panels → card-styles → responsive (last) -->
  <link rel="stylesheet" href="css/forge-tokens.css">
  <link rel="stylesheet" href="css/forge-chrome.css">
  <link rel="stylesheet" href="css/forge-editor.css">
  <link rel="stylesheet" href="css/forge-panels.css">
  <link rel="stylesheet" href="css/forge-card-styles.css">
  <link rel="stylesheet" href="css/forge-responsive.css">
</head>
<body class="forge-page">

  <!-- Sub-1280px notice — hidden on desktop via forge-responsive.css -->
  <div class="forge-mobile-notice">
    <h1>Best viewed on desktop</h1>
    <p>CardForge FORGE is optimized for <span class="forge-mobile-dot">1280px+</span> screens. Mobile + tablet support is coming soon.</p>
  </div>

  <header class="forge-topbar">
    <div class="forge-topbar-left">
      <a class="forge-logo" href="/cardforge/" aria-label="CardForge home">
        <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
          <defs>
            <linearGradient id="forge-logo-gradient" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#ff7a1a"/>
              <stop offset="1" stop-color="#ff9a4e"/>
            </linearGradient>
          </defs>
          <polygon points="12,2 22,7 22,17 12,22 2,17 2,7" fill="url(#forge-logo-gradient)"/>
        </svg>
        <span>CardForge</span>
      </a>
      <nav class="forge-nav" aria-label="Primary">
        <a href="/cardforge/forge/" class="is-active">The Forge</a>
        <a href="/cardforge/forge/library.html">Library</a>
        <a href="/cardforge/forge/gallery.html">Community</a>
      </nav>
    </div>
    <div class="forge-topbar-right">
      <!-- Card-style pill lands in Phase 5 Task 5.8 -->
      <button class="forge-signin" type="button">SIGN IN</button>
    </div>
  </header>

  <main class="forge-editor">
    <aside class="forge-editor-left" id="forge-left-panel" aria-label="Editor left panel">
      <!-- Populated by forge-left-panel.js: Identity + Stages + Pick Card Style -->
    </aside>

    <section class="forge-editor-stage" id="forge-stage" aria-label="Card design stage">
      <header class="forge-stage-header">
        <!-- Populated by forge-stage.js: stage crumb + title + icon buttons -->
      </header>

      <div class="forge-stage-floor">
        <div class="forge-stage-glow" aria-hidden="true"></div>
        <div class="forge-stage-card" id="forge-stage-card">
          <!-- Phase 5 Task 5.1: card render dispatched by window.ForgeRender -->
        </div>
      </div>

      <footer class="forge-stage-footer">
        <!-- Populated by forge-stage.js: action row (undo / shuffle / hammer / share / caption) -->
      </footer>
    </section>

    <aside class="forge-editor-right" id="forge-right-panel" aria-label="Editor right panel">
      <!-- Populated by forge-right-panel.js: Vitals + Overlays + Live state + FORGE → NEXT -->
    </aside>
  </main>

  <!-- Core modules — load order matters. With `defer`, scripts run in document order
       after parsing. State store must exist before any panel subscribes. -->
  <!-- Telemetry wrapper loads FIRST so every later module can call it safely.
       Silent-fail until prod flips the App Insights config flag (audit 0.3). -->
  <script src="js/forge-telemetry.js" defer></script>
  <script src="js/forge-state.js" defer></script>
  <script src="js/forge-stage-flow.js" defer></script>
  <script src="js/forge-portrait.js" defer></script>

  <!-- Card render dispatcher + 6 style modules (each registers window.ForgeStyle<X>) -->
  <script src="js/forge-render.js" defer></script>
  <script src="js/forge-styles/style-ember.js" defer></script>
  <script src="js/forge-styles/style-monograph.js" defer></script>
  <script src="js/forge-styles/style-codex.js" defer></script>
  <script src="js/forge-styles/style-press.js" defer></script>
  <script src="js/forge-styles/style-arcade.js" defer></script>
  <script src="js/forge-styles/style-terminal.js" defer></script>

  <!-- html-to-image for Phase 7 mint-stage PNG/SVG export (CDN) -->
  <script src="https://unpkg.com/html-to-image@1.11.13/dist/html-to-image.js" defer></script>

  <!-- Mint module — hash, publish, export helpers -->
  <script src="js/forge-share.js" defer></script>

  <!-- Panel modules (self-initialize on DOMContentLoaded, subscribe to ForgeState) -->
  <script src="js/forge-left-panel.js" defer></script>
  <script src="js/forge-stage.js" defer></script>
  <script src="js/forge-right-panel.js" defer></script>

</body>
</html>
