<body>
  <h1 class="sr-only">Deck Builder — CardForge</h1>
  <header data-cf-nav="decks"></header>
  <div id="db-app" class="db-app">
    <div class="db-loading">

  <script src="/cardforge/js/config.js?v=20260425f"></script>

  <script>
    // Bootstrap auth state for deck builder (mirrors index.html auth check)
    // Stores promise so deck builder can await it before loading collection
    window._authReady = (async function() {
      try {
        var resp = await fetch('/.auth/me');
        if (!resp.ok) return;
        var data = await resp.json();
        var principal = Array.isArray(data && data.clientPrincipal)
          ? data.clientPrincipal[0]
          : ((data && data.clientPrincipal) || null);
        if (!principal || !principal.userId) return;
        var name = (principal.userDetails || '').split('@')[0] || 'User';
        sessionStorage.setItem('isAuthenticated', 'true');
        sessionStorage.setItem('userInfo', JSON.stringify({
          userId: principal.userId, name: name,
          email: principal.userDetails
        }));
        document.body.setAttribute('data-auth-state', 'signed-in');
      } catch (e) { /* not authenticated */ }
    })();
  </script>
  <script src="/cardforge/js/cardforge-deck-builder.js?v=20260425e"></script>
</body>
