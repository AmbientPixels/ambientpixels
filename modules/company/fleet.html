<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="AmbientPixels Fleet — agent roster, lifecycle proposals, identity evolution." />
  <link rel="icon" href="/images/favicon.ico" type="image/x-icon" />
  <title>Fleet — AmbientPixels HQ</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/grid.css" />
  <link rel="stylesheet" href="/css/nav.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/theme.css" />
  <link rel="stylesheet" href="/css/banner.css" />
  <link rel="stylesheet" href="/modules/company/css/company.css" />
  <link rel="stylesheet" href="/modules/company/css/dashboard.css" />
  <link rel="stylesheet" href="/modules/company/css/sidebar.css" />
  <link rel="stylesheet" href="/modules/company/css/quick-chat.css" />
  <style>
    .fl-section { margin-bottom: 1.4rem; padding: 1rem; border: 1px solid rgba(255,255,255,0.06); border-radius: 10px; background: rgba(255,255,255,0.02); }
    .fl-section h2 { font-size: var(--c-text-base); margin: 0 0 0.7rem 0; letter-spacing: 0.02em; }
    .fl-empty { font-size: var(--c-text-xs); color: rgba(255,255,255,0.5); padding: 0.5rem 0.7rem; background: rgba(255,255,255,0.03); border-left: 2px solid rgba(251,191,36,0.4); border-radius: 4px; }
    .fl-hero { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 0.7rem; margin-bottom: 1.2rem; }
    .fl-hero-card { padding: 0.8rem; border-radius: 10px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); }
    .fl-hero-card .fl-label { font-size: var(--c-text-xs); text-transform: uppercase; letter-spacing: 0.05em; opacity: 0.5; margin-bottom: 0.3rem; }
    .fl-hero-card .fl-value { font-size: var(--c-text-xl); font-weight: 600; color: #fff; }
    .fl-hero-card .fl-sub { font-size: var(--c-text-xs); opacity: 0.6; margin-top: 0.2rem; }
    .fl-grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 0.9rem; }

    .fl-roster { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 0.7rem; }
    .fl-agent-card { padding: 0.8rem; background: rgba(255,255,255,0.03); border-radius: 10px; border: 1px solid rgba(255,255,255,0.06); font-size: var(--c-text-xs); }
    .fl-agent-card.protected { border-left: 3px solid #34d399; }
    .fl-agent-card.archived { opacity: 0.55; border-left: 3px solid rgba(156,163,175,0.5); }
    .fl-agent-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 0.4rem; }
    .fl-agent-name { font-size: var(--c-text-md); font-weight: 600; color: #fff; text-transform: capitalize; }
    .fl-agent-tier { font-size: var(--c-text-xs); opacity: 0.55; letter-spacing: 0.04em; }
    .fl-agent-role { font-size: var(--c-text-xs); opacity: 0.8; margin-bottom: 0.3rem; }
    .fl-agent-meta { font-size: var(--c-text-xs); opacity: 0.65; line-height: 1.4; }
    .fl-agent-meta strong { color: rgba(255,255,255,0.85); }
    .fl-agent-actions { display: flex; gap: 0.3rem; margin-top: 0.5rem; }
    .fl-btn { padding: 0.25rem 0.6rem; font-size: var(--c-text-xs); border-radius: 4px; border: 1px solid transparent; cursor: pointer; font-family: inherit; }
    .fl-btn-primary { background: rgba(96,165,250,0.15); color: #60a5fa; border-color: rgba(96,165,250,0.3); }
    .fl-btn-warn { background: rgba(248,113,113,0.12); color: #f87171; border-color: rgba(248,113,113,0.3); }
    .fl-btn-approve { background: rgba(52,211,153,0.18); color: #34d399; border-color: rgba(52,211,153,0.3); }
    .fl-btn-reject { background: rgba(248,113,113,0.15); color: #f87171; border-color: rgba(248,113,113,0.3); }
    .fl-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .fl-btn:hover:not(:disabled) { filter: brightness(1.2); }

    .fl-drift { font-size: var(--c-text-xs); padding: 0.1rem 0.35rem; border-radius: 3px; background: rgba(251,191,36,0.15); color: #fbbf24; display: inline-block; margin-left: 0.3rem; }
    .fl-cap-red { color: #f87171; }
    .fl-cap-yellow { color: #fbbf24; }
    .fl-cap-green { color: #34d399; }

    .fl-proposal { padding: 0.7rem 0.9rem; background: rgba(255,255,255,0.03); border-radius: 8px; margin-bottom: 0.5rem; border-left: 3px solid rgba(96,165,250,0.5); font-size: var(--c-text-xs); }
    .fl-proposal.type-hire { border-left-color: #34d399; }
    .fl-proposal.type-retire { border-left-color: #f87171; }
    .fl-proposal.type-evolve { border-left-color: #fbbf24; }
    .fl-proposal-head { display: flex; justify-content: space-between; align-items: baseline; gap: 0.5rem; margin-bottom: 0.3rem; }
    .fl-proposal-title { font-weight: 600; color: #fff; }
    .fl-proposal-cost { font-weight: 600; color: #fbbf24; font-size: var(--c-text-xs); }
    .fl-proposal-body { opacity: 0.85; line-height: 1.45; margin-bottom: 0.4rem; }
    .fl-proposal-body strong { color: rgba(255,255,255,0.9); }
    .fl-proposal-meta { font-size: var(--c-text-xs); opacity: 0.55; margin-top: 0.3rem; }
    .fl-actions { display: flex; gap: 0.4rem; margin-top: 0.5rem; }

    .fl-decision { padding: 0.35rem 0.6rem; font-size: var(--c-text-xs); border-radius: 4px; margin-bottom: 0.25rem; background: rgba(255,255,255,0.02); display: grid; grid-template-columns: 80px 100px 1fr 90px; gap: 0.4rem; align-items: center; }
    .fl-decision-action { font-size: var(--c-text-xs); text-transform: uppercase; letter-spacing: 0.04em; }
    .fl-decision-action.approved { color: #34d399; }
    .fl-decision-action.rejected { color: #f87171; }

    .fl-intel-row { padding: 0.4rem 0.6rem; font-size: var(--c-text-xs); border-radius: 4px; margin-bottom: 0.25rem; background: rgba(255,255,255,0.02); }
    .fl-intel-label { font-weight: 600; color: #fff; text-transform: capitalize; }

    /* Character-sheet card extras */
    .fl-lv { font-size: var(--c-text-xs); font-weight: 600; color: #fbbf24; background: rgba(251,191,36,0.12); border: 1px solid rgba(251,191,36,0.3); border-radius: 3px; padding: 0.02rem 0.3rem; vertical-align: middle; letter-spacing: 0.02em; }
    .fl-traits { display: flex; flex-wrap: wrap; gap: 0.25rem; margin-bottom: 0.4rem; }
    .fl-trait { font-size: var(--c-text-xs); padding: 0.1rem 0.4rem; border-radius: 3px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); color: rgba(255,255,255,0.8); }
    .fl-loadout { margin-top: 0.5rem; padding-top: 0.45rem; border-top: 1px solid rgba(255,255,255,0.06); display: grid; gap: 0.2rem; }
    .fl-mix-row { display: flex; justify-content: space-between; align-items: center; font-size: var(--c-text-xs); }
    .fl-mix-row > span:first-child { opacity: 0.65; }
    .fl-mix-row > span:last-child { font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; font-size: 0.62rem; padding: 0.04rem 0.32rem; border-radius: 3px; }
    .fl-mix-high { color: #34d399; background: rgba(52,211,153,0.14); }
    .fl-mix-medium { color: #fbbf24; background: rgba(251,191,36,0.14); }
    .fl-mix-low { color: #60a5fa; background: rgba(96,165,250,0.14); }
    .fl-mix-none { color: rgba(255,255,255,0.45); background: rgba(255,255,255,0.05); }

    /* Evolve modal */
    .fe-overlay { position: fixed; inset: 0; z-index: 1000; background: rgba(6,9,13,0.78); display: flex; align-items: flex-start; justify-content: center; padding: 3vh 1rem; overflow-y: auto; }
    .fe-modal { width: 100%; max-width: 560px; background: #0e1218; border: 1px solid #2a3644; border-radius: 12px; box-shadow: 0 24px 60px rgba(0,0,0,0.6); color: #e7edf5; font-size: var(--c-text-xs); padding: 1.1rem 1.2rem 1rem; }
    .fe-head { margin-bottom: 0.8rem; }
    .fe-title { font-size: var(--c-text-lg); font-weight: 600; color: #fff; text-transform: capitalize; }
    .fe-sub { font-size: var(--c-text-xs); opacity: 0.6; margin-top: 0.15rem; }
    .fe-presets { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-bottom: 0.9rem; }
    .fe-preset { font-size: var(--c-text-xs); padding: 0.22rem 0.55rem; border-radius: 5px; background: rgba(255,255,255,0.04); border: 1px solid #2a3644; color: #cdd7e3; cursor: pointer; user-select: none; }
    .fe-preset:hover { border-color: rgba(251,191,36,0.5); color: #fff; }
    .fe-sec { margin-bottom: 0.85rem; }
    .fe-lbl { font-size: var(--c-text-xs); text-transform: uppercase; letter-spacing: 0.05em; opacity: 0.55; margin-bottom: 0.4rem; }
    .fe-req { color: #f87171; text-transform: none; letter-spacing: 0; opacity: 0.9; margin-left: 0.3rem; }
    .fe-ta { width: 100%; box-sizing: border-box; background: #161c25; border: 1px solid #2a3644; border-radius: 6px; color: #e7edf5; font-family: inherit; font-size: var(--c-text-xs); padding: 0.45rem 0.55rem; resize: vertical; }
    .fe-ta:focus { outline: none; border-color: rgba(251,191,36,0.6); }
    .fe-row { display: flex; align-items: center; gap: 0.6rem; margin-bottom: 0.45rem; }
    .fe-row > span { flex: 0 0 8.5rem; opacity: 0.7; }
    .fe-row > input.fe-ta { flex: 1; }
    .fe-seg { display: flex; flex-wrap: wrap; gap: 0.25rem; }
    .fe-seg-b { font-size: var(--c-text-xs); padding: 0.2rem 0.5rem; border-radius: 5px; background: rgba(255,255,255,0.04); border: 1px solid #2a3644; color: #cdd7e3; cursor: pointer; user-select: none; font-weight: 400; }
    .fe-seg-b:hover { border-color: rgba(251,191,36,0.4); }
    .fe-seg-b.on { background: #fbbf24; border-color: #fbbf24; color: #1a1206; font-weight: 600; }
    .fe-range { width: 100%; accent-color: #fbbf24; }
    .fe-capval { display: inline-block; margin-top: 0.25rem; font-weight: 600; color: #fbbf24; }
    .fe-chips { display: flex; flex-wrap: wrap; gap: 0.3rem; flex: 1; }
    .fe-chip { display: inline-flex; align-items: center; gap: 0.3rem; font-size: var(--c-text-xs); padding: 0.15rem 0.45rem; border-radius: 4px; background: rgba(255,255,255,0.05); border: 1px solid #2a3644; color: #cdd7e3; }
    .fe-chip .fe-x { cursor: pointer; font-style: normal; opacity: 0.6; }
    .fe-chip .fe-x:hover { opacity: 1; color: #f87171; }
    .fe-chip.fe-add { cursor: pointer; border-style: dashed; color: #fbbf24; border-color: rgba(251,191,36,0.4); }
    .fe-chip.fe-add:hover { background: rgba(251,191,36,0.1); }
    .fe-diff { margin: 0.6rem 0 0.9rem; padding: 0.6rem 0.7rem; background: rgba(255,255,255,0.03); border: 1px solid #2a3644; border-radius: 8px; min-height: 1.2rem; }
    .fe-diff-row { font-size: var(--c-text-xs); line-height: 1.6; }
    .fe-diff-row .was { color: rgba(255,255,255,0.5); text-decoration: line-through; }
    .fe-diff-row .now { color: #34d399; font-weight: 600; }
    .fe-note { font-size: var(--c-text-xs); opacity: 0.5; }
    .fe-foot { display: flex; align-items: center; gap: 0.4rem; margin-top: 0.6rem; }
    .fe-spacer { flex: 1; }
    .fe-btn { padding: 0.4rem 0.75rem; font-size: var(--c-text-xs); border-radius: 6px; border: 1px solid transparent; cursor: pointer; font-family: inherit; }
    .fe-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .fe-btn:hover:not(:disabled) { filter: brightness(1.1); }
    .fe-btn.fe-ghost { background: transparent; border-color: #2a3644; color: #cdd7e3; }
    .fe-btn.fe-sec { background: rgba(96,165,250,0.15); border-color: rgba(96,165,250,0.3); color: #60a5fa; }
    .fe-btn.fe-amber { background: #fbbf24; border-color: #fbbf24; color: #1a1206; font-weight: 600; }
  </style>
</head>
<body data-theme="dark">

  <main class="content-section" id="fl-main">
    <div class="company-header">
      <div>
        <h1><i class="fas fa-users-gear co-icon-mr-lg dash-icon-amber"></i>Fleet</h1>
        <p class="act-header-sub">Agent roster, lifecycle proposals, identity evolution. Forge proposes; CEO approves.</p>
      </div>
    </div>

    <div id="fl-hero" class="fl-hero"></div>

    <div class="sys-section" id="fl-roster-section">
      <div class="sys-section-hdr">
        <i class="fas fa-users-gear"></i>
        <strong>ACTIVE ROSTER</strong>
        <span class="sys-count" id="fl-roster-count"></span>
        <i class="fas fa-chevron-down sys-chevron"></i>
      </div>
      <div class="sys-section-body">
        <div class="fl-section" data-section="roster">
          <div id="fl-roster"></div>
        </div>
      </div>
    </div>

    <div class="sys-section" id="fl-proposals-section">
      <div class="sys-section-hdr">
        <i class="fas fa-inbox"></i>
        <strong>PENDING FLEET PROPOSALS</strong>
        <span class="sys-count" id="fl-proposals-count"></span>
        <i class="fas fa-chevron-down sys-chevron"></i>
      </div>
      <div class="sys-section-body">
        <div class="fl-section" data-section="proposals">
          <div id="fl-proposals"></div>
        </div>
      </div>
    </div>

    <div class="fl-grid-2">
      <div class="sys-section" id="fl-intel-section">
        <div class="sys-section-hdr">
          <i class="fas fa-microscope"></i>
          <strong>FORGE'S FLEET INTELLIGENCE</strong>
          <span class="sys-count" id="fl-intel-count"></span>
          <i class="fas fa-chevron-down sys-chevron"></i>
        </div>
        <div class="sys-section-body">
          <div class="fl-section" data-section="intel">
            <div id="fl-intel"></div>
          </div>
        </div>
      </div>

      <div class="sys-section" id="fl-archived-section">
        <div class="sys-section-hdr">
          <i class="fas fa-archive"></i>
          <strong>ARCHIVED AGENTS</strong>
          <span class="sys-count" id="fl-archived-count"></span>
          <i class="fas fa-chevron-down sys-chevron"></i>
        </div>
        <div class="sys-section-body">
          <div class="fl-section" data-section="archive">
            <div id="fl-archive"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="sys-section" id="fl-decisions-section">
      <div class="sys-section-hdr">
        <i class="fas fa-wrench"></i>
        <strong>RECENT FLEET DECISIONS</strong>
        <span class="sys-count" id="fl-decisions-count"></span>
        <i class="fas fa-chevron-down sys-chevron"></i>
      </div>
      <div class="sys-section-body">
        <div class="fl-section" data-section="decisions">
          <div id="fl-decisions"></div>
        </div>
      </div>
    </div>
  </main>

  <script src="/modules/company/fleet-evolve.js"></script>
  <script>
  (function () {
    'use strict';
    var API = (location.hostname.indexOf('ambientpixels.ai') !== -1)
      ? 'https://ambientpixels-nova-api.azurewebsites.net/api'
      : '/api';
    var SECRET = 'pixelpusher';
    var PROTECTED = new Set(['nova', 'cipher']);

    function esc(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
    function emptyState(id, msg) { var el = document.getElementById(id); if (el) el.innerHTML = '<div class="fl-empty">' + esc(msg) + '</div>'; }
    function ageDays(iso) {
      if (!iso) return '?';
      var ms = Date.now() - Date.parse(iso);
      if (!isFinite(ms) || ms < 0) return '?';
      return Math.floor(ms / (24*60*60*1000));
    }

    function loadAll() {
      return Promise.all([
        fetch(API + '/company-state?key=agentRegistry', { headers: { 'x-company-secret': SECRET } }).then(function(r){return r.json();}),
        fetch(API + '/company-state?key=approvalQueue', { headers: { 'x-company-secret': SECRET } }).then(function(r){return r.json();}),
        fetch(API + '/company-state?key=runtimeMemory', { headers: { 'x-company-secret': SECRET } }).then(function(r){return r.json();}),
        fetch(API + '/allocationDigest', { headers: { 'x-company-secret': SECRET } }).then(function(r){return r.json();})
      ]).then(function (arr) {
        return {
          registry: (arr[0] && arr[0].value) || { agents: [] },
          approvalQueue: (arr[1] && arr[1].value) || [],
          reflectionDigest: (arr[2] && arr[2].value && arr[2].value.reflectionDigest) || null,
          financeDigest: (arr[2] && arr[2].value && arr[2].value.financeDigest) || null,
          allocationDigest: arr[3] || null
        };
      });
    }

    function renderHero(d) {
      var active = (d.registry.agents || []).filter(function(a){return a.status==='active';});
      var archived = (d.registry.agents || []).filter(function(a){return a.status==='archived';});
      var pending = (d.approvalQueue || []).filter(function(q){return q.type && q.type.indexOf('agent_')===0 && q.status==='pending';});
      var oldest = pending.slice().sort(function(a,b){return (a.createdAt||'').localeCompare(b.createdAt||'');})[0];
      var oldestAge = oldest ? ageDays(oldest.createdAt) + 'd' : '—';

      var activeColor = active.length >= 5 ? '#34d399' : '#f87171';
      var pendingColor = pending.length === 0 ? '#34d399' : (pending.length >= 3 ? '#f87171' : '#fbbf24');
      var oldestColor = oldest ? (ageDays(oldest.createdAt) >= 7 ? '#f87171' : (ageDays(oldest.createdAt) >= 3 ? '#fbbf24' : 'inherit')) : '#34d399';

      var html = '';
      html += '<div class="fl-hero-card"><div class="fl-label">Active Fleet</div><div class="fl-value" style="color:' + activeColor + ';">' + active.length + '</div><div class="fl-sub">min ' + 5 + ' · max ' + 12 + '</div></div>';
      html += '<div class="fl-hero-card"><div class="fl-label">Pending Proposals</div><div class="fl-value" style="color:' + pendingColor + ';">' + pending.length + '</div><div class="fl-sub">hire / retire / evolve</div></div>';
      html += '<div class="fl-hero-card"><div class="fl-label">Archived</div><div class="fl-value">' + archived.length + '</div><div class="fl-sub">retired, memories preserved</div></div>';
      html += '<div class="fl-hero-card"><div class="fl-label">Oldest Pending</div><div class="fl-value" style="color:' + oldestColor + ';">' + oldestAge + '</div><div class="fl-sub">' + (oldest ? esc((oldest.type||'').replace('agent_','').replace('_proposal','')) : 'nothing pending') + '</div></div>';
      document.getElementById('fl-hero').innerHTML = html;
    }

    function renderRoster(d) {
      var active = (d.registry.agents || []).filter(function(a){return a.status==='active';});
      if (active.length === 0) { emptyState('fl-roster', 'No active agents. Agent registry may be uninitialized.'); return; }

      var allocPA = (d.allocationDigest && d.allocationDigest.perAgent) || {};
      var rdPA = (d.reflectionDigest && d.reflectionDigest.perAgent) || {};

      var html = '<div class="fl-roster">' + active.map(function (a) {
        var isProtected = PROTECTED.has(a.id);
        var alloc = allocPA[a.id] || null;
        var drift = rdPA[a.id] && rdPA[a.id].roleAdherence && rdPA[a.id].roleAdherence.drift;
        var driftBadge = (drift && drift !== 'on-role') ? '<span class="fl-drift">' + esc(drift) + '</span>' : '';
        var capClass = alloc ? ('fl-cap-' + String(alloc.status||'green').toLowerCase()) : '';
        var capText = alloc ? ('$' + Number(alloc.spent).toFixed(2) + '/$' + Number(a.monthlyCap).toFixed(2) + ' (' + alloc.pct + '%)') : ('cap $' + Number(a.monthlyCap||0).toFixed(2));

        var d = a.doctrine || {}, mix = a.expectedActionMix || {};
        var ver = (Array.isArray(a.doctrineHistory) ? a.doctrineHistory.length : 0) + 1;
        var traits = [d.riskTolerance ? 'Risk: ' + d.riskTolerance : '', d.timeHorizon ? 'Horizon: ' + d.timeHorizon : '']
          .filter(Boolean).map(function (t) { return '<span class="fl-trait">' + esc(t) + '</span>'; }).join('');
        var loadout = Object.keys(mix).slice(0, 4).map(function (act) {
          return '<div class="fl-mix-row"><span>' + esc(act) + '</span><span class="fl-mix-' + esc(mix[act]) + '">' + esc(mix[act]) + '</span></div>';
        }).join('');

        return '<div class="fl-agent-card' + (isProtected ? ' protected' : '') + '">' +
          '<div class="fl-agent-head"><span class="fl-agent-name">' + esc(a.name || a.id) +
            ' <span class="fl-lv">v' + ver + '</span>' + driftBadge + '</span><span class="fl-agent-tier">T' + (a.tier||'?') + '</span></div>' +
          '<div class="fl-agent-role">' + esc(a.role || '') + '</div>' +
          (traits ? '<div class="fl-traits">' + traits + '</div>' : '') +
          '<div class="fl-agent-meta"><strong>Cap:</strong> <span class="' + capClass + '">' + esc(capText) + '</span><br>' +
            '<strong>Focus:</strong> ' + esc(String(a.focus||'').substring(0,140)) + (String(a.focus||'').length > 140 ? '…' : '') + '</div>' +
          (loadout ? '<div class="fl-loadout">' + loadout + '</div>' : '') +
          '<div class="fl-agent-actions">' +
            '<button class="fl-btn fl-btn-primary" data-action="evolve" data-agent="' + esc(a.id) + '">Evolve</button>' +
            '<button class="fl-btn fl-btn-warn" data-action="retire" data-agent="' + esc(a.id) + '"' + (isProtected ? ' disabled title="PROTECTED"' : '') + '>Retire</button>' +
          '</div></div>';
      }).join('') + '</div>';
      document.getElementById('fl-roster').innerHTML = html;

      // Wire action buttons — open lightweight prompt flow for CEO
      document.querySelectorAll('#fl-roster .fl-btn[data-action]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var action = btn.getAttribute('data-action');
          var agentId = btn.getAttribute('data-agent');
          if (action === 'retire') return openRetireFlow(agentId);
          if (action === 'evolve') return openEvolveFlow(agentId);
        });
      });
    }

    function openRetireFlow(agentId) {
      var rationale = window.prompt('Rationale for retiring ' + agentId + ' (required, min 20 chars):');
      if (!rationale || rationale.trim().length < 20) { alert('Rationale required, min 20 chars.'); return; }
      var plan = window.prompt('Reassignment plan (what happens to open tasks / campaigns):');
      if (!plan || plan.trim().length < 10) { alert('Reassignment plan required.'); return; }
      var payload = {
        type: 'agent_retire_proposal',
        proposedBy: 'ceo',
        retire: { targetAgent: agentId, rationale: rationale.trim(), reassignmentPlan: plan.trim(), estimatedWinddownCost: 0 }
      };
      submitProposal(payload);
    }

    // ── Evolve modal (replaces the old window.prompt chain) ─────────────
    // refreshAll: reuse the file's existing post-action reload (same as the
    // proposal decision handler + submitProposal already use). A full reload
    // re-runs loadAll() and re-sets window._fleetData — no duplicate loader.
    function refreshAll() { window.location.reload(); }

    var _feCurrentAgent = null;

    function openEvolveFlow(agentId) {
      var agent = (window._fleetData && window._fleetData.registry && window._fleetData.registry.agents || []).filter(function (a) { return a.id === agentId; })[0];
      if (!agent) { alert('Agent not found: ' + agentId); return; }
      _feCurrentAgent = agent;
      var overlay = document.createElement('div');
      overlay.className = 'fe-overlay';
      overlay.id = 'fe-overlay';
      overlay.innerHTML = FleetEvolve.buildEvolveModalHtml(agent);
      document.body.appendChild(overlay);
      wireEvolveModal(overlay, agent);
      updateEvolveDiff(overlay, agent);
    }

    function readEvolveModalState(overlay, agent) {
      var q = function (s) { return overlay.querySelector(s); };
      var edited = {
        focus: (q('[data-field="focus"]') || {}).value || '',
        monthlyCap: Number((q('[data-field="monthlyCap"]') || {}).value || agent.monthlyCap),
        doctrine: {}, expectedActionMix: {}
      };
      // doctrine scalar inputs
      ['strategicBias', 'coreQuestion'].forEach(function (k) {
        var el = q('[data-doctrine="' + k + '"]'); if (el) edited.doctrine[k] = el.value;
      });
      // doctrine segmented (riskTolerance, timeHorizon)
      ['riskTolerance', 'timeHorizon'].forEach(function (k) {
        var on = q('.fe-seg-b.on[data-doctrine="' + k + '"]');
        edited.doctrine[k] = on ? on.getAttribute('data-val') : (agent.doctrine || {})[k];
      });
      // escalation triggers chips
      edited.doctrine.escalationTriggers = Array.prototype.map.call(
        overlay.querySelectorAll('[data-triggers] .fe-chip[data-trigger]'),
        function (c) { return c.getAttribute('data-trigger'); });
      // action mix
      Object.keys(agent.expectedActionMix || {}).forEach(function (act) {
        var on = q('.fe-seg-b.on[data-action="' + act + '"]');
        edited.expectedActionMix[act] = on ? on.getAttribute('data-val') : agent.expectedActionMix[act];
      });
      return edited;
    }

    function wireEvolveModal(overlay, agent) {
      // segmented pickers (doctrine + action mix): clicking selects within its group
      overlay.addEventListener('click', function (e) {
        var b = e.target.closest && e.target.closest('.fe-seg-b');
        if (b) {
          var group = b.getAttribute('data-doctrine') ? '[data-doctrine="' + b.getAttribute('data-doctrine') + '"]'
                                                       : '[data-action="' + b.getAttribute('data-action') + '"]';
          overlay.querySelectorAll('.fe-seg-b' + group).forEach(function (x) { x.classList.remove('on'); });
          b.classList.add('on');
          updateEvolveDiff(overlay, agent);
        }
        var chipX = e.target.closest && e.target.closest('.fe-x');
        if (chipX) { chipX.parentNode.remove(); updateEvolveDiff(overlay, agent); }
        var addChip = e.target.classList && e.target.classList.contains('fe-add');
        if (addChip) {
          var v = window.prompt('New escalation trigger:'); // small inline add; full chip-input is P3 polish
          if (v && v.trim()) {
            var span = document.createElement('span');
            span.className = 'fe-chip'; span.setAttribute('data-trigger', v.trim());
            span.innerHTML = esc(v.trim()) + '<i class="fe-x">×</i>';
            e.target.parentNode.insertBefore(span, e.target);
            updateEvolveDiff(overlay, agent);
          }
        }
        var preset = e.target.getAttribute && e.target.getAttribute('data-preset');
        if (preset) { applyArchetype(overlay, agent, preset); }
        var fe = e.target.getAttribute && e.target.getAttribute('data-fe');
        if (fe === 'cancel') closeEvolveModal();
        if (fe === 'propose') submitEvolution(overlay, agent, 'propose');
        if (fe === 'now') submitEvolution(overlay, agent, 'now');
      });
      // slider readout + live diff on any input
      overlay.addEventListener('input', function (e) {
        if (e.target.getAttribute('data-field') === 'monthlyCap') {
          var out = overlay.querySelector('.fe-capval'); if (out) out.textContent = '$' + Number(e.target.value).toFixed(2);
        }
        updateEvolveDiff(overlay, agent);
      });
    }

    function applyArchetype(overlay, agent, key) {
      var arc = FleetEvolve.ARCHETYPES[key]; if (!arc) return;
      if (arc._reset) { closeEvolveModal(); openEvolveFlow(agent.id); return; } // reset = re-render from current
      if (arc.doctrine) Object.keys(arc.doctrine).forEach(function (k) {
        var sel = overlay.querySelector('.fe-seg-b[data-doctrine="' + k + '"][data-val="' + arc.doctrine[k] + '"]');
        if (sel) { overlay.querySelectorAll('.fe-seg-b[data-doctrine="' + k + '"]').forEach(function (x){x.classList.remove('on');}); sel.classList.add('on'); }
      });
      if (arc.expectedActionMix) Object.keys(arc.expectedActionMix).forEach(function (act) {
        var sel = overlay.querySelector('.fe-seg-b[data-action="' + act + '"][data-val="' + arc.expectedActionMix[act] + '"]');
        if (sel) { overlay.querySelectorAll('.fe-seg-b[data-action="' + act + '"]').forEach(function (x){x.classList.remove('on');}); sel.classList.add('on'); }
      });
      updateEvolveDiff(overlay, agent);
    }

    function updateEvolveDiff(overlay, agent) {
      var edited = readEvolveModalState(overlay, agent);
      var rows = FleetEvolve.diffSummary(agent, edited);
      var el = overlay.querySelector('[data-diff]');
      if (!el) return;
      el.innerHTML = rows.length
        ? '<div class="fe-lbl">Changes (' + rows.length + ')</div>' + rows.map(function (r) {
            return '<div class="fe-diff-row">' + esc(r.label) + ': <span class="was">' + esc(r.was) + '</span> → <span class="now">' + esc(r.now) + '</span></div>';
          }).join('')
        : '<div class="fe-note">No changes yet.</div>';
    }

    function closeEvolveModal() { var o = document.getElementById('fe-overlay'); if (o) o.remove(); _feCurrentAgent = null; }

    function submitEvolution(overlay, agent, mode) {
      var edited = readEvolveModalState(overlay, agent);
      var changes = FleetEvolve.buildChanges(agent, edited);
      var rationale = ((overlay.querySelector('[data-field="rationale"]') || {}).value || '').trim();
      var v = FleetEvolve.validateEvolution(changes, { rationale: rationale });
      if (!v.ok) { alert(v.errors.join('\n')); return; }
      var payload = {
        type: 'agent_evolution_proposal', proposedBy: 'ceo',
        evolution: { targetAgent: agent.id, changes: changes, rationale: rationale,
                     estimatedCostDelta: FleetEvolve.computeCostDelta(agent, edited) }
      };
      overlay.querySelectorAll('.fe-btn').forEach(function (b){ b.disabled = true; });
      fetch(API + '/fleetProposalCreate', {
        method: 'POST', headers: { 'x-company-secret': SECRET, 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      }).then(function (r) { return r.json(); }).then(function (res) {
        if (!res || (!res.id && !res.ok)) throw new Error((res && res.error) || 'Create failed');
        if (mode === 'propose') { closeEvolveModal(); alert('Proposal created — review it in the queue.'); return refreshAll(); }
        // evolve-now: chain approve
        return fetch(API + '/approveProposal', {
          method: 'POST', headers: { 'x-company-secret': SECRET, 'Content-Type': 'application/json' },
          body: JSON.stringify({ id: res.id, decision: 'approved', ceoNote: 'Evolved via Fleet Command' })
        }).then(function (r2) { return r2.json(); }).then(function (ar) {
          closeEvolveModal();
          if (ar && ar.sideEffect) alert('Evolved ' + agent.id + '. Changed: ' + ((ar.sideEffect.changedFields||[]).join(', ') || 'fields') + '. Takes effect next heartbeat.');
          else alert('Evolution applied (proposal ' + res.id + ').');
          return refreshAll();
        });
      }).catch(function (err) {
        overlay.querySelectorAll('.fe-btn').forEach(function (b){ b.disabled = false; });
        alert('Evolution failed: ' + (err && err.message ? err.message : err) + '\nIf a proposal was created it is left pending in the queue.');
      });
    }

    function submitProposal(payload) {
      fetch(API + '/fleetProposalCreate', {
        method: 'POST',
        headers: { 'x-company-secret': SECRET, 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      }).then(function (r) {
        if (!r.ok) return r.json().then(function(j){throw new Error(j.error || 'HTTP ' + r.status);});
        return r.json();
      }).then(function (res) {
        alert('Proposal created: ' + res.id + '\nApprove it below in PENDING FLEET PROPOSALS.');
        window.location.reload();
      }).catch(function (e) { alert('Failed: ' + e.message); });
    }

    function typeShort(t) {
      if (t === 'agent_hire_proposal') return 'HIRE';
      if (t === 'agent_retire_proposal') return 'RETIRE';
      if (t === 'agent_evolution_proposal') return 'EVOLVE';
      return t || '';
    }
    function typeSlug(t) {
      if (t === 'agent_hire_proposal') return 'type-hire';
      if (t === 'agent_retire_proposal') return 'type-retire';
      if (t === 'agent_evolution_proposal') return 'type-evolve';
      return '';
    }
    function proposalBody(q) {
      var lines = [];
      if (q.hire) {
        lines.push('<strong>ID:</strong> ' + esc(q.hire.id) + ' · <strong>Name:</strong> ' + esc(q.hire.name) + ' · <strong>Tier:</strong> ' + q.hire.tier);
        lines.push('<strong>Role:</strong> ' + esc(q.hire.role));
        lines.push('<strong>Focus:</strong> ' + esc(q.hire.focus));
        lines.push('<strong>Reports to:</strong> ' + esc(q.hire.reportsTo || '—') + ' · <strong>Cap:</strong> $' + Number(q.hire.monthlyCap).toFixed(2));
        lines.push('<strong>Rationale:</strong> ' + esc(q.hire.rationale));
      } else if (q.retire) {
        lines.push('<strong>Target:</strong> ' + esc(q.retire.targetAgent));
        lines.push('<strong>Rationale:</strong> ' + esc(q.retire.rationale));
        lines.push('<strong>Reassignment plan:</strong> ' + esc(q.retire.reassignmentPlan));
        if (q.retire.orphans && q.retire.orphans.length) lines.push('<strong style="color:#fbbf24;">Orphans:</strong> ' + esc(q.retire.orphans.join(', ')));
      } else if (q.evolution) {
        lines.push('<strong>Target:</strong> ' + esc(q.evolution.targetAgent));
        lines.push('<strong>Changes:</strong> <code>' + esc(JSON.stringify(q.evolution.changes)).substring(0,300) + '</code>');
        lines.push('<strong>Rationale:</strong> ' + esc(q.evolution.rationale));
      }
      return lines.join('<br>');
    }

    function renderProposals(d) {
      var aq = d.approvalQueue || [];
      var pending = aq.filter(function(q){return q.type && q.type.indexOf('agent_')===0 && q.status==='pending';});
      if (pending.length === 0) { emptyState('fl-proposals', 'No pending fleet proposals. Use the Evolve/Retire buttons on any agent card above to propose, or wait for Forge to surface candidates.'); return; }
      var html = pending.map(function (q) {
        return '<div class="fl-proposal ' + typeSlug(q.type) + '">' +
          '<div class="fl-proposal-head"><span class="fl-proposal-title">' + typeShort(q.type) + ' · ' + esc((q.hire && q.hire.id) || (q.retire && q.retire.targetAgent) || (q.evolution && q.evolution.targetAgent) || q.id) + '</span><span class="fl-proposal-cost">$' + Number(q.estimatedCost||0).toFixed(2) + '</span></div>' +
          '<div class="fl-proposal-body">' + proposalBody(q) + '</div>' +
          '<div class="fl-proposal-meta">' + esc(q.id) + ' · ' + esc(q.proposedBy || '—') + ' · ' + esc((q.createdAt||'').substring(0,16).replace('T',' ')) + ' · age ' + ageDays(q.createdAt) + 'd</div>' +
          '<div class="fl-actions"><button class="fl-btn fl-btn-approve" data-id="' + esc(q.id) + '" data-decision="approved">Approve</button>' +
          '<button class="fl-btn fl-btn-reject" data-id="' + esc(q.id) + '" data-decision="rejected">Reject</button></div>' +
          '</div>';
      }).join('');
      document.getElementById('fl-proposals').innerHTML = html;

      document.querySelectorAll('#fl-proposals .fl-btn[data-decision]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var id = btn.getAttribute('data-id');
          var decision = btn.getAttribute('data-decision');
          var ceoNote = '';
          if (decision === 'rejected') {
            ceoNote = window.prompt('Reason for reject (required):') || '';
            if (!ceoNote.trim()) { alert('Reject requires a reason.'); return; }
          } else {
            ceoNote = window.prompt('Optional note for approve:') || '';
          }
          btn.disabled = true;
          fetch(API + '/approveProposal', {
            method: 'POST',
            headers: { 'x-company-secret': SECRET, 'Content-Type': 'application/json' },
            body: JSON.stringify({ id: id, decision: decision, ceoNote: ceoNote })
          }).then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
            .then(function (res) {
              var msg = 'Decision recorded.';
              if (res.sideEffect) {
                if (res.sideEffect.kind === 'agent-hired') msg = 'Agent ' + res.sideEffect.agentId + ' HIRED. Will run next heartbeat.';
                else if (res.sideEffect.kind === 'agent-retired') msg = 'Agent ' + res.sideEffect.agentId + ' RETIRED. ' + res.sideEffect.reassignedCount + ' task(s) reassigned.';
                else if (res.sideEffect.kind === 'agent-evolved') msg = 'Agent ' + res.sideEffect.agentId + ' EVOLVED. Fields: ' + (res.sideEffect.changedFields || []).join(', ');
              }
              if (res.warning) msg += '\n⚠ ' + res.warning;
              alert(msg);
              window.location.reload();
            })
            .catch(function (e) { alert('Failed: ' + e.message); btn.disabled = false; });
        });
      });
    }

    function renderArchive(d) {
      var archived = (d.registry.agents || []).filter(function(a){return a.status==='archived';});
      if (archived.length === 0) { emptyState('fl-archive', 'No archived agents. Retiring an active agent moves them here with memories preserved.'); return; }
      var html = archived.map(function (a) {
        return '<div class="fl-agent-card archived">' +
          '<div class="fl-agent-head"><span class="fl-agent-name">' + esc(a.name || a.id) + '</span><span class="fl-agent-tier">T' + (a.tier||'?') + '</span></div>' +
          '<div class="fl-agent-role">' + esc(a.role || '') + '</div>' +
          '<div class="fl-agent-meta"><strong>Retired:</strong> ' + esc((a.retiredAt||'').substring(0,10)) + '<br>' +
          '<strong>Reason:</strong> ' + esc(String(a.retiredReason||'').substring(0,200)) + '</div>' +
          '</div>';
      }).join('');
      document.getElementById('fl-archive').innerHTML = '<div class="fl-roster">' + html + '</div>';
    }

    function renderIntel(d) {
      var lines = [];
      // Drift
      var rdPA = (d.reflectionDigest && d.reflectionDigest.perAgent) || {};
      var drifts = Object.keys(rdPA).filter(function(k){ var ra=rdPA[k].roleAdherence; return ra && ra.drift && ra.drift!=='on-role'; });
      if (drifts.length) {
        lines.push('<div class="fl-intel-row"><strong>Drift candidates:</strong> ' + drifts.map(function(k){return '<span class="fl-intel-label">'+esc(k)+'</span> <span class="fl-drift">'+esc(rdPA[k].roleAdherence.drift)+'</span>';}).join(' · ') + '</div>');
      }
      // Cap-exceeding
      var allocPA = (d.allocationDigest && d.allocationDigest.perAgent) || {};
      var over = Object.keys(allocPA).filter(function(k){return allocPA[k].status==='RED';});
      if (over.length) {
        lines.push('<div class="fl-intel-row"><strong>Cap-exceeding:</strong> ' + over.map(function(k){var a=allocPA[k];return '<span class="fl-intel-label">'+esc(k)+'</span> ('+a.pct+'%)';}).join(' · ') + '</div>');
      }
      // Stale
      var eff = (d.financeDigest && d.financeDigest.agentEfficiency) || {};
      var stale = Object.keys(eff).filter(function(k){return eff[k].executed===0;});
      if (stale.length) {
        lines.push('<div class="fl-intel-row"><strong>Stale (0 actions 7d):</strong> ' + stale.map(function(k){return '<span class="fl-intel-label">'+esc(k)+'</span>';}).join(' · ') + '</div>');
      }
      if (lines.length === 0) { emptyState('fl-intel', 'Fleet is healthy — no drift, no cap exceedance, no stale agents.'); return; }
      document.getElementById('fl-intel').innerHTML = lines.join('');
    }

    function renderDecisions(d) {
      var aq = d.approvalQueue || [];
      var resolved = aq.filter(function(q){return q.type && q.type.indexOf('agent_')===0 && q.status!=='pending';})
        .sort(function(a,b){return (b.resolvedAt||b.createdAt||'').localeCompare(a.resolvedAt||a.createdAt||'');})
        .slice(0, 20);
      if (resolved.length === 0) { emptyState('fl-decisions', 'No fleet decisions yet.'); return; }
      document.getElementById('fl-decisions').innerHTML = resolved.map(function (q) {
        return '<div class="fl-decision">' +
          '<div class="fl-decision-action ' + esc(q.status) + '">' + esc(q.status) + '</div>' +
          '<div>' + typeShort(q.type) + ' · ' + esc((q.hire && q.hire.id) || (q.retire && q.retire.targetAgent) || (q.evolution && q.evolution.targetAgent) || '—') + '</div>' +
          '<div style="opacity:0.7;">' + esc((q.ceoNote||'').substring(0,80)) + '</div>' +
          '<div style="opacity:0.5;font-size:var(--c-text-xs);">' + esc((q.resolvedAt||q.createdAt||'').substring(0,16).replace('T',' ')) + '</div>' +
          '</div>';
      }).join('');
    }

    document.querySelectorAll('.sys-section-hdr').forEach(function(hdr) {
      hdr.addEventListener('click', function() {
        hdr.parentElement.classList.toggle('collapsed');
        hdr.parentElement.classList.remove('dimmed');
      });
    });

    function _applySectionDefaults(defaults) {
      Object.keys(defaults).forEach(function(id) {
        var section = document.getElementById(id);
        if (!section) return;
        var body = section.querySelector('.sys-section-body');
        var countEl = section.querySelector('.sys-count');
        var cfg = defaults[id];
        var count = cfg.count != null ? cfg.count
          : body ? body.querySelectorAll(':scope > *').length : 0;
        if (countEl) countEl.textContent = count > 0 ? '(' + count + ')' : '';
        var shouldCollapse = cfg.collapse === 'always'
          || (cfg.collapse === 'if-empty' && count === 0);
        if (shouldCollapse) {
          section.classList.add('collapsed');
          if (count === 0) section.classList.add('dimmed');
        } else {
          section.classList.remove('collapsed', 'dimmed');
        }
      });
    }

    loadAll().then(function (d) {
      window._fleetData = d;
      renderHero(d);
      renderRoster(d);
      renderProposals(d);
      renderIntel(d);
      renderArchive(d);
      renderDecisions(d);

      var pendingCount = ((d.approvalQueue || []).filter(function(q){return q.type && q.type.indexOf('agent_')===0 && q.status==='pending';})).length;
      var activeCount = ((d.registry.agents || []).filter(function(a){return a.status==='active';})).length;
      var archivedCount = ((d.registry.agents || []).filter(function(a){return a.status==='archived';})).length;
      var intelEl = document.getElementById('fl-intel');
      var intelCount = intelEl ? intelEl.querySelectorAll('.fl-intel-row').length : 0;
      var decisionsEl = document.getElementById('fl-decisions');
      var decisionsCount = decisionsEl ? decisionsEl.querySelectorAll('.fl-decision').length : 0;

      _applySectionDefaults({
        'fl-roster-section': { collapse: 'never', count: activeCount },
        'fl-proposals-section': { collapse: 'never', count: pendingCount },
        'fl-intel-section': { collapse: 'never', count: intelCount },
        'fl-archived-section': { collapse: 'never', count: archivedCount },
        'fl-decisions-section': { collapse: 'never', count: decisionsCount }
      });
    }).catch(function (err) {
      var m = 'Failed to load fleet.';
      if (err && err.status === 403) m = 'Unauthorized — check x-company-secret header.';
      document.getElementById('fl-hero').innerHTML = '<div class="fl-empty">' + esc(m) + '</div>';
    });
  })();
  </script>
  <script src="/modules/company/js/sidebar.js"></script>
  <script src="/modules/company/js/quick-chat.js"></script>
</body>
