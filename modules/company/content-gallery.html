<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="AmbientPixels Content Gallery — Browse generated content packages." />
  <link rel="icon" href="/images/favicon.ico" type="image/x-icon" />
  <title>Content Gallery — AmbientPixels HQ</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/grid.css" />
  <link rel="stylesheet" href="/css/nav.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/theme.css" />
  <link rel="stylesheet" href="/css/banner.css" />
  <link rel="stylesheet" href="/modules/company/css/company.css" />
  <link rel="stylesheet" href="/modules/company/css/sidebar.css" />
  <link rel="stylesheet" href="/modules/company/css/quick-chat.css" />
  <link rel="stylesheet" href="/modules/company/css/content-gallery.css" />
</head>
<body data-theme="dark">
<main id="cg-main" class="content-section">

  <!-- Header -->
  <div class="cg-header">
    <div>
      <h1><i class="fas fa-images co-icon-faint co-icon-mr-lg"></i>Content Gallery</h1>
      <div class="cg-header-sub">Browse generated content packages</div>
    </div>
    <a class="cg-new-btn" href="/modules/company/content-engine.html"><i class="fas fa-plus"></i> New Image</a>
  </div>

  <!-- Filters -->
  <div class="cg-filters">
    <select class="cg-filter-select" id="cg-preset-filter" onchange="cgApplyFilters()">
      <option value="">All Presets</option>
      <option value="ap-neon-glass">Neon Glass</option>
      <option value="ap-2d-flat">2D Flat</option>
      <option value="ap-ornate-frame">Ornate Frame</option>
      <option value="ap-corporate-tech">Corporate Tech</option>
    </select>
    <div class="cg-status-chips">
      <div class="cg-chip cg-chip--active" data-status="" onclick="cgSetStatus(this,'')">All</div>
      <div class="cg-chip" data-status="pending_approval" onclick="cgSetStatus(this,'pending_approval')">Pending</div>
      <div class="cg-chip" data-status="partial_success" onclick="cgSetStatus(this,'partial_success')">Partial</div>
      <div class="cg-chip" data-status="deleted" onclick="cgSetStatus(this,'deleted')">Deleted</div>
    </div>
    <select class="cg-filter-select" id="cg-limit" onchange="cgApplyFilters()">
      <option value="100">100</option>
      <option value="200" selected>200</option>
      <option value="500">500</option>
    </select>
    <div class="cg-search-wrap">
      <i class="fas fa-search cg-search-icon"></i>
      <input class="cg-search" id="cg-search" type="text" placeholder="Search topic or ID..." oninput="cgLocalFilter()" />
    </div>
    <span class="cg-count" id="cg-count"></span>
  </div>

  <!-- Grid -->
  <div class="cg-grid" id="cg-grid"></div>
  <div class="cg-empty" id="cg-empty" style="display:none;"><i class="fas fa-box-open"></i>No packages found. Generate your first image in the <a href="/modules/company/content-engine.html">Image Engine</a>.</div>
  <div class="cg-error" id="cg-error" style="display:none;"></div>

  <!-- Scripts -->
  <script src="/js/company-store-adapter.js"></script>
  <script src="/modules/company/js/demo-toast.js"></script>
  <script src="/js/company-store.js"></script>
  <script src="/modules/company/js/sidebar.js"></script>
  <script src="/modules/company/js/quick-chat.js"></script>
  <script>
    var API_BASE = window.location.hostname.includes('ambientpixels.ai') ? 'https://ambientpixels-nova-api.azurewebsites.net' : '';
    var _statusFilter = '';
    var _allData = [];

    function _getAuthHeaders() {
      var headers = { 'Content-Type': 'application/json' };
      try { var key = sessionStorage.getItem('ap_server_key'); if (key) headers['x-company-secret'] = key; } catch (e) {}
      return headers;
    }

    function showSkeletons() {
      var grid = document.getElementById('cg-grid');
      grid.innerHTML = '';
      for (var i = 0; i < 8; i++) {
        var sk = document.createElement('div');
        sk.className = 'cg-skeleton';
        sk.innerHTML = '<div class="cg-skeleton-mosaic"></div><div class="cg-skeleton-body"><div class="cg-skeleton-line"></div><div class="cg-skeleton-line cg-skeleton-line--short"></div><div class="cg-skeleton-line cg-skeleton-line--tiny"></div></div>';
        grid.appendChild(sk);
      }
    }

    async function cgFetch() {
      showSkeletons();
      document.getElementById('cg-empty').style.display = 'none';
      document.getElementById('cg-error').style.display = 'none';

      var preset = document.getElementById('cg-preset-filter').value;
      var limit = document.getElementById('cg-limit').value;
      var url = API_BASE + '/api/content-index?limit=' + limit;
      if (preset) url += '&preset=' + encodeURIComponent(preset);
      if (_statusFilter) url += '&status=' + encodeURIComponent(_statusFilter);

      try {
        var res = await fetch(url, { headers: _getAuthHeaders() });
        var data = await res.json();
        if (!data.ok) throw new Error(data.error || 'Unknown error');
        _allData = data.results || [];
        cgRender(_allData);
      } catch (err) {
        document.getElementById('cg-grid').innerHTML = '';
        document.getElementById('cg-error').style.display = 'block';
        document.getElementById('cg-error').textContent = 'Failed to load gallery: ' + err.message;
      }
    }

    function cgSetStatus(el, status) {
      _statusFilter = status;
      document.querySelectorAll('.cg-chip').forEach(function (c) { c.classList.remove('cg-chip--active'); });
      el.classList.add('cg-chip--active');
      cgApplyFilters();
    }

    function cgApplyFilters() { cgFetch(); }

    function cgLocalFilter() {
      var q = (document.getElementById('cg-search').value || '').trim().toLowerCase();
      if (!q) { cgRender(_allData); return; }
      var filtered = _allData.filter(function (e) {
        return (e.topic && e.topic.toLowerCase().indexOf(q) !== -1) ||
               (e.packageId && e.packageId.toLowerCase().indexOf(q) !== -1);
      });
      cgRender(filtered);
    }

    function cgRender(items) {
      var grid = document.getElementById('cg-grid');
      grid.innerHTML = '';
      // Hide deleted unless explicitly filtering for them
      var showItems = _statusFilter === 'deleted' ? items : items.filter(function (e) { return e.status !== 'deleted'; });
      document.getElementById('cg-count').textContent = showItems.length + ' package' + (showItems.length !== 1 ? 's' : '');
      if (showItems.length === 0) { document.getElementById('cg-empty').style.display = 'block'; return; }
      document.getElementById('cg-empty').style.display = 'none';
      items = showItems;
      var batchSize = 20; var idx = 0;
      function renderBatch() {
        var frag = document.createDocumentFragment();
        var end = Math.min(idx + batchSize, items.length);
        for (; idx < end; idx++) frag.appendChild(buildCard(items[idx]));
        grid.appendChild(frag);
        if (idx < items.length) requestAnimationFrame(renderBatch);
      }
      requestAnimationFrame(renderBatch);
    }

    function buildCard(entry) {
      var card = document.createElement('div');
      card.className = 'cg-card';
      var thumbs = entry.thumbs || [];
      var mosaicHtml = '';
      var slots = Math.min(thumbs.length, 4);
      if (slots === 0) {
        mosaicHtml = '<div class="cg-mosaic" style="grid-template-columns:1fr;"><div class="cg-mosaic-placeholder"><i class="fas fa-image"></i></div></div>';
      } else {
        var cols = slots <= 1 ? '1fr' : '1fr 1fr';
        mosaicHtml = '<div class="cg-mosaic" style="grid-template-columns:' + cols + ';">';
        for (var t = 0; t < slots; t++) mosaicHtml += '<img src="' + thumbs[t] + '" alt="thumb" loading="lazy" />';
        if (slots === 3) mosaicHtml += '<div class="cg-mosaic-placeholder"><i class="fas fa-image"></i></div>';
        mosaicHtml += '</div>';
      }
      var statusClass = 'cg-badge--pending'; var statusLabel = entry.status || 'unknown';
      if (entry.status === 'pending_approval') { statusClass = 'cg-badge--pending'; statusLabel = 'pending'; }
      else if (entry.status === 'partial_success') { statusClass = 'cg-badge--partial'; statusLabel = 'partial'; }
      else if (entry.status === 'approved') { statusClass = 'cg-badge--success'; statusLabel = 'approved'; }
      else if (entry.status === 'failed') { statusClass = 'cg-badge--failed'; statusLabel = 'failed'; }
      var outputLabels = { 'x_image':'X', 'hero_image':'Hero', 'square_image':'Square', 'story_image':'Story', 'blog_image':'Blog', 'linkedin_image':'LinkedIn' };
      var outputStr = (entry.outputTypes || []).map(function (k) { return outputLabels[k] || k; }).join(', ');
      var countStr = '';
      if (entry.successCount > 0) countStr += entry.successCount + ' ok';
      if (entry.failedCount > 0) countStr += (countStr ? ', ' : '') + entry.failedCount + ' failed';
      if (entry.variations > 1) countStr += ' \u00b7 ' + entry.variations + ' var';
      var dateStr = entry.createdAt ? new Date(entry.createdAt).toLocaleDateString() : '';
      var isDeleted = entry.status === 'deleted';
      var actionsHtml = '<a class="cg-card-btn" href="/modules/company/content-engine.html?pkg=' + (entry.packageId || '') + '"><i class="fas fa-box-open"></i> Open</a>';
      if (entry.failedCount > 0 && !isDeleted) {
        actionsHtml += ' <button class="cg-card-btn cg-card-btn--retry" onclick="cgRetry(\'' + (entry.packageId || '') + '\', this)"><i class="fas fa-rotate-right"></i> Retry</button>';
      }
      if (!isDeleted) {
        actionsHtml += ' <button class="cg-card-btn cg-card-btn--delete" onclick="cgSoftDelete(\'' + (entry.packageId || '') + '\', this)"><i class="fas fa-trash"></i> Delete</button>';
      }
      // Detail meta line: presetLabel · variations · images
      var presetLabels = { 'ap-2d-flat':'2D Flat', 'ap-neon-glass':'Neon Glass', 'ap-ornate-frame':'Ornate Frame', 'ap-corporate-tech':'Corporate Tech' };
      var detailParts = [];
      detailParts.push(presetLabels[entry.preset] || (entry.preset || '').replace('ap-',''));
      var vCount = entry.variations || 1;
      detailParts.push(vCount + ' variation' + (vCount !== 1 ? 's' : ''));
      var imgCount = entry.successCount || 0;
      detailParts.push(imgCount + ' image' + (imgCount !== 1 ? 's' : ''));
      var detailStr = detailParts.join(' \u00b7 ');

      if (isDeleted) card.className += ' cg-card--deleted';
      card.innerHTML = mosaicHtml +
        '<div class="cg-card-body">' +
          '<div class="cg-card-topic">' + (entry.topic || entry.packageId || 'Package') + '</div>' +
          '<div class="cg-card-meta">' + dateStr + (countStr ? ' \u00b7 ' + countStr : '') + '</div>' +
          '<div class="cg-card-detail">' + detailStr + '</div>' +
          '<div class="cg-card-badges"><span class="cg-badge ' + statusClass + '">' + statusLabel + '</span></div>' +
          '<div class="cg-card-outputs">' + outputStr + '</div>' +
          '<div class="cg-card-actions">' + actionsHtml + '</div>' +
        '</div>';
      return card;
    }

    async function cgRetry(packageId, btn) {
      if (!packageId) return;
      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Retrying...';
      try {
        var res = await fetch(API_BASE + '/api/content-retry', {
          method: 'POST', headers: _getAuthHeaders(),
          body: JSON.stringify({ packageId: packageId })
        });
        var data = await res.json();
        if (!data.ok) { btn.innerHTML = '<i class="fas fa-exclamation-triangle"></i> Failed'; return; }
        btn.innerHTML = '<i class="fas fa-check"></i> ' + (data.stillFailed > 0 ? data.retriedCount + ' retried' : 'Done');
        setTimeout(function () { cgFetch(); }, 1500);
      } catch (err) {
        btn.innerHTML = '<i class="fas fa-exclamation-triangle"></i> Error';
      }
    }

    async function cgSoftDelete(packageId, btn) {
      if (!packageId) return;
      if (!confirm('Delete this package? It can be restored later.')) return;
      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
      try {
        var res = await fetch(API_BASE + '/api/content-package-delete', {
          method: 'POST', headers: _getAuthHeaders(),
          body: JSON.stringify({ id: packageId, mode: 'soft' })
        });
        var data = await res.json();
        if (!data.ok) { btn.innerHTML = '<i class="fas fa-exclamation-triangle"></i> Failed'; return; }
        btn.innerHTML = '<i class="fas fa-check"></i> Deleted';
        setTimeout(function () { cgFetch(); }, 800);
      } catch (err) {
        btn.innerHTML = '<i class="fas fa-exclamation-triangle"></i> Error';
      }
    }

    cgFetch();
  </script>
</main>
</body>
</html>
