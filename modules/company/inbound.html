<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Inbound — External signals captured by AmbientOS (forms, requests, signups)." />
  <link rel="icon" href="/images/favicon.ico" type="image/x-icon" />
  <title>Inbound — AmbientPixels HQ</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/grid.css" />
  <link rel="stylesheet" href="/css/nav.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/theme.css" />
  <link rel="stylesheet" href="/css/banner.css" />
  <link rel="stylesheet" href="/modules/company/css/company.css" />
  <link rel="stylesheet" href="/modules/company/css/dashboard.css" />
  <link rel="stylesheet" href="/modules/company/css/sidebar.css" />
  <link rel="stylesheet" href="/modules/company/css/quick-chat.css" />
  <link rel="stylesheet" href="/modules/company/css/inbound.css" />
</head>
<body data-theme="dark">

  <main id="inb-main" class="content-section">

    <!-- Hero -->
    <div class="inb-hero">
      <h1><i class="fas fa-satellite-dish co-icon-mr-lg dash-icon-sky"></i> Inbound</h1>
      <p>External signals captured by AmbientOS (forms, requests, signups).</p>
    </div>

    <!-- Stats -->
    <div class="inb-stats">
      <div class="inb-stat">
        <div class="inb-stat-value" id="inb-stat-today">–</div>
        <div class="inb-stat-label">Today</div>
      </div>
      <div class="inb-stat">
        <div class="inb-stat-value" id="inb-stat-week">–</div>
        <div class="inb-stat-label">Last 7 Days</div>
      </div>
      <div class="inb-stat">
        <div class="inb-stat-value" id="inb-stat-tasks">–</div>
        <div class="inb-stat-label">Tasks Spawned (7d)</div>
      </div>
    </div>

    <!-- Filters -->
    <div class="inb-filters">
      <button class="inb-chip inb-chip--active" data-filter="all">All</button>
      <button class="inb-chip" data-filter="contact">Contact</button>
      <button class="inb-chip" data-filter="demo">Demo</button>
      <button class="inb-chip" data-filter="newsletter">Newsletter</button>
      <label class="inb-toggle">
        <input type="checkbox" id="inb-hide-filtered" checked> Hide filtered
      </label>
    </div>

    <!-- Table -->
    <div class="inb-table-wrap">
      <table class="inb-table">
        <thead>
          <tr>
            <th>Time</th>
            <th>Type</th>
            <th>Name / Email</th>
            <th>Source</th>
            <th>Status</th>
            <th>Task</th>
          </tr>
        </thead>
        <tbody id="inb-tbody">
          <tr><td colspan="6" class="inb-empty"><i class="fas fa-spinner fa-spin"></i> Loading submissions...</td></tr>
        </tbody>
      </table>
    </div>

  </main>

  <!-- Detail Drawer -->
  <div class="inb-drawer-overlay" id="inb-drawer-overlay"></div>
  <div class="inb-drawer" id="inb-drawer">
    <button class="inb-drawer-close" id="inb-drawer-close"><i class="fas fa-times"></i></button>
    <div id="inb-drawer-content"></div>
  </div>

  <script src="/js/ap-config.js"></script>
  <script src="/modules/company/js/demo-toast.js"></script>
  <script src="/js/company-store.js"></script>
  <script src="/js/agent-engine.js"></script>
  <script src="/modules/company/js/quick-chat.js"></script>
  <script src="/modules/company/js/ap-utils.js"></script>
  <script src="/modules/company/js/ap-api.js"></script>
  <script src="/modules/company/js/sidebar.js"></script>
  <script src="/modules/company/js/inbound-intake.js"></script>
</body>
</html>
