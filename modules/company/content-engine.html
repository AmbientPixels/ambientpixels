<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="AmbientPixels Content Engine — Generate branded image packages for approval" />
  <link rel="icon" href="/images/favicon.ico" type="image/x-icon" />
  <title>Image Engine — AmbientPixels HQ</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/grid.css" />
  <link rel="stylesheet" href="/css/nav.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/theme.css" />
  <link rel="stylesheet" href="/css/banner.css" />
  <link rel="stylesheet" href="/modules/company/css/company.css" />
  <link rel="stylesheet" href="/modules/company/css/sidebar.css" />
  <link rel="stylesheet" href="/modules/company/css/quick-chat.css" />
  <style>
    .ce-panel { background:rgba(255,255,255,0.02); border:1px solid rgba(255,255,255,0.06); border-radius:10px; padding:1rem; margin-bottom:1rem; }
    .ce-panel-title { font-size:0.8rem; font-weight:600; margin-bottom:0.7rem; display:flex; align-items:center; gap:0.4rem; }
    .ce-panel-title i { opacity:0.5; font-size:0.7rem; }

    .ce-form-grid { display:grid; grid-template-columns:1fr 1fr; gap:0.6rem; margin-bottom:0.6rem; }
    .ce-form-full { grid-column: 1 / -1; }
    .ce-form label { font-size:0.62rem; opacity:0.5; display:block; margin-bottom:2px; text-transform:uppercase; letter-spacing:0.5px; }
    .ce-form input, .ce-form select, .ce-form textarea {
      width:100%; font-size:0.72rem; padding:7px 10px; background:rgba(255,255,255,0.04);
      border:1px solid rgba(255,255,255,0.08); border-radius:6px; color:#e0e0e0;
      font-family:inherit; box-sizing:border-box;
    }
    .ce-form textarea { resize:vertical; min-height:52px; }

    .ce-output-grid { display:flex; flex-wrap:wrap; gap:0.4rem; margin-top:4px; }
    .ce-output-chip {
      display:flex; align-items:center; gap:0.35rem; padding:6px 12px; border-radius:8px;
      font-size:0.65rem; cursor:pointer; user-select:none; transition:all 0.15s;
      background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.08); color:#aaa;
    }
    .ce-output-chip:hover { border-color:rgba(139,92,246,0.3); }
    .ce-output-chip--active { background:rgba(139,92,246,0.12); border-color:rgba(139,92,246,0.4); color:#c4b5fd; }
    .ce-output-chip i { font-size:0.6rem; }
    .ce-output-chip .ce-chip-size { font-size:0.55rem; opacity:0.5; }

    .ce-var-row { display:flex; align-items:center; gap:0.5rem; margin-top:4px; }
    .ce-var-btn {
      width:30px; height:30px; border-radius:6px; border:1px solid rgba(255,255,255,0.08);
      background:rgba(255,255,255,0.03); color:#aaa; font-size:0.72rem; font-weight:600;
      cursor:pointer; transition:all 0.15s;
    }
    .ce-var-btn:hover { border-color:rgba(139,92,246,0.3); }
    .ce-var-btn--active { background:rgba(139,92,246,0.12); border-color:rgba(139,92,246,0.4); color:#c4b5fd; }

    .ce-prompt-preview {
      background:rgba(0,0,0,0.2); border:1px solid rgba(255,255,255,0.06); border-radius:6px;
      padding:0.6rem; font-size:0.6rem; font-family:'Courier New',monospace; line-height:1.5;
      max-height:120px; overflow-y:auto; color:#888; display:none; margin-top:0.5rem;
    }
    .ce-prompt-toggle { font-size:0.6rem; color:#8b5cf6; cursor:pointer; opacity:0.7; margin-top:0.4rem; display:inline-block; }
    .ce-prompt-toggle:hover { opacity:1; }
    .ce-est { font-size:0.6rem; opacity:0.4; }

    .ce-actions { display:flex; gap:0.5rem; margin-top:0.6rem; }
    .ce-btn {
      padding:8px 16px; border:none; border-radius:6px; font-size:0.7rem; font-weight:600;
      cursor:pointer; font-family:inherit; display:inline-flex; align-items:center; gap:0.3rem;
      transition: opacity 0.2s;
    }
    .ce-btn:disabled { opacity:0.3; cursor:not-allowed; }
    .ce-btn--primary { background:#3b82f6; color:#fff; }
    .ce-btn--primary:hover:not(:disabled) { background:#2563eb; }
    .ce-btn--generate { background:#8b5cf6; color:#fff; }
    .ce-btn--generate:hover:not(:disabled) { background:#7c3aed; }

    .ce-status { margin-top:0.6rem; font-size:0.68rem; padding:0.4rem 0.6rem; border-radius:6px; display:none; }
    .ce-status--info { background:rgba(96,165,250,0.1); color:#60a5fa; display:block; }
    .ce-status--success { background:rgba(34,197,94,0.1); color:#22c55e; display:block; }
    .ce-status--error { background:rgba(239,68,68,0.1); color:#ef4444; display:block; }
    .ce-status--loading { background:rgba(251,191,36,0.08); color:#fbbf24; display:block; }
    .ce-status i { margin-right:4px; }

    .ce-results { display:none; }
    .ce-results-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(280px, 1fr)); gap:0.8rem; margin-top:0.6rem; }
    .ce-result-card {
      background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.08);
      border-radius:8px; overflow:hidden;
    }
    .ce-result-img { width:100%; aspect-ratio:16/9; object-fit:cover; background:#111; display:block; }
    .ce-result-img--hero { aspect-ratio:3/2; }
    .ce-result-body { padding:0.6rem; }
    .ce-result-label { font-size:0.6rem; opacity:0.4; text-transform:uppercase; margin-bottom:2px; }
    .ce-result-size { font-size:0.68rem; font-weight:500; margin-bottom:0.3rem; }
    .ce-result-links { display:flex; gap:0.5rem; }
    .ce-result-links a { font-size:0.62rem; color:#60a5fa; text-decoration:none; }
    .ce-result-links a:hover { text-decoration:underline; }

    .ce-approval-badge {
      display:inline-flex; align-items:center; gap:0.3rem; font-size:0.65rem;
      padding:3px 10px; border-radius:12px; font-weight:600;
      background:rgba(251,191,36,0.12); color:#fbbf24; margin-top:0.5rem;
    }

    .ce-log { margin-top:0.5rem; max-height:160px; overflow-y:auto; font-size:0.62rem; font-family:'Courier New',monospace; opacity:0.6; line-height:1.6; }
    .ce-log-entry { padding:1px 0; }

    .ce-preset-preview { font-size:0.6rem; opacity:0.4; margin-top:2px; font-style:italic; }
  </style>
</head>
<body>
  <h1 style="font-size:1.1rem; font-weight:600; margin-bottom:0.3rem;">
    <i class="fas fa-images" style="opacity:0.5;"></i> Image Engine
  </h1>
  <p style="font-size:0.68rem; opacity:0.4; margin-bottom:1rem;">Generate branded images with AI. One click — brief is auto-created behind the scenes.</p>

  <!-- ── Generate Form ── -->
  <div class="ce-panel ce-form" id="ce-form-panel">
    <div class="ce-panel-title"><i class="fas fa-wand-magic-sparkles"></i> Generate Images</div>
    <div class="ce-form-grid">
      <div>
        <label for="ce-topic">Topic *</label>
        <input type="text" id="ce-topic" placeholder="e.g. CardForge Launch Promo" maxlength="200" />
      </div>
      <div>
        <label for="ce-preset">Visual Style *</label>
        <select id="ce-preset">
          <option value="ap-neon-glass">Neon Glass</option>
          <option value="ap-2d-flat">2D Flat</option>
          <option value="ap-ornate-frame">Ornate Frame</option>
          <option value="ap-corporate-tech">Corporate Tech</option>
        </select>
        <div class="ce-preset-preview" id="ce-preset-preview"></div>
      </div>
      <div class="ce-form-full">
        <label for="ce-goal">Describe what you want *</label>
        <textarea id="ce-goal" placeholder="e.g. An eye-catching abstract promo with clean 2D borders and glowing badges" maxlength="500"></textarea>
      </div>
      <div>
        <label for="ce-audience">Audience (optional)</label>
        <input type="text" id="ce-audience" placeholder="e.g. Indie game developers" maxlength="200" />
      </div>
      <div>
        <label for="ce-tone">Tone (optional)</label>
        <input type="text" id="ce-tone" placeholder="e.g. Energetic, bold" maxlength="100" />
      </div>
      <div class="ce-form-full">
        <label>Image Formats</label>
        <div class="ce-output-grid" id="ce-output-grid"></div>
      </div>
      <div>
        <label>Variations per format</label>
        <div class="ce-var-row">
          <button class="ce-var-btn ce-var-btn--active" data-v="1" onclick="setVariations(1)">1</button>
          <button class="ce-var-btn" data-v="2" onclick="setVariations(2)">2</button>
          <button class="ce-var-btn" data-v="3" onclick="setVariations(3)">3</button>
          <button class="ce-var-btn" data-v="4" onclick="setVariations(4)">4</button>
          <span class="ce-est" id="ce-est-label"></span>
        </div>
      </div>
    </div>

    <div class="ce-prompt-toggle" onclick="togglePromptPreview()"><i class="fas fa-eye"></i> Preview prompt</div>
    <div class="ce-prompt-preview" id="ce-prompt-preview"></div>

    <div class="ce-actions">
      <button class="ce-btn ce-btn--generate" id="ce-generate-btn" onclick="ceQuickGenerate()">
        <i class="fas fa-bolt"></i> Generate
      </button>
      <span class="ce-est" id="ce-time-est"></span>
    </div>

    <div class="ce-status" id="ce-status"></div>
    <div class="ce-log" id="ce-log"></div>
  </div>

  <!-- ── Results ── -->
  <div class="ce-panel ce-results" id="ce-results">
    <div class="ce-panel-title"><i class="fas fa-box-open"></i> Generated Package</div>
    <div id="ce-results-meta" style="font-size:0.65rem; opacity:0.5; margin-bottom:0.4rem;"></div>
    <div class="ce-results-grid" id="ce-results-grid"></div>
    <div id="ce-results-links" style="margin-top:0.5rem;"></div>
    <div id="ce-approval-status"></div>
  </div>

  <!-- Scripts -->
  <script src="/js/company-store-adapter.js"></script>
  <script src="/js/company-store.js"></script>
  <script src="/modules/company/js/sidebar.js"></script>
  <script src="/modules/company/js/quick-chat.js"></script>
  <script>
    var API_BASE = 'https://ambientpixels-nova-api.azurewebsites.net';
    var _selectedOutputs = ['x_image'];
    var _variations = 1;

    var OUTPUT_TYPES = {
      'x_image':        { label: 'X / Twitter',    icon: 'fa-brands fa-x-twitter', size: '1600\u00d7900',  aspect: '16:9' },
      'hero_image':     { label: 'Hero Banner',    icon: 'fa-panorama',            size: '1536\u00d71024', aspect: '3:2' },
      'square_image':   { label: 'Square',         icon: 'fa-square',              size: '1024\u00d71024', aspect: '1:1' },
      'story_image':    { label: 'Story',          icon: 'fa-mobile-screen',       size: '1080\u00d71920', aspect: '9:16' },
      'blog_image':     { label: 'Blog Header',    icon: 'fa-newspaper',           size: '1200\u00d7900',  aspect: '4:3' },
      'linkedin_image': { label: 'LinkedIn',       icon: 'fa-brands fa-linkedin',  size: '1200\u00d7627',  aspect: '1.91:1' }
    };

    var PRESET_DESC = {
      'ap-2d-flat': 'Bold flat colors, minimal shadows, geometric vector-art.',
      'ap-neon-glass': 'Dark bg, neon glow, glass-morphism, cyberpunk palette.',
      'ap-ornate-frame': 'Art Nouveau borders, gold & jewel tones, vintage feel.',
      'ap-corporate-tech': 'Navy-to-teal gradients, geometric patterns, sleek.'
    };

    // ── Helpers ──
    async function _safeJson(res) {
      var text = await res.text();
      if (!text) return { _empty: true, _status: res.status };
      try { return JSON.parse(text); } catch (e) { return { error: 'HTTP ' + res.status + ': ' + text.substring(0, 200), _status: res.status }; }
    }

    function _getAuthHeaders() {
      var headers = { 'Content-Type': 'application/json' };
      try { var key = sessionStorage.getItem('ap_server_key'); if (key) headers['x-company-secret'] = key; } catch (e) {}
      return headers;
    }

    function _setStatus(msg, type) {
      var el = document.getElementById('ce-status');
      el.className = 'ce-status ce-status--' + type;
      var icon = type === 'loading' ? 'fa-spinner fa-spin' : type === 'success' ? 'fa-check-circle' : type === 'error' ? 'fa-exclamation-circle' : 'fa-info-circle';
      el.innerHTML = '<i class="fas ' + icon + '"></i> ' + msg;
    }

    function _addLog(msg) {
      var log = document.getElementById('ce-log');
      var entry = document.createElement('div');
      entry.className = 'ce-log-entry';
      entry.textContent = '[' + new Date().toLocaleTimeString() + '] ' + msg;
      log.appendChild(entry);
      log.scrollTop = log.scrollHeight;
    }

    function _formatBytes(bytes) {
      if (!bytes) return '\u2014';
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
      return (bytes / 1048576).toFixed(2) + ' MB';
    }

    // ── Output Chips ──
    function buildOutputChips() {
      var grid = document.getElementById('ce-output-grid');
      grid.innerHTML = '';
      Object.keys(OUTPUT_TYPES).forEach(function (key) {
        var t = OUTPUT_TYPES[key];
        var chip = document.createElement('div');
        chip.className = 'ce-output-chip' + (_selectedOutputs.indexOf(key) !== -1 ? ' ce-output-chip--active' : '');
        chip.setAttribute('data-key', key);
        chip.innerHTML = '<i class="' + t.icon + '"></i> ' + t.label + ' <span class="ce-chip-size">' + t.size + '</span>';
        chip.addEventListener('click', function () { toggleOutput(key); });
        grid.appendChild(chip);
      });
      updateEstimate();
    }

    function toggleOutput(key) {
      var idx = _selectedOutputs.indexOf(key);
      if (idx !== -1) { _selectedOutputs.splice(idx, 1); } else { _selectedOutputs.push(key); }
      buildOutputChips();
    }

    // ── Variations ──
    function setVariations(n) {
      _variations = n;
      document.querySelectorAll('.ce-var-btn').forEach(function (btn) {
        btn.classList.toggle('ce-var-btn--active', parseInt(btn.getAttribute('data-v')) === n);
      });
      updateEstimate();
    }

    function updateEstimate() {
      var total = _selectedOutputs.length * _variations;
      var estSec = total * 30;
      document.getElementById('ce-est-label').textContent = total + ' image' + (total !== 1 ? 's' : '') + ' total';
      document.getElementById('ce-time-est').textContent = total > 0 ? '~' + Math.ceil(estSec / 60) + ' min estimated' : '';
    }

    // ── Preset Preview ──
    function _updatePresetPreview() {
      document.getElementById('ce-preset-preview').textContent = PRESET_DESC[document.getElementById('ce-preset').value] || '';
    }
    document.getElementById('ce-preset').addEventListener('change', _updatePresetPreview);
    _updatePresetPreview();

    // ── Prompt Preview ──
    function togglePromptPreview() {
      var el = document.getElementById('ce-prompt-preview');
      if (el.style.display === 'block') { el.style.display = 'none'; return; }
      var topic = document.getElementById('ce-topic').value.trim() || '(topic)';
      var goal = document.getElementById('ce-goal').value.trim() || '(goal)';
      var preset = document.getElementById('ce-preset').value;
      var presetLabel = PRESET_DESC[preset] || preset;
      var outputs = _selectedOutputs.map(function (k) { return OUTPUT_TYPES[k] ? OUTPUT_TYPES[k].label + ' (' + OUTPUT_TYPES[k].size + ')' : k; });
      el.textContent = 'TOPIC: ' + topic + '\nGOAL: ' + goal + '\nVISUAL STYLE: ' + presetLabel + '\nFORMATS: ' + outputs.join(', ') + '\nVARIATIONS: ' + _variations;
      el.style.display = 'block';
    }

    // ── Quick Generate (one click) ──
    async function ceQuickGenerate() {
      var topic = document.getElementById('ce-topic').value.trim();
      var goal = document.getElementById('ce-goal').value.trim();
      var preset = document.getElementById('ce-preset').value;

      if (!topic || topic.length < 3) { _setStatus('Topic required (min 3 chars)', 'error'); return; }
      if (!goal || goal.length < 3) { _setStatus('Description required (min 3 chars)', 'error'); return; }
      if (_selectedOutputs.length === 0) { _setStatus('Select at least one image format', 'error'); return; }

      var genBtn = document.getElementById('ce-generate-btn');
      genBtn.disabled = true;
      var totalImages = _selectedOutputs.length * _variations;
      _setStatus('Generating ' + totalImages + ' image' + (totalImages !== 1 ? 's' : '') + '... ~' + Math.ceil(totalImages * 30 / 60) + ' min', 'loading');
      _addLog('Quick generate: ' + topic + ' (' + _selectedOutputs.join(', ') + ') x' + _variations);

      try {
        var res = await fetch(API_BASE + '/api/content-quick-generate', {
          method: 'POST',
          headers: _getAuthHeaders(),
          body: JSON.stringify({
            topic: topic,
            goal: goal,
            preset: preset,
            outputs: _selectedOutputs,
            variations: _variations,
            audience: document.getElementById('ce-audience').value.trim() || undefined,
            tone: document.getElementById('ce-tone').value.trim() || undefined
          })
        });

        var data = await _safeJson(res);
        if (!res.ok || !data.ok) {
          _setStatus('Failed (HTTP ' + res.status + '): ' + (data.error || 'Unknown error'), 'error');
          _addLog('ERROR: ' + (data.error || JSON.stringify(data).substring(0, 200)));
          if (data.details) { data.details.forEach(function (d) { _addLog('  ' + (d.outputKey || d.outputType) + ': ' + d.error); }); }
          genBtn.disabled = false;
          return;
        }

        _setStatus('Package generated! Submitted to Approval Queue.', 'success');
        _addLog('Package: ' + data.packageId + ' | Brief: ' + data.briefId);
        if (data.errors) { data.errors.forEach(function (e) { _addLog('WARN: ' + (e.outputKey || e.outputType) + ' failed: ' + e.error); }); }

        _renderResults(data);
        genBtn.disabled = false;

      } catch (err) {
        _setStatus('Network error: ' + err.message, 'error');
        _addLog('ERROR: ' + err.message);
        genBtn.disabled = false;
      }
    }

    // ── Render Results ──
    function _renderResults(data) {
      var panel = document.getElementById('ce-results');
      panel.style.display = 'block';

      document.getElementById('ce-results-meta').textContent =
        'Package: ' + data.packageId + ' | Brief: ' + data.briefId;

      var grid = document.getElementById('ce-results-grid');
      grid.innerHTML = '';

      var outputs = data.outputs || {};
      Object.keys(outputs).forEach(function (key) {
        var out = outputs[key];
        var baseType = out.outputType || key.replace(/_v\d+$/, '');
        var info = OUTPUT_TYPES[baseType] || { label: key, size: out.size };

        var card = document.createElement('div');
        card.className = 'ce-result-card';
        card.innerHTML =
          '<img src="' + out.imageUrl + '" alt="' + info.label + '" class="ce-result-img" loading="lazy" />' +
          '<div class="ce-result-body">' +
            '<div class="ce-result-label">' + info.label + (out.variation > 1 ? ' (v' + out.variation + ')' : '') + '</div>' +
            '<div class="ce-result-size">' + out.size + ' \u00b7 ' + _formatBytes(out.bytes) + '</div>' +
            '<div class="ce-result-links">' +
              '<a href="' + out.imageUrl + '" target="_blank"><i class="fas fa-external-link-alt"></i> Open</a>' +
              '<a href="' + out.metaUrl + '" target="_blank"><i class="fas fa-code"></i> Meta</a>' +
            '</div>' +
          '</div>';
        grid.appendChild(card);
      });

      var linksEl = document.getElementById('ce-results-links');
      linksEl.innerHTML = '<a href="' + (data.packageUrl || '#') + '" target="_blank" style="font-size:0.65rem; color:#60a5fa;"><i class="fas fa-box"></i> Open Package JSON</a>';

      var approvalEl = document.getElementById('ce-approval-status');
      if (data.skippedApproval) {
        approvalEl.innerHTML = '<div class="ce-approval-badge" style="background:rgba(34,197,94,0.12); color:#22c55e;"><i class="fas fa-check"></i> Auto-approved</div>';
      } else {
        approvalEl.innerHTML = '<div class="ce-approval-badge"><i class="fas fa-clock"></i> Submitted to Approval Queue (' + (data.approvalItemId || '') + ')</div>';
      }
    }

    // ── Init ──
    buildOutputChips();
  </script>
</body>
</html>
