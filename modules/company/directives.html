<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="AmbientPixels Strategic Directives — CEO-defined high-level direction for the company." />
  <link rel="icon" href="/images/favicon.ico" type="image/x-icon" />
  <title>Strategic Directives — AmbientPixels HQ</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/grid.css" />
  <link rel="stylesheet" href="/css/nav.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/theme.css" />
  <link rel="stylesheet" href="/css/banner.css" />
  <link rel="stylesheet" href="/modules/company/css/company.css" />
  <link rel="stylesheet" href="/modules/company/css/dashboard.css" />
  <link rel="stylesheet" href="/modules/company/css/sidebar.css" />
  <style>
    .dir-modal-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,0.7);
      display: none; align-items: center; justify-content: center; z-index: 1000;
    }
    .dir-modal {
      width: min(420px, 90%); background: rgba(7,16,25,0.95);
      border: 1px solid rgba(255,255,255,0.08); border-radius: 10px;
      padding: 1rem; box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }
    .dir-modal h3 { margin: 0 0 0.6rem; font-size: 1rem; }
    .dir-modal label { display:block; font-size:0.7rem; opacity:0.5; margin-top:0.6rem; }
    .dir-modal input,
    .dir-modal textarea,
    .dir-modal select {
      width: 100%; padding: 0.4rem 0.6rem; border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.08); background: rgba(255,255,255,0.03);
      color: inherit; font-size: 0.8rem; font-family: inherit;
    }
    .dir-modal textarea { resize: vertical; min-height: 80px; }
    .dir-modal-actions { margin-top: 0.8rem; display:flex; gap:0.5rem; justify-content:flex-end; }
    .dir-btn {
      font-size:0.65rem; padding:0.3rem 0.8rem; border-radius:5px; border:1px solid rgba(255,255,255,0.1);
      background:rgba(255,255,255,0.05); color:#fff; cursor:pointer;
    }
    .dir-btn--primary { border-color:#8A2BE2; background:rgba(138,43,226,0.2); color:#d8b4fe; }
    .dir-btn--danger { border-color:#f87171; color:#f87171; }
  </style>
</head>
<body style="background:#071019" data-theme="dark">

  <main class="content-section" style="max-width: 900px; margin: 0 auto; padding: 1rem;">

    <div class="company-header">
      <h1><i class="fas fa-compass" style="opacity:0.4; margin-right:8px; color:#8A2BE2;"></i>Strategic Directives</h1>
      <p>CEO-defined high-level direction. Prime Operator translates directives into objectives and tasks.</p>
    </div>

    <!-- Create Directive Form -->
    <div class="dash-panel" style="margin-bottom:1.5rem;">
      <div class="dash-panel-header">
        <span class="dash-panel-title"><i class="fas fa-plus-circle" style="color:#FFD700;"></i> New Directive</span>
      </div>
      <div style="padding:0.5rem 0;">
        <input type="text" id="dir-title" placeholder="Directive title..." style="width:100%; padding:0.5rem 0.7rem; background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.08); border-radius:6px; color:inherit; font-size:0.8rem; margin-bottom:0.5rem;" />
        <textarea id="dir-desc" placeholder="Description — what should the team achieve?" rows="3" style="width:100%; padding:0.5rem 0.7rem; background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.08); border-radius:6px; color:inherit; font-size:0.75rem; resize:vertical; margin-bottom:0.5rem;"></textarea>
        <div style="display:flex; gap:0.5rem; align-items:center;">
          <select id="dir-priority" style="padding:0.35rem 0.6rem; background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.08); border-radius:6px; color:inherit; font-size:0.7rem;">
            <option value="low">Low</option>
            <option value="medium" selected>Medium</option>
            <option value="high">High</option>
            <option value="critical">Critical</option>
          </select>
          <button id="dir-create-btn" style="padding:0.35rem 1rem; background:rgba(138,43,226,0.1); border:1px solid rgba(138,43,226,0.3); border-radius:6px; color:#8A2BE2; font-size:0.7rem; cursor:pointer; font-weight:500;">Create Directive</button>
        </div>
      </div>
    </div>

    <!-- Active Directives -->
    <div class="dash-panel dash-panel--full">
      <div class="dash-panel-header">
        <span class="dash-panel-title"><i class="fas fa-fire" style="color:#FF8C00;"></i> Active Directives</span>
        <span class="dash-panel-badge" id="active-dir-count">0</span>
      </div>
      <div id="dir-active-list">
        <div class="dash-empty">No active directives. Create one above.</div>
      </div>
    </div>

    <!-- Completed / Paused -->
    <div class="dash-panel dash-panel--full" style="margin-top:1rem;">
      <div class="dash-panel-header">
        <span class="dash-panel-title"><i class="fas fa-archive" style="opacity:0.4;"></i> Completed / Paused</span>
      </div>
      <div id="dir-archive-list">
        <div class="dash-empty">No archived directives.</div>
      </div>
    </div>

  </main>

  <div class="dir-modal-backdrop" id="dir-edit-modal">
    <div class="dir-modal">
      <h3>Edit Directive</h3>
      <label for="edit-title">Title</label>
      <input type="text" id="edit-title" />

      <label for="edit-desc">Description</label>
      <textarea id="edit-desc"></textarea>

      <label for="edit-priority">Priority</label>
      <select id="edit-priority">
        <option value="low">Low</option>
        <option value="medium">Medium</option>
        <option value="high">High</option>
        <option value="critical">Critical</option>
      </select>

      <label for="edit-status">Status</label>
      <select id="edit-status">
        <option value="active">Active</option>
        <option value="paused">Paused</option>
        <option value="completed">Completed</option>
      </select>

      <div class="dir-modal-actions">
        <button class="dir-btn" id="edit-cancel">Cancel</button>
        <button class="dir-btn dir-btn--primary" id="edit-save">Save</button>
      </div>
    </div>
  </div>

  <script src="/js/company-store.js"></script>
  <script src="/js/agent-engine.js"></script>
  <script>
    (function () {
      'use strict';

      var titleInput = document.getElementById('dir-title');
      var descInput = document.getElementById('dir-desc');
      var prioritySelect = document.getElementById('dir-priority');
      var createBtn = document.getElementById('dir-create-btn');
      var activeList = document.getElementById('dir-active-list');
      var archiveList = document.getElementById('dir-archive-list');
      var activeCount = document.getElementById('active-dir-count');
      var modal = document.getElementById('dir-edit-modal');
      var editTitle = document.getElementById('edit-title');
      var editDesc = document.getElementById('edit-desc');
      var editPriority = document.getElementById('edit-priority');
      var editStatus = document.getElementById('edit-status');
      var editSave = document.getElementById('edit-save');
      var editCancel = document.getElementById('edit-cancel');
      var editingId = null;

      AgentEngine.loadRegistry().then(function () { renderDirectives(); });

      document.addEventListener('sync-complete', function () { renderDirectives(); });

      editCancel.addEventListener('click', closeModal);
      modal.addEventListener('click', function (e) { if (e.target === modal) closeModal(); });
      editSave.addEventListener('click', function () {
        if (!editingId) return;
        var payload = {
          title: editTitle.value.trim(),
          description: editDesc.value.trim(),
          priority: editPriority.value,
          status: editStatus.value
        };
        AgentEngine.updateDirective(editingId, payload);
        closeModal();
        renderDirectives();
      });

      createBtn.addEventListener('click', function () {
        var title = titleInput.value.trim();
        if (!title) return;

        AgentEngine.addDirective({
          title: title,
          description: descInput.value.trim(),
          priority: prioritySelect.value
        });

        titleInput.value = '';
        descInput.value = '';
        prioritySelect.value = 'medium';
        renderDirectives();
      });

      function renderDirectives() {
        var directives = AgentEngine.getDirectives();
        var active = directives.filter(function (d) { return d.status === 'active'; });
        var archived = directives.filter(function (d) { return d.status !== 'active'; });

        activeCount.textContent = active.length;

        // Active
        if (active.length === 0) {
          activeList.innerHTML = '<div class="dash-empty">No active directives. Create one above.</div>';
        } else {
          activeList.innerHTML = '';
          active.forEach(function (dir) { activeList.appendChild(createDirectiveCard(dir)); });
        }

        // Archived
        if (archived.length === 0) {
          archiveList.innerHTML = '<div class="dash-empty">No archived directives.</div>';
        } else {
          archiveList.innerHTML = '';
          archived.forEach(function (dir) { archiveList.appendChild(createDirectiveCard(dir, true)); });
        }
      }

      function createDirectiveCard(dir, isArchived) {
        var card = document.createElement('div');
        card.style.cssText = 'padding:0.8rem; border:1px solid rgba(138,43,226,0.08); border-radius:8px; margin-bottom:0.5rem; background:rgba(138,43,226,0.02);';

        var priorityColor = dir.priority === 'critical' ? '#f87171' : dir.priority === 'high' ? '#fbbf24' : dir.priority === 'medium' ? '#8A2BE2' : '#34d399';

        var linkedHtml = '';
        if (dir.linkedObjectives && dir.linkedObjectives.length > 0) {
          linkedHtml += '<span style="font-size:0.6rem; opacity:0.5;"><i class="fas fa-bullseye"></i> ' + dir.linkedObjectives.length + ' objectives</span> ';
        }
        if (dir.linkedTasks && dir.linkedTasks.length > 0) {
          linkedHtml += '<span style="font-size:0.6rem; opacity:0.5;"><i class="fas fa-tasks"></i> ' + dir.linkedTasks.length + ' tasks</span>';
        }

        card.innerHTML =
          '<div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:0.3rem;">' +
            '<strong style="font-size:0.85rem;">' + escapeHtml(dir.title) + '</strong>' +
            '<span style="font-size:0.6rem; padding:0.15rem 0.5rem; border-radius:3px; background:rgba(138,43,226,0.1); color:' + priorityColor + ';">' + dir.priority + '</span>' +
          '</div>' +
          (dir.description ? '<p style="font-size:0.75rem; opacity:0.6; margin:0 0 0.4rem;">' + escapeHtml(dir.description) + '</p>' : '') +
          '<div style="display:flex; gap:0.6rem; align-items:center; margin-bottom:0.4rem;">' +
            '<span style="font-size:0.6rem; opacity:0.4;">Created: ' + new Date(dir.createdDate).toLocaleDateString() + '</span>' +
            '<span style="font-size:0.6rem; padding:0.1rem 0.4rem; border-radius:3px; background:rgba(255,255,255,0.05);">' + dir.status + '</span>' +
            linkedHtml +
          '</div>';

        if (!isArchived) {
          var btnWrap = document.createElement('div');
          btnWrap.style.cssText = 'display:flex; gap:0.3rem; margin-top:0.3rem;';

          var completeBtn = document.createElement('button');
          completeBtn.textContent = 'Complete';
          completeBtn.style.cssText = 'font-size:0.6rem; padding:0.2rem 0.5rem; border:1px solid rgba(52,211,153,0.3); background:rgba(52,211,153,0.05); color:#34d399; border-radius:4px; cursor:pointer;';
          completeBtn.addEventListener('click', function () {
            AgentEngine.updateDirective(dir.id, { status: 'completed' });
            renderDirectives();
          });

          var pauseBtn = document.createElement('button');
          pauseBtn.textContent = 'Pause';
          pauseBtn.style.cssText = 'font-size:0.6rem; padding:0.2rem 0.5rem; border:1px solid rgba(251,191,36,0.3); background:rgba(251,191,36,0.05); color:#fbbf24; border-radius:4px; cursor:pointer;';
          pauseBtn.addEventListener('click', function () {
            AgentEngine.updateDirective(dir.id, { status: 'paused' });
            renderDirectives();
          });

          var editBtn = document.createElement('button');
          editBtn.textContent = 'Edit';
          editBtn.style.cssText = 'font-size:0.6rem; padding:0.2rem 0.5rem; border:1px solid rgba(138,43,226,0.3); background:rgba(138,43,226,0.05); color:#c084fc; border-radius:4px; cursor:pointer;';
          editBtn.addEventListener('click', function () { openModal(dir); });

          btnWrap.appendChild(completeBtn);
          btnWrap.appendChild(pauseBtn);
          btnWrap.appendChild(editBtn);
          card.appendChild(btnWrap);
        }

        return card;
      }

      function escapeHtml(str) {
        var div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
      }

      function openModal(dir) {
        editingId = dir.id;
        editTitle.value = dir.title || '';
        editDesc.value = dir.description || '';
        editPriority.value = dir.priority || 'medium';
        editStatus.value = dir.status || 'active';
        modal.style.display = 'flex';
      }

      function closeModal() {
        modal.style.display = 'none';
        editingId = null;
      }
    })();
  </script>

  <script src="/modules/company/js/sidebar.js"></script>
</body>
</html>
