<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="AmbientPixels Quarterly Board — executive review of projects, KPIs, risks, decisions, and throughput." />
  <link rel="icon" href="/images/favicon.ico" type="image/x-icon" />
  <title>Board Mode — AmbientPixels HQ</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/grid.css" />
  <link rel="stylesheet" href="/css/nav.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/theme.css" />
  <link rel="stylesheet" href="/css/banner.css" />
  <link rel="stylesheet" href="/modules/company/css/company.css" />
  <link rel="stylesheet" href="/modules/company/css/dashboard.css" />
  <link rel="stylesheet" href="/modules/company/css/sidebar.css" />
  <link rel="stylesheet" href="/modules/company/css/quick-chat.css" />
  <style>
    .board-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem; flex-wrap:wrap; gap:0.5rem; }
    .board-header h1 { font-size:1.3rem; font-weight:700; margin:0; }
    .board-controls { display:flex; gap:0.4rem; align-items:center; }
    .board-controls select, .board-controls button { padding:0.3rem 0.6rem; background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.1); border-radius:6px; color:inherit; font-size:0.7rem; cursor:pointer; }
    .board-controls button:hover { background:rgba(255,255,255,0.06); }
    .board-date-range { font-size:0.65rem; opacity:0.4; }
    .board-section { margin-bottom:1.2rem; }
    .board-section-title { font-size:0.85rem; font-weight:600; margin-bottom:0.5rem; display:flex; align-items:center; gap:0.4rem; }
    .board-card { padding:0.5rem 0.6rem; border:1px solid rgba(255,255,255,0.05); border-radius:8px; background:rgba(255,255,255,0.015); margin-bottom:0.4rem; }
    .board-stat-row { display:flex; gap:0.6rem; flex-wrap:wrap; margin-bottom:1rem; }
    .board-stat { flex:1 1 140px; min-width:120px; padding:0.5rem 0.6rem; border:1px solid rgba(255,255,255,0.05); border-radius:8px; background:rgba(255,255,255,0.015); text-align:center; }
    .board-stat-val { font-size:1.4rem; font-weight:700; }
    .board-stat-label { font-size:0.6rem; opacity:0.5; margin-top:0.15rem; }
    .board-kpi-grid { display:flex; gap:0.5rem; flex-wrap:wrap; }
    .board-kpi-card { flex:1 1 200px; min-width:180px; padding:0.5rem 0.6rem; border-radius:8px; }
    .board-badge { font-size:0.5rem; padding:1px 6px; border-radius:4px; font-weight:600; }
    .board-dir-card { display:flex; justify-content:space-between; align-items:center; padding:0.4rem 0.6rem; border:1px solid rgba(255,255,255,0.04); border-radius:6px; margin-bottom:0.3rem; background:rgba(255,255,255,0.01); }
    .board-empty { font-size:0.7rem; opacity:0.3; padding:0.5rem 0; }
    .board-copy-btn { border-color:rgba(52,211,153,0.2) !important; color:#34d399 !important; }
    .board-copy-btn:hover { background:rgba(52,211,153,0.06) !important; }
    .board-two-col { display:grid; grid-template-columns:1fr 1fr; gap:1rem; }
    @media (max-width:700px) { .board-two-col { grid-template-columns:1fr; } }
    .board-goal-card { padding:0.45rem 0.6rem; border:1px solid rgba(255,255,255,0.04); border-radius:6px; margin-bottom:0.35rem; background:rgba(255,255,255,0.01); }
    .board-goal-title { font-size:0.8rem; font-weight:600; margin-bottom:0.2rem; }
    .board-goal-meta { font-size:0.55rem; opacity:0.45; display:flex; gap:0.4rem; flex-wrap:wrap; }
    .board-progress-bar { height:6px; border-radius:3px; background:rgba(255,255,255,0.06); overflow:hidden; margin-top:0.3rem; }
    .board-progress-fill { height:100%; border-radius:3px; transition:width 0.3s; }
    .board-agent-card { padding:0.4rem 0.55rem; border:1px solid rgba(255,255,255,0.04); border-radius:6px; background:rgba(255,255,255,0.01); display:flex; align-items:center; gap:0.5rem; }
    .board-agent-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
    .board-agent-name { font-size:0.72rem; font-weight:600; }
    .board-agent-role { font-size:0.5rem; opacity:0.35; }
    .board-agent-stat { font-size:0.6rem; margin-left:auto; opacity:0.5; }
    .board-cost-row { display:flex; gap:0.4rem; flex-wrap:wrap; }
    .board-cost-item { flex:1; min-width:80px; text-align:center; padding:0.3rem 0.4rem; border:1px solid rgba(255,255,255,0.04); border-radius:6px; background:rgba(255,255,255,0.01); }
    .board-cost-val { font-size:0.9rem; font-weight:700; }
    .board-cost-label { font-size:0.48rem; opacity:0.35; margin-top:0.1rem; }
    .board-content-row { display:flex; gap:0.5rem; flex-wrap:wrap; }
    .board-content-pill { flex:1; min-width:80px; text-align:center; padding:0.5rem; border:1px solid rgba(255,255,255,0.05); border-radius:8px; background:rgba(255,255,255,0.015); }
    .board-content-pill-val { font-size:1.1rem; font-weight:700; }
    .board-content-pill-label { font-size:0.5rem; opacity:0.4; margin-top:0.1rem; }
  </style>
</head>
<body style="background:#071019" data-theme="dark">

  <main class="content-section" style="max-width:1240px; margin:0 auto; padding:1rem;">

    <!-- Header -->
    <div class="board-header">
      <div>
        <h1><i class="fas fa-columns" style="color:#c084fc;"></i> Quarterly Board</h1>
        <div class="board-date-range" id="board-range"></div>
      </div>
      <div class="board-controls">
        <select id="board-year"></select>
        <select id="board-quarter">
          <option value="Q1">Q1</option>
          <option value="Q2">Q2</option>
          <option value="Q3">Q3</option>
          <option value="Q4">Q4</option>
        </select>
        <button id="board-render-btn"><i class="fas fa-sync-alt"></i> Load</button>
        <button id="board-copy-btn" class="board-copy-btn"><i class="fas fa-clipboard"></i> Copy Board Packet</button>
        <a href="/modules/company/dashboard.html" style="padding:0.3rem 0.6rem; border:1px solid rgba(255,255,255,0.1); border-radius:6px; font-size:0.7rem; color:inherit; text-decoration:none;"><i class="fas fa-arrow-left"></i> Dashboard</a>
      </div>
    </div>

    <!-- 1. Headline Stats -->
    <div class="board-stat-row" id="board-headline-stats"></div>

    <!-- 2. Executive Summary -->
    <div class="board-section" id="sec-exec">
      <div class="board-section-title"><i class="fas fa-briefcase" style="color:#FFD700;"></i> Executive Summary</div>
      <div class="board-card" id="board-exec-summary" style="font-size:0.8rem; line-height:1.5; border-color:rgba(255,215,0,0.1); background:rgba(255,215,0,0.02);"></div>
    </div>

    <!-- 3. Goals -->
    <div class="board-section" id="sec-goals">
      <div class="board-section-title"><i class="fas fa-bullseye" style="color:#4ECDC4;"></i> Goals <span class="board-badge" id="badge-goals" style="background:rgba(78,205,196,0.1);color:#4ECDC4;">0</span></div>
      <div id="board-goals"></div>
    </div>

    <!-- 4–5. Projects + Team (two-column) -->
    <div class="board-two-col">
      <div>
        <!-- Active Projects -->
        <div class="board-section" id="sec-active-dirs">
          <div class="board-section-title"><i class="fas fa-fire" style="color:#FF8C00;"></i> Active Projects <span class="board-badge" id="badge-active-dirs" style="background:rgba(255,140,0,0.1);color:#FF8C00;">0</span></div>
          <div id="board-active-dirs"></div>
        </div>
        <!-- Completed Projects -->
        <div class="board-section" id="sec-completed-dirs">
          <div class="board-section-title"><i class="fas fa-trophy" style="color:#c084fc;"></i> Completed <span class="board-badge" id="badge-completed-dirs" style="background:rgba(192,132,252,0.1);color:#c084fc;">0</span></div>
          <div id="board-completed-dirs"></div>
        </div>
        <!-- Pending Approval -->
        <div class="board-section" id="sec-pending-dirs">
          <div class="board-section-title"><i class="fas fa-hourglass-half" style="color:#fbbf24;"></i> Pending Approval <span class="board-badge" id="badge-pending-dirs" style="background:rgba(251,191,36,0.1);color:#fbbf24;">0</span></div>
          <div id="board-pending-dirs"></div>
        </div>
      </div>
      <div>
        <!-- Agent Team -->
        <div class="board-section" id="sec-team">
          <div class="board-section-title"><i class="fas fa-users" style="color:#4ECDC4;"></i> Agent Team</div>
          <div id="board-team" style="display:flex; flex-direction:column; gap:0.35rem;"></div>
        </div>
        <!-- Approval Backlog -->
        <div class="board-section" id="sec-backlog">
          <div class="board-section-title"><i class="fas fa-inbox" style="color:#fbbf24;"></i> Approval Backlog <span class="board-badge" id="badge-backlog" style="background:rgba(251,191,36,0.1);color:#fbbf24;">0</span></div>
          <div id="board-backlog"></div>
        </div>
      </div>
    </div>

    <!-- 6–7. Cost + Content Pipeline (two-column) -->
    <div class="board-two-col">
      <div>
        <div class="board-section" id="sec-cost">
          <div class="board-section-title"><i class="fas fa-dollar-sign" style="color:#fbbf24;"></i> Cost Summary</div>
          <div id="board-cost"></div>
        </div>
      </div>
      <div>
        <div class="board-section" id="sec-content">
          <div class="board-section-title"><i class="fas fa-newspaper" style="color:#a78bfa;"></i> Content Pipeline</div>
          <div id="board-content"></div>
        </div>
      </div>
    </div>

    <!-- 8. Decisions Log -->
    <div class="board-section" id="sec-decisions">
      <div class="board-section-title"><i class="fas fa-gavel" style="color:#60a5fa;"></i> Decisions <span class="board-badge" id="badge-decisions" style="background:rgba(96,165,250,0.1);color:#60a5fa;">0</span></div>
      <div id="board-decisions"></div>
    </div>

    <!-- 9. Risk Register -->
    <div class="board-section" id="sec-risks">
      <div class="board-section-title"><i class="fas fa-exclamation-triangle" style="color:#f87171;"></i> Risk Register <span class="board-badge" id="badge-risks" style="background:rgba(248,113,113,0.1);color:#f87171;">0</span></div>
      <div id="board-risks"></div>
    </div>

    <!-- 10. Throughput -->
    <div class="board-section" id="sec-throughput">
      <div class="board-section-title"><i class="fas fa-tachometer-alt" style="color:#34d399;"></i> Delivery / Throughput</div>
      <div class="board-stat-row" id="board-throughput"></div>
    </div>

  </main>

  <script src="/js/company-store.js"></script>
  <script src="/js/agent-engine.js"></script>
  <script src="/modules/company/js/quick-chat.js"></script>
  <script>
    (function () {
      'use strict';

      var yearSel = document.getElementById('board-year');
      var quarterSel = document.getElementById('board-quarter');
      var renderBtn = document.getElementById('board-render-btn');
      var copyBtn = document.getElementById('board-copy-btn');
      var rangeEl = document.getElementById('board-range');

      // Populate year dropdown
      var nowYear = new Date().getFullYear();
      for (var y = nowYear - 2; y <= nowYear + 1; y++) {
        var opt = document.createElement('option');
        opt.value = y; opt.textContent = y;
        if (y === nowYear) opt.selected = true;
        yearSel.appendChild(opt);
      }
      // Default quarter
      var nowQ = 'Q' + (Math.floor(new Date().getMonth() / 3) + 1);
      quarterSel.value = nowQ;

      var _packet = null;

      AgentEngine.loadRegistry().then(function () { renderBoard(); });

      // Re-render after CompanyStore server sync
      window.addEventListener('companystoreready', function () { renderBoard(); });

      renderBtn.addEventListener('click', renderBoard);
      copyBtn.addEventListener('click', copyPacket);

      function escapeHtml(str) {
        var div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
      }

      function renderBoard() {
        var year = parseInt(yearSel.value);
        var quarter = quarterSel.value;
        _packet = AgentEngine.getBoardPacket({ year: year, quarter: quarter });

        // Range display
        var s = new Date(_packet.dateRange.startISO);
        var e = new Date(_packet.dateRange.endISO);
        rangeEl.textContent = _packet.quarterKey + '  ·  ' + s.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) + ' – ' + e.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });

        renderHeadlineStats();
        renderExecSummary();
        renderGoals();
        renderDirectiveSection('board-active-dirs', 'badge-active-dirs', _packet.directives.active);
        renderDirectiveSection('board-completed-dirs', 'badge-completed-dirs', _packet.directives.completed);
        renderDirectiveSection('board-pending-dirs', 'badge-pending-dirs', _packet.directives.pendingApproval);
        renderTeam();
        renderBacklog();
        renderCostSummary();
        renderContentPipeline();
        renderDecisions();
        renderRisks();
        renderThroughput();
      }

      function renderExecSummary() {
        var el = document.getElementById('board-exec-summary');
        el.textContent = _packet.execSummary || 'No data available for this quarter.';
      }

      function renderHeadlineStats() {
        var el = document.getElementById('board-headline-stats');
        var objectives = AgentEngine.getObjectives ? AgentEngine.getObjectives() : [];
        var queue = AgentEngine.getApprovalQueue ? AgentEngine.getApprovalQueue() : [];
        var pending = queue.filter(function (q) { return q.status === 'pending'; });
        var reg = AgentEngine.getRegistry ? AgentEngine.getRegistry() : null;
        var agentCount = (reg && reg.agents) ? reg.agents.length : 0;
        var tasks = AgentEngine.getTasks ? AgentEngine.getTasks() : [];
        var doneTasks = tasks.filter(function (t) { return t.status === 'done'; });
        var autoCompleted = doneTasks.filter(function (t) { return !t.manuallyCompleted; }).length;
        var autonomyPct = doneTasks.length > 0 ? Math.round((autoCompleted / doneTasks.length) * 100) : 0;

        var sessions = AgentEngine.getSessionLog ? AgentEngine.getSessionLog() : [];
        var totalCost = 0;
        sessions.forEach(function (s) { if (s.cost) totalCost += s.cost; });

        el.innerHTML =
          '<div class="board-stat"><div class="board-stat-val" style="color:#4ECDC4;">' + objectives.length + '</div><div class="board-stat-label">Goals</div></div>' +
          '<div class="board-stat"><div class="board-stat-val" style="color:#FF8C00;">' + _packet.directives.active.length + '</div><div class="board-stat-label">Active Projects</div></div>' +
          '<div class="board-stat"><div class="board-stat-val" style="color:#60a5fa;">' + _packet.throughput.tasksCreated + ' / ' + _packet.throughput.tasksCompleted + '</div><div class="board-stat-label">Tasks Created / Done</div></div>' +
          '<div class="board-stat"><div class="board-stat-val" style="color:#34d399;">' + autonomyPct + '%</div><div class="board-stat-label">Autonomy</div></div>' +
          '<div class="board-stat"><div class="board-stat-val" style="color:#fbbf24;">$' + totalCost.toFixed(2) + '</div><div class="board-stat-label">Total Spend</div></div>' +
          '<div class="board-stat"><div class="board-stat-val" style="color:#ef4444;">' + pending.length + '</div><div class="board-stat-label">Pending Approvals</div></div>';
      }

      function renderGoals() {
        var el = document.getElementById('board-goals');
        var badge = document.getElementById('badge-goals');
        var objectives = AgentEngine.getObjectives ? AgentEngine.getObjectives() : [];
        badge.textContent = objectives.length;

        if (objectives.length === 0) {
          el.innerHTML = '<div class="board-empty">No goals defined yet.</div>';
          return;
        }

        var html = '';
        objectives.forEach(function (o) {
          var pct = o.progressPercentage || 0;
          var statusColors = { on_track: '#34d399', at_risk: '#fbbf24', behind: '#ef4444', completed: '#c084fc' };
          var sColor = statusColors[o.status] || '#60a5fa';
          var barColor = pct >= 75 ? '#34d399' : pct >= 40 ? '#fbbf24' : '#60a5fa';

          html += '<div class="board-goal-card">';
          html += '<div class="board-goal-title">' + escapeHtml(o.title || 'Untitled') + '</div>';
          html += '<div class="board-goal-meta">';
          if (o.quarter) html += '<span>Q' + o.quarter + '</span>';
          html += '<span style="color:' + sColor + ';">' + (o.status || 'active').replace(/_/g, ' ') + '</span>';
          html += '<span>' + pct + '% complete</span>';
          if (o.linkedDirectives && o.linkedDirectives.length > 0) html += '<span>' + o.linkedDirectives.length + ' project' + (o.linkedDirectives.length > 1 ? 's' : '') + '</span>';
          html += '</div>';
          html += '<div class="board-progress-bar"><div class="board-progress-fill" style="width:' + pct + '%;background:' + barColor + ';"></div></div>';
          html += '</div>';
        });
        el.innerHTML = html;
      }

      function renderTeam() {
        var el = document.getElementById('board-team');
        var reg = AgentEngine.getRegistry ? AgentEngine.getRegistry() : null;
        var agents = (reg && reg.agents) ? reg.agents : [];
        if (agents.length === 0) {
          el.innerHTML = '<div class="board-empty">No agents loaded.</div>';
          return;
        }

        var tasks = AgentEngine.getTasks ? AgentEngine.getTasks() : [];
        var sessions = AgentEngine.getSessionLog ? AgentEngine.getSessionLog() : [];
        var agentStats = AgentEngine.getAgentSessionStats ? AgentEngine.getAgentSessionStats() : {};

        var html = '';
        agents.forEach(function (a) {
          var agentId = a.id || a.name;
          var doneTasks = tasks.filter(function (t) { return (t.assignee === agentId || t.assignee === (a.name || '').toLowerCase()) && t.status === 'done'; }).length;
          var activeTasks = tasks.filter(function (t) { return (t.assignee === agentId || t.assignee === (a.name || '').toLowerCase()) && t.status !== 'done' && t.status !== 'backlog'; }).length;
          var stat = agentStats[agentId];
          var calls = stat ? stat.calls : 0;

          html += '<div class="board-agent-card">';
          html += '<div class="board-agent-dot" style="background:' + (a.color || '#8A2BE2') + ';"></div>';
          html += '<div>';
          html += '<div class="board-agent-name">' + escapeHtml(a.name || agentId) + '</div>';
          html += '<div class="board-agent-role">' + escapeHtml(a.role || '') + '</div>';
          html += '</div>';
          html += '<div class="board-agent-stat">' + doneTasks + ' done · ' + activeTasks + ' active · ' + calls + ' calls</div>';
          html += '</div>';
        });
        el.innerHTML = html;
      }

      function renderBacklog() {
        var el = document.getElementById('board-backlog');
        var badge = document.getElementById('badge-backlog');
        var queue = AgentEngine.getApprovalQueue ? AgentEngine.getApprovalQueue() : [];
        var pending = queue.filter(function (q) { return q.status === 'pending'; });
        badge.textContent = pending.length;

        if (pending.length === 0) {
          el.innerHTML = '<div class="board-empty">No pending approvals.</div>';
          return;
        }

        // Avg wait time
        var totalWaitMs = 0;
        var now = Date.now();
        pending.forEach(function (p) {
          if (p.submittedAt) totalWaitMs += now - new Date(p.submittedAt).getTime();
        });
        var avgWaitH = pending.length > 0 ? Math.round(totalWaitMs / pending.length / 3600000) : 0;

        var html = '<div class="board-cost-row" style="margin-bottom:0.5rem;">';
        html += '<div class="board-cost-item"><div class="board-cost-val" style="color:#fbbf24;">' + pending.length + '</div><div class="board-cost-label">Pending</div></div>';
        html += '<div class="board-cost-item"><div class="board-cost-val" style="color:#ef4444;">' + avgWaitH + 'h</div><div class="board-cost-label">Avg Wait</div></div>';
        html += '</div>';

        // List first 5
        pending.slice(0, 5).forEach(function (p) {
          html += '<div class="board-dir-card" style="font-size:0.7rem;">';
          html += '<div style="flex:1;min-width:0;"><span style="font-weight:600;">' + escapeHtml(p.taskTitle || p.title || p.taskId || '?') + '</span>';
          if (p.submittedAt) html += '<span style="opacity:0.35;font-size:0.55rem;margin-left:0.4rem;">' + new Date(p.submittedAt).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) + '</span>';
          html += '</div>';
          html += '<span style="font-size:0.5rem;color:#fbbf24;">pending</span>';
          html += '</div>';
        });
        if (pending.length > 5) html += '<div style="font-size:0.55rem;opacity:0.3;padding:0.2rem 0;">+' + (pending.length - 5) + ' more</div>';
        el.innerHTML = html;
      }

      function renderCostSummary() {
        var el = document.getElementById('board-cost');
        var sessions = AgentEngine.getSessionLog ? AgentEngine.getSessionLog() : [];

        var totalCost = 0, totalTokensIn = 0, totalTokensOut = 0, totalCalls = 0;
        var perAgent = {};
        sessions.forEach(function (s) {
          totalCost += s.cost || 0;
          totalTokensIn += s.inputTokens || 0;
          totalTokensOut += s.outputTokens || 0;
          totalCalls++;
          var aid = s.agentId || 'unknown';
          if (!perAgent[aid]) perAgent[aid] = { cost: 0, calls: 0 };
          perAgent[aid].cost += s.cost || 0;
          perAgent[aid].calls++;
        });

        var html = '<div class="board-cost-row" style="margin-bottom:0.5rem;">';
        html += '<div class="board-cost-item"><div class="board-cost-val" style="color:#fbbf24;">$' + totalCost.toFixed(2) + '</div><div class="board-cost-label">Total Spend</div></div>';
        html += '<div class="board-cost-item"><div class="board-cost-val" style="color:#60a5fa;">' + totalCalls + '</div><div class="board-cost-label">API Calls</div></div>';
        html += '<div class="board-cost-item"><div class="board-cost-val" style="color:#34d399;">' + Math.round((totalTokensIn + totalTokensOut) / 1000) + 'k</div><div class="board-cost-label">Total Tokens</div></div>';
        html += '</div>';

        // Per-agent breakdown
        var agentKeys = Object.keys(perAgent).sort(function (a, b) { return perAgent[b].cost - perAgent[a].cost; });
        if (agentKeys.length > 0) {
          html += '<div style="font-size:0.55rem;opacity:0.4;margin-bottom:0.25rem;">Per Agent</div>';
          agentKeys.slice(0, 6).forEach(function (aid) {
            var agent = AgentEngine.getAgent ? AgentEngine.getAgent(aid) : null;
            var name = agent ? agent.name : aid;
            var c = perAgent[aid];
            html += '<div style="display:flex;justify-content:space-between;font-size:0.65rem;padding:0.15rem 0;border-bottom:1px solid rgba(255,255,255,0.03);">';
            html += '<span>' + escapeHtml(name) + '</span>';
            html += '<span style="opacity:0.5;">$' + c.cost.toFixed(3) + ' · ' + c.calls + ' calls</span>';
            html += '</div>';
          });
        }
        el.innerHTML = html || '<div class="board-empty">No cost data available.</div>';
      }

      function renderContentPipeline() {
        var el = document.getElementById('board-content');
        var docs = [];
        try { docs = CompanyStore.getState('documents') || []; } catch (e) {}

        var published = docs.filter(function (d) { return d.status === 'published'; }).length;
        var draft = docs.filter(function (d) { return d.status === 'draft'; }).length;
        var review = docs.filter(function (d) { return d.status === 'review'; }).length;
        var promote = docs.filter(function (d) { return d.promote; }).length;
        var total = docs.length;

        if (total === 0) {
          el.innerHTML = '<div class="board-empty">No content in pipeline.</div>';
          return;
        }

        var html = '<div class="board-content-row">';
        html += '<div class="board-content-pill"><div class="board-content-pill-val" style="color:#34d399;">' + published + '</div><div class="board-content-pill-label">Published</div></div>';
        html += '<div class="board-content-pill"><div class="board-content-pill-val" style="color:#60a5fa;">' + draft + '</div><div class="board-content-pill-label">Drafts</div></div>';
        html += '<div class="board-content-pill"><div class="board-content-pill-val" style="color:#fbbf24;">' + review + '</div><div class="board-content-pill-label">In Review</div></div>';
        if (promote > 0) html += '<div class="board-content-pill"><div class="board-content-pill-val" style="color:#c084fc;">' + promote + '</div><div class="board-content-pill-label">Promoted</div></div>';
        html += '</div>';

        el.innerHTML = html;
      }

      function renderDirectiveSection(listId, badgeId, dirs) {
        var listEl = document.getElementById(listId);
        var badge = document.getElementById(badgeId);
        badge.textContent = dirs.length;
        if (dirs.length === 0) {
          listEl.innerHTML = '<div class="board-empty">None for this quarter.</div>';
          return;
        }
        listEl.innerHTML = '';

        dirs.forEach(function (d) {
          var pColor = d.priority === 'critical' ? '#ef4444' : d.priority === 'high' ? '#fbbf24' : d.priority === 'medium' ? '#8A2BE2' : '#34d399';
          var sColor = d.status === 'active' ? '#34d399' : d.status === 'completed' ? '#c084fc' : d.status === 'pending-approval' ? '#fbbf24' : '#6b7280';

          var div = document.createElement('div');
          div.className = 'board-dir-card';
          var html = '<div style="flex:1;min-width:0;">';
          html += '<div style="font-size:0.85rem;font-weight:600;">' + escapeHtml(d.title) + '</div>';
          html += '<div style="display:flex;gap:0.4rem;flex-wrap:wrap;margin-top:3px;font-size:0.6rem;opacity:0.5;">';
          html += '<span style="color:' + sColor + ';">' + d.status + '</span>';
          html += '<span style="color:' + pColor + ';">' + (d.priority || 'medium') + '</span>';
          if (d.classification) html += '<span>' + d.classification + '</span>';
          if (d.impact) html += '<span>Impact: ' + d.impact + '</span>';
          if (d.owner) html += '<span>Owner: ' + d.owner + '</span>';
          if (d.kpiLinks && d.kpiLinks.length > 0) html += '<span style="color:#4ECDC4;">' + d.kpiLinks.length + ' KPI' + (d.kpiLinks.length > 1 ? 's' : '') + '</span>';
          html += '</div>';
          html += '</div>';
          div.innerHTML = html;
          listEl.appendChild(div);
        });
      }

      function renderDecisions() {
        var listEl = document.getElementById('board-decisions');
        var badge = document.getElementById('badge-decisions');
        badge.textContent = _packet.decisions.length;
        if (_packet.decisions.length === 0) {
          listEl.innerHTML = '<div class="board-empty">No decisions recorded this quarter.</div>';
          return;
        }
        listEl.innerHTML = '';

        _packet.decisions.forEach(function (d) {
          var sColor = d.decisionStatus === 'Approved' ? '#34d399' : d.decisionStatus === 'Rejected' ? '#f87171' : d.decisionStatus === 'Deferred' ? '#fbbf24' : '#60a5fa';
          var div = document.createElement('div');
          div.className = 'board-dir-card';
          div.innerHTML =
            '<div style="flex:1;min-width:0;">' +
              '<div style="font-size:0.8rem;font-weight:600;">' + escapeHtml(d.title) + '</div>' +
              '<div style="font-size:0.6rem;opacity:0.5;margin-top:2px;">' +
                (d.topicKey ? d.topicKey + ' · ' : '') +
                new Date(d.date).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) +
                (d.decisionNotes ? ' · ' + escapeHtml(d.decisionNotes).substring(0, 80) : '') +
              '</div>' +
            '</div>' +
            '<span style="font-size:0.55rem;padding:2px 8px;border-radius:4px;background:' + sColor + '18;color:' + sColor + ';font-weight:600;white-space:nowrap;">' + d.decisionStatus + '</span>';
          listEl.appendChild(div);
        });
      }

      function renderRisks() {
        var listEl = document.getElementById('board-risks');
        var badge = document.getElementById('badge-risks');
        badge.textContent = _packet.risks.length;
        if (_packet.risks.length === 0) {
          listEl.innerHTML = '<div class="board-empty">No risks identified this quarter.</div>';
          return;
        }
        listEl.innerHTML = '';

        var sevColors = { critical: '#ef4444', high: '#f87171', medium: '#fbbf24', low: '#34d399' };
        _packet.risks.slice(0, 10).forEach(function (r) {
          var sColor = sevColors[r.severity] || '#fbbf24';
          var div = document.createElement('div');
          div.className = 'board-dir-card';
          div.innerHTML =
            '<div style="flex:1;min-width:0;">' +
              '<div style="font-size:0.8rem;">' + escapeHtml(r.description) + '</div>' +
              '<div style="font-size:0.6rem;opacity:0.4;margin-top:2px;">From: ' + escapeHtml(r.standupTitle || '?') + ' · ' + (r.date ? new Date(r.date).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) : '') + '</div>' +
            '</div>' +
            '<span style="font-size:0.55rem;padding:2px 8px;border-radius:4px;background:' + sColor + '18;color:' + sColor + ';font-weight:600;white-space:nowrap;">' + r.severity + '</span>';
          listEl.appendChild(div);
        });
        if (_packet.risks.length > 10) {
          var more = document.createElement('div');
          more.style.cssText = 'font-size:0.6rem;opacity:0.3;padding:0.3rem 0;';
          more.textContent = '+' + (_packet.risks.length - 10) + ' more risks';
          listEl.appendChild(more);
        }
      }

      function renderThroughput() {
        var el = document.getElementById('board-throughput');
        var tp = _packet.throughput;
        el.innerHTML =
          '<div class="board-stat"><div class="board-stat-val" style="color:#60a5fa;">' + tp.tasksCreated + '</div><div class="board-stat-label">Tasks Created</div></div>' +
          '<div class="board-stat"><div class="board-stat-val" style="color:#34d399;">' + tp.tasksCompleted + '</div><div class="board-stat-label">Tasks Completed</div></div>' +
          '<div class="board-stat"><div class="board-stat-val" style="color:#fbbf24;">' + tp.pendingApprovalTasks + '</div><div class="board-stat-label">Pending Approval</div></div>' +
          '<div class="board-stat"><div class="board-stat-val" style="color:#c084fc;">' + _packet.decisions.length + '</div><div class="board-stat-label">Decisions Made</div></div>' +
          '<div class="board-stat"><div class="board-stat-val" style="color:#f87171;">' + _packet.risks.length + '</div><div class="board-stat-label">Risks Logged</div></div>';
      }

      function copyPacket() {
        if (!_packet) return;
        var lines = [];
        lines.push('# ' + _packet.quarterKey + ' Board Packet');
        lines.push('');
        lines.push('## Executive Summary');
        lines.push(_packet.execSummary);
        lines.push('');

        // Headline stats
        var objectives = AgentEngine.getObjectives ? AgentEngine.getObjectives() : [];
        var tasks = AgentEngine.getTasks ? AgentEngine.getTasks() : [];
        var doneTasks = tasks.filter(function (t) { return t.status === 'done'; });
        var autoCompleted = doneTasks.filter(function (t) { return !t.manuallyCompleted; }).length;
        var autonomyPct = doneTasks.length > 0 ? Math.round((autoCompleted / doneTasks.length) * 100) : 0;
        var sessions = AgentEngine.getSessionLog ? AgentEngine.getSessionLog() : [];
        var totalCost = 0;
        sessions.forEach(function (s) { if (s.cost) totalCost += s.cost; });

        lines.push('## Key Metrics');
        lines.push('- Goals: ' + objectives.length);
        lines.push('- Active Projects: ' + _packet.directives.active.length);
        lines.push('- Tasks Created / Completed: ' + _packet.throughput.tasksCreated + ' / ' + _packet.throughput.tasksCompleted);
        lines.push('- Autonomy: ' + autonomyPct + '%');
        lines.push('- Total Spend: $' + totalCost.toFixed(2));
        lines.push('');

        // Goals
        if (objectives.length > 0) {
          lines.push('## Goals (' + objectives.length + ')');
          objectives.forEach(function (o) {
            lines.push('- ' + o.title + ' [' + (o.status || 'active').replace(/_/g, ' ') + '] ' + (o.progressPercentage || 0) + '%');
          });
          lines.push('');
        }

        lines.push('## Active Projects (' + _packet.directives.active.length + ')');
        _packet.directives.active.forEach(function (d) { lines.push('- ' + d.title + ' [' + d.priority + ']'); });
        lines.push('');
        lines.push('## Completed Projects (' + _packet.directives.completed.length + ')');
        _packet.directives.completed.forEach(function (d) { lines.push('- ' + d.title); });
        lines.push('');

        // Team
        var reg = AgentEngine.getRegistry ? AgentEngine.getRegistry() : null;
        var agents = (reg && reg.agents) ? reg.agents : [];
        if (agents.length > 0) {
          lines.push('## Agent Team');
          agents.forEach(function (a) {
            var aid = a.id || a.name;
            var done = tasks.filter(function (t) { return (t.assignee === aid || t.assignee === (a.name || '').toLowerCase()) && t.status === 'done'; }).length;
            lines.push('- ' + a.name + ' (' + a.role + '): ' + done + ' tasks done');
          });
          lines.push('');
        }

        // Cost
        lines.push('## Cost');
        lines.push('- Total Spend: $' + totalCost.toFixed(2));
        lines.push('- API Calls: ' + sessions.length);
        lines.push('');

        // Content
        var docs = [];
        try { docs = CompanyStore.getState('documents') || []; } catch (e) {}
        if (docs.length > 0) {
          var published = docs.filter(function (d) { return d.status === 'published'; }).length;
          var draft = docs.filter(function (d) { return d.status === 'draft'; }).length;
          lines.push('## Content Pipeline');
          lines.push('- Published: ' + published + ', Drafts: ' + draft + ', Total: ' + docs.length);
          lines.push('');
        }

        lines.push('## Decisions (' + _packet.decisions.length + ')');
        _packet.decisions.forEach(function (d) { lines.push('- ' + d.title + ' → ' + d.decisionStatus); });
        lines.push('');
        lines.push('## Risks (' + _packet.risks.length + ')');
        _packet.risks.slice(0, 10).forEach(function (r) { lines.push('- [' + r.severity + '] ' + r.description); });

        var text = lines.join('\n');
        if (navigator.clipboard) {
          navigator.clipboard.writeText(text).then(function () {
            copyBtn.innerHTML = '<i class="fas fa-check"></i> Copied!';
            setTimeout(function () { copyBtn.innerHTML = '<i class="fas fa-clipboard"></i> Copy Board Packet'; }, 2000);
          });
        }
      }

    })();
  </script>

  <script src="/modules/company/js/sidebar.js"></script>
