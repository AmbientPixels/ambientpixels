<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="AmbientPixels Quarterly Board — executive review of directives, KPIs, risks, decisions, and throughput." />
  <link rel="icon" href="/images/favicon.ico" type="image/x-icon" />
  <title>Board Mode — AmbientPixels HQ</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/grid.css" />
  <link rel="stylesheet" href="/css/nav.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/theme.css" />
  <link rel="stylesheet" href="/css/banner.css" />
  <link rel="stylesheet" href="/modules/company/css/company.css" />
  <link rel="stylesheet" href="/modules/company/css/dashboard.css" />
  <link rel="stylesheet" href="/modules/company/css/sidebar.css" />
  <link rel="stylesheet" href="/modules/company/css/quick-chat.css" />
  <style>
    .board-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem; flex-wrap:wrap; gap:0.5rem; }
    .board-header h1 { font-size:1.3rem; font-weight:700; margin:0; }
    .board-controls { display:flex; gap:0.4rem; align-items:center; }
    .board-controls select, .board-controls button { padding:0.3rem 0.6rem; background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.1); border-radius:6px; color:inherit; font-size:0.7rem; cursor:pointer; }
    .board-controls button:hover { background:rgba(255,255,255,0.06); }
    .board-date-range { font-size:0.65rem; opacity:0.4; }
    .board-section { margin-bottom:1.2rem; }
    .board-section-title { font-size:0.85rem; font-weight:600; margin-bottom:0.5rem; display:flex; align-items:center; gap:0.4rem; }
    .board-card { padding:0.5rem 0.6rem; border:1px solid rgba(255,255,255,0.05); border-radius:8px; background:rgba(255,255,255,0.015); margin-bottom:0.4rem; }
    .board-stat-row { display:flex; gap:0.6rem; flex-wrap:wrap; margin-bottom:1rem; }
    .board-stat { flex:1 1 140px; min-width:120px; padding:0.5rem 0.6rem; border:1px solid rgba(255,255,255,0.05); border-radius:8px; background:rgba(255,255,255,0.015); text-align:center; }
    .board-stat-val { font-size:1.4rem; font-weight:700; }
    .board-stat-label { font-size:0.6rem; opacity:0.5; margin-top:0.15rem; }
    .board-kpi-grid { display:flex; gap:0.5rem; flex-wrap:wrap; }
    .board-kpi-card { flex:1 1 200px; min-width:180px; padding:0.5rem 0.6rem; border-radius:8px; }
    .board-badge { font-size:0.5rem; padding:1px 6px; border-radius:4px; font-weight:600; }
    .board-dir-card { display:flex; justify-content:space-between; align-items:center; padding:0.4rem 0.6rem; border:1px solid rgba(255,255,255,0.04); border-radius:6px; margin-bottom:0.3rem; background:rgba(255,255,255,0.01); }
    .board-empty { font-size:0.7rem; opacity:0.3; padding:0.5rem 0; }
    .board-copy-btn { border-color:rgba(52,211,153,0.2) !important; color:#34d399 !important; }
    .board-copy-btn:hover { background:rgba(52,211,153,0.06) !important; }
  </style>
</head>
<body style="background:#071019" data-theme="dark">

  <main class="content-section" style="max-width:960px; margin:0 auto; padding:1rem;">

    <!-- Header -->
    <div class="board-header">
      <div>
        <h1><i class="fas fa-columns" style="color:#c084fc;"></i> Quarterly Board</h1>
        <div class="board-date-range" id="board-range"></div>
      </div>
      <div class="board-controls">
        <select id="board-year"></select>
        <select id="board-quarter">
          <option value="Q1">Q1</option>
          <option value="Q2">Q2</option>
          <option value="Q3">Q3</option>
          <option value="Q4">Q4</option>
        </select>
        <button id="board-render-btn"><i class="fas fa-sync-alt"></i> Load</button>
        <button id="board-copy-btn" class="board-copy-btn"><i class="fas fa-clipboard"></i> Copy Board Packet</button>
        <a href="/modules/company/dashboard.html" style="padding:0.3rem 0.6rem; border:1px solid rgba(255,255,255,0.1); border-radius:6px; font-size:0.7rem; color:inherit; text-decoration:none;"><i class="fas fa-arrow-left"></i> Dashboard</a>
      </div>
    </div>

    <!-- 1. Executive Summary -->
    <div class="board-section" id="sec-exec">
      <div class="board-section-title"><i class="fas fa-briefcase" style="color:#FFD700;"></i> Executive Summary</div>
      <div class="board-card" id="board-exec-summary" style="font-size:0.8rem; line-height:1.5; border-color:rgba(255,215,0,0.1); background:rgba(255,215,0,0.02);"></div>
    </div>

    <!-- 2. KPI Scoreboard -->
    <div class="board-section" id="sec-kpis">
      <div class="board-section-title"><i class="fas fa-chart-line" style="color:#4ECDC4;"></i> KPI Scoreboard</div>
      <div class="board-kpi-grid" id="board-kpi-grid"></div>
    </div>

    <!-- 3. Active / Approved Directives -->
    <div class="board-section" id="sec-active-dirs">
      <div class="board-section-title"><i class="fas fa-fire" style="color:#FF8C00;"></i> Active Directives <span class="board-badge" id="badge-active-dirs" style="background:rgba(255,140,0,0.1);color:#FF8C00;">0</span></div>
      <div id="board-active-dirs"></div>
    </div>

    <!-- 4. Completed Directives -->
    <div class="board-section" id="sec-completed-dirs">
      <div class="board-section-title"><i class="fas fa-trophy" style="color:#c084fc;"></i> Completed Directives <span class="board-badge" id="badge-completed-dirs" style="background:rgba(192,132,252,0.1);color:#c084fc;">0</span></div>
      <div id="board-completed-dirs"></div>
    </div>

    <!-- 5. Pending Approval -->
    <div class="board-section" id="sec-pending-dirs">
      <div class="board-section-title"><i class="fas fa-hourglass-half" style="color:#fbbf24;"></i> Pending Approval <span class="board-badge" id="badge-pending-dirs" style="background:rgba(251,191,36,0.1);color:#fbbf24;">0</span></div>
      <div id="board-pending-dirs"></div>
    </div>

    <!-- 6. Decisions Log -->
    <div class="board-section" id="sec-decisions">
      <div class="board-section-title"><i class="fas fa-gavel" style="color:#60a5fa;"></i> Decisions <span class="board-badge" id="badge-decisions" style="background:rgba(96,165,250,0.1);color:#60a5fa;">0</span></div>
      <div id="board-decisions"></div>
    </div>

    <!-- 7. Risk Register -->
    <div class="board-section" id="sec-risks">
      <div class="board-section-title"><i class="fas fa-exclamation-triangle" style="color:#f87171;"></i> Risk Register <span class="board-badge" id="badge-risks" style="background:rgba(248,113,113,0.1);color:#f87171;">0</span></div>
      <div id="board-risks"></div>
    </div>

    <!-- 8. Throughput -->
    <div class="board-section" id="sec-throughput">
      <div class="board-section-title"><i class="fas fa-tachometer-alt" style="color:#34d399;"></i> Delivery / Throughput</div>
      <div class="board-stat-row" id="board-throughput"></div>
    </div>

  </main>

  <script src="/js/company-store.js"></script>
  <script src="/js/agent-engine.js"></script>
  <script src="/modules/company/js/quick-chat.js"></script>
  <script>
    (function () {
      'use strict';

      var yearSel = document.getElementById('board-year');
      var quarterSel = document.getElementById('board-quarter');
      var renderBtn = document.getElementById('board-render-btn');
      var copyBtn = document.getElementById('board-copy-btn');
      var rangeEl = document.getElementById('board-range');

      // Populate year dropdown
      var nowYear = new Date().getFullYear();
      for (var y = nowYear - 2; y <= nowYear + 1; y++) {
        var opt = document.createElement('option');
        opt.value = y; opt.textContent = y;
        if (y === nowYear) opt.selected = true;
        yearSel.appendChild(opt);
      }
      // Default quarter
      var nowQ = 'Q' + (Math.floor(new Date().getMonth() / 3) + 1);
      quarterSel.value = nowQ;

      var _packet = null;

      AgentEngine.loadRegistry().then(function () { renderBoard(); });

      // Re-render after CompanyStore server sync
      window.addEventListener('companystoreready', function () { renderBoard(); });

      renderBtn.addEventListener('click', renderBoard);
      copyBtn.addEventListener('click', copyPacket);

      function escapeHtml(str) {
        var div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
      }

      function renderBoard() {
        var year = parseInt(yearSel.value);
        var quarter = quarterSel.value;
        _packet = AgentEngine.getBoardPacket({ year: year, quarter: quarter });

        // Range display
        var s = new Date(_packet.dateRange.startISO);
        var e = new Date(_packet.dateRange.endISO);
        rangeEl.textContent = _packet.quarterKey + '  ·  ' + s.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) + ' – ' + e.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });

        renderExecSummary();
        renderKpis();
        renderDirectiveSection('board-active-dirs', 'badge-active-dirs', _packet.directives.active);
        renderDirectiveSection('board-completed-dirs', 'badge-completed-dirs', _packet.directives.completed);
        renderDirectiveSection('board-pending-dirs', 'badge-pending-dirs', _packet.directives.pendingApproval);
        renderDecisions();
        renderRisks();
        renderThroughput();
      }

      function renderExecSummary() {
        var el = document.getElementById('board-exec-summary');
        el.textContent = _packet.execSummary || 'No data available for this quarter.';
      }

      function renderKpis() {
        var grid = document.getElementById('board-kpi-grid');
        grid.innerHTML = '';
        var catColors = { Growth: '#34d399', Engagement: '#60a5fa', Product: '#a78bfa', Activation: '#fbbf24', Cost: '#f87171', Reliability: '#4ECDC4' };

        _packet.kpis.forEach(function (k) {
          var catColor = catColors[k.category] || '#8A2BE2';
          var unitLabel = k.unit === 'usd' ? '$' : k.unit === 'percent' ? '%' : '';
          var card = document.createElement('div');
          card.className = 'board-kpi-card';
          card.style.cssText = 'border:1px solid ' + catColor + '18; background:' + catColor + '06;';

          var html = '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.2rem;">';
          html += '<span style="font-size:0.7rem;font-weight:600;">' + escapeHtml(k.name) + '</span>';
          html += '<span style="font-size:0.5rem;padding:1px 5px;border-radius:3px;background:' + catColor + '15;color:' + catColor + ';">' + k.category + '</span>';
          html += '</div>';

          html += '<div style="font-size:1.1rem;font-weight:700;color:' + catColor + ';margin-bottom:0.2rem;">-' + unitLabel + '</div>';

          if (k.linkedDirectives.length > 0) {
            html += '<div style="font-size:0.55rem;opacity:0.5;">' + k.linkedDirectives.length + ' directive' + (k.linkedDirectives.length > 1 ? 's' : '') + '</div>';
            k.linkedDirectives.slice(0, 2).forEach(function (d) {
              var sColor = d.status === 'active' ? '#34d399' : d.status === 'completed' ? '#c084fc' : '#fbbf24';
              html += '<div style="font-size:0.55rem;opacity:0.6;margin-top:2px;"><span style="color:' + sColor + ';">●</span> ' + escapeHtml(d.title) + '</div>';
            });
          } else {
            html += '<div style="font-size:0.55rem;opacity:0.25;">No linked directives</div>';
          }

          card.innerHTML = html;
          grid.appendChild(card);
        });
      }

      function renderDirectiveSection(listId, badgeId, dirs) {
        var listEl = document.getElementById(listId);
        var badge = document.getElementById(badgeId);
        badge.textContent = dirs.length;
        if (dirs.length === 0) {
          listEl.innerHTML = '<div class="board-empty">None for this quarter.</div>';
          return;
        }
        listEl.innerHTML = '';

        dirs.forEach(function (d) {
          var pColor = d.priority === 'critical' ? '#ef4444' : d.priority === 'high' ? '#fbbf24' : d.priority === 'medium' ? '#8A2BE2' : '#34d399';
          var sColor = d.status === 'active' ? '#34d399' : d.status === 'completed' ? '#c084fc' : d.status === 'pending-approval' ? '#fbbf24' : '#6b7280';

          var div = document.createElement('div');
          div.className = 'board-dir-card';
          var html = '<div style="flex:1;min-width:0;">';
          html += '<div style="font-size:0.85rem;font-weight:600;">' + escapeHtml(d.title) + '</div>';
          html += '<div style="display:flex;gap:0.4rem;flex-wrap:wrap;margin-top:3px;font-size:0.6rem;opacity:0.5;">';
          html += '<span style="color:' + sColor + ';">' + d.status + '</span>';
          html += '<span style="color:' + pColor + ';">' + (d.priority || 'medium') + '</span>';
          if (d.classification) html += '<span>' + d.classification + '</span>';
          if (d.impact) html += '<span>Impact: ' + d.impact + '</span>';
          if (d.owner) html += '<span>Owner: ' + d.owner + '</span>';
          if (d.kpiLinks && d.kpiLinks.length > 0) html += '<span style="color:#4ECDC4;">' + d.kpiLinks.length + ' KPI' + (d.kpiLinks.length > 1 ? 's' : '') + '</span>';
          html += '</div>';
          html += '</div>';
          div.innerHTML = html;
          listEl.appendChild(div);
        });
      }

      function renderDecisions() {
        var listEl = document.getElementById('board-decisions');
        var badge = document.getElementById('badge-decisions');
        badge.textContent = _packet.decisions.length;
        if (_packet.decisions.length === 0) {
          listEl.innerHTML = '<div class="board-empty">No decisions recorded this quarter.</div>';
          return;
        }
        listEl.innerHTML = '';

        _packet.decisions.forEach(function (d) {
          var sColor = d.decisionStatus === 'Approved' ? '#34d399' : d.decisionStatus === 'Rejected' ? '#f87171' : d.decisionStatus === 'Deferred' ? '#fbbf24' : '#60a5fa';
          var div = document.createElement('div');
          div.className = 'board-dir-card';
          div.innerHTML =
            '<div style="flex:1;min-width:0;">' +
              '<div style="font-size:0.8rem;font-weight:600;">' + escapeHtml(d.title) + '</div>' +
              '<div style="font-size:0.6rem;opacity:0.5;margin-top:2px;">' +
                (d.topicKey ? d.topicKey + ' · ' : '') +
                new Date(d.date).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) +
                (d.decisionNotes ? ' · ' + escapeHtml(d.decisionNotes).substring(0, 80) : '') +
              '</div>' +
            '</div>' +
            '<span style="font-size:0.55rem;padding:2px 8px;border-radius:4px;background:' + sColor + '18;color:' + sColor + ';font-weight:600;white-space:nowrap;">' + d.decisionStatus + '</span>';
          listEl.appendChild(div);
        });
      }

      function renderRisks() {
        var listEl = document.getElementById('board-risks');
        var badge = document.getElementById('badge-risks');
        badge.textContent = _packet.risks.length;
        if (_packet.risks.length === 0) {
          listEl.innerHTML = '<div class="board-empty">No risks identified this quarter.</div>';
          return;
        }
        listEl.innerHTML = '';

        var sevColors = { critical: '#ef4444', high: '#f87171', medium: '#fbbf24', low: '#34d399' };
        _packet.risks.slice(0, 10).forEach(function (r) {
          var sColor = sevColors[r.severity] || '#fbbf24';
          var div = document.createElement('div');
          div.className = 'board-dir-card';
          div.innerHTML =
            '<div style="flex:1;min-width:0;">' +
              '<div style="font-size:0.8rem;">' + escapeHtml(r.description) + '</div>' +
              '<div style="font-size:0.6rem;opacity:0.4;margin-top:2px;">From: ' + escapeHtml(r.standupTitle || '?') + ' · ' + (r.date ? new Date(r.date).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) : '') + '</div>' +
            '</div>' +
            '<span style="font-size:0.55rem;padding:2px 8px;border-radius:4px;background:' + sColor + '18;color:' + sColor + ';font-weight:600;white-space:nowrap;">' + r.severity + '</span>';
          listEl.appendChild(div);
        });
        if (_packet.risks.length > 10) {
          var more = document.createElement('div');
          more.style.cssText = 'font-size:0.6rem;opacity:0.3;padding:0.3rem 0;';
          more.textContent = '+' + (_packet.risks.length - 10) + ' more risks';
          listEl.appendChild(more);
        }
      }

      function renderThroughput() {
        var el = document.getElementById('board-throughput');
        var tp = _packet.throughput;
        el.innerHTML =
          '<div class="board-stat"><div class="board-stat-val" style="color:#60a5fa;">' + tp.tasksCreated + '</div><div class="board-stat-label">Tasks Created</div></div>' +
          '<div class="board-stat"><div class="board-stat-val" style="color:#34d399;">' + tp.tasksCompleted + '</div><div class="board-stat-label">Tasks Completed</div></div>' +
          '<div class="board-stat"><div class="board-stat-val" style="color:#fbbf24;">' + tp.pendingApprovalTasks + '</div><div class="board-stat-label">Pending Approval</div></div>' +
          '<div class="board-stat"><div class="board-stat-val" style="color:#c084fc;">' + _packet.decisions.length + '</div><div class="board-stat-label">Decisions Made</div></div>' +
          '<div class="board-stat"><div class="board-stat-val" style="color:#f87171;">' + _packet.risks.length + '</div><div class="board-stat-label">Risks Logged</div></div>';
      }

      function copyPacket() {
        if (!_packet) return;
        var lines = [];
        lines.push('# ' + _packet.quarterKey + ' Board Packet');
        lines.push('');
        lines.push('## Executive Summary');
        lines.push(_packet.execSummary);
        lines.push('');
        lines.push('## Throughput');
        lines.push('- Tasks Created: ' + _packet.throughput.tasksCreated);
        lines.push('- Tasks Completed: ' + _packet.throughput.tasksCompleted);
        lines.push('- Pending Approval: ' + _packet.throughput.pendingApprovalTasks);
        lines.push('');
        lines.push('## Active Directives (' + _packet.directives.active.length + ')');
        _packet.directives.active.forEach(function (d) { lines.push('- ' + d.title + ' [' + d.priority + ']'); });
        lines.push('');
        lines.push('## Completed Directives (' + _packet.directives.completed.length + ')');
        _packet.directives.completed.forEach(function (d) { lines.push('- ' + d.title); });
        lines.push('');
        lines.push('## Decisions (' + _packet.decisions.length + ')');
        _packet.decisions.forEach(function (d) { lines.push('- ' + d.title + ' → ' + d.decisionStatus); });
        lines.push('');
        lines.push('## Risks (' + _packet.risks.length + ')');
        _packet.risks.slice(0, 10).forEach(function (r) { lines.push('- [' + r.severity + '] ' + r.description); });
        lines.push('');
        lines.push('## KPIs');
        _packet.kpis.forEach(function (k) { lines.push('- ' + k.name + ' (' + k.category + '): ' + k.linkedDirectives.length + ' linked directives'); });

        var text = lines.join('\n');
        if (navigator.clipboard) {
          navigator.clipboard.writeText(text).then(function () {
            copyBtn.innerHTML = '<i class="fas fa-check"></i> Copied!';
            setTimeout(function () { copyBtn.innerHTML = '<i class="fas fa-clipboard"></i> Copy Board Packet'; }, 2000);
          });
        }
      }

    })();
  </script>

  <script src="/modules/company/js/sidebar.js"></script>
</body>
</html>
