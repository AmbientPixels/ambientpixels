<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="refresh" content="0;url=dashboard.html?view=board" />
  <title>Redirecting to Board View…</title>
  <script>
    (function () {
      var t = 'dashboard.html?view=board';
      var qs = window.location.search || '';
      var h = window.location.hash || '';
      // If original URL already has query params, merge them
      if (qs) t += '&' + qs.slice(1);
      window.location.replace(t + h);
    })();
  </script>
  <style>
    body { background:#000000; color:#fff; font-family:Inter,sans-serif; display:flex; align-items:center; justify-content:center; min-height:100vh; margin:0; }
    a { color:#a78bfa; }
  </style>
</head>
<body>
  <p>Redirecting to <a href="dashboard.html?view=board">Board View</a>…</p>
</body>
</html>
