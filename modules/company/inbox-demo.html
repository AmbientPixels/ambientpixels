<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Inbox agent — live demo</title>
<!-- Deploy-generated, authenticated-only. Supplies window.AP_SECRET. -->
<script src="/modules/company/runtime-config.js"></script>
<style>
  /* Accent is Hanson's brand indigo. The logo asset is white with #13017C
     detailing, so it needs a dark ground -- hence the solid brand band up top,
     which stays the same in both themes and gives the mark somewhere to sit. */
  :root{--brand:#13017C;--paper:#F6F6FA;--card:#FFFFFF;--ink:#1A1A2E;--soft:#4B4B66;--faint:#7C7C94;--rule:#E4E4EE;--accent:#13017C;--tint:#E8E6F5}
  @media (prefers-color-scheme:dark){:root{--paper:#0F0F1A;--card:#191926;--ink:#E8E8F2;--soft:#ABABC2;--faint:#7C7C94;--rule:#2B2B3D;--accent:#8F84F5;--tint:#1C1930}}
  :root[data-theme="dark"]{--paper:#0F0F1A;--card:#191926;--ink:#E8E8F2;--soft:#ABABC2;--faint:#7C7C94;--rule:#2B2B3D;--accent:#8F84F5;--tint:#1C1930}
  :root[data-theme="light"]{--paper:#F6F6FA;--card:#FFFFFF;--ink:#1A1A2E;--soft:#4B4B66;--faint:#7C7C94;--rule:#E4E4EE;--accent:#13017C;--tint:#E8E6F5}
  .brandbar{background:var(--brand);margin:0 -1rem;padding:1.1rem 1rem}
  .brandbar .inner{max-width:38rem;margin:0 auto}
  .brandbar img{height:54px;width:auto;display:block}
  *,*::before,*::after{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5;padding:0 1rem 4rem}
  .wrap{max-width:38rem;margin:0 auto}
  header{padding:2.75rem 0 1.25rem}
  .eyebrow{font-size:.72rem;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--accent);margin:0 0 .4rem}
  h1{font-size:1.8rem;font-weight:640;letter-spacing:-.02em;margin:0 0 .35rem}
  .sub{color:var(--faint);font-size:.92rem;margin:0}
  .bar{display:flex;gap:.8rem;align-items:center;flex-wrap:wrap;padding:1rem 0 1.15rem;border-bottom:1px solid var(--rule)}
  button{font:inherit;font-weight:600;font-size:.95rem;padding:.6rem 1.35rem;border-radius:3px;border:1px solid var(--accent);background:var(--accent);color:var(--paper);cursor:pointer}
  button:hover:not(:disabled){filter:brightness(1.08)}
  button:disabled{opacity:.5;cursor:default}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  label{font-size:.88rem;color:var(--soft);display:flex;align-items:center;gap:.4rem;cursor:pointer}
  .status{font-size:.88rem;color:var(--faint)}
  .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-right:.45rem;animation:p 1.1s infinite}
  @keyframes p{0%,100%{opacity:.25}50%{opacity:1}}
  @media (prefers-reduced-motion:reduce){.dot{animation:none}*{transition:none!important}}
  h2{font-size:.75rem;font-weight:650;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin:2rem 0 .7rem}
  .item{background:var(--card);border:1px solid var(--rule);border-radius:3px;padding:.95rem 1.1rem;margin-bottom:.55rem}
  .item.hot{border-color:var(--accent);box-shadow:0 1px 0 var(--tint)}
  .meta{display:flex;justify-content:space-between;gap:1rem;align-items:baseline;margin-bottom:.15rem}
  .from{font-weight:640;font-size:.94rem}
  .time{color:var(--faint);font-size:.78rem;white-space:nowrap;font-variant-numeric:tabular-nums}
  .subject{font-size:.94rem;margin:0 0 .4rem}
  .why{font-size:.83rem;color:var(--accent);margin:0}
  .brief{background:var(--tint);border-top:3px solid var(--accent);padding:1.1rem 1.25rem;margin:1.5rem 0 .5rem}
  .brief p{margin:0;font-size:1rem}
  .acts{display:flex;gap:.5rem;margin-top:.7rem}
  .acts a{font-size:.82rem;font-weight:600;text-decoration:none;padding:.32rem .8rem;border-radius:3px;
    border:1px solid var(--rule);color:var(--soft);background:var(--paper)}
  .acts a:hover{border-color:var(--accent);color:var(--accent)}
  .acts a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .grp{background:var(--card);border:1px solid var(--rule);border-radius:3px;margin-bottom:.4rem}
  .grp summary{cursor:pointer;padding:.7rem 1.1rem;display:flex;align-items:center;font-size:.9rem;list-style:none}
  .grp summary::-webkit-details-marker{display:none}
  .grp summary::after{content:"\203A";color:var(--faint);transition:transform .15s}
  .grp[open] summary::after{transform:rotate(90deg)}
  .gname{color:var(--soft)}
  .gcount{color:var(--faint);font-variant-numeric:tabular-nums;margin-left:auto;margin-right:.6rem}
  .glist{list-style:none;margin:0;padding:0 1.1rem .8rem}
  .glist li{display:flex;gap:.6rem;padding:.35rem 0;border-top:1px solid var(--rule);font-size:.85rem}
  .gfrom{color:var(--soft);min-width:9rem;flex-shrink:0}
  .gsub{color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  footer{margin-top:2rem;padding-top:1rem;border-top:1px solid var(--rule);color:var(--faint);font-size:.83rem}
  footer strong{color:var(--soft);font-weight:640}
  .err{background:var(--card);border:1px solid #b3564a;border-radius:3px;padding:.9rem 1.1rem;color:var(--soft);font-size:.88rem}
  .hide{display:none}
</style>
</head>
<body>
<div class="brandbar">
  <div class="inner"><img src="/modules/img/hanson-consulting-group-light.svg" alt="Hanson Consulting Group"></div>
</div>
<div class="wrap">

  <header>
    <p class="eyebrow">Live demo</p>
    <h1>Inbox agent</h1>
    <p class="sub">Reads the inbox, decides what actually needs you, files the rest. Nothing is moved or deleted.</p>
  </header>

  <div class="bar">
    <button id="go">Run it</button>
    <label><input type="checkbox" id="redact" checked> Hide real senders and subjects</label>
    <span class="status" id="status"></span>
  </div>

  <div id="err" class="err hide"></div>
  <div id="out"></div>
</div>

<script>
(function () {
  var LABEL = { transactional: 'Receipts and account notices', promotional: 'Offers and marketing', newsletter: 'Newsletters' };
  var go = document.getElementById('go'), statusEl = document.getElementById('status');
  var out = document.getElementById('out'), errEl = document.getElementById('err');

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }
  // Keep the first word or two legible so the shape reads, mask the rest.
  function mask(s, keep) {
    return String(s || '').split(/\s+/).filter(Boolean).map(function (w, i) {
      return i < keep ? w : w[0] + new Array(Math.max(2, Math.min(w.length - 1, 6)) + 1).join('·');
    }).join(' ');
  }
  function when(iso) {
    if (!iso) return '';
    try { return new Date(iso).toLocaleString(undefined, { weekday: 'short', hour: 'numeric', minute: '2-digit' }); }
    catch (e) { return ''; }
  }

  function render(data, redact) {
    var rows = (data.verdicts || []).map(function (v) {
      var m = data.messages[v.i] || {};
      return {
        cat: v.category, why: v.why || '',
        from: redact ? mask(m.from || 'Unknown', 1) : (m.from || 'Unknown'),
        subject: redact ? mask(m.subject || '', 2) : (m.subject || '(no subject)'),
        when: m.receivedDateTime,
        webLink: m.webLink || '',
        // Reply is a mailto: — it opens her own compose window with the fields
        // filled in. The agent never writes or sends anything.
        reply: m.address
          ? 'mailto:' + encodeURIComponent(m.address) +
            '?subject=' + encodeURIComponent(/^re:/i.test(m.subject || '') ? m.subject : 'Re: ' + (m.subject || ''))
          : ''
      };
    });
    var needs = rows.filter(function (r) { return r.cat === 'needs_you'; });
    var filed = rows.filter(function (r) { return r.cat !== 'needs_you'; });
    var groups = {};
    filed.forEach(function (r) { (groups[r.cat] = groups[r.cat] || []).push(r); });

    var h = '<header style="padding:2rem 0 .5rem">' +
      '<h1>' + (needs.length === 0 ? 'Nothing needs you.' : needs.length === 1 ? 'One thing needs you.' : needs.length + ' things need you.') + '</h1>' +
      '<p class="sub">' + rows.length + ' messages arrived. ' + filed.length + ' were filed out of the way.</p></header>';

    if (data.summary) h += '<div class="brief"><p>' + esc(data.summary) + '</p></div>';

    h += '<h2>Needs you</h2>';
    h += needs.length ? needs.map(function (r) {
      var acts = '';
      if (r.webLink) acts += '<a href="' + esc(r.webLink) + '" target="_blank" rel="noopener">Open</a>';
      if (r.reply) acts += '<a href="' + esc(r.reply) + '">Reply</a>';
      return '<div class="item hot"><div class="meta"><span class="from">' + esc(r.from) + '</span>' +
        '<span class="time">' + esc(when(r.when)) + '</span></div>' +
        '<p class="subject">' + esc(r.subject) + '</p>' +
        '<p class="why">' + esc(r.why) + '</p>' +
        (acts ? '<div class="acts">' + acts + '</div>' : '') + '</div>';
    }).join('') : '<p class="sub" style="padding:.75rem 0">Nothing today. Everything that arrived was routine.</p>';

    h += '<h2>Filed away</h2>';
    h += Object.keys(groups).sort(function (a, b) { return groups[b].length - groups[a].length; }).map(function (cat) {
      return '<details class="grp"><summary><span class="gname">' + esc(LABEL[cat] || cat) + '</span>' +
        '<span class="gcount">' + groups[cat].length + '</span></summary><ul class="glist">' +
        groups[cat].map(function (r) {
          return '<li><span class="gfrom">' + esc(r.from) + '</span><span class="gsub">' + esc(r.subject) + '</span></li>';
        }).join('') + '</ul></details>';
    }).join('');

    var s = data.stats || {};
    h += '<footer><strong>Nothing was deleted.</strong> Everything above is still in the mailbox, just moved out of the way.' +
      '<br>' + s.count + ' messages in ' + ((s.ms || 0) / 1000).toFixed(1) + 's, about $' + (s.costUsd || 0).toFixed(4) +
      ' — roughly $' + ((s.costUsd || 0) / Math.max(1, s.count) * 3000).toFixed(2) + ' per 3,000 emails.</footer>';

    out.innerHTML = h;
  }

  go.addEventListener('click', function () {
    var redact = document.getElementById('redact').checked;
    go.disabled = true;
    errEl.classList.add('hide');
    out.innerHTML = '';
    statusEl.innerHTML = '<span class="dot"></span>reading the inbox and classifying…';

    // Direct to the Function App, not a relative /api path. staticwebapp.config.json
    // only proxies routes it lists explicitly, and anything unlisted falls through to
    // the homepage — so a relative call here returns HTML and dies on .json().
    fetch('https://ambientpixels-nova-api.azurewebsites.net/api/inbox-demo', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-company-secret': (window.AP_SECRET || '') },
      body: JSON.stringify({ count: 25 })
    })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (res) {
        if (!res.ok || !res.j.ok) throw new Error(res.j.error || 'request failed');
        statusEl.textContent = res.j.account ? 'mailbox: ' + res.j.account : 'done';
        render(res.j, redact);
      })
      .catch(function (e) {
        statusEl.textContent = '';
        errEl.textContent = e.message;
        errEl.classList.remove('hide');
      })
      .then(function () { go.disabled = false; });
  });
})();
</script>
</body>
</html>
