<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="AmbientPixels Goals — track progress on quarterly targets." />
  <link rel="icon" href="/images/favicon.ico" type="image/x-icon" />
  <title>Goals — AmbientPixels HQ</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/grid.css" />
  <link rel="stylesheet" href="/css/nav.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/theme.css" />
  <link rel="stylesheet" href="/css/banner.css" />
  <link rel="stylesheet" href="/modules/company/css/company.css" />
  <link rel="stylesheet" href="/modules/company/css/dashboard.css" />
  <link rel="stylesheet" href="/modules/company/css/sidebar.css" />
  <link rel="stylesheet" href="/modules/company/css/quick-chat.css" />
  <style>
    .obj-modal-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,0.7);
      display: none; align-items: center; justify-content: center; z-index: 1000;
    }
    .obj-modal {
      width: min(440px, 90%); background: rgba(7,16,25,0.95);
      border: 1px solid rgba(255,255,255,0.08); border-radius: 10px;
      padding: 1rem; box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }
    .obj-modal h3 { margin: 0 0 0.6rem; font-size: 1rem; }
    .obj-modal label { display:block; font-size:0.7rem; opacity:0.5; margin-top:0.6rem; }
    .obj-modal input,
    .obj-modal textarea,
    .obj-modal select {
      width: 100%; padding: 0.4rem 0.6rem; border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.08); background: rgba(255,255,255,0.03);
      color: inherit; font-size: 0.8rem; font-family: inherit;
    }
    .obj-modal textarea { resize: vertical; min-height: 80px; }
    .obj-modal-row { display:flex; gap:0.5rem; }
    .obj-modal-row > div { flex:1; }
    .obj-modal-actions { margin-top: 0.8rem; display:flex; gap:0.5rem; justify-content:flex-end; }
    .obj-btn {
      font-size:0.65rem; padding:0.3rem 0.8rem; border-radius:5px; border:1px solid rgba(255,255,255,0.1);
      background:rgba(255,255,255,0.05); color:#fff; cursor:pointer;
    }
    .obj-btn--primary { border-color:rgba(78,205,196,0.4); color:#4ECDC4; }
    .obj-btn--danger { border-color:rgba(248,113,113,0.4); color:#f87171; margin-right:auto; }
  </style>
</head>
<body style="background:#071019" data-theme="dark">

  <main class="content-section" style="max-width: 900px; margin: 0 auto; padding: 1rem;">

    <div class="company-header">
      <h1><i class="fas fa-bullseye" style="opacity:0.4; margin-right:8px; color:#4ECDC4;"></i>Goals</h1>
      <p>Track progress on quarterly targets. Prime Operator owns execution and updates weekly.</p>
    </div>

    <!-- Create Objective Form -->
    <div class="dash-panel" style="margin-bottom:1.5rem;">
      <div class="dash-panel-header">
        <span class="dash-panel-title"><i class="fas fa-plus-circle" style="color:#FFD700;"></i> New Goal</span>
      </div>
      <div style="padding:0.5rem 0;">
        <input type="text" id="obj-title" placeholder="Goal title..." style="width:100%; padding:0.5rem 0.7rem; background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.08); border-radius:6px; color:inherit; font-size:0.8rem; margin-bottom:0.5rem;" />
        <div style="display:flex; gap:0.5rem; align-items:center; flex-wrap:wrap;">
          <select id="obj-quarter" style="padding:0.35rem 0.6rem; background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.08); border-radius:6px; color:inherit; font-size:0.7rem;">
            <option value="Q1">Q1</option>
            <option value="Q2">Q2</option>
            <option value="Q3">Q3</option>
            <option value="Q4">Q4</option>
          </select>
          <input type="number" id="obj-year" value="2026" min="2024" max="2030" style="width:80px; padding:0.35rem 0.6rem; background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.08); border-radius:6px; color:inherit; font-size:0.7rem;" />
          <select id="obj-directive" multiple style="padding:0.35rem 0.6rem; background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.08); border-radius:6px; color:inherit; font-size:0.7rem; overflow:auto; appearance:none; -webkit-appearance:none;">
          </select>
          <button id="obj-create-btn" style="padding:0.35rem 1rem; background:rgba(78,205,196,0.1); border:1px solid rgba(78,205,196,0.3); border-radius:6px; color:#4ECDC4; font-size:0.7rem; cursor:pointer; font-weight:500;">Create Goal</button>
        </div>
      </div>
    </div>

    <!-- Executive Summary -->
    <div class="dash-panel dash-panel--full" style="margin-bottom:1rem;">
      <div class="dash-panel-header">
        <span class="dash-panel-title"><i class="fas fa-chart-pie" style="color:#FFD700;"></i> Executive Summary</span>
      </div>
      <div id="obj-summary" style="display:flex; gap:1rem; flex-wrap:wrap; padding:0.5rem 0;">
        <div class="stat-card" style="flex:1; min-width:120px;">
          <div class="stat-value" id="obj-total">0</div>
          <div class="stat-label">Total</div>
        </div>
        <div class="stat-card" style="flex:1; min-width:120px;">
          <div class="stat-value" id="obj-on-track" style="color:#34d399;">0</div>
          <div class="stat-label">On Track</div>
        </div>
        <div class="stat-card" style="flex:1; min-width:120px;">
          <div class="stat-value" id="obj-at-risk" style="color:#fbbf24;">0</div>
          <div class="stat-label">At Risk</div>
        </div>
        <div class="stat-card" style="flex:1; min-width:120px;">
          <div class="stat-value" id="obj-behind" style="color:#f87171;">0</div>
          <div class="stat-label">Behind</div>
        </div>
        <div class="stat-card" style="flex:1; min-width:120px;">
          <div class="stat-value" id="obj-complete" style="color:#8A2BE2;">0</div>
          <div class="stat-label">Complete</div>
        </div>
        <div class="stat-card" style="flex:1; min-width:120px;">
          <div class="stat-value" id="obj-canceled" style="color:#9ca3af;">0</div>
          <div class="stat-label">Canceled</div>
        </div>
      </div>
    </div>

    <!-- Objectives List -->
    <div class="dash-panel dash-panel--full">
      <div class="dash-panel-header">
        <span class="dash-panel-title"><i class="fas fa-list-check" style="color:#4ECDC4;"></i> All Goals</span>
      </div>
      <div id="obj-list">
        <div class="dash-empty">No goals yet. Create one above.</div>
      </div>
    </div>

  </main>

  <!-- Edit Objective Modal -->
  <div class="obj-modal-backdrop" id="obj-edit-modal">
    <div class="obj-modal">
      <h3 id="obj-modal-title">Edit Goal</h3>
      <label for="obj-edit-title">Title</label>
      <input type="text" id="obj-edit-title" />

      <label for="obj-edit-desc">Description</label>
      <textarea id="obj-edit-desc" placeholder="Describe the goal..."></textarea>

      <div class="obj-modal-row">
        <div>
          <label for="obj-edit-quarter">Quarter</label>
          <select id="obj-edit-quarter">
            <option value="Q1">Q1</option>
            <option value="Q2">Q2</option>
            <option value="Q3">Q3</option>
            <option value="Q4">Q4</option>
          </select>
        </div>
        <div>
          <label for="obj-edit-year">Year</label>
          <input type="number" id="obj-edit-year" min="2024" max="2030" />
        </div>
      </div>

      <label for="obj-edit-directive">Linked Projects <span style="opacity:0.35; font-weight:normal;">(Ctrl+click to multi-select)</span></label>
      <select id="obj-edit-directive" multiple style="background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.08); border-radius:6px; color:inherit; font-size:0.75rem; padding:0.35rem 0.5rem; overflow:auto; appearance:none; -webkit-appearance:none;">
      </select>

      <div class="obj-modal-row">
        <div>
          <label for="obj-edit-owner">Owner</label>
          <select id="obj-edit-owner">
            <option value="nova">Nova</option>
            <option value="cipher">Cipher</option>
            <option value="pixel">Pixel</option>
            <option value="forge">Forge</option>
            <option value="echo">Echo</option>
            <option value="scribe">Scribe</option>
            <option value="quill">Quill</option>
            <option value="scout">Scout</option>
          </select>
        </div>
        <div>
          <label for="obj-edit-status">Status</label>
          <select id="obj-edit-status">
            <option value="on_track">On Track</option>
            <option value="at_risk">At Risk</option>
            <option value="behind">Behind</option>
            <option value="complete">Complete</option>
            <option value="canceled">Canceled</option>
          </select>
        </div>
      </div>

      <div class="obj-modal-actions">
        <button class="obj-btn obj-btn--danger" id="obj-edit-delete"><i class="fas fa-trash"></i> Delete</button>
        <button class="obj-btn" id="obj-edit-cancel">Cancel</button>
        <button class="obj-btn obj-btn--primary" id="obj-edit-save"><i class="fas fa-check"></i> Save</button>
      </div>
    </div>
  </div>

  <script src="/js/company-store.js"></script>
  <script src="/js/agent-engine.js"></script>
  <script src="/modules/company/js/quick-chat.js"></script>
  <script>
    (function () {
      'use strict';

      var titleInput = document.getElementById('obj-title');
      var quarterSelect = document.getElementById('obj-quarter');
      var yearInput = document.getElementById('obj-year');
      var directiveSelect = document.getElementById('obj-directive');
      var createBtn = document.getElementById('obj-create-btn');
      var objList = document.getElementById('obj-list');

      // Edit modal elements
      var editModal = document.getElementById('obj-edit-modal');
      var editTitle = document.getElementById('obj-edit-title');
      var editDesc = document.getElementById('obj-edit-desc');
      var editQuarter = document.getElementById('obj-edit-quarter');
      var editYear = document.getElementById('obj-edit-year');
      var editDirective = document.getElementById('obj-edit-directive');
      var editOwner = document.getElementById('obj-edit-owner');
      var editStatus = document.getElementById('obj-edit-status');
      var editSave = document.getElementById('obj-edit-save');
      var editCancel = document.getElementById('obj-edit-cancel');
      var editDelete = document.getElementById('obj-edit-delete');
      var editingId = null;

      AgentEngine.loadRegistry().then(function () {
        populateDirectiveSelect();
        renderObjectives();
      });

      // Re-render after CompanyStore server sync
      window.addEventListener('companystoreready', function () { renderObjectives(); });

      AgentEngine.on('sync-complete', function () {
        populateDirectiveSelect();
        renderObjectives();
      });

      function populateDirectiveSelect(targetSelect, selectedIds) {
        var directives = AgentEngine.getDirectives();
        var active = directives.filter(function (d) { return d.status === 'active' || d.status === 'completed'; });
        var sel = targetSelect || directiveSelect;
        var ids = Array.isArray(selectedIds) ? selectedIds : (selectedIds ? [selectedIds] : []);
        sel.innerHTML = '';
        // Handle empty state: hide select and show placeholder
        var emptyId = sel.id + '-empty';
        var existingEmpty = sel.parentElement.querySelector('#' + emptyId);
        if (active.length === 0) {
          sel.style.display = 'none';
          if (!existingEmpty) {
            var emptyLabel = document.createElement('span');
            emptyLabel.id = emptyId;
            emptyLabel.style.cssText = 'font-size:0.65rem; opacity:0.3; padding:0.35rem 0.6rem;';
            emptyLabel.textContent = 'No projects yet';
            sel.parentElement.insertBefore(emptyLabel, sel.nextSibling);
          }
          return;
        }
        sel.style.display = '';
        if (existingEmpty) existingEmpty.remove();
        active.forEach(function (dir) {
          var opt = document.createElement('option');
          opt.value = dir.id;
          opt.textContent = dir.title + (dir.status !== 'active' ? ' [' + dir.status + ']' : '');
          opt.style.cssText = 'padding:0.25rem 0.4rem; border-radius:4px;';
          if (ids.indexOf(dir.id) !== -1) opt.selected = true;
          sel.appendChild(opt);
        });
        sel.size = Math.min(active.length, 5);
      }

      // ── Edit Modal ──
      function openEditModal(obj) {
        editingId = obj.id;
        editTitle.value = obj.title || '';
        editDesc.value = obj.description || '';
        editQuarter.value = obj.quarter || 'Q1';
        editYear.value = obj.year || 2026;
        editOwner.value = obj.owner || 'nova';
        editStatus.value = obj.status || 'on_track';
        populateDirectiveSelect(editDirective, obj.linkedDirectives || (obj.linkedDirective ? [obj.linkedDirective] : []));
        editModal.style.display = 'flex';
      }

      function closeEditModal() {
        editModal.style.display = 'none';
        editingId = null;
      }

      editCancel.addEventListener('click', closeEditModal);
      editModal.addEventListener('click', function (e) { if (e.target === editModal) closeEditModal(); });

      editSave.addEventListener('click', function () {
        if (!editingId) return;
        var selectedDirs = [];
        for (var i = 0; i < editDirective.options.length; i++) {
          if (editDirective.options[i].selected && editDirective.options[i].value) selectedDirs.push(editDirective.options[i].value);
        }
        var payload = {
          title: editTitle.value.trim(),
          description: editDesc.value.trim(),
          quarter: editQuarter.value,
          year: parseInt(editYear.value, 10),
          linkedDirectives: selectedDirs,
          owner: editOwner.value || 'nova',
          status: editStatus.value
        };
        AgentEngine.updateObjective(editingId, payload);
        // Push to server so heartbeat sees changes
        if (typeof CompanyStore !== 'undefined' && CompanyStore.setState) {
          CompanyStore.setState('ap_objectives', AgentEngine.getObjectives());
        }
        closeEditModal();
        renderObjectives();
      });

      editDelete.addEventListener('click', function () {
        if (!editingId) return;
        if (!confirm('Permanently delete this goal? This cannot be undone.')) return;
        var objectives = AgentEngine.getObjectives().filter(function (o) { return o.id !== editingId; });
        if (typeof CompanyStore !== 'undefined' && CompanyStore.setState) {
          CompanyStore.setState('ap_objectives', objectives);
        }
        // Also update local storage
        localStorage.setItem('ap_objectives', JSON.stringify(objectives));
        closeEditModal();
        renderObjectives();
      });

      createBtn.addEventListener('click', function () {
        var title = titleInput.value.trim();
        if (!title) return;

        var selectedDirs = [];
        for (var i = 0; i < directiveSelect.options.length; i++) {
          if (directiveSelect.options[i].selected && directiveSelect.options[i].value) selectedDirs.push(directiveSelect.options[i].value);
        }
        AgentEngine.addObjective({
          title: title,
          quarter: quarterSelect.value,
          year: parseInt(yearInput.value, 10),
          linkedDirectives: selectedDirs
        });

        // Push to server so heartbeat can see the objective
        if (typeof CompanyStore !== 'undefined' && CompanyStore.setState) {
          CompanyStore.setState('ap_objectives', AgentEngine.getObjectives());
        }

        titleInput.value = '';
        renderObjectives();
      });

      function renderObjectives() {
        var objectives = AgentEngine.getObjectives();

        // Summary stats
        var total = objectives.length;
        var onTrack = objectives.filter(function (o) { return o.status === 'on_track'; }).length;
        var atRisk = objectives.filter(function (o) { return o.status === 'at_risk'; }).length;
        var behind = objectives.filter(function (o) { return o.status === 'behind'; }).length;
        var complete = objectives.filter(function (o) { return o.status === 'complete'; }).length;
        var canceled = objectives.filter(function (o) { return o.status === 'canceled'; }).length;

        document.getElementById('obj-total').textContent = total;
        document.getElementById('obj-on-track').textContent = onTrack;
        document.getElementById('obj-at-risk').textContent = atRisk;
        document.getElementById('obj-behind').textContent = behind;
        document.getElementById('obj-complete').textContent = complete;
        document.getElementById('obj-canceled').textContent = canceled;

        if (objectives.length === 0) {
          objList.innerHTML = '<div class="dash-empty">No objectives yet. Create one above.</div>';
          return;
        }

        objList.innerHTML = '';
        objectives.slice().reverse().forEach(function (obj) {
          objList.appendChild(createObjectiveCard(obj));
        });
      }

      function createObjectiveCard(obj) {
        var card = document.createElement('div');
        card.style.cssText = 'padding:0.8rem; border:1px solid rgba(78,205,196,0.08); border-radius:8px; margin-bottom:0.5rem; background:rgba(78,205,196,0.02);';

        var isCanceled = obj.status === 'canceled';
        var statusColor = obj.status === 'on_track' ? '#34d399' : obj.status === 'at_risk' ? '#fbbf24' : obj.status === 'behind' ? '#f87171' : obj.status === 'canceled' ? '#9ca3af' : '#8A2BE2';
        var pct = obj.progressPercentage || 0;

        // Find linked project titles
        var dirTitles = [];
        var linkedIds = obj.linkedDirectives || (obj.linkedDirective ? [obj.linkedDirective] : []);
        if (linkedIds.length > 0) {
          var directives = AgentEngine.getDirectives();
          linkedIds.forEach(function (did) {
            var linked = directives.find(function (d) { return d.id === did; });
            if (linked) dirTitles.push(linked.title);
          });
        }

        card.innerHTML =
          '<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.3rem;">' +
            '<strong style="font-size:0.85rem;">' + escapeHtml(obj.title) + '</strong>' +
            '<span style="font-size:0.65rem; opacity:0.5;">' + (obj.quarter || '') + ' ' + (obj.year || '') + '</span>' +
          '</div>' +
          (dirTitles.length > 0 ? '<div style="font-size:0.6rem; opacity:0.4; margin-bottom:0.4rem;"><i class="fas fa-compass"></i> ' + dirTitles.map(function (t) { return escapeHtml(t); }).join(', ') + '</div>' : '') +
          (obj.description ? '<div style="font-size:0.7rem; opacity:0.5; margin-bottom:0.4rem; line-height:1.3;">' + escapeHtml(obj.description) + '</div>' : '') +
          '<div style="margin:0.4rem 0; height:6px; background:rgba(255,255,255,0.05); border-radius:3px; overflow:hidden;">' +
            '<div style="height:100%; width:' + pct + '%; background:' + statusColor + '; border-radius:3px; transition:width 0.3s;"></div>' +
          '</div>' +
          '<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.5rem;">' +
            '<span style="font-size:0.7rem; color:' + statusColor + '; font-weight:500;">' + pct + '% — ' + (obj.status || 'on_track').replace(/_/g, ' ') + '</span>' +
            '<span style="font-size:0.6rem; opacity:0.4;">Owner: ' + (obj.owner || 'nova') + '</span>' +
          '</div>';

        // Controls
        var controls = document.createElement('div');
        controls.style.cssText = 'display:flex; gap:0.3rem; flex-wrap:wrap; align-items:center;';

        // Progress slider
        var slider = document.createElement('input');
        slider.type = 'range';
        slider.min = '0';
        slider.max = '100';
        slider.value = pct;
        slider.style.cssText = 'flex:1; min-width:100px; accent-color:' + statusColor + ';';
        slider.disabled = isCanceled;
        if (isCanceled) slider.style.opacity = '0.45';
        slider.addEventListener('change', function () {
          if (obj.status === 'canceled') return;
          var newPct = parseInt(slider.value, 10);
          var newStatus = newPct >= 100 ? 'complete' : obj.status;
          AgentEngine.updateObjective(obj.id, { progressPercentage: newPct, status: newStatus });
          renderObjectives();
        });
        controls.appendChild(slider);

        // Status buttons
        var statuses = ['on_track', 'at_risk', 'behind', 'complete'];
        var statusLabels = { on_track: 'On Track', at_risk: 'At Risk', behind: 'Behind', complete: 'Complete' };
        var statusColors = { on_track: '#34d399', at_risk: '#fbbf24', behind: '#f87171', complete: '#8A2BE2' };

        statuses.forEach(function (s) {
          var btn = document.createElement('button');
          btn.textContent = statusLabels[s];
          var isActive = obj.status === s;
          btn.style.cssText = 'font-size:0.55rem; padding:0.2rem 0.4rem; border:1px solid ' + (isActive ? statusColors[s] : 'rgba(255,255,255,0.08)') + '; background:' + (isActive ? 'rgba(255,255,255,0.05)' : 'transparent') + '; color:' + (isActive ? statusColors[s] : 'rgba(255,255,255,0.4)') + '; border-radius:3px; cursor:pointer;';
          btn.disabled = isCanceled;
          if (isCanceled) {
            btn.style.opacity = '0.45';
            btn.style.cursor = 'not-allowed';
          }
          btn.addEventListener('click', function () {
            if (obj.status === 'canceled') return;
            AgentEngine.updateObjective(obj.id, { status: s });
            renderObjectives();
          });
          controls.appendChild(btn);
        });

        var cancelBtn = document.createElement('button');
        cancelBtn.textContent = 'Cancel';
        cancelBtn.style.cssText = 'font-size:0.55rem; padding:0.2rem 0.4rem; border:1px solid rgba(156,163,175,0.5); background:' + (isCanceled ? 'rgba(156,163,175,0.12)' : 'transparent') + '; color:#9ca3af; border-radius:3px; cursor:' + (isCanceled ? 'not-allowed' : 'pointer') + ';';
        cancelBtn.disabled = isCanceled;
        cancelBtn.addEventListener('click', function () {
          if (obj.status === 'canceled') return;
          if (!confirm('Cancel this goal? This voids it and blocks all execution.')) return;
          AgentEngine.updateObjective(obj.id, { status: 'canceled' });
          // Push to server immediately so heartbeat sees canceled status on next run
          if (typeof CompanyStore !== 'undefined' && CompanyStore.setState) {
            CompanyStore.setState('ap_objectives', AgentEngine.getObjectives());
          }
          renderObjectives();
        });
        controls.appendChild(cancelBtn);

        // Edit button
        var editBtn = document.createElement('button');
        editBtn.innerHTML = '<i class="fas fa-pen"></i> Edit';
        editBtn.style.cssText = 'font-size:0.55rem; padding:0.2rem 0.5rem; border:1px solid rgba(138,43,226,0.3); background:rgba(138,43,226,0.05); color:#c084fc; border-radius:3px; cursor:pointer;';
        editBtn.addEventListener('click', function () { openEditModal(obj); });
        controls.appendChild(editBtn);

        card.appendChild(controls);
        return card;
      }

      function escapeHtml(str) {
        var div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
      }
    })();
  </script>

  <script src="/modules/company/js/sidebar.js"></script>
</body>
</html>
