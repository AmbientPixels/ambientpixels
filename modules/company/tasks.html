    <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="AmbientPixels Task Manager — Kanban board for agent task tracking." />
  <link rel="icon" href="/images/favicon.ico" type="image/x-icon" />
  <title>Tasks — AmbientPixels HQ</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/grid.css" />
  <link rel="stylesheet" href="/css/nav.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/theme.css" />
  <link rel="stylesheet" href="/css/banner.css" />
  <link rel="stylesheet" href="/modules/company/css/company.css" />
  <link rel="stylesheet" href="/modules/company/css/sidebar.css" />
  <link rel="stylesheet" href="/modules/company/css/tasks.css" />
  <style>
    .task-risk-pill {
      font-size:0.55rem; padding:0.1rem 0.35rem; border-radius:4px;
      background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.08);
      color:rgba(255,255,255,0.6); margin-left:0.4rem; text-transform:capitalize;
    }
    .task-risk-pill--high { border-color:rgba(248,113,113,0.4); color:#f87171; }
    .task-risk-pill--medium { border-color:rgba(251,191,36,0.4); color:#fbbf24; }
    .task-risk-pill--low { border-color:rgba(52,211,153,0.4); color:#34d399; }
  </style>
</head>
<body style="background:#071019" data-theme="dark">

  <main class="content-section" style="max-width: 1100px; margin: 0 auto; padding: 1rem;">

    <!-- Header -->
    <div class="tm-header">
      <h1><i class="fas fa-tasks"></i> Task Manager</h1>
      <div class="tm-actions">
        <button class="tm-btn tm-btn--primary" id="btn-new-task"><i class="fas fa-plus"></i> New Task</button>
      </div>
    </div>

    <!-- Stats -->
    <div class="tm-stats" id="tm-stats"></div>

    <!-- Filters + View Toggle -->
    <div class="tm-filters">
      <span class="tm-filter-label">Filter:</span>
      <select class="tm-filter-select" id="filter-assignee">
        <option value="">All Agents</option>
      </select>
      <select class="tm-filter-select" id="filter-priority">
        <option value="">All Priorities</option>
        <option value="critical">Critical</option>
        <option value="high">High</option>
        <option value="medium">Medium</option>
        <option value="low">Low</option>
      </select>
      <select class="tm-filter-select" id="filter-division">
        <option value="">All Divisions</option>
      </select>
      <div class="tm-view-toggle">
        <button class="tm-view-btn active" id="view-board" title="Board"><i class="fas fa-columns"></i></button>
        <button class="tm-view-btn" id="view-list" title="List"><i class="fas fa-list"></i></button>
      </div>
    </div>

    <!-- Task Intelligence Alerts -->
    <div id="tm-intel-alerts"></div>

    <!-- Signal Filter Bar -->
    <div class="tm-signal-bar" id="tm-signal-bar">
      <button class="tm-signal-chip" data-signal="all" aria-pressed="true">All</button>
      <button class="tm-signal-chip" data-signal="aging" aria-pressed="false">Aging 5d+</button>
      <button class="tm-signal-chip" data-signal="overdue" aria-pressed="false">Overdue</button>
      <button class="tm-signal-chip" data-signal="blocked" aria-pressed="false">Blocked</button>
      <button class="tm-signal-chip" data-signal="mytasks" aria-pressed="false">My Tasks</button>
      <div class="tm-signal-sep"></div>
      <select class="tm-preset-select" id="tm-preset-select">
        <option value="default">Default View</option>
        <option value="ceo">CEO Focus</option>
        <option value="execution">Execution Focus</option>
      </select>
    </div>

    <!-- Kanban Board -->
    <div class="tm-board active" id="tm-board">
      <div class="tm-column" data-status="pending-approval" style="border-top:2px solid rgba(251,191,36,0.3);">
        <div class="tm-column-header">
          <span class="tm-column-title" style="color:#fbbf24;"><i class="fas fa-hourglass-half"></i> Pending Approval</span>
          <span class="tm-column-count" data-count="pending-approval" style="background:rgba(251,191,36,0.12);color:#fbbf24;">0</span>
          <button class="tm-col-chevron" aria-expanded="true" aria-label="Toggle column"><i class="fas fa-chevron-down"></i></button>
        </div>
        <div class="tm-column-summary" data-summary="pending-approval"></div>
        <div class="tm-column-cards" data-col="pending-approval"></div>
      </div>
      <div class="tm-column tm-column--backlog" data-status="backlog">
        <div class="tm-column-header">
          <span class="tm-column-title"><i class="fas fa-inbox"></i> Backlog</span>
          <span class="tm-column-count" data-count="backlog">0</span>
          <button class="tm-col-chevron" aria-expanded="true" aria-label="Toggle column"><i class="fas fa-chevron-down"></i></button>
        </div>
        <div class="tm-column-summary" data-summary="backlog"></div>
        <div class="tm-column-cards" data-col="backlog"></div>
      </div>
      <div class="tm-column tm-column--todo" data-status="todo">
        <div class="tm-column-header">
          <span class="tm-column-title"><i class="fas fa-clipboard-list"></i> To Do</span>
          <span class="tm-column-count" data-count="todo">0</span>
          <button class="tm-col-chevron" aria-expanded="true" aria-label="Toggle column"><i class="fas fa-chevron-down"></i></button>
        </div>
        <div class="tm-column-summary" data-summary="todo"></div>
        <div class="tm-column-cards" data-col="todo"></div>
      </div>
      <div class="tm-column tm-column--in-progress" data-status="in-progress">
        <div class="tm-column-header">
          <span class="tm-column-title"><i class="fas fa-spinner"></i> In Progress</span>
          <span class="tm-column-count" data-count="in-progress">0</span>
          <button class="tm-col-chevron" aria-expanded="true" aria-label="Toggle column"><i class="fas fa-chevron-down"></i></button>
        </div>
        <div class="tm-column-summary" data-summary="in-progress"></div>
        <div class="tm-column-cards" data-col="in-progress"></div>
      </div>
      <div class="tm-column tm-column--review" data-status="review">
        <div class="tm-column-header">
          <span class="tm-column-title"><i class="fas fa-eye"></i> Review</span>
          <span class="tm-column-count" data-count="review">0</span>
          <button class="tm-col-chevron" aria-expanded="true" aria-label="Toggle column"><i class="fas fa-chevron-down"></i></button>
        </div>
        <div class="tm-column-summary" data-summary="review"></div>
        <div class="tm-column-cards" data-col="review"></div>
      </div>
      <div class="tm-column tm-column--done" data-status="done">
        <div class="tm-column-header">
          <span class="tm-column-title"><i class="fas fa-check-circle"></i> Done</span>
          <span class="tm-column-count" data-count="done">0</span>
          <button class="tm-col-chevron" aria-expanded="true" aria-label="Toggle column"><i class="fas fa-chevron-down"></i></button>
        </div>
        <div class="tm-column-summary" data-summary="done"></div>
        <div class="tm-column-cards" data-col="done"></div>
      </div>
    </div>

    <!-- List View -->
    <div class="tm-list" id="tm-list">
      <table class="tm-list-table">
        <thead>
          <tr>
            <th>Task</th>
            <th>Status</th>
            <th>Priority</th>
            <th>Assignee</th>
            <th>Division</th>
            <th>Due</th>
          </tr>
        </thead>
        <tbody id="tm-list-body"></tbody>
      </table>
    </div>

    <!-- Task Modal (Create / Edit) -->
    <div class="tm-modal-overlay" id="task-modal">
      <div class="tm-modal">
        <div class="tm-modal-header">
          <h2 class="tm-modal-title" id="modal-title">New Task</h2>
          <button class="tm-modal-close" id="modal-close"><i class="fas fa-times"></i></button>
        </div>
        <div class="tm-modal-body">
          <input type="hidden" id="task-id" />

          <label for="task-title">Title</label>
          <input type="text" id="task-title" placeholder="Task title..." />

          <label for="task-desc">Description</label>
          <textarea id="task-desc" placeholder="What needs to be done..."></textarea>

          <div class="tm-modal-row">
            <div>
              <label for="task-status">Status</label>
              <select id="task-status">
                <option value="pending-approval">Pending Approval</option>
                <option value="backlog">Backlog</option>
                <option value="todo">To Do</option>
                <option value="in-progress">In Progress</option>
                <option value="review">Review</option>
                <option value="done">Done</option>
              </select>
            </div>
            <div>
              <label for="task-priority">Priority</label>
              <select id="task-priority">
                <option value="low">Low</option>
                <option value="medium" selected>Medium</option>
                <option value="high">High</option>
                <option value="critical">Critical</option>
              </select>
            </div>
          </div>

          <div class="tm-modal-row">
            <div>
              <label for="task-assignee">Assignee</label>
              <select id="task-assignee">
                <option value="">Unassigned</option>
              </select>
            </div>
            <div>
              <label for="task-division">Division</label>
              <select id="task-division">
                <option value="">None</option>
              </select>
            </div>
          </div>

          <label for="task-due">Due Date</label>
          <input type="date" id="task-due" />

          <label for="task-risk">Risk Level</label>
          <select id="task-risk">
            <option value="none">None</option>
            <option value="low">Low</option>
            <option value="medium">Medium</option>
            <option value="high">High</option>
          </select>

          <!-- Comments (only in edit mode) -->
          <div class="tm-comments" id="task-comments" style="display:none;">
            <h4><i class="fas fa-comments" style="margin-right:4px;"></i>Comments</h4>
            <div id="task-comments-list"></div>
            <div class="tm-comment-add">
              <input type="text" id="task-comment-input" placeholder="Add a comment..." />
              <button id="btn-add-comment"><i class="fas fa-paper-plane"></i></button>
            </div>
          </div>
        </div>
        <div class="tm-modal-footer">
          <button class="tm-btn" id="btn-delete-task" style="margin-right:auto; color:#f87171; border-color:rgba(248,113,113,0.2); display:none;">
            <i class="fas fa-trash"></i> Delete
          </button>
          <button class="tm-btn" id="btn-cancel-task">Cancel</button>
          <button class="tm-btn tm-btn--primary" id="btn-save-task"><i class="fas fa-check"></i> Save</button>
        </div>
      </div>
    </div>

  </main>

  <script src="/js/company-store.js"></script>
  <script src="/js/agent-engine.js"></script>
  <script>
    (function () {
      'use strict';

      var agents = [];
      var allDivisions = [];
      var currentView = 'board';
      var filterAssignee = '';
      var filterPriority = '';
      var filterDivision = '';

      // Collapsed columns state
      var _defaultCollapsed = { 'pending-approval': false, backlog: false, todo: false, 'in-progress': false, review: false, done: true };
      var _collapsedCols = {};
      try { _collapsedCols = JSON.parse(localStorage.getItem('ap_tasks_collapsed_columns')) || {}; } catch (e) {}
      // Merge defaults for any missing keys
      Object.keys(_defaultCollapsed).forEach(function (k) {
        if (typeof _collapsedCols[k] === 'undefined') _collapsedCols[k] = _defaultCollapsed[k];
      });
      function _saveCollapsedCols() { localStorage.setItem('ap_tasks_collapsed_columns', JSON.stringify(_collapsedCols)); }

      // Signal filter mode
      var _signalFilter = localStorage.getItem('ap_tasks_filter_mode') || 'all';
      var _viewPreset = localStorage.getItem('ap_tasks_view_preset') || 'default';
      var _currentAgentId = '';

      // Try to resolve current user identity for "My Tasks" filter
      try {
        fetch('/.auth/me').then(function (r) { return r.json(); }).then(function (d) {
          if (d && d.clientPrincipal && d.clientPrincipal.userId) {
            _currentAgentId = d.clientPrincipal.userDetails || d.clientPrincipal.userId;
          }
        }).catch(function () {});
      } catch (e) {}

      // DOM refs
      var board = document.getElementById('tm-board');
      var listView = document.getElementById('tm-list');
      var listBody = document.getElementById('tm-list-body');
      var statsBar = document.getElementById('tm-stats');
      var modal = document.getElementById('task-modal');

      // ── Init ──
      // Re-render when server sync pulls in agent-created tasks
      AgentEngine.on('sync-complete', function () { renderAll(); });

      AgentEngine.loadRegistry().then(function (data) {
        if (!data || !data.agents) return;
        agents = data.agents;

        // Populate agent filter + assignee dropdown
        var filterAssigneeEl = document.getElementById('filter-assignee');
        var taskAssigneeEl = document.getElementById('task-assignee');
        var filterDivisionEl = document.getElementById('filter-division');
        var taskDivisionEl = document.getElementById('task-division');

        agents.forEach(function (a) {
          filterAssigneeEl.innerHTML += '<option value="' + a.id + '">' + a.name + ' (' + a.role + ')</option>';
          taskAssigneeEl.innerHTML += '<option value="' + a.id + '">' + a.name + ' — ' + a.role + '</option>';

          // Collect divisions
          if (a.divisions) {
            a.divisions.forEach(function (d) {
              allDivisions.push({ id: d.id, name: d.name, icon: d.icon, agentId: a.id, agentName: a.name });
              filterDivisionEl.innerHTML += '<option value="' + d.id + '">' + d.name + ' (' + a.name + ')</option>';
              taskDivisionEl.innerHTML += '<option value="' + d.id + '">' + d.name + ' — ' + a.name + '</option>';
            });
          }
        });

        renderAll();
      });

      // ── Render ──
      function renderAll() {
        renderTaskIntel();
        renderStats();
        renderBoard();
        renderList();
      }

      // ── Task Intelligence ──
      function renderTaskIntel() {
        var el = document.getElementById('tm-intel-alerts');
        if (!el) return;
        var tasks = AgentEngine.getTasks();
        var nowMs = Date.now();
        var dayMs = 86400000;
        var today = new Date().toISOString().split('T')[0];
        var alerts = [];

        // Single pass: gather column stats + agent load + objective freshness
        var colStats = {};
        var agentLoad = {};
        var objLastActivity = {}; // objectiveId → newest updatedAt ms
        var cols = ['pending-approval', 'backlog', 'todo', 'in-progress', 'review'];

        tasks.forEach(function (t) {
          var isDone = t.status === 'done';

          // Column bottleneck (exclude done)
          if (!isDone && cols.indexOf(t.status) !== -1) {
            if (!colStats[t.status]) colStats[t.status] = { count: 0, oldestAge: 0 };
            colStats[t.status].count++;
            if (t.createdAt) {
              var age = nowMs - new Date(t.createdAt).getTime();
              if (!isNaN(age) && age > colStats[t.status].oldestAge) colStats[t.status].oldestAge = age;
            }
          }

          // Agent overload (active tasks only)
          if (!isDone && t.assignee) {
            agentLoad[t.assignee] = (agentLoad[t.assignee] || 0) + 1;
          }

          // Objective stagnation via directive linkage (skip done + pending-approval)
          if (t.directive_id && t.updatedAt && t.status !== 'done' && t.status !== 'pending-approval') {
            var ts = new Date(t.updatedAt).getTime();
            if (!isNaN(ts)) {
              if (!objLastActivity[t.directive_id] || ts > objLastActivity[t.directive_id]) {
                objLastActivity[t.directive_id] = ts;
              }
            }
          }
        });

        // 1) Column Bottleneck — show worst column only
        var worstCol = null;
        var worstSeverity = 0; // 0=none, 1=amber, 2=red
        var colLabels = { 'pending-approval': 'Pending Approval', backlog: 'Backlog', todo: 'To Do', 'in-progress': 'In Progress', review: 'Review' };
        cols.forEach(function (status) {
          var s = colStats[status];
          if (!s) return;
          var ageDays = Math.floor(s.oldestAge / dayMs);
          var sev = 0;
          if (s.count >= 10 || ageDays >= 14) sev = 2;
          else if (s.count >= 6 || ageDays >= 7) sev = 1;
          if (sev > worstSeverity
            || (sev === worstSeverity && worstCol && ageDays > worstCol.ageDays)
            || (sev === worstSeverity && worstCol && ageDays === worstCol.ageDays && s.count > worstCol.count)) {
            worstSeverity = sev;
            worstCol = { status: status, count: s.count, ageDays: ageDays };
          }
        });
        if (worstCol && worstSeverity > 0) {
          var cls = worstSeverity === 2 ? 'tm-intel-alert--red' : 'tm-intel-alert--amber';
          var icon = worstSeverity === 2 ? 'fas fa-exclamation-circle' : 'fas fa-exclamation-triangle';
          alerts.push('<div class="tm-intel-alert ' + cls + '"><i class="' + icon + '"></i><span>' + colLabels[worstCol.status] + ' column accumulating tasks (' + worstCol.count + ' items, oldest ' + worstCol.ageDays + 'd)</span></div>');
        }

        // 2) Agent Overload — show worst agent only
        var worstAgent = null;
        var worstAgentCount = 0;
        Object.keys(agentLoad).forEach(function (agentId) {
          if (agentLoad[agentId] > worstAgentCount) {
            worstAgentCount = agentLoad[agentId];
            worstAgent = agentId;
          }
        });
        if (worstAgent && worstAgentCount >= 7) {
          var agentObj = null;
          for (var i = 0; i < agents.length; i++) { if (agents[i].id === worstAgent) { agentObj = agents[i]; break; } }
          var agentName = agentObj ? agentObj.name : worstAgent;
          var agentCls = worstAgentCount >= 10 ? 'tm-intel-alert--red' : 'tm-intel-alert--amber';
          var agentIcon = worstAgentCount >= 10 ? 'fas fa-exclamation-circle' : 'fas fa-user-clock';
          alerts.push('<div class="tm-intel-alert ' + agentCls + '"><i class="' + agentIcon + '"></i><span>' + escapeHtml(agentName) + ' has ' + worstAgentCount + ' active tasks</span></div>');
        }

        // 3) Objective Stagnation via directives
        try {
          var directives = typeof AgentEngine.getDirectives === 'function' ? AgentEngine.getDirectives() : [];
          directives.forEach(function (dir) {
            var lastMs = objLastActivity[dir.id];
            if (!lastMs) return;
            var staleDays = Math.floor((nowMs - lastMs) / dayMs);
            if (staleDays >= 4) {
              alerts.push('<div class="tm-intel-alert tm-intel-alert--amber"><i class="fas fa-hourglass-end"></i><span>' + escapeHtml(dir.title || dir.id) + ' shows no progress in ' + staleDays + ' days</span></div>');
            }
          });
        } catch (e) {}

        // Also check objectives with linkedTasks
        try {
          var objectives = typeof AgentEngine.getObjectives === 'function' ? AgentEngine.getObjectives() : [];
          objectives.forEach(function (obj) {
            if (!obj.linkedTasks || obj.linkedTasks.length === 0) return;
            var newestMs = 0;
            tasks.forEach(function (t) {
              if (obj.linkedTasks.indexOf(t.id) !== -1 && t.updatedAt && t.status !== 'done' && t.status !== 'pending-approval') {
                var ts = new Date(t.updatedAt).getTime();
                if (!isNaN(ts) && ts > newestMs) newestMs = ts;
              }
            });
            if (newestMs === 0) return;
            var staleDays = Math.floor((nowMs - newestMs) / dayMs);
            if (staleDays >= 4) {
              alerts.push('<div class="tm-intel-alert tm-intel-alert--amber"><i class="fas fa-bullseye"></i><span>' + escapeHtml(obj.title || obj.id) + ' objective shows no progress in ' + staleDays + ' days</span></div>');
            }
          });
        } catch (e) {}

        el.innerHTML = alerts.join('');
      }

      function getFilteredTasks(applySignal) {
        var tasks = AgentEngine.getTasks();
        if (filterAssignee) {
          tasks = tasks.filter(function (t) { return t.assignee === filterAssignee; });
        }
        if (filterPriority) {
          tasks = tasks.filter(function (t) { return t.priority === filterPriority; });
        }
        if (filterDivision) {
          tasks = tasks.filter(function (t) { return t.division === filterDivision; });
        }
        // Signal filters (board view only)
        if (applySignal && _signalFilter !== 'all') {
          var nowMs = Date.now();
          var dayMs = 86400000;
          var today = new Date().toISOString().split('T')[0];
          tasks = tasks.filter(function (t) {
            if (_signalFilter === 'aging') {
              return t.createdAt && (nowMs - new Date(t.createdAt).getTime()) > 5 * dayMs;
            }
            if (_signalFilter === 'overdue') {
              return t.dueDate && t.dueDate < today && t.status !== 'done';
            }
            if (_signalFilter === 'blocked') {
              return t.blocked || t.escalated || (t.tags && t.tags.indexOf('blocked') !== -1);
            }
            if (_signalFilter === 'mytasks') {
              return t.assignee && t.assignee === _currentAgentId;
            }
            return true;
          });
        }
        return tasks;
      }

      function renderStats() {
        var stats = AgentEngine.getTaskStats();
        var pendingCount = AgentEngine.getTasks().filter(function(t){ return t.status === 'pending-approval'; }).length;
        statsBar.innerHTML =
          statCard(stats.total, 'Total', '') +
          (pendingCount > 0 ? statCard(pendingCount, 'Pending', 'tm-stat--pending') : '') +
          statCard(stats.backlog, 'Backlog', '') +
          statCard(stats.todo + stats['in-progress'], 'Active', 'tm-stat--active') +
          statCard(stats.review, 'Review', '') +
          statCard(stats.done, 'Done', '') +
          statCard(stats.overdue, 'Overdue', 'tm-stat--overdue') +
          statCard(stats.unassigned, 'Unassigned', '');
      }

      function statCard(val, label, cls) {
        return '<div class="tm-stat ' + cls + '"><div class="tm-stat-value">' + val + '</div><div class="tm-stat-label">' + label + '</div></div>';
      }

      function riskPill(task) {
        if (!task.risk_level || task.risk_level === 'none') return '';
        var cls = 'task-risk-pill task-risk-pill--' + task.risk_level;
        return '<span class="' + cls + '">' + task.risk_level + '</span>';
      }

      function renderBoard() {
        var tasks = getFilteredTasks(true);
        var cols = ['pending-approval', 'backlog', 'todo', 'in-progress', 'review', 'done'];
        var today = new Date().toISOString().split('T')[0];
        var nowMs = Date.now();
        var dayMs = 86400000;

        cols.forEach(function (status) {
          var container = document.querySelector('[data-col="' + status + '"]');
          var countEl = document.querySelector('[data-count="' + status + '"]');
          var summaryEl = document.querySelector('[data-summary="' + status + '"]');
          var colTasks = tasks.filter(function (t) { return t.status === status; });

          // Sort: critical first, then by date
          colTasks.sort(function (a, b) {
            var prioOrder = { critical: 0, high: 1, medium: 2, low: 3 };
            return (prioOrder[a.priority] || 2) - (prioOrder[b.priority] || 2);
          });

          countEl.textContent = colTasks.length;
          container.innerHTML = '';

          // Column summary
          if (colTasks.length === 0) {
            summaryEl.innerHTML = '';
            container.innerHTML = '<div class="tm-empty">No tasks</div>';
            return;
          }

          var oldestAge = 0;
          var overdueCount = 0;
          var blockedCount = 0;
          colTasks.forEach(function (t) {
            if (t.createdAt) {
              var age = nowMs - new Date(t.createdAt).getTime();
              if (!isNaN(age) && age > oldestAge) oldestAge = age;
            }
            if (t.dueDate && t.dueDate < today && t.status !== 'done') overdueCount++;
            if (t.blocked || t.escalated || (t.tags && t.tags.indexOf('blocked') !== -1)) blockedCount++;
          });

          var summaryHtml = '';
          var oldestDays = Math.floor(oldestAge / dayMs);
          if (oldestDays > 0) summaryHtml += '<div class="tm-column-summary-line"><i class="fas fa-clock"></i> Oldest: ' + oldestDays + 'd</div>';
          if (overdueCount > 0) summaryHtml += '<div class="tm-column-summary-line tm-summary-overdue"><i class="fas fa-exclamation-circle"></i> ' + overdueCount + ' overdue</div>';
          if (blockedCount > 0) summaryHtml += '<div class="tm-column-summary-line tm-summary-blocked"><i class="fas fa-ban"></i> ' + blockedCount + ' blocked</div>';
          summaryEl.innerHTML = summaryHtml;

          colTasks.forEach(function (task) {
            container.appendChild(createTaskCard(task, nowMs, dayMs));
          });
        });
      }

      function createTaskCard(task, nowMs, dayMs) {
        var card = document.createElement('div');
        var agingClass = '';
        if (task.createdAt && nowMs && dayMs && task.status !== 'done') {
          var ageDays = (nowMs - new Date(task.createdAt).getTime()) / dayMs;
          if (ageDays > 10) agingClass = ' tm-card--age-critical';
          else if (ageDays > 5) agingClass = ' tm-card--age-warn';
        }
        card.className = 'tm-card' + agingClass;
        card.setAttribute('draggable', 'true');
        card.setAttribute('data-task-id', task.id);

        var agent = task.assignee ? getAgentById(task.assignee) : null;
        var div = task.division ? getDivisionById(task.division) : null;
        var today = new Date().toISOString().split('T')[0];
        var isOverdue = task.dueDate && task.dueDate < today && task.status !== 'done';

        var meta = '<div class="tm-card-meta">';
        meta += '<span class="tm-card-priority tm-card-priority--' + task.priority + '">' + task.priority + '</span>';

        if (agent) {
          meta += '<span class="tm-card-assignee" style="--agent-color:' + agent.color + '"><i class="' + agent.icon + '"></i> ' + agent.name + '</span>';
        }

        if (task.comments && task.comments.length > 0) {
          meta += '<span class="tm-card-comments"><i class="fas fa-comment"></i> ' + task.comments.length + '</span>';
        }

        if (task.dueDate) {
          meta += '<span class="tm-card-due ' + (isOverdue ? 'overdue' : '') + '"><i class="fas fa-calendar"></i> ' + formatDate(task.dueDate) + '</span>';
        }

        meta += '</div>';

        if (div) {
          meta += '<div class="tm-card-division"><i class="' + div.icon + '"></i> ' + div.name + '</div>';
        }

        var badge = riskPill(task);

        // v2.3 D) Source traceability link
        var sourceHtml = '';
        if (task.source && task.source.type === 'standup') {
          sourceHtml = '<div style="font-size:0.55rem;opacity:0.4;margin-top:0.2rem;"><i class="fas fa-link" style="margin-right:2px;"></i> From standup: <a href="/modules/company/standup.html" style="color:#fbbf24;text-decoration:none;">' + escapeHtml(task.source.title || 'Standup') + '</a></div>';
        }

        card.innerHTML = '<div class="tm-card-title">' + escapeHtml(task.title) + badge + '</div>' + meta + sourceHtml;

        card.addEventListener('click', function () { openEditModal(task.id); });

        // Drag events
        card.addEventListener('dragstart', function (e) {
          e.dataTransfer.setData('text/plain', task.id);
          card.style.opacity = '0.4';
        });
        card.addEventListener('dragend', function () {
          card.style.opacity = '1';
        });

        return card;
      }

      function renderList() {
        var tasks = getFilteredTasks();

        // Sort: status order, then priority
        var statusOrder = { 'pending-approval': -1, 'in-progress': 0, 'review': 1, 'todo': 2, 'backlog': 3, 'done': 4 };
        var prioOrder = { critical: 0, high: 1, medium: 2, low: 3 };
        tasks.sort(function (a, b) {
          var s = (statusOrder[a.status] || 3) - (statusOrder[b.status] || 3);
          if (s !== 0) return s;
          return (prioOrder[a.priority] || 2) - (prioOrder[b.priority] || 2);
        });

        listBody.innerHTML = '';
        if (tasks.length === 0) {
          listBody.innerHTML = '<tr><td colspan="6" style="text-align:center; opacity:0.2; padding:2rem;">No tasks</td></tr>';
          return;
        }

        tasks.forEach(function (task) {
          var agent = task.assignee ? getAgentById(task.assignee) : null;
          var div = task.division ? getDivisionById(task.division) : null;
          var today = new Date().toISOString().split('T')[0];
          var isOverdue = task.dueDate && task.dueDate < today && task.status !== 'done';

          var tr = document.createElement('tr');
          tr.innerHTML =
            '<td>' + escapeHtml(task.title) + '</td>' +
            '<td><span class="tm-list-status tm-list-status--' + task.status + '">' + formatStatus(task.status) + '</span></td>' +
            '<td><span class="tm-card-priority tm-card-priority--' + task.priority + '">' + task.priority + '</span></td>' +
            '<td>' + (agent ? '<span style="color:' + agent.color + ';">' + agent.name + '</span>' : '<span style="opacity:0.2">—</span>') + '</td>' +
            '<td>' + (div ? '<span style="opacity:0.4;">' + div.name + '</span>' : '<span style="opacity:0.2">—</span>') + '</td>' +
            '<td>' + (task.dueDate ? '<span class="' + (isOverdue ? 'overdue' : '') + '" style="font-size:0.7rem;' + (isOverdue ? 'color:#f87171;' : 'opacity:0.4;') + '">' + formatDate(task.dueDate) + '</span>' : '<span style="opacity:0.2">—</span>') + '</td>';

          tr.addEventListener('click', function () { openEditModal(task.id); });
          listBody.appendChild(tr);
        });
      }

      // ── Drag & Drop ──
      document.querySelectorAll('.tm-column').forEach(function (col) {
        col.addEventListener('dragover', function (e) {
          e.preventDefault();
          col.classList.add('drag-over');
        });
        col.addEventListener('dragleave', function () {
          col.classList.remove('drag-over');
        });
        col.addEventListener('drop', function (e) {
          e.preventDefault();
          col.classList.remove('drag-over');
          var taskId = e.dataTransfer.getData('text/plain');
          var newStatus = col.getAttribute('data-status');
          if (taskId && newStatus) {
            AgentEngine.moveTask(taskId, newStatus);
            renderAll();
          }
        });
      });

      // ── Collapsible Columns (chevron only) ──
      document.querySelectorAll('.tm-column').forEach(function (col) {
        var status = col.getAttribute('data-status');
        var chevron = col.querySelector('.tm-col-chevron');
        // Apply initial collapsed state
        if (_collapsedCols[status]) {
          col.classList.add('collapsed');
          chevron.setAttribute('aria-expanded', 'false');
        }
        // Toggle on chevron click only
        chevron.addEventListener('click', function (e) {
          e.stopPropagation();
          var isCollapsed = col.classList.toggle('collapsed');
          chevron.setAttribute('aria-expanded', !isCollapsed);
          _collapsedCols[status] = isCollapsed;
          _saveCollapsedCols();
        });
        chevron.addEventListener('keydown', function (e) {
          if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); chevron.click(); }
        });
      });

      // ── Dynamic Board Height ──
      function _updateBoardHeight() {
        if (board) {
          var offset = board.getBoundingClientRect().top;
          document.documentElement.style.setProperty('--tasks-board-height', (window.innerHeight - offset - 8) + 'px');
        }
      }
      _updateBoardHeight();
      window.addEventListener('resize', _updateBoardHeight);
      window.addEventListener('orientationchange', function () { setTimeout(_updateBoardHeight, 100); });

      // ── Signal Filter Chips ──
      function _setSignalFilter(mode) {
        _signalFilter = mode;
        localStorage.setItem('ap_tasks_filter_mode', mode);
        document.querySelectorAll('.tm-signal-chip').forEach(function (chip) {
          chip.setAttribute('aria-pressed', chip.dataset.signal === mode ? 'true' : 'false');
        });
        renderBoard();
      }
      // Init chip state
      document.querySelectorAll('.tm-signal-chip').forEach(function (chip) {
        chip.setAttribute('aria-pressed', chip.dataset.signal === _signalFilter ? 'true' : 'false');
        chip.addEventListener('click', function () { _setSignalFilter(chip.dataset.signal); });
      });

      // ── View Presets ──
      var presetSelect = document.getElementById('tm-preset-select');
      function _applyPreset(preset) {
        _viewPreset = preset;
        localStorage.setItem('ap_tasks_view_preset', preset);
        presetSelect.value = preset;
        if (preset === 'ceo') {
          _setSignalFilter('overdue');
          _collapsedCols = { 'pending-approval': false, backlog: false, todo: false, 'in-progress': false, review: false, done: true };
        } else if (preset === 'execution') {
          _setSignalFilter('mytasks');
          _collapsedCols = { 'pending-approval': true, backlog: true, todo: true, 'in-progress': false, review: false, done: true };
        } else {
          _setSignalFilter('all');
          Object.keys(_defaultCollapsed).forEach(function (k) { _collapsedCols[k] = _defaultCollapsed[k]; });
        }
        _saveCollapsedCols();
        // Apply collapsed state to DOM
        document.querySelectorAll('.tm-column').forEach(function (col) {
          var st = col.getAttribute('data-status');
          var chev = col.querySelector('.tm-col-chevron');
          if (_collapsedCols[st]) { col.classList.add('collapsed'); chev.setAttribute('aria-expanded', 'false'); }
          else { col.classList.remove('collapsed'); chev.setAttribute('aria-expanded', 'true'); }
        });
        renderBoard();
      }
      presetSelect.value = _viewPreset;
      presetSelect.addEventListener('change', function () { _applyPreset(this.value); });

      // ── View Toggle ──
      var viewBoardBtn = document.getElementById('view-board');
      var viewListBtn = document.getElementById('view-list');

      viewBoardBtn.addEventListener('click', function () {
        currentView = 'board';
        board.classList.add('active');
        listView.classList.remove('active');
        viewBoardBtn.classList.add('active');
        viewListBtn.classList.remove('active');
      });

      viewListBtn.addEventListener('click', function () {
        currentView = 'list';
        board.classList.remove('active');
        listView.classList.add('active');
        viewListBtn.classList.add('active');
        viewBoardBtn.classList.remove('active');
      });

      // ── Filters ──
      document.getElementById('filter-assignee').addEventListener('change', function () {
        filterAssignee = this.value;
        renderBoard();
        renderList();
      });

      document.getElementById('filter-priority').addEventListener('change', function () {
        filterPriority = this.value;
        renderBoard();
        renderList();
      });

      document.getElementById('filter-division').addEventListener('change', function () {
        filterDivision = this.value;
        renderBoard();
        renderList();
      });

      // ── Modal ──
      var modalTitle = document.getElementById('modal-title');
      var taskIdField = document.getElementById('task-id');
      var taskTitleField = document.getElementById('task-title');
      var taskDescField = document.getElementById('task-desc');
      var taskStatusField = document.getElementById('task-status');
      var taskPriorityField = document.getElementById('task-priority');
      var taskAssigneeField = document.getElementById('task-assignee');
      var taskDivisionField = document.getElementById('task-division');
      var taskDueField = document.getElementById('task-due');
      var taskCommentsSection = document.getElementById('task-comments');
      var taskCommentsList = document.getElementById('task-comments-list');
      var taskCommentInput = document.getElementById('task-comment-input');
      var deleteBtn = document.getElementById('btn-delete-task');

      function openNewModal() {
        modalTitle.textContent = 'New Task';
        taskIdField.value = '';
        taskTitleField.value = '';
        taskDescField.value = '';
        taskStatusField.value = 'backlog';
        taskPriorityField.value = 'medium';
        taskAssigneeField.value = '';
        taskDivisionField.value = '';
        taskDueField.value = '';
        taskCommentsSection.style.display = 'none';
        deleteBtn.style.display = 'none';
        modal.classList.add('active');
        setTimeout(function () { taskTitleField.focus(); }, 100);
      }

      function openEditModal(taskId) {
        var task = AgentEngine.getTask(taskId);
        if (!task) return;

        modalTitle.textContent = 'Edit Task';
        taskIdField.value = task.id;
        taskTitleField.value = task.title;
        taskDescField.value = task.description || '';
        taskStatusField.value = task.status;
        taskPriorityField.value = task.priority;
        taskAssigneeField.value = task.assignee || '';
        taskDivisionField.value = task.division || '';
        taskDueField.value = task.dueDate ? String(task.dueDate).split('T')[0] : '';
        deleteBtn.style.display = '';

        // Render comments
        taskCommentsSection.style.display = '';
        renderComments(task);

        modal.classList.add('active');
      }

      function renderComments(task) {
        taskCommentsList.innerHTML = '';
        if (!task.comments || task.comments.length === 0) {
          taskCommentsList.innerHTML = '<div style="opacity:0.2; font-size:0.65rem; font-style:italic;">No comments yet</div>';
          return;
        }
        task.comments.forEach(function (c) {
          var authorId = c.agentId || c.author || null;
          var agent = authorId ? getAgentById(authorId) : null;
          var ts = c.timestamp || c.createdAt || null;
          var div = document.createElement('div');
          div.className = 'tm-comment';
          div.innerHTML =
            '<div class="tm-comment-meta">' +
              (agent ? '<span style="color:' + agent.color + ';">' + agent.name + '</span>' : (authorId || 'User')) +
              ' · ' + formatTimeAgo(ts ? new Date(ts) : null) +
            '</div>' +
            '<div>' + escapeHtml(c.text) + '</div>';
          taskCommentsList.appendChild(div);
        });
      }

      function closeModal() {
        modal.classList.remove('active');
      }

      document.getElementById('btn-new-task').addEventListener('click', openNewModal);
      document.getElementById('modal-close').addEventListener('click', closeModal);
      document.getElementById('btn-cancel-task').addEventListener('click', closeModal);

      modal.addEventListener('click', function (e) {
        if (e.target === modal) closeModal();
      });

      // Save task
      document.getElementById('btn-save-task').addEventListener('click', function () {
        var title = taskTitleField.value.trim();
        if (!title) { taskTitleField.focus(); return; }

        var data = {
          title: title,
          description: taskDescField.value.trim(),
          status: taskStatusField.value,
          priority: taskPriorityField.value,
          assignee: taskAssigneeField.value || null,
          division: taskDivisionField.value || null,
          dueDate: taskDueField.value || null
        };

        if (taskIdField.value) {
          AgentEngine.updateTask(taskIdField.value, data);
        } else {
          AgentEngine.addTask(data);
        }

        closeModal();
        renderAll();
      });

      // Delete task
      deleteBtn.addEventListener('click', function () {
        if (taskIdField.value) {
          AgentEngine.deleteTask(taskIdField.value);
          closeModal();
          renderAll();
        }
      });

      // Add comment
      document.getElementById('btn-add-comment').addEventListener('click', function () {
        var text = taskCommentInput.value.trim();
        if (!text || !taskIdField.value) return;
        var task = AgentEngine.addTaskComment(taskIdField.value, { text: text });
        taskCommentInput.value = '';
        if (task) renderComments(task);
      });

      taskCommentInput.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') {
          document.getElementById('btn-add-comment').click();
        }
      });

      // Auto-set division when assignee changes
      taskAssigneeField.addEventListener('change', function () {
        var agentId = this.value;
        if (!agentId) return;
        var agent = getAgentById(agentId);
        if (agent && agent.divisions && agent.divisions.length > 0 && !taskDivisionField.value) {
          taskDivisionField.value = agent.divisions[0].id;
        }
      });

      // ── Helpers ──
      function getAgentById(id) {
        for (var i = 0; i < agents.length; i++) {
          if (agents[i].id === id) return agents[i];
        }
        return null;
      }

      function getDivisionById(id) {
        for (var i = 0; i < allDivisions.length; i++) {
          if (allDivisions[i].id === id) return allDivisions[i];
        }
        return null;
      }

      function formatStatus(s) {
        return s.replace(/-/g, ' ').replace(/\b\w/g, function (c) { return c.toUpperCase(); });
      }

      function formatDate(d) {
        if (!d) return '—';
        // Handle both 'YYYY-MM-DD' and full ISO datetime strings
        var dateStr = String(d).split('T')[0];
        var dt = new Date(dateStr + 'T00:00:00');
        if (isNaN(dt.getTime())) return '—';
        return dt.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
      }

      function formatTimeAgo(date) {
        if (!date || isNaN(date.getTime())) return '';
        var diff = Date.now() - date.getTime();
        var mins = Math.floor(diff / 60000);
        if (mins < 1) return 'just now';
        if (mins < 60) return mins + 'm ago';
        var hours = Math.floor(mins / 60);
        if (hours < 24) return hours + 'h ago';
        var days = Math.floor(hours / 24);
        return days + 'd ago';
      }

      function escapeHtml(str) {
        var div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
      }
    })();
  </script>

  <script src="/modules/company/js/sidebar.js"></script>
</body>
