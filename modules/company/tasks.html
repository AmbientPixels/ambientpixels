    <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="AmbientPixels Task Manager — Kanban board for agent task tracking." />
  <link rel="icon" href="/images/favicon.ico" type="image/x-icon" />
  <title>Tasks — AmbientPixels HQ</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/grid.css" />
  <link rel="stylesheet" href="/css/nav.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/theme.css" />
  <link rel="stylesheet" href="/css/banner.css" />
  <link rel="stylesheet" href="/modules/company/css/company.css" />
  <link rel="stylesheet" href="/modules/company/css/sidebar.css" />
  <link rel="stylesheet" href="/modules/company/css/quick-chat.css" />
  <link rel="stylesheet" href="/modules/company/css/tasks.css" />
  <style>
    .task-risk-pill {
      font-size:0.55rem; padding:0.1rem 0.35rem; border-radius:4px;
      background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.08);
      color:rgba(255,255,255,0.6); margin-left:0.4rem; text-transform:capitalize;
    }
    .task-risk-pill--high { border-color:rgba(248,113,113,0.4); color:#f87171; }
    .task-risk-pill--medium { border-color:rgba(251,191,36,0.4); color:#fbbf24; }
    .task-risk-pill--low { border-color:rgba(52,211,153,0.4); color:#34d399; }

    /* Verification badges */
    .verify-badge { font-size:0.5rem; padding:0.1rem 0.3rem; border-radius:3px; margin-left:0.3rem; white-space:nowrap; vertical-align:middle; }
    .verify-badge--pass { background:rgba(52,211,153,0.1); border:1px solid rgba(52,211,153,0.3); color:#34d399; }
    .verify-badge--fail { background:rgba(239,68,68,0.1); border:1px solid rgba(239,68,68,0.3); color:#ef4444; }
    .verify-badge--manual { background:rgba(251,191,36,0.1); border:1px solid rgba(251,191,36,0.3); color:#fbbf24; }
    .verify-badge--warn { background:rgba(251,191,36,0.1); border:1px solid rgba(251,191,36,0.3); color:#fbbf24; }

    /* Verification block toast */
    .verify-toast { position:fixed; bottom:1.5rem; left:50%; transform:translateX(-50%); z-index:9999; padding:0.6rem 1.2rem; border-radius:8px; font-size:0.72rem; font-weight:500; background:rgba(239,68,68,0.15); border:1px solid rgba(239,68,68,0.3); color:#f87171; box-shadow:0 4px 20px rgba(0,0,0,0.4); pointer-events:none; opacity:0; transition:opacity 0.2s; }
    .verify-toast.show { opacity:1; }
    .verify-toast--notice { background:rgba(251,191,36,0.12); border-color:rgba(251,191,36,0.3); color:#fbbf24; }

    /* Badge emphasis in review lane */
    [data-status="review"] .verify-badge--fail { background:rgba(239,68,68,0.15); }
    [data-status="review"] .verify-badge--manual { background:rgba(251,191,36,0.15); }

    /* Priority Engine pills */
    .priority-pill { font-size:0.5rem; padding:0.1rem 0.3rem; border-radius:3px; margin-left:0.3rem; white-space:nowrap; vertical-align:middle; }
    .priority-pill--low { background:rgba(156,163,175,0.08); border:1px solid rgba(156,163,175,0.2); color:#9ca3af; }
    .priority-pill--medium { background:rgba(59,130,246,0.08); border:1px solid rgba(59,130,246,0.25); color:#60a5fa; }
    .priority-pill--high { background:rgba(251,191,36,0.1); border:1px solid rgba(251,191,36,0.3); color:#fbbf24; }
    .priority-pill--critical { background:rgba(239,68,68,0.12); border:1px solid rgba(239,68,68,0.35); color:#f87171; }

    /* Archive tab */
    .tm-tab-bar { display:flex; gap:0; margin-bottom:0.75rem; border-bottom:1px solid rgba(255,255,255,0.06); }
    .tm-tab { padding:0.45rem 1rem; font-size:0.72rem; font-weight:500; color:rgba(255,255,255,0.35); background:none; border:none; border-bottom:2px solid transparent; cursor:pointer; transition:all 0.15s; font-family:inherit; }
    .tm-tab:hover { color:rgba(255,255,255,0.6); }
    .tm-tab.active { color:rgba(255,165,0,0.9); border-bottom-color:rgba(255,165,0,0.6); }
    .tm-tab .tm-tab-count { font-size:0.6rem; opacity:0.5; margin-left:0.3rem; }
    .tm-archive-panel { display:none; }
    .tm-archive-panel.active { display:block; }
    .tm-archive-table { width:100%; border-collapse:collapse; font-size:0.7rem; }
    .tm-archive-table th { text-align:left; padding:0.4rem 0.6rem; font-size:0.6rem; text-transform:uppercase; letter-spacing:0.04em; color:rgba(255,255,255,0.25); border-bottom:1px solid rgba(255,255,255,0.06); font-weight:500; }
    .tm-archive-table td { padding:0.4rem 0.6rem; border-bottom:1px solid rgba(255,255,255,0.03); color:rgba(255,255,255,0.55); }
    .tm-archive-table tr:hover td { background:rgba(255,255,255,0.02); }
    .tm-archive-empty { text-align:center; padding:2rem; opacity:0.2; font-size:0.75rem; }
    .tm-archive-load-btn { display:block; margin:1rem auto; padding:0.4rem 1.2rem; font-size:0.7rem; font-family:inherit; background:rgba(255,165,0,0.08); border:1px solid rgba(255,165,0,0.2); border-radius:6px; color:rgba(255,165,0,0.7); cursor:pointer; transition:all 0.15s; }
    .tm-archive-load-btn:hover { background:rgba(255,165,0,0.15); color:rgba(255,165,0,0.9); }
    .tm-archive-stats { display:flex; gap:1rem; margin-bottom:0.75rem; font-size:0.65rem; color:rgba(255,255,255,0.3); }
    .tm-archive-stats span { background:rgba(255,255,255,0.03); padding:0.2rem 0.6rem; border-radius:4px; border:1px solid rgba(255,255,255,0.05); }

    /* Task search */
    .tm-search-wrap {
      position: relative; flex: 1; min-width: 160px; max-width: 320px;
    }
    .tm-search-wrap input {
      width: 100%; padding: 0.35rem 0.6rem 0.35rem 1.8rem;
      font-size: 0.72rem; font-family: inherit; color: inherit;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 6px; outline: none;
      transition: border-color 0.15s;
    }
    .tm-search-wrap input:focus { border-color: rgba(255,165,0,0.3); }
    .tm-search-wrap input::placeholder { color: rgba(255,255,255,0.2); }
    .tm-search-wrap .tm-search-icon {
      position: absolute; left: 0.6rem; top: 50%; transform: translateY(-50%);
      font-size: 0.6rem; opacity: 0.25; pointer-events: none;
    }
  </style>
</head>
<body style="background:#071019" data-theme="dark">

  <main class="content-section" style="max-width: 1100px; margin: 0 auto; padding: 1rem;">

    <!-- Header -->
    <div class="tm-header">
      <h1><i class="fas fa-tasks"></i> Task Manager</h1>
      <div class="tm-actions">
        <button class="tm-btn tm-btn--primary" id="btn-new-task"><i class="fas fa-plus"></i> New Task</button>
      </div>
    </div>

    <!-- Server Write Status Banner -->
    <div id="write-status-banner" style="display:none; margin-bottom:0.75rem; padding:0.5rem 0.75rem; border-radius:6px; font-size:0.7rem; background:rgba(239,68,68,0.1); border:1px solid rgba(239,68,68,0.25); color:#f87171;">
      <i class="fas fa-exclamation-triangle" style="margin-right:0.4rem;"></i>
      <span id="write-status-msg">Server writes failing — tasks won't reach agents.</span>
      <span style="margin-left:0.5rem;">
        Key: <input id="write-key-input" type="password" placeholder="write secret" style="width:140px; padding:0.2rem 0.4rem; font-size:0.65rem; background:rgba(0,0,0,0.3); border:1px solid rgba(255,255,255,0.15); border-radius:4px; color:#fff; margin:0 0.3rem;" />
        <button id="write-key-save" style="padding:0.2rem 0.5rem; font-size:0.6rem; background:rgba(52,211,153,0.15); border:1px solid rgba(52,211,153,0.3); border-radius:4px; color:#34d399; cursor:pointer;">Set Key</button>
      </span>
    </div>

    <!-- Stats -->
    <div class="tm-stats" id="tm-stats"></div>

    <!-- Tab Bar: Active / Archive -->
    <div class="tm-tab-bar">
      <button class="tm-tab active" id="tab-active"><i class="fas fa-tasks" style="margin-right:4px;"></i>Active</button>
      <button class="tm-tab" id="tab-archive"><i class="fas fa-archive" style="margin-right:4px;"></i>Archive <span class="tm-tab-count" id="archive-count"></span></button>
    </div>

    <!-- Filters + View Toggle -->
    <div class="tm-filters">
      <span class="tm-filter-label">Filter:</span>
      <select class="tm-filter-select" id="filter-assignee">
        <option value="">All Agents</option>
      </select>
      <select class="tm-filter-select" id="filter-priority">
        <option value="">All Priorities</option>
        <option value="critical">Critical</option>
        <option value="high">High</option>
        <option value="medium">Medium</option>
        <option value="low">Low</option>
      </select>
      <select class="tm-filter-select" id="filter-division">
        <option value="">All Divisions</option>
      </select>
      <div class="tm-search-wrap">
        <i class="fas fa-search tm-search-icon"></i>
        <input type="text" id="tm-search" placeholder="Search tasks..." />
      </div>
      <div class="tm-view-toggle">
        <button class="tm-view-btn active" id="view-board" title="Board"><i class="fas fa-columns"></i></button>
        <button class="tm-view-btn" id="view-list" title="List"><i class="fas fa-list"></i></button>
      </div>
    </div>

    <!-- Task Intelligence Alerts -->
    <div id="tm-intel-alerts"></div>

    <!-- Signal Filter Bar -->
    <div class="tm-signal-bar" id="tm-signal-bar">
      <button class="tm-signal-chip" data-signal="all" aria-pressed="true">All</button>
      <button class="tm-signal-chip" data-signal="aging" aria-pressed="false">Aging 5d+</button>
      <button class="tm-signal-chip" data-signal="overdue" aria-pressed="false">Overdue</button>
      <button class="tm-signal-chip" data-signal="blocked" aria-pressed="false">Blocked</button>
      <button class="tm-signal-chip" data-signal="mytasks" aria-pressed="false">My Tasks</button>
      <div class="tm-signal-sep"></div>
      <select class="tm-preset-select" id="tm-preset-select">
        <option value="default">Default View</option>
        <option value="ceo">CEO Focus</option>
        <option value="execution">Execution Focus</option>
      </select>
    </div>

    <!-- Kanban Board -->
    <div class="tm-board active" id="tm-board">
      <div class="tm-column" data-status="pending-approval" style="border-top:2px solid rgba(251,191,36,0.3);">
        <div class="tm-column-header">
          <span class="tm-column-title" style="color:#fbbf24;"><i class="fas fa-hourglass-half"></i> Pending Approval</span>
          <span class="tm-column-count" data-count="pending-approval" style="background:rgba(251,191,36,0.12);color:#fbbf24;">0</span>
          <button class="tm-col-chevron" aria-expanded="true" aria-label="Toggle column"><i class="fas fa-chevron-down"></i></button>
        </div>
        <div class="tm-column-summary" data-summary="pending-approval"></div>
        <div class="tm-column-cards" data-col="pending-approval"></div>
      </div>
      <div class="tm-column tm-column--backlog" data-status="backlog">
        <div class="tm-column-header">
          <span class="tm-column-title"><i class="fas fa-inbox"></i> Backlog</span>
          <span class="tm-column-count" data-count="backlog">0</span>
          <button class="tm-col-chevron" aria-expanded="true" aria-label="Toggle column"><i class="fas fa-chevron-down"></i></button>
        </div>
        <div class="tm-column-summary" data-summary="backlog"></div>
        <div class="tm-column-cards" data-col="backlog"></div>
      </div>
      <div class="tm-column tm-column--todo" data-status="todo">
        <div class="tm-column-header">
          <span class="tm-column-title"><i class="fas fa-clipboard-list"></i> To Do</span>
          <span class="tm-column-count" data-count="todo">0</span>
          <button class="tm-col-chevron" aria-expanded="true" aria-label="Toggle column"><i class="fas fa-chevron-down"></i></button>
        </div>
        <div class="tm-column-summary" data-summary="todo"></div>
        <div class="tm-column-cards" data-col="todo"></div>
      </div>
      <div class="tm-column tm-column--in-progress" data-status="in-progress">
        <div class="tm-column-header">
          <span class="tm-column-title"><i class="fas fa-spinner"></i> In Progress</span>
          <span class="tm-column-count" data-count="in-progress">0</span>
          <button class="tm-col-chevron" aria-expanded="true" aria-label="Toggle column"><i class="fas fa-chevron-down"></i></button>
        </div>
        <div class="tm-column-summary" data-summary="in-progress"></div>
        <div class="tm-column-cards" data-col="in-progress"></div>
      </div>
      <div class="tm-column tm-column--review" data-status="review">
        <div class="tm-column-header">
          <span class="tm-column-title"><i class="fas fa-eye"></i> Review</span>
          <span class="tm-column-count" data-count="review">0</span>
          <button class="tm-col-chevron" aria-expanded="true" aria-label="Toggle column"><i class="fas fa-chevron-down"></i></button>
        </div>
        <div class="tm-column-summary" data-summary="review"></div>
        <div class="tm-column-cards" data-col="review"></div>
      </div>
      <div class="tm-column tm-column--done" data-status="done">
        <div class="tm-column-header">
          <span class="tm-column-title"><i class="fas fa-check-circle"></i> Done</span>
          <span class="tm-column-count" data-count="done">0</span>
          <button class="tm-col-chevron" aria-expanded="true" aria-label="Toggle column"><i class="fas fa-chevron-down"></i></button>
        </div>
        <div class="tm-column-summary" data-summary="done"></div>
        <div class="tm-column-cards" data-col="done"></div>
      </div>
    </div>

    <!-- List View -->
    <div class="tm-list" id="tm-list">
      <table class="tm-list-table">
        <thead>
          <tr>
            <th>Task</th>
            <th>Status</th>
            <th>Priority</th>
            <th>Assignee</th>
            <th>Division</th>
            <th>Due</th>
          </tr>
        </thead>
        <tbody id="tm-list-body"></tbody>
      </table>
    </div>

    <!-- Archive Panel (lazy-loaded) -->
    <div class="tm-archive-panel" id="tm-archive-panel">
      <div class="tm-archive-stats" id="tm-archive-stats"></div>
      <div id="tm-archive-content">
        <button class="tm-archive-load-btn" id="btn-load-archive"><i class="fas fa-cloud-download-alt" style="margin-right:4px;"></i>Load Archive from Server</button>
      </div>
    </div>

    <!-- Task Modal (Create / Edit) -->
    <div class="tm-modal-overlay" id="task-modal">
      <div class="tm-modal">
        <div class="tm-modal-header">
          <h2 class="tm-modal-title" id="modal-title">New Task</h2>
          <button class="tm-modal-close" id="modal-close"><i class="fas fa-times"></i></button>
        </div>
        <div class="tm-modal-body">
          <input type="hidden" id="task-id" />

          <label for="task-title">Title</label>
          <input type="text" id="task-title" placeholder="Task title..." />

          <label for="task-desc">Description</label>
          <textarea id="task-desc" placeholder="What needs to be done..."></textarea>

          <label for="task-priority">Priority</label>
          <select id="task-priority">
            <option value="low">Low</option>
            <option value="medium" selected>Medium</option>
            <option value="high">High</option>
            <option value="critical">Critical</option>
          </select>

          <div class="tm-modal-row">
            <div>
              <label for="task-due">Due Date</label>
              <input type="date" id="task-due" />
            </div>
            <div>
              <label for="task-risk">Risk Level</label>
              <select id="task-risk">
                <option value="none">None</option>
                <option value="low">Low</option>
                <option value="medium">Medium</option>
                <option value="high">High</option>
              </select>
            </div>
          </div>

          <div id="nova-triage-hint" style="padding:0.5rem 0.6rem; margin:0.3rem 0 0.5rem; border-radius:6px; background:rgba(78,205,196,0.06); border:1px solid rgba(78,205,196,0.15); font-size:0.62rem; color:rgba(255,255,255,0.5); display:none;">
            <i class="fas fa-robot" style="color:#4ecdc4; margin-right:4px;"></i>
            <strong style="color:#4ecdc4;">Nova will triage this task</strong> — assign it to the right agent and add delegation context.
          </div>

          <!-- Edit-only fields (hidden during creation, shown when editing) -->
          <div id="edit-only-fields" style="display:none;">
            <label for="task-status">Status</label>
            <select id="task-status">
              <option value="todo" selected>To Do</option>
              <option value="backlog">Backlog</option>
              <option value="pending-approval">Pending Approval</option>
              <option value="in-progress">In Progress</option>
              <option value="review">Review</option>
              <option value="done">Done</option>
            </select>

            <div class="tm-modal-row">
              <div>
                <label for="task-assignee">Assignee</label>
                <select id="task-assignee">
                  <option value="">Unassigned (Nova triages)</option>
                </select>
              </div>
              <div>
                <label for="task-division">Division</label>
                <select id="task-division">
                  <option value="">None</option>
                </select>
              </div>
            </div>
          </div>

          <!-- Related Tasks (only in edit mode) -->
          <div id="tm-related-tasks" style="display:none;"></div>

          <!-- Comments (only in edit mode) -->
          <div class="tm-comments" id="task-comments" style="display:none;">
            <h4><i class="fas fa-comments" style="margin-right:4px;"></i>Comments</h4>
            <div id="task-comments-list"></div>
            <div class="tm-comment-add">
              <input type="text" id="task-comment-input" placeholder="Add a comment..." />
              <button id="btn-add-comment"><i class="fas fa-paper-plane"></i></button>
            </div>
          </div>
        </div>
        <div class="tm-modal-footer">
          <button class="tm-btn" id="btn-delete-task" style="margin-right:auto; color:#f87171; border-color:rgba(248,113,113,0.2); display:none;">
            <i class="fas fa-trash"></i> Delete
          </button>
          <button class="tm-btn" id="btn-cancel-task">Cancel</button>
          <button class="tm-btn tm-btn--primary" id="btn-save-task"><i class="fas fa-check"></i> Save</button>
        </div>
      </div>
    </div>

  </main>

  <script src="/js/priority-audit.js"></script>
  <script src="/js/priority-engine.js"></script>
  <script src="/js/task-verifier.js"></script>
  <script src="/js/company-store.js"></script>
  <script src="/js/agent-engine.js"></script>
  <script src="/modules/company/js/quick-chat.js"></script>
  <script>
    (function () {
      'use strict';

      // Local date helper (avoids UTC timezone shift causing false overdue)
      function _localToday() {
        var d = new Date();
        return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
      }

      var agents = [];
      var allDivisions = [];
      var currentView = 'board';
      var filterAssignee = '';
      var filterPriority = '';
      var filterDivision = '';
      var filterSearch = '';

      // Collapsed columns state
      var _defaultCollapsed = { 'pending-approval': false, backlog: false, todo: false, 'in-progress': false, review: false, done: true };
      var _collapsedCols = {};
      try { _collapsedCols = JSON.parse(localStorage.getItem('ap_tasks_collapsed_columns')) || {}; } catch (e) {}
      // Merge defaults for any missing keys
      Object.keys(_defaultCollapsed).forEach(function (k) {
        if (typeof _collapsedCols[k] === 'undefined') _collapsedCols[k] = _defaultCollapsed[k];
      });
      function _saveCollapsedCols() { localStorage.setItem('ap_tasks_collapsed_columns', JSON.stringify(_collapsedCols)); }

      // Signal filter mode
      var _signalFilter = localStorage.getItem('ap_tasks_filter_mode') || 'all';
      var _viewPreset = localStorage.getItem('ap_tasks_view_preset') || 'default';
      var _currentAgentId = '';

      // Try to resolve current user identity for "My Tasks" filter
      try {
        fetch('/.auth/me').then(function (r) { return r.json(); }).then(function (d) {
          if (d && d.clientPrincipal && d.clientPrincipal.userId) {
            _currentAgentId = d.clientPrincipal.userDetails || d.clientPrincipal.userId;
          }
        }).catch(function () {});
      } catch (e) {}

      // DOM refs
      var board = document.getElementById('tm-board');
      var listView = document.getElementById('tm-list');
      var listBody = document.getElementById('tm-list-body');
      var statsBar = document.getElementById('tm-stats');
      var modal = document.getElementById('task-modal');

      // ── Init ──
      // Re-render when server sync pulls in agent-created tasks
      AgentEngine.on('sync-complete', function () { renderAll(); });

      // Re-render after CompanyStore server sync
      window.addEventListener('companystoreready', function () { renderAll(); });

      AgentEngine.loadRegistry().then(function (data) {
        if (!data || !data.agents) return;
        agents = data.agents;

        // Populate agent filter + assignee dropdown
        var filterAssigneeEl = document.getElementById('filter-assignee');
        var taskAssigneeEl = document.getElementById('task-assignee');
        var filterDivisionEl = document.getElementById('filter-division');
        var taskDivisionEl = document.getElementById('task-division');

        agents.forEach(function (a) {
          filterAssigneeEl.innerHTML += '<option value="' + a.id + '">' + a.name + ' (' + a.role + ')</option>';
          taskAssigneeEl.innerHTML += '<option value="' + a.id + '">' + a.name + ' — ' + a.role + '</option>';

          // Collect divisions
          if (a.divisions) {
            a.divisions.forEach(function (d) {
              allDivisions.push({ id: d.id, name: d.name, icon: d.icon, agentId: a.id, agentName: a.name });
              filterDivisionEl.innerHTML += '<option value="' + d.id + '">' + d.name + ' (' + a.name + ')</option>';
              taskDivisionEl.innerHTML += '<option value="' + d.id + '">' + d.name + ' — ' + a.name + '</option>';
            });
          }
        });

        renderAll();
      });

      // ── Render ──
      function renderAll() {
        // Priority Engine v1 — recalculate before render
        try { PriorityEngine.recalculateAll(AgentEngine.getTasks()); } catch (e) { /* fail closed */ }
        renderTaskIntel();
        renderStats();
        renderBoard();
        renderList();
      }

      // ── Task Intelligence ──
      function renderTaskIntel() {
        var el = document.getElementById('tm-intel-alerts');
        if (!el) return;
        var tasks = AgentEngine.getTasks();
        var nowMs = Date.now();
        var dayMs = 86400000;
        var today = _localToday();
        var alerts = [];

        // Single pass: gather column stats + agent load + objective freshness
        var colStats = {};
        var agentLoad = {};
        var objLastActivity = {}; // objectiveId → newest updatedAt ms
        var cols = ['pending-approval', 'backlog', 'todo', 'in-progress', 'review'];

        tasks.forEach(function (t) {
          var isDone = t.status === 'done';

          // Column bottleneck (exclude done)
          if (!isDone && cols.indexOf(t.status) !== -1) {
            if (!colStats[t.status]) colStats[t.status] = { count: 0, oldestAge: 0 };
            colStats[t.status].count++;
            if (t.createdAt) {
              var age = nowMs - new Date(t.createdAt).getTime();
              if (!isNaN(age) && age > colStats[t.status].oldestAge) colStats[t.status].oldestAge = age;
            }
          }

          // Agent overload (active tasks only)
          if (!isDone && t.assignee) {
            agentLoad[t.assignee] = (agentLoad[t.assignee] || 0) + 1;
          }

          // Objective stagnation via directive linkage (skip done + pending-approval)
          if (t.directive_id && t.updatedAt && t.status !== 'done' && t.status !== 'pending-approval') {
            var ts = new Date(t.updatedAt).getTime();
            if (!isNaN(ts)) {
              if (!objLastActivity[t.directive_id] || ts > objLastActivity[t.directive_id]) {
                objLastActivity[t.directive_id] = ts;
              }
            }
          }
        });

        // 1) Column Bottleneck — show worst column only
        var worstCol = null;
        var worstSeverity = 0; // 0=none, 1=amber, 2=red
        var colLabels = { 'pending-approval': 'Pending Approval', backlog: 'Backlog', todo: 'To Do', 'in-progress': 'In Progress', review: 'Review' };
        cols.forEach(function (status) {
          var s = colStats[status];
          if (!s) return;
          var ageDays = Math.floor(s.oldestAge / dayMs);
          var sev = 0;
          if (s.count >= 10 || ageDays >= 14) sev = 2;
          else if (s.count >= 6 || ageDays >= 7) sev = 1;
          if (sev > worstSeverity
            || (sev === worstSeverity && worstCol && ageDays > worstCol.ageDays)
            || (sev === worstSeverity && worstCol && ageDays === worstCol.ageDays && s.count > worstCol.count)) {
            worstSeverity = sev;
            worstCol = { status: status, count: s.count, ageDays: ageDays };
          }
        });
        if (worstCol && worstSeverity > 0) {
          var cls = worstSeverity === 2 ? 'tm-intel-alert--red' : 'tm-intel-alert--amber';
          var icon = worstSeverity === 2 ? 'fas fa-exclamation-circle' : 'fas fa-exclamation-triangle';
          alerts.push('<div class="tm-intel-alert ' + cls + '"><i class="' + icon + '"></i><span>' + colLabels[worstCol.status] + ' column accumulating tasks (' + worstCol.count + ' items, oldest ' + worstCol.ageDays + 'd)</span></div>');
        }

        // 2) Agent Overload — show worst agent only
        var worstAgent = null;
        var worstAgentCount = 0;
        Object.keys(agentLoad).forEach(function (agentId) {
          if (agentLoad[agentId] > worstAgentCount) {
            worstAgentCount = agentLoad[agentId];
            worstAgent = agentId;
          }
        });
        if (worstAgent && worstAgentCount >= 7) {
          var agentObj = null;
          for (var i = 0; i < agents.length; i++) { if (agents[i].id === worstAgent) { agentObj = agents[i]; break; } }
          var agentName = agentObj ? agentObj.name : worstAgent;
          var agentCls = worstAgentCount >= 10 ? 'tm-intel-alert--red' : 'tm-intel-alert--amber';
          var agentIcon = worstAgentCount >= 10 ? 'fas fa-exclamation-circle' : 'fas fa-user-clock';
          alerts.push('<div class="tm-intel-alert ' + agentCls + '"><i class="' + agentIcon + '"></i><span>' + escapeHtml(agentName) + ' has ' + worstAgentCount + ' active tasks</span></div>');
        }

        // 3) Objective Stagnation via directives
        try {
          var directives = typeof AgentEngine.getDirectives === 'function' ? AgentEngine.getDirectives() : [];
          directives.forEach(function (dir) {
            var lastMs = objLastActivity[dir.id];
            if (!lastMs) return;
            var staleDays = Math.floor((nowMs - lastMs) / dayMs);
            if (staleDays >= 4) {
              alerts.push('<div class="tm-intel-alert tm-intel-alert--amber"><i class="fas fa-hourglass-end"></i><span>' + escapeHtml(dir.title || dir.id) + ' shows no progress in ' + staleDays + ' days</span></div>');
            }
          });
        } catch (e) {}

        // Also check objectives with linkedTasks
        try {
          var objectives = typeof AgentEngine.getObjectives === 'function' ? AgentEngine.getObjectives() : [];
          objectives.forEach(function (obj) {
            if (!obj.linkedTasks || obj.linkedTasks.length === 0) return;
            var newestMs = 0;
            tasks.forEach(function (t) {
              if (obj.linkedTasks.indexOf(t.id) !== -1 && t.updatedAt && t.status !== 'done' && t.status !== 'pending-approval') {
                var ts = new Date(t.updatedAt).getTime();
                if (!isNaN(ts) && ts > newestMs) newestMs = ts;
              }
            });
            if (newestMs === 0) return;
            var staleDays = Math.floor((nowMs - newestMs) / dayMs);
            if (staleDays >= 4) {
              alerts.push('<div class="tm-intel-alert tm-intel-alert--amber"><i class="fas fa-bullseye"></i><span>' + escapeHtml(obj.title || obj.id) + ' objective shows no progress in ' + staleDays + ' days</span></div>');
            }
          });
        } catch (e) {}

        el.innerHTML = alerts.join('');
      }

      function getFilteredTasks(applySignal) {
        var tasks = AgentEngine.getTasks();
        if (filterSearch) {
          var q = filterSearch.toLowerCase();
          tasks = tasks.filter(function (t) {
            var haystack = ((t.title || '') + ' ' + (t.description || '') + ' ' + (t.assignee || '') + ' ' + (t.priority || '') + ' ' + (t.status || '') + ' ' + (t.tags || []).join(' ')).toLowerCase();
            return haystack.indexOf(q) !== -1;
          });
        }
        if (filterAssignee) {
          tasks = tasks.filter(function (t) { return t.assignee === filterAssignee; });
        }
        if (filterPriority) {
          tasks = tasks.filter(function (t) { return t.priority === filterPriority; });
        }
        if (filterDivision) {
          tasks = tasks.filter(function (t) { return t.division === filterDivision; });
        }
        // Signal filters (board view only)
        if (applySignal && _signalFilter !== 'all') {
          var nowMs = Date.now();
          var dayMs = 86400000;
          var today = _localToday();
          tasks = tasks.filter(function (t) {
            if (_signalFilter === 'aging') {
              return t.createdAt && (nowMs - new Date(t.createdAt).getTime()) > 5 * dayMs;
            }
            if (_signalFilter === 'overdue') {
              return t.dueDate && t.dueDate < today && t.status !== 'done';
            }
            if (_signalFilter === 'blocked') {
              return t.blocked || t.escalated || (t.tags && t.tags.indexOf('blocked') !== -1);
            }
            if (_signalFilter === 'mytasks') {
              return t.assignee && t.assignee === _currentAgentId;
            }
            return true;
          });
        }
        return tasks;
      }

      function renderStats() {
        var stats = AgentEngine.getTaskStats();
        var pendingCount = AgentEngine.getTasks().filter(function(t){ return t.status === 'pending-approval'; }).length;
        statsBar.innerHTML =
          statCard(stats.total, 'Total', '') +
          (pendingCount > 0 ? statCard(pendingCount, 'Pending', 'tm-stat--pending') : '') +
          statCard(stats.backlog, 'Backlog', '') +
          statCard(stats.todo + stats['in-progress'], 'Active', 'tm-stat--active') +
          statCard(stats.review, 'Review', '') +
          statCard(stats.done, 'Done', '') +
          statCard(stats.overdue, 'Overdue', 'tm-stat--overdue') +
          statCard(stats.unassigned, 'Unassigned', '');
      }

      function statCard(val, label, cls) {
        return '<div class="tm-stat ' + cls + '"><div class="tm-stat-value">' + val + '</div><div class="tm-stat-label">' + label + '</div></div>';
      }

      function riskPill(task) {
        if (!task.risk_level || task.risk_level === 'none') return '';
        var cls = 'task-risk-pill task-risk-pill--' + task.risk_level;
        return '<span class="' + cls + '">' + task.risk_level + '</span>';
      }

      // Verification Gate v1 — badge helper
      function _verifyBadgeHtml(task) {
        if (!TaskVerifier || !TaskVerifier.isLoaded()) return '';
        var b = TaskVerifier.getBadge(task);
        if (!b) return '';
        return '<span class="verify-badge ' + b.cls + '" title="' + b.label + '"><i class="' + b.icon + '"></i> ' + b.label + '</span>';
      }

      // Verification Gate v1 — toast notification
      var _toastEl = null;
      var _toastTimer = null;
      function _showVerifyToast(msg, type) {
        if (!_toastEl) {
          _toastEl = document.createElement('div');
          _toastEl.className = 'verify-toast';
          document.body.appendChild(_toastEl);
        }
        var isNotice = type === 'notice';
        _toastEl.className = 'verify-toast' + (isNotice ? ' verify-toast--notice' : '');
        var icon = isNotice ? 'fas fa-circle-info' : 'fas fa-shield-halved';
        _toastEl.innerHTML = '<i class="' + icon + '" style="margin-right:6px;"></i>' + (msg || 'Verification failed');
        _toastEl.classList.add('show');
        clearTimeout(_toastTimer);
        _toastTimer = setTimeout(function () { _toastEl.classList.remove('show'); }, 3500);
      }

      // v2.5 Provenance badge — shows how each task was created
      function _provenanceBadge(task) {
        var src = task.source || '';
        var srcType = (typeof src === 'object') ? (src.type || '') : String(src);
        var tags = task.tags || [];
        var createdBy = task.created_by || task.createdBy || '';
        var badges = [];

        // Auto-created: hero image task
        if (tags.indexOf('hero-image') !== -1 && tags.indexOf('auto-created') !== -1) {
          badges.push({ icon: 'fas fa-image', label: 'Auto: Hero Image', cls: 'prov--auto-hero' });
        }
        // Auto-created: social copy task
        else if (tags.indexOf('social-copy') !== -1 && tags.indexOf('auto-created') !== -1) {
          badges.push({ icon: 'fas fa-pen-fancy', label: 'Auto: Social Copy', cls: 'prov--auto-copy' });
        }
        // Auto-created: design revision from CEO rejection
        else if (tags.indexOf('design-revision') !== -1 || srcType === 'auto:publish-rejection-design-feedback' || srcType === 'auto:ceo-design-feedback') {
          badges.push({ icon: 'fas fa-palette', label: 'Auto: Design Fix', cls: 'prov--auto-design' });
        }
        // From standup
        else if (srcType === 'standup') {
          badges.push({ icon: 'fas fa-users', label: 'Standup', cls: 'prov--standup' });
        }
        // From meeting
        else if (srcType === 'meeting') {
          badges.push({ icon: 'fas fa-video', label: 'Meeting', cls: 'prov--meeting' });
        }
        // Agent via chat
        else if (createdBy && createdBy.indexOf('(via chat)') !== -1) {
          var chatAgent = createdBy.replace(' (via chat)', '').trim();
          var _chatAg = getAgentById(chatAgent);
          badges.push({ icon: 'fas fa-comment-dots', label: 'Chat: ' + (_chatAg ? _chatAg.name : chatAgent), cls: 'prov--chat', color: _chatAg ? _chatAg.color : null });
        }
        // Agent-created via heartbeat
        else if (srcType === 'heartbeat' && createdBy && createdBy !== 'system') {
          var _ag = getAgentById(createdBy);
          badges.push({ icon: _ag ? _ag.icon : 'fas fa-robot', label: (_ag ? _ag.name : createdBy), cls: 'prov--agent', color: _ag ? _ag.color : null });
        }
        // CEO-created (no heartbeat source, not system)
        else if (srcType !== 'heartbeat' && createdBy !== 'system') {
          badges.push({ icon: 'fas fa-crown', label: 'CEO', cls: 'prov--ceo' });
        }

        // Additive: directive-linked
        if (task.directive_id) {
          badges.push({ icon: 'fas fa-bullhorn', label: 'Directive', cls: 'prov--directive' });
        }
        // Additive: objective-linked
        if (task.objective_id) {
          badges.push({ icon: 'fas fa-bullseye', label: 'Objective', cls: 'prov--objective' });
        }

        if (badges.length === 0) return '';
        return '<div class="tm-prov-row">' + badges.map(function (b) {
          var style = b.color ? ' style="border-color:' + b.color + '33; color:' + b.color + ';"' : '';
          return '<span class="tm-prov ' + b.cls + '"' + style + ' title="' + escapeHtml(b.label) + '"><i class="' + b.icon + '"></i> ' + escapeHtml(b.label) + '</span>';
        }).join('') + '</div>';
      }

      // v2.5 Related task badge — shows parent/children count on card
      function _relatedBadge(task, allTasks) {
        var parts = [];
        if (task.parent_task_id) {
          var parent = allTasks.find(function (t) { return t.id === task.parent_task_id; });
          parts.push('<span class="tm-related tm-related--parent" title="Parent: ' + escapeHtml(parent ? parent.title : task.parent_task_id) + '"><i class="fas fa-arrow-up"></i> ' + escapeHtml(parent ? parent.title.substring(0, 25) : 'Parent') + '</span>');
        }
        var children = allTasks.filter(function (t) { return t.parent_task_id === task.id; });
        if (children.length > 0) {
          parts.push('<span class="tm-related tm-related--children" title="' + children.length + ' child task' + (children.length > 1 ? 's' : '') + '"><i class="fas fa-arrow-down"></i> ' + children.length + ' child' + (children.length > 1 ? 'ren' : '') + '</span>');
        }
        if (parts.length === 0) return '';
        return '<div class="tm-related-row">' + parts.join('') + '</div>';
      }

      // Priority Engine v1 — pill helper
      function _priorityPillHtml(task) {
        var cached = PriorityEngine.getCached(task.id);
        if (!cached) return '';
        var b = cached.bucket;
        var icons = { low: 'fas fa-minus', medium: 'fas fa-equals', high: 'fas fa-arrow-up', critical: 'fas fa-fire' };
        var labels = { low: 'Low', medium: 'Med', high: 'High', critical: 'Crit' };
        return '<span class="priority-pill priority-pill--' + b + '" title="Priority: ' + b + '"><i class="' + (icons[b] || 'fas fa-minus') + '"></i> ' + (labels[b] || b) + '</span>';
      }

      // Load verification templates
      TaskVerifier.load();

      function renderBoard() {
        var tasks = getFilteredTasks(true);
        var cols = ['pending-approval', 'backlog', 'todo', 'in-progress', 'review', 'done'];
        var today = _localToday();
        var nowMs = Date.now();
        var dayMs = 86400000;

        cols.forEach(function (status) {
          var container = document.querySelector('[data-col="' + status + '"]');
          var countEl = document.querySelector('[data-count="' + status + '"]');
          var summaryEl = document.querySelector('[data-summary="' + status + '"]');
          var colTasks = tasks.filter(function (t) { return t.status === status; });

          // Sort: critical first, then by date
          colTasks.sort(function (a, b) {
            var prioOrder = { critical: 0, high: 1, medium: 2, low: 3 };
            return (prioOrder[a.priority] || 2) - (prioOrder[b.priority] || 2);
          });

          countEl.textContent = colTasks.length;
          container.innerHTML = '';

          // Column summary
          if (colTasks.length === 0) {
            summaryEl.innerHTML = '';
            container.innerHTML = '<div class="tm-empty">No tasks</div>';
            return;
          }

          var oldestAge = 0;
          var overdueCount = 0;
          var blockedCount = 0;
          colTasks.forEach(function (t) {
            if (t.createdAt) {
              var age = nowMs - new Date(t.createdAt).getTime();
              if (!isNaN(age) && age > oldestAge) oldestAge = age;
            }
            if (t.dueDate && t.dueDate < today && t.status !== 'done') overdueCount++;
            if (t.blocked || t.escalated || (t.tags && t.tags.indexOf('blocked') !== -1)) blockedCount++;
          });

          var summaryHtml = '';
          var oldestDays = Math.floor(oldestAge / dayMs);
          if (oldestDays > 0) summaryHtml += '<div class="tm-column-summary-line"><i class="fas fa-clock"></i> Oldest: ' + oldestDays + 'd</div>';
          if (overdueCount > 0) summaryHtml += '<div class="tm-column-summary-line tm-summary-overdue"><i class="fas fa-exclamation-circle"></i> ' + overdueCount + ' overdue</div>';
          if (blockedCount > 0) summaryHtml += '<div class="tm-column-summary-line tm-summary-blocked"><i class="fas fa-ban"></i> ' + blockedCount + ' blocked</div>';
          summaryEl.innerHTML = summaryHtml;

          colTasks.forEach(function (task) {
            container.appendChild(createTaskCard(task, nowMs, dayMs, tasks));
          });
        });
      }

      function createTaskCard(task, nowMs, dayMs, allTasks) {
        var card = document.createElement('div');
        var agingClass = '';
        if (task.createdAt && nowMs && dayMs && task.status !== 'done') {
          var ageDays = (nowMs - new Date(task.createdAt).getTime()) / dayMs;
          if (ageDays > 10) agingClass = ' tm-card--age-critical';
          else if (ageDays > 5) agingClass = ' tm-card--age-warn';
        }
        card.className = 'tm-card' + agingClass;
        card.setAttribute('draggable', 'true');
        card.setAttribute('data-task-id', task.id);

        var agent = task.assignee ? getAgentById(task.assignee) : null;
        var div = task.division ? getDivisionById(task.division) : null;
        var today = _localToday();
        var isOverdue = task.dueDate && task.dueDate.substring(0,10) < today && task.status !== 'done';

        var meta = '<div class="tm-card-meta">';
        meta += '<span class="tm-card-priority tm-card-priority--' + task.priority + '">' + task.priority + '</span>';

        if (agent) {
          meta += '<span class="tm-card-assignee" style="--agent-color:' + agent.color + '"><i class="' + agent.icon + '"></i> ' + agent.name + '</span>';
        }

        if (task.comments && task.comments.length > 0) {
          meta += '<span class="tm-card-comments"><i class="fas fa-comment"></i> ' + task.comments.length + '</span>';
        }

        if (task.dueDate) {
          meta += '<span class="tm-card-due ' + (isOverdue ? 'overdue' : '') + '"><i class="fas fa-calendar"></i> ' + formatDate(task.dueDate) + '</span>';
        }

        meta += '</div>';

        if (div) {
          meta += '<div class="tm-card-division"><i class="' + div.icon + '"></i> ' + div.name + '</div>';
        }

        var badge = riskPill(task);
        var vBadge = _verifyBadgeHtml(task);
        var pPill = _priorityPillHtml(task);

        // v2.5 Provenance + related task badges
        var provHtml = _provenanceBadge(task);
        var relHtml = _relatedBadge(task, allTasks || []);

        card.innerHTML = '<div class="tm-card-title">' + escapeHtml(task.title) + badge + vBadge + pPill + '</div>' + meta + provHtml + relHtml;

        card.addEventListener('click', function () { openEditModal(task.id); });

        // Drag events
        card.addEventListener('dragstart', function (e) {
          e.dataTransfer.setData('text/plain', task.id);
          card.style.opacity = '0.4';
        });
        card.addEventListener('dragend', function () {
          card.style.opacity = '1';
        });

        return card;
      }

      function renderList() {
        var tasks = getFilteredTasks();

        // Sort: status order, then priority
        var statusOrder = { 'pending-approval': -1, 'in-progress': 0, 'review': 1, 'todo': 2, 'backlog': 3, 'done': 4 };
        var prioOrder = { critical: 0, high: 1, medium: 2, low: 3 };
        tasks.sort(function (a, b) {
          var s = (statusOrder[a.status] || 3) - (statusOrder[b.status] || 3);
          if (s !== 0) return s;
          return (prioOrder[a.priority] || 2) - (prioOrder[b.priority] || 2);
        });

        listBody.innerHTML = '';
        if (tasks.length === 0) {
          listBody.innerHTML = '<tr><td colspan="6" style="text-align:center; opacity:0.2; padding:2rem;">No tasks</td></tr>';
          return;
        }

        tasks.forEach(function (task) {
          var agent = task.assignee ? getAgentById(task.assignee) : null;
          var div = task.division ? getDivisionById(task.division) : null;
          var today = _localToday();
          var isOverdue = task.dueDate && task.dueDate.substring(0,10) < today && task.status !== 'done';

          var tr = document.createElement('tr');
          tr.innerHTML =
            '<td>' + escapeHtml(task.title) + _provenanceBadge(task) + '</td>' +
            '<td><span class="tm-list-status tm-list-status--' + task.status + '">' + formatStatus(task.status) + '</span></td>' +
            '<td><span class="tm-card-priority tm-card-priority--' + task.priority + '">' + task.priority + '</span></td>' +
            '<td>' + (agent ? '<span style="color:' + agent.color + ';">' + agent.name + '</span>' : '<span style="opacity:0.2">—</span>') + '</td>' +
            '<td>' + (div ? '<span style="opacity:0.4;">' + div.name + '</span>' : '<span style="opacity:0.2">—</span>') + '</td>' +
            '<td>' + (task.dueDate ? '<span class="' + (isOverdue ? 'overdue' : '') + '" style="font-size:0.7rem;' + (isOverdue ? 'color:#f87171;' : 'opacity:0.4;') + '">' + formatDate(task.dueDate) + '</span>' : '<span style="opacity:0.2">—</span>') + '</td>';

          tr.addEventListener('click', function () { openEditModal(task.id); });
          listBody.appendChild(tr);
        });
      }

      // ── Drag & Drop ──
      document.querySelectorAll('.tm-column').forEach(function (col) {
        col.addEventListener('dragover', function (e) {
          e.preventDefault();
          col.classList.add('drag-over');
        });
        col.addEventListener('dragleave', function () {
          col.classList.remove('drag-over');
        });
        col.addEventListener('drop', function (e) {
          e.preventDefault();
          col.classList.remove('drag-over');
          var taskId = e.dataTransfer.getData('text/plain');
          var newStatus = col.getAttribute('data-status');
          if (taskId && newStatus) {
            // Verification Gate v1.1 — lane transition hook (loose review, strict done)
            var task = AgentEngine.getTaskById ? AgentEngine.getTaskById(taskId) : null;
            if (task && (newStatus === 'review' || newStatus === 'done')) {
              var vr = TaskVerifier.verifyForTransition(task, newStatus);
              if (!vr.allowed) {
                _showVerifyToast(vr.message || 'Verification failed');
                return;
              }
              if (vr.notice) _showVerifyToast(vr.notice, 'notice');
            }
            AgentEngine.moveTask(taskId, newStatus);
            renderAll();
          }
        });
      });

      // ── Collapsible Columns (chevron only) ──
      document.querySelectorAll('.tm-column').forEach(function (col) {
        var status = col.getAttribute('data-status');
        var chevron = col.querySelector('.tm-col-chevron');
        // Apply initial collapsed state
        if (_collapsedCols[status]) {
          col.classList.add('collapsed');
          chevron.setAttribute('aria-expanded', 'false');
        }
        // Toggle on chevron click only
        chevron.addEventListener('click', function (e) {
          e.stopPropagation();
          var isCollapsed = col.classList.toggle('collapsed');
          chevron.setAttribute('aria-expanded', !isCollapsed);
          _collapsedCols[status] = isCollapsed;
          _saveCollapsedCols();
        });
        chevron.addEventListener('keydown', function (e) {
          if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); chevron.click(); }
        });
      });

      // ── Dynamic Board Height ──
      function _updateBoardHeight() {
        if (board) {
          var offset = board.getBoundingClientRect().top;
          document.documentElement.style.setProperty('--tasks-board-height', (window.innerHeight - offset - 8) + 'px');
        }
      }
      _updateBoardHeight();
      window.addEventListener('resize', _updateBoardHeight);
      window.addEventListener('orientationchange', function () { setTimeout(_updateBoardHeight, 100); });

      // ── Signal Filter Chips ──
      function _setSignalFilter(mode) {
        _signalFilter = mode;
        localStorage.setItem('ap_tasks_filter_mode', mode);
        document.querySelectorAll('.tm-signal-chip').forEach(function (chip) {
          chip.setAttribute('aria-pressed', chip.dataset.signal === mode ? 'true' : 'false');
        });
        renderBoard();
      }
      // Init chip state
      document.querySelectorAll('.tm-signal-chip').forEach(function (chip) {
        chip.setAttribute('aria-pressed', chip.dataset.signal === _signalFilter ? 'true' : 'false');
        chip.addEventListener('click', function () { _setSignalFilter(chip.dataset.signal); });
      });

      // ── View Presets ──
      var presetSelect = document.getElementById('tm-preset-select');
      function _applyPreset(preset) {
        _viewPreset = preset;
        localStorage.setItem('ap_tasks_view_preset', preset);
        presetSelect.value = preset;
        if (preset === 'ceo') {
          _setSignalFilter('overdue');
          _collapsedCols = { 'pending-approval': false, backlog: false, todo: false, 'in-progress': false, review: false, done: true };
        } else if (preset === 'execution') {
          _setSignalFilter('mytasks');
          _collapsedCols = { 'pending-approval': true, backlog: true, todo: true, 'in-progress': false, review: false, done: true };
        } else {
          _setSignalFilter('all');
          Object.keys(_defaultCollapsed).forEach(function (k) { _collapsedCols[k] = _defaultCollapsed[k]; });
        }
        _saveCollapsedCols();
        // Apply collapsed state to DOM
        document.querySelectorAll('.tm-column').forEach(function (col) {
          var st = col.getAttribute('data-status');
          var chev = col.querySelector('.tm-col-chevron');
          if (_collapsedCols[st]) { col.classList.add('collapsed'); chev.setAttribute('aria-expanded', 'false'); }
          else { col.classList.remove('collapsed'); chev.setAttribute('aria-expanded', 'true'); }
        });
        renderBoard();
      }
      presetSelect.value = _viewPreset;
      presetSelect.addEventListener('change', function () { _applyPreset(this.value); });

      // ── View Toggle ──
      var viewBoardBtn = document.getElementById('view-board');
      var viewListBtn = document.getElementById('view-list');

      viewBoardBtn.addEventListener('click', function () {
        currentView = 'board';
        board.classList.add('active');
        listView.classList.remove('active');
        viewBoardBtn.classList.add('active');
        viewListBtn.classList.remove('active');
      });

      viewListBtn.addEventListener('click', function () {
        currentView = 'list';
        board.classList.remove('active');
        listView.classList.add('active');
        viewListBtn.classList.add('active');
        viewBoardBtn.classList.remove('active');
      });

      // ── Filters ──
      document.getElementById('filter-assignee').addEventListener('change', function () {
        filterAssignee = this.value;
        renderBoard();
        renderList();
      });

      document.getElementById('filter-priority').addEventListener('change', function () {
        filterPriority = this.value;
        renderBoard();
        renderList();
      });

      document.getElementById('filter-division').addEventListener('change', function () {
        filterDivision = this.value;
        renderBoard();
        renderList();
      });

      // Text search with debounce
      var _searchTimer;
      document.getElementById('tm-search').addEventListener('input', function () {
        var self = this;
        clearTimeout(_searchTimer);
        _searchTimer = setTimeout(function () {
          filterSearch = self.value.trim();
          renderBoard();
          renderList();
        }, 150);
      });

      // ── Modal ──
      var modalTitle = document.getElementById('modal-title');
      var taskIdField = document.getElementById('task-id');
      var taskTitleField = document.getElementById('task-title');
      var taskDescField = document.getElementById('task-desc');
      var taskStatusField = document.getElementById('task-status');
      var taskPriorityField = document.getElementById('task-priority');
      var taskAssigneeField = document.getElementById('task-assignee');
      var taskDivisionField = document.getElementById('task-division');
      var taskDueField = document.getElementById('task-due');
      var taskCommentsSection = document.getElementById('task-comments');
      var taskCommentsList = document.getElementById('task-comments-list');
      var taskCommentInput = document.getElementById('task-comment-input');
      var deleteBtn = document.getElementById('btn-delete-task');

      var editOnlyFields = document.getElementById('edit-only-fields');
      var triageHint = document.getElementById('nova-triage-hint');

      function openNewModal() {
        modalTitle.textContent = 'New Task';
        taskIdField.value = '';
        taskTitleField.value = '';
        taskDescField.value = '';
        taskStatusField.value = 'todo';
        taskPriorityField.value = 'medium';
        taskAssigneeField.value = '';
        taskDivisionField.value = '';
        taskDueField.value = '';
        taskCommentsSection.style.display = 'none';
        deleteBtn.style.display = 'none';
        // Hide status/assignee/division — Nova handles these
        editOnlyFields.style.display = 'none';
        triageHint.style.display = '';
        modal.classList.add('active');
        setTimeout(function () { taskTitleField.focus(); }, 100);
      }

      function openEditModal(taskId) {
        var task = AgentEngine.getTask(taskId);
        if (!task) return;

        // Show all fields in edit mode (status/assignee/division visible)
        editOnlyFields.style.display = '';
        triageHint.style.display = 'none';

        modalTitle.textContent = 'Edit Task';
        taskIdField.value = task.id;
        taskTitleField.value = task.title;
        taskDescField.value = task.description || '';
        taskStatusField.value = task.status;
        taskPriorityField.value = task.priority;
        taskAssigneeField.value = task.assignee || '';
        taskDivisionField.value = task.division || '';
        taskDueField.value = task.dueDate ? String(task.dueDate).split('T')[0] : '';
        deleteBtn.style.display = '';

        // Render related tasks (parent + children)
        _renderRelatedTasks(task);

        // Render comments
        taskCommentsSection.style.display = '';
        renderComments(task);

        modal.classList.add('active');
      }

      // v2.5 Related Tasks panel in edit modal
      function _renderRelatedTasks(task) {
        var container = document.getElementById('tm-related-tasks');
        if (!container) return;
        var allTasks = AgentEngine.getTasks();
        var parts = [];

        // Parent
        if (task.parent_task_id) {
          var parent = allTasks.find(function (t) { return t.id === task.parent_task_id; });
          if (parent) {
            var pAgent = parent.assignee ? getAgentById(parent.assignee) : null;
            parts.push('<div class="tm-rel-item tm-rel-item--parent" data-task-id="' + escapeHtml(parent.id) + '">' +
              '<i class="fas fa-arrow-up" style="color:#fbbf24;font-size:0.5rem;"></i> ' +
              '<span class="tm-rel-label">Parent:</span> ' +
              '<span class="tm-rel-title">' + escapeHtml(parent.title) + '</span>' +
              (pAgent ? ' <span style="color:' + pAgent.color + ';font-size:0.6rem;">(' + pAgent.name + ')</span>' : '') +
              ' <span class="tm-rel-status tm-rel-status--' + parent.status + '">' + parent.status + '</span>' +
              '</div>');
          }
        }

        // Children
        var children = allTasks.filter(function (t) { return t.parent_task_id === task.id; });
        if (children.length > 0) {
          children.forEach(function (child) {
            var cAgent = child.assignee ? getAgentById(child.assignee) : null;
            parts.push('<div class="tm-rel-item tm-rel-item--child" data-task-id="' + escapeHtml(child.id) + '">' +
              '<i class="fas fa-arrow-down" style="color:#8b5cf6;font-size:0.5rem;"></i> ' +
              '<span class="tm-rel-label">Child:</span> ' +
              '<span class="tm-rel-title">' + escapeHtml(child.title) + '</span>' +
              (cAgent ? ' <span style="color:' + cAgent.color + ';font-size:0.6rem;">(' + cAgent.name + ')</span>' : '') +
              ' <span class="tm-rel-status tm-rel-status--' + child.status + '">' + child.status + '</span>' +
              '</div>');
          });
        }

        if (parts.length === 0) {
          container.style.display = 'none';
          container.innerHTML = '';
          return;
        }

        container.style.display = '';
        container.innerHTML = '<div class="tm-rel-header"><i class="fas fa-link"></i> Related Tasks</div>' + parts.join('');

        // Clickable navigation — open the related task
        container.querySelectorAll('.tm-rel-item').forEach(function (el) {
          el.style.cursor = 'pointer';
          el.addEventListener('click', function () {
            var relId = el.getAttribute('data-task-id');
            if (relId) openEditModal(relId);
          });
        });
      }

      function renderComments(task) {
        taskCommentsList.innerHTML = '';
        if (!task.comments || task.comments.length === 0) {
          taskCommentsList.innerHTML = '<div style="opacity:0.2; font-size:0.65rem; font-style:italic;">No comments yet</div>';
          return;
        }
        task.comments.forEach(function (c) {
          var authorId = c.agentId || c.author || null;
          var agent = authorId ? getAgentById(authorId) : null;
          var ts = c.timestamp || c.createdAt || null;
          var div = document.createElement('div');
          div.className = 'tm-comment';
          var imgHtml = '';
          if (c.imageUrl || c.thumbUrl) {
            var thumbSrc = c.thumbUrl || c.imageUrl;
            var fullSrc = c.imageUrl || c.thumbUrl;
            imgHtml = '<a href="' + escapeHtml(fullSrc) + '" target="_blank" rel="noopener" style="display:block;margin-top:6px;">' +
              '<img src="' + escapeHtml(thumbSrc) + '" alt="Generated image" ' +
              'style="max-width:220px;max-height:140px;border-radius:6px;border:1px solid rgba(255,255,255,0.1);cursor:pointer;transition:opacity 0.2s;" ' +
              'onmouseover="this.style.opacity=\'0.8\'" onmouseout="this.style.opacity=\'1\'" ' +
              'onerror="this.parentElement.style.display=\'none\'">' +
              '</a>';
          }
          div.innerHTML =
            '<div class="tm-comment-meta">' +
              (agent ? '<span style="color:' + agent.color + ';">' + agent.name + '</span>' : (authorId || 'User')) +
              ' · ' + formatTimeAgo(ts ? new Date(ts) : null) +
            '</div>' +
            '<div>' + escapeHtml(c.text) + '</div>' +
            imgHtml;
          taskCommentsList.appendChild(div);
        });
      }

      function closeModal() {
        modal.classList.remove('active');
      }

      document.getElementById('btn-new-task').addEventListener('click', openNewModal);
      document.getElementById('modal-close').addEventListener('click', closeModal);
      document.getElementById('btn-cancel-task').addEventListener('click', closeModal);

      modal.addEventListener('click', function (e) {
        if (e.target === modal) closeModal();
      });

      // Save task
      document.getElementById('btn-save-task').addEventListener('click', function () {
        var title = taskTitleField.value.trim();
        if (!title) { taskTitleField.focus(); return; }

        var data = {
          title: title,
          description: taskDescField.value.trim(),
          status: taskStatusField.value,
          priority: taskPriorityField.value,
          assignee: taskAssigneeField.value || null,
          division: taskDivisionField.value || null,
          dueDate: taskDueField.value || null
        };

        if (taskIdField.value) {
          // Verification Gate v1.1 — modal save lane check (loose review, strict done)
          var existingTask = AgentEngine.getTaskById ? AgentEngine.getTaskById(taskIdField.value) : null;
          if (existingTask && existingTask.status !== data.status && (data.status === 'review' || data.status === 'done')) {
            var merged = {};
            for (var mk in existingTask) { if (existingTask.hasOwnProperty(mk)) merged[mk] = existingTask[mk]; }
            for (var dk in data) { if (data.hasOwnProperty(dk)) merged[dk] = data[dk]; }
            var vr = TaskVerifier.verifyForTransition(merged, data.status);
            if (!vr.allowed) {
              _showVerifyToast(vr.message || 'Verification failed');
              return;
            }
            if (vr.notice) _showVerifyToast(vr.notice, 'notice');
          }
          AgentEngine.updateTask(taskIdField.value, data);
        } else {
          AgentEngine.addTask(data);
        }

        closeModal();
        renderAll();
      });

      // Delete task
      deleteBtn.addEventListener('click', function () {
        if (taskIdField.value) {
          AgentEngine.deleteTask(taskIdField.value);
          closeModal();
          renderAll();
        }
      });

      // Add comment
      document.getElementById('btn-add-comment').addEventListener('click', function () {
        var text = taskCommentInput.value.trim();
        if (!text || !taskIdField.value) return;
        var task = AgentEngine.addTaskComment(taskIdField.value, { text: text });
        taskCommentInput.value = '';
        if (task) renderComments(task);
      });

      taskCommentInput.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') {
          document.getElementById('btn-add-comment').click();
        }
      });

      // Auto-set division when assignee changes
      taskAssigneeField.addEventListener('change', function () {
        var agentId = this.value;
        if (!agentId) return;
        var agent = getAgentById(agentId);
        if (agent && agent.divisions && agent.divisions.length > 0 && !taskDivisionField.value) {
          taskDivisionField.value = agent.divisions[0].id;
        }
      });

      // ── Helpers ──
      function getAgentById(id) {
        for (var i = 0; i < agents.length; i++) {
          if (agents[i].id === id) return agents[i];
        }
        return null;
      }

      function getDivisionById(id) {
        for (var i = 0; i < allDivisions.length; i++) {
          if (allDivisions[i].id === id) return allDivisions[i];
        }
        return null;
      }

      function formatStatus(s) {
        return s.replace(/-/g, ' ').replace(/\b\w/g, function (c) { return c.toUpperCase(); });
      }

      function formatDate(d) {
        if (!d) return '—';
        // Handle both 'YYYY-MM-DD' and full ISO datetime strings
        var dateStr = String(d).split('T')[0];
        var dt = new Date(dateStr + 'T00:00:00');
        if (isNaN(dt.getTime())) return '—';
        return dt.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
      }

      function formatTimeAgo(date) {
        if (!date || isNaN(date.getTime())) return '';
        var diff = Date.now() - date.getTime();
        var mins = Math.floor(diff / 60000);
        if (mins < 1) return 'just now';
        if (mins < 60) return mins + 'm ago';
        var hours = Math.floor(mins / 60);
        if (hours < 24) return hours + 'h ago';
        var days = Math.floor(hours / 24);
        return days + 'd ago';
      }

      function escapeHtml(str) {
        var div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
      }

      // ── Tab Switching: Active / Archive ──
      var _activeTab = 'active';
      var _archiveData = null;
      var tabActiveBtn = document.getElementById('tab-active');
      var tabArchiveBtn = document.getElementById('tab-archive');
      var archivePanel = document.getElementById('tm-archive-panel');
      var archiveContent = document.getElementById('tm-archive-content');
      var archiveStats = document.getElementById('tm-archive-stats');
      var archiveCountEl = document.getElementById('archive-count');
      var filtersEl = document.querySelector('.tm-filters');
      var signalBar = document.getElementById('tm-signal-bar');
      var intelAlerts = document.getElementById('tm-intel-alerts');

      function _switchTab(tab) {
        _activeTab = tab;
        tabActiveBtn.classList.toggle('active', tab === 'active');
        tabArchiveBtn.classList.toggle('active', tab === 'archive');
        // Active tab elements
        var showActive = tab === 'active';
        board.style.display = showActive && currentView === 'board' ? '' : 'none';
        listView.style.display = showActive && currentView === 'list' ? '' : 'none';
        if (filtersEl) filtersEl.style.display = showActive ? '' : 'none';
        if (signalBar) signalBar.style.display = showActive ? '' : 'none';
        if (intelAlerts) intelAlerts.style.display = showActive ? '' : 'none';
        // Archive panel
        archivePanel.classList.toggle('active', tab === 'archive');
        if (tab === 'active') {
          board.classList.toggle('active', currentView === 'board');
          listView.classList.toggle('active', currentView === 'list');
        }
      }

      tabActiveBtn.addEventListener('click', function () { _switchTab('active'); });
      tabArchiveBtn.addEventListener('click', function () { _switchTab('archive'); });

      // Lazy-load archive
      document.getElementById('btn-load-archive').addEventListener('click', function () {
        var btn = this;
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin" style="margin-right:4px;"></i>Loading...';
        CompanyStore.getState('ap_tasks_archive', []).then(function (data) {
          _archiveData = Array.isArray(data) ? data : [];
          _renderArchive();
          if (archiveCountEl) archiveCountEl.textContent = _archiveData.length ? '(' + _archiveData.length + ')' : '';
        }).catch(function (err) {
          archiveContent.innerHTML = '<div class="tm-archive-empty">Failed to load archive: ' + (err.message || err) + '</div>';
        });
      });

      function _renderArchive() {
        if (!_archiveData || _archiveData.length === 0) {
          archiveStats.innerHTML = '';
          archiveContent.innerHTML = '<div class="tm-archive-empty">No archived tasks yet. Tasks completed more than 7 days ago will appear here.</div>';
          return;
        }
        // Stats
        var byAgent = {};
        _archiveData.forEach(function (t) {
          var a = t.assignee || 'unassigned';
          byAgent[a] = (byAgent[a] || 0) + 1;
        });
        var statsHtml = '<span><i class="fas fa-archive" style="margin-right:3px;"></i>' + _archiveData.length + ' archived</span>';
        Object.keys(byAgent).sort(function (a, b) { return byAgent[b] - byAgent[a]; }).slice(0, 4).forEach(function (agentId) {
          var agent = getAgentById(agentId);
          var name = agent ? agent.name : agentId;
          statsHtml += '<span>' + escapeHtml(name) + ': ' + byAgent[agentId] + '</span>';
        });
        archiveStats.innerHTML = statsHtml;

        // Table (newest first)
        var sorted = _archiveData.slice().sort(function (a, b) {
          return new Date(b.completedAt || b.archivedAt || 0).getTime() - new Date(a.completedAt || a.archivedAt || 0).getTime();
        });
        var html = '<table class="tm-archive-table"><thead><tr><th>Task</th><th>Assignee</th><th>Priority</th><th>Completed</th><th>Comments</th></tr></thead><tbody>';
        sorted.forEach(function (t) {
          var agent = t.assignee ? getAgentById(t.assignee) : null;
          var agentHtml = agent ? '<span style="color:' + agent.color + ';">' + agent.name + '</span>' : (t.assignee || '<span style="opacity:0.2;">\u2014</span>');
          var completedStr = t.completedAt ? formatDate(t.completedAt) : '\u2014';
          var lastNote = t.lastComment ? escapeHtml((t.lastComment.author || '') + ': ' + (t.lastComment.text || '').substring(0, 60)) : '';
          html += '<tr title="' + escapeHtml(t.description || '') + '">' +
            '<td>' + escapeHtml(t.title) + '</td>' +
            '<td>' + agentHtml + '</td>' +
            '<td><span class="tm-card-priority tm-card-priority--' + (t.priority || 'medium') + '">' + (t.priority || 'medium') + '</span></td>' +
            '<td style="font-size:0.65rem;opacity:0.5;">' + completedStr + '</td>' +
            '<td style="font-size:0.6rem;opacity:0.35;">' + (t.commentCount || 0) + (lastNote ? ' \u2014 ' + lastNote : '') + '</td>' +
            '</tr>';
        });
        html += '</tbody></table>';
        archiveContent.innerHTML = html;
      }
    })();
  </script>

  <script>
    // Write-status check: show banner if server writes are failing
    (function () {
      var banner = document.getElementById('write-status-banner');
      var msgEl = document.getElementById('write-status-msg');
      var keyInput = document.getElementById('write-key-input');
      var keyBtn = document.getElementById('write-key-save');
      if (!banner || typeof CompanyStore === 'undefined' || !CompanyStore.getWriteStatus) return;

      function checkWrite() {
        var ws = CompanyStore.getWriteStatus();
        if (ws.mode !== 'server') { banner.style.display = 'none'; return; }
        if (ws.failCount > 0) {
          banner.style.display = '';
          banner.style.background = 'rgba(239,68,68,0.1)';
          banner.style.borderColor = 'rgba(239,68,68,0.25)';
          banner.style.color = '#f87171';
          msgEl.textContent = 'Server writes failing (' + ws.lastError + ') — tasks created here won\'t reach agents.';
        } else if (!ws.canWrite) {
          banner.style.display = '';
          banner.style.background = 'rgba(251,191,36,0.1)';
          banner.style.borderColor = 'rgba(251,191,36,0.25)';
          banner.style.color = '#fbbf24';
          msgEl.textContent = 'Not authenticated — sign in so tasks reach agents, or enter write key.';
        } else {
          banner.style.display = 'none';
        }
      }

      keyBtn.addEventListener('click', function () {
        var key = keyInput.value.trim();
        if (!key) return;
        CompanyStore.setWriteKey(key);
        // Also set for CompanyStoreAdapter if available
        if (typeof CompanyStoreAdapter !== 'undefined' && CompanyStoreAdapter.setKey) {
          CompanyStoreAdapter.setKey(key);
        }
        keyInput.value = '';
        banner.style.display = 'none';
        // Force a sync push of current local tasks to server with new key
        var tasks = CompanyStore.getStateSync('ap_tasks', []);
        if (tasks.length > 0) {
          CompanyStore.setStateSync('ap_tasks', tasks);
          console.log('[Tasks] Re-pushed', tasks.length, 'tasks to server with new write key');
        }
        // Re-check after a moment
        setTimeout(checkWrite, 3000);
      });

      keyInput.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') keyBtn.click();
      });

      // Check on load and periodically
      setTimeout(checkWrite, 2000);
      setInterval(checkWrite, 15000);
    })();
  </script>

  <script src="/modules/company/js/sidebar.js"></script>
</body>
