<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="AmbientPixels Company Calendar — tasks, content, reminders, and activity at a glance." />
  <link rel="icon" href="/images/favicon.ico" type="image/x-icon" />
  <title>Calendar — AmbientPixels HQ</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/grid.css" />
  <link rel="stylesheet" href="/css/nav.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/theme.css" />
  <link rel="stylesheet" href="/css/banner.css" />
  <link rel="stylesheet" href="/modules/company/css/company.css" />
  <link rel="stylesheet" href="/modules/company/css/sidebar.css" />
  <link rel="stylesheet" href="/modules/company/css/quick-chat.css" />
  <link rel="stylesheet" href="/modules/company/css/calendar.css" />
  <style>
    .cal-header {
      display: flex; align-items: flex-start; justify-content: space-between;
      padding: 1.5rem 0 1rem; flex-wrap: wrap; gap: 0.5rem;
    }
    .cal-header h1 { font-size: 1.4rem; font-weight: 600; margin: 0; display: flex; align-items: center; gap: 8px; }
    .cal-header-sub { font-size: 0.8rem; opacity: 0.45; margin: 0.3rem 0 0; }
    .cal-nav { display: flex; align-items: center; gap: 0.4rem; }
    .cal-nav-btn {
      background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
      border-radius: 6px; color: rgba(255,255,255,0.6); cursor: pointer;
      font-size: 0.7rem; padding: 0.3rem 0.6rem; font-family: inherit; transition: all 0.15s;
    }
    .cal-nav-btn:hover { background: rgba(255,255,255,0.08); color: #fff; }
    .cal-month-label { font-size: 0.85rem; font-weight: 500; min-width: 140px; text-align: center; }

    /* Filters */
    .cal-filters {
      display: flex; gap: 0.4rem; flex-wrap: wrap; margin-bottom: 0.8rem;
    }
    .cal-filter {
      font-size: 0.55rem; padding: 0.2rem 0.5rem; border-radius: 4px;
      border: 1px solid rgba(255,255,255,0.08); background: rgba(255,255,255,0.03);
      color: rgba(255,255,255,0.5); cursor: pointer; font-family: inherit;
      display: flex; align-items: center; gap: 0.25rem; transition: all 0.15s;
    }
    .cal-filter:hover { background: rgba(255,255,255,0.06); }
    .cal-filter.active { border-color: var(--fc); color: var(--fc); background: var(--fb); }
    .cal-filter .cal-dot { width: 6px; height: 6px; border-radius: 50%; }

    /* Grid */
    .cal-grid {
      display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px;
      background: rgba(255,255,255,0.03); border-radius: 10px; overflow: hidden;
      border: 1px solid rgba(255,255,255,0.05);
    }
    .cal-weekday {
      font-size: 0.5rem; text-transform: uppercase; letter-spacing: 0.06em;
      opacity: 0.3; text-align: center; padding: 0.4rem 0;
      background: rgba(255,255,255,0.02);
    }
    .cal-cell {
      min-height: 80px; padding: 0.3rem; background: rgba(7,16,25,0.6);
      cursor: pointer; transition: background 0.15s; position: relative;
    }
    .cal-cell:hover { background: rgba(255,255,255,0.04); }
    .cal-cell--other { opacity: 0.25; }
    .cal-cell--today { background: rgba(255,215,0,0.04); border: 1px solid rgba(255,215,0,0.15); }
    .cal-cell--selected { background: rgba(59,130,246,0.08); border: 1px solid rgba(59,130,246,0.2); }
    .cal-day-num {
      font-size: 0.65rem; font-weight: 500; margin-bottom: 0.2rem;
      display: flex; align-items: center; justify-content: space-between;
    }
    .cal-day-num .cal-today-badge {
      font-size: 0.4rem; background: rgba(255,215,0,0.15); color: #FFD700;
      padding: 0.05rem 0.25rem; border-radius: 3px; font-weight: 600;
    }
    .cal-dots { display: flex; gap: 2px; flex-wrap: wrap; }
    .cal-cell-dot {
      width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0;
    }
    .cal-cell-item {
      font-size: 0.45rem; padding: 0.08rem 0.2rem; border-radius: 2px;
      margin-bottom: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      line-height: 1.3;
    }

    /* Day Detail Panel */
    .cal-detail {
      margin-top: 1rem; border: 1px solid rgba(255,255,255,0.07);
      border-radius: 12px; background: #1c1c1e; overflow: hidden;
    }
    .cal-detail-head {
      padding: 0.6rem 0.8rem; border-bottom: 1px solid rgba(255,255,255,0.04);
      display: flex; align-items: center; justify-content: space-between; gap: 0.6rem;
    }
    .cal-detail-head-info { display:flex; align-items:center; gap:0.4rem; font-size:0.8rem; font-weight:500; }
    .cal-detail-head i { opacity: 0.4; }
    .cal-detail-actions { display:flex; gap:0.3rem; flex-wrap:wrap; }
    .cal-quick-btn {
      font-size:0.55rem; padding:0.2rem 0.5rem; border-radius:4px;
      border:1px solid rgba(255,255,255,0.1); background:rgba(255,255,255,0.04);
      color:rgba(255,255,255,0.7); cursor:pointer; transition:all 0.15s;
    }
    .cal-quick-btn:hover { background:rgba(255,255,255,0.08); color:#fff; }
    .cal-detail-body { padding: 0.6rem 0.8rem; }
    .cal-detail-empty {
      text-align: center; font-size: 0.7rem; opacity: 0.25; padding: 1.5rem;
    }
    .cal-detail-section {
      margin-bottom: 0.6rem;
    }
    .cal-detail-section-title {
      font-size: 0.55rem; opacity: 0.4; text-transform: uppercase;
      letter-spacing: 0.05em; margin-bottom: 0.3rem;
    }
    .cal-detail-item {
      display: flex; align-items: center; gap: 0.4rem;
      padding: 0.3rem 0.4rem; border-radius: 5px; margin-bottom: 0.2rem;
      font-size: 0.65rem; border: 1px solid rgba(255,255,255,0.03);
      background: rgba(255,255,255,0.01);
    }
    .cal-detail-item .cal-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
    .cal-detail-item-info { flex: 1; min-width: 0; }
    .cal-detail-item-title { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cal-detail-item-meta { font-size: 0.55rem; opacity: 0.4; margin-top: 0.05rem; }
    .cal-detail-item-badge {
      font-size: 0.45rem; padding: 0.08rem 0.3rem; border-radius: 3px; font-weight: 500;
      white-space: nowrap;
    }
    .cal-cell-flags {
      display:flex; gap:0.2rem; flex-wrap:wrap; margin-top:0.15rem;
    }
    .cal-flag {
      font-size:0.45rem; padding:0.05rem 0.3rem; border-radius:3px;
      background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.08);
      color:rgba(255,255,255,0.65); display:inline-flex; align-items:center; gap:0.15rem;
    }
    .cal-flag--alert { border-color:rgba(248,113,113,0.4); color:#f87171; }
    .cal-flag--social { border-color:rgba(96,165,250,0.4); color:#60a5fa; }
    .cal-flag--reminder { border-color:rgba(255,215,0,0.4); color:#fbbf24; }

    /* View toggle */
    .cal-view-toggle {
      display: flex; gap: 2px; background: rgba(255,255,255,0.04);
      border-radius: 6px; padding: 2px; margin-right: 0.5rem;
    }
    .cal-view-btn {
      font-size: 0.6rem; padding: 0.25rem 0.6rem; border-radius: 4px;
      border: none; background: transparent; color: rgba(255,255,255,0.4);
      cursor: pointer; font-family: inherit; transition: all 0.15s;
    }
    .cal-view-btn:hover { color: rgba(255,255,255,0.7); }
    .cal-view-btn.active { background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.9); font-weight: 600; }

    /* Week view */
    .cal-grid--week .cal-cell { min-height: 200px; }
    .cal-grid--week .cal-cell-item {
      font-size: 0.55rem; padding: 0.15rem 0.3rem; border-radius: 3px;
      margin-bottom: 2px; line-height: 1.4;
    }

    /* Day view */
    .cal-day-view {
      border: 1px solid rgba(255,255,255,0.07); border-radius: 12px;
      background: #1c1c1e; overflow: hidden;
    }
    .cal-day-view-head {
      padding: 0.8rem 1rem; border-bottom: 1px solid rgba(255,255,255,0.04);
      display: flex; align-items: center; justify-content: space-between;
    }
    .cal-day-view-date { font-size: 1rem; font-weight: 600; }
    .cal-day-view-sub { font-size: 0.65rem; opacity: 0.35; }
    .cal-day-view-body { padding: 0.8rem 1rem; }
    .cal-day-view-section { margin-bottom: 1rem; }
    .cal-day-view-section-title {
      font-size: 0.6rem; opacity: 0.4; text-transform: uppercase;
      letter-spacing: 0.05em; margin-bottom: 0.4rem; display: flex; align-items: center; gap: 0.3rem;
    }
    .cal-day-view-item {
      display: flex; align-items: flex-start; gap: 0.5rem;
      padding: 0.5rem 0.6rem; border-radius: 6px; margin-bottom: 0.3rem;
      border: 1px solid rgba(255,255,255,0.04); background: rgba(255,255,255,0.015);
      transition: background 0.15s;
    }
    .cal-day-view-item:hover { background: rgba(255,255,255,0.03); }
    .cal-day-view-item .cal-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; margin-top: 0.25rem; }
    .cal-day-view-item-info { flex: 1; min-width: 0; }
    .cal-day-view-item-title { font-size: 0.75rem; font-weight: 500; }
    .cal-day-view-item-meta { font-size: 0.6rem; opacity: 0.4; margin-top: 0.15rem; }
    .cal-day-view-item-badge {
      font-size: 0.5rem; padding: 0.1rem 0.4rem; border-radius: 3px;
      font-weight: 500; white-space: nowrap; align-self: center;
    }
    .cal-day-view-empty {
      text-align: center; font-size: 0.8rem; opacity: 0.2; padding: 3rem;
    }

    /* Search bar */
    .cal-search-bar {
      display: flex; align-items: center; gap: 0.5rem;
      margin-bottom: 0.8rem; position: relative;
    }
    .cal-search-bar input {
      flex: 1; padding: 0.45rem 0.7rem 0.45rem 2rem;
      font-size: 0.72rem; font-family: inherit; color: inherit;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px; outline: none;
      transition: border-color 0.15s;
    }
    .cal-search-bar input:focus { border-color: rgba(59,130,246,0.3); }
    .cal-search-bar input::placeholder { color: rgba(255,255,255,0.2); }
    .cal-search-bar .cal-search-icon {
      position: absolute; left: 0.7rem; top: 50%; transform: translateY(-50%);
      font-size: 0.65rem; opacity: 0.25; pointer-events: none;
    }
    .cal-search-bar .cal-search-count {
      font-size: 0.55rem; opacity: 0.3; white-space: nowrap;
    }
    .cal-search-results {
      margin-bottom: 0.8rem; display: none;
    }
    .cal-search-results.active { display: block; }
    .cal-search-result {
      display: flex; align-items: center; gap: 0.5rem;
      padding: 0.35rem 0.6rem; margin-bottom: 0.2rem;
      border-radius: 6px; font-size: 0.68rem;
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.04);
      cursor: pointer; transition: background 0.15s;
    }
    .cal-search-result:hover { background: rgba(59,130,246,0.06); border-color: rgba(59,130,246,0.15); }
    .cal-search-result .cal-sr-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
    .cal-search-result .cal-sr-title { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cal-search-result .cal-sr-date { font-size: 0.55rem; opacity: 0.35; flex-shrink: 0; }
    .cal-search-result .cal-sr-type { font-size: 0.5rem; opacity: 0.4; flex-shrink: 0; }

    /* Stats bar */
    .cal-stats {
      display: flex; gap: 0.6rem; flex-wrap: wrap; margin-bottom: 0.8rem;
    }
    .cal-stat {
      flex: 1; min-width: 80px; padding: 0.5rem 0.6rem;
      border: 1px solid rgba(255,255,255,0.04); border-radius: 8px;
      background: rgba(255,255,255,0.015); text-align: center;
    }
    .cal-stat-val { font-size: 1.1rem; font-weight: 600; }
    .cal-stat-label { font-size: 0.5rem; opacity: 0.35; text-transform: uppercase; letter-spacing: 0.04em; margin-top: 0.1rem; }

    /* ── Inline Style Replacements ── */
    #cal-main { max-width: 1200px; margin: 0 auto; padding: 1rem; }
    #cal-today { margin-left: 0.3rem; }
  </style>
</head>
<body data-theme="dark">

  <main class="content-section" id="cal-main">

    <div class="cal-header">
      <div>
        <h1><i class="fas fa-calendar-alt co-icon-mr-lg dash-icon-green"></i>Company Calendar</h1>
        <p class="cal-header-sub">Scheduled tasks, campaigns, and key dates across all agents.</p>
      </div>
      <div class="cal-nav">
        <div class="cal-view-toggle" id="cal-view-toggle">
          <button class="cal-view-btn active" data-view="month">Month</button>
          <button class="cal-view-btn" data-view="week">Week</button>
          <button class="cal-view-btn" data-view="day">Day</button>
        </div>
        <button class="cal-nav-btn" id="cal-prev"><i class="fas fa-chevron-left"></i></button>
        <span class="cal-month-label" id="cal-month-label"></span>
        <button class="cal-nav-btn" id="cal-next"><i class="fas fa-chevron-right"></i></button>
        <button class="cal-nav-btn" id="cal-today">Today</button>
      </div>
    </div>

    <!-- Filters -->
    <div class="cal-filters" id="cal-filters">
      <button class="cal-filter active" data-layer="tasks" style="--fc:#60a5fa;--fb:rgba(96,165,250,0.08);">
        <span class="cal-dot" style="background:#60a5fa;"></span> Tasks
      </button>
      <button class="cal-filter active" data-layer="content" style="--fc:#34d399;--fb:rgba(52,211,153,0.08);">
        <span class="cal-dot" style="background:#34d399;"></span> Content
      </button>
      <button class="cal-filter active" data-layer="social" style="--fc:#a855f7;--fb:rgba(168,85,247,0.08);">
        <span class="cal-dot" style="background:#a855f7;"></span> Social
      </button>
      <button class="cal-filter active" data-layer="reminders" style="--fc:#FFD700;--fb:rgba(255,215,0,0.08);">
        <span class="cal-dot" style="background:#FFD700;"></span> Reminders
      </button>
      <button class="cal-filter active" data-layer="activity" style="--fc:#FFA500;--fb:rgba(255,165,0,0.08);">
        <span class="cal-dot" style="background:#FFA500;"></span> Activity
      </button>
    </div>

    <!-- Search -->
    <div class="cal-search-bar">
      <i class="fas fa-search cal-search-icon"></i>
      <input type="text" id="cal-search-input" placeholder="Search tasks, posts, reminders, docs..." />
      <span class="cal-search-count" id="cal-search-count"></span>
    </div>
    <div class="cal-search-results" id="cal-search-results"></div>

    <!-- Month Stats -->
    <div class="cal-stats" id="cal-stats"></div>

    <!-- Calendar Intelligence -->
    <div id="cal-intel-alerts"></div>
    <div id="cal-recommendations"></div>

    <!-- Calendar Grid -->
    <div class="cal-grid" id="cal-grid"></div>

    <!-- Day Detail -->
    <div class="cal-detail" id="cal-detail" style="display:none;">
      <div class="cal-detail-head" id="cal-detail-head">
        <div class="cal-detail-head-info">
          <i class="fas fa-calendar-day dash-icon-green co-icon-mr"></i>
          <span id="cal-detail-date"></span>
        </div>
        <div class="cal-detail-actions">
          <button class="cal-quick-btn" id="cal-add-task-btn"><i class="fas fa-plus"></i> Task</button>
          <button class="cal-quick-btn" id="cal-add-reminder-btn"><i class="fas fa-bell"></i> Reminder</button>
        </div>
      </div>
      <div class="cal-detail-body" id="cal-detail-body"></div>
    </div>

  </main>

  <script src="/modules/company/js/demo-toast.js"></script>
  <script src="/js/company-store.js"></script>
  <script src="/js/friendly-labels.js"></script>
  <script src="/js/agent-engine.js"></script>
  <script src="/modules/company/js/quick-chat.js"></script>
  <script>
    (function () {
      'use strict';

      var API_BASE = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
        ? '/api' : 'https://ambientpixels-nova-api.azurewebsites.net/api';

      // State
      var currentYear, currentMonth; // 0-indexed month
      var selectedDate = null;
      var currentView = 'month'; // 'month' | 'week' | 'day'
      var weekStartDate = null; // Date object for week view start (Sunday)
      var dayViewDate = null; // Date object for day view
      var activeLayers = { tasks: true, content: true, social: true, reminders: true, activity: true };
      var calData = {}; // dateStr → { tasks:[], content:[], social:[], reminders:[], activity:[] }

      // Layer colors
      var LAYER_COLORS = {
        tasks: '#60a5fa',
        content: '#34d399',
        social: '#a78bfa',
        reminders: '#fbbf24',
        activity: '#fbbf24'
      };

      // Elements
      var gridEl = document.getElementById('cal-grid');
      var monthLabel = document.getElementById('cal-month-label');
      var detailEl = document.getElementById('cal-detail');
      var detailDate = document.getElementById('cal-detail-date');
      var detailBody = document.getElementById('cal-detail-body');
      var statsEl = document.getElementById('cal-stats');
      var addTaskBtn = document.getElementById('cal-add-task-btn');
      var addReminderBtn = document.getElementById('cal-add-reminder-btn');

      // Init
      var now = new Date();
      currentYear = now.getFullYear();
      currentMonth = now.getMonth();
      weekStartDate = getWeekStart(now);
      dayViewDate = new Date(now);

      // Restore persisted open day (collapse detail by default if none stored)
      var _storedDay = localStorage.getItem('ap_calendar_open_day') || '';
      selectedDate = null;

      // Re-render after CompanyStore server sync
      window.addEventListener('companystoreready', function () { loadAllData().then(function () { render(); }); });

      AgentEngine.loadRegistry().then(function () {
        loadAllData().then(function () {
          render();
          // Restore persisted day if it's in the current month
          if (_storedDay) {
            var storedMonth = _storedDay.substring(0, 7);
            var currentMonthStr = currentYear + '-' + String(currentMonth + 1).padStart(2, '0');
            if (storedMonth === currentMonthStr) {
              selectDay(_storedDay);
            } else {
              localStorage.removeItem('ap_calendar_open_day');
            }
          }
        });
      });

      // Helper: get Sunday of the week containing d
      function getWeekStart(d) {
        var s = new Date(d);
        s.setDate(s.getDate() - s.getDay());
        return s;
      }

      // View toggle
      document.getElementById('cal-view-toggle').addEventListener('click', function (e) {
        var btn = e.target.closest('.cal-view-btn');
        if (!btn) return;
        currentView = btn.dataset.view;
        document.querySelectorAll('.cal-view-btn').forEach(function (b) {
          b.classList.toggle('active', b.dataset.view === currentView);
        });
        // Sync week/day dates from selected date or today
        var ref = selectedDate ? new Date(selectedDate + 'T12:00:00') : new Date();
        weekStartDate = getWeekStart(ref);
        dayViewDate = new Date(ref);
        currentYear = ref.getFullYear();
        currentMonth = ref.getMonth();
        render();
      });

      // Navigation — view-aware
      document.getElementById('cal-prev').addEventListener('click', function () {
        if (currentView === 'month') {
          currentMonth--;
          if (currentMonth < 0) { currentMonth = 11; currentYear--; }
          selectedDate = null;
          localStorage.removeItem('ap_calendar_open_day');
        } else if (currentView === 'week') {
          weekStartDate.setDate(weekStartDate.getDate() - 7);
          currentYear = weekStartDate.getFullYear();
          currentMonth = weekStartDate.getMonth();
        } else {
          dayViewDate.setDate(dayViewDate.getDate() - 1);
          currentYear = dayViewDate.getFullYear();
          currentMonth = dayViewDate.getMonth();
          selectedDate = toDateStr(dayViewDate);
        }
        render();
      });
      document.getElementById('cal-next').addEventListener('click', function () {
        if (currentView === 'month') {
          currentMonth++;
          if (currentMonth > 11) { currentMonth = 0; currentYear++; }
          selectedDate = null;
          localStorage.removeItem('ap_calendar_open_day');
        } else if (currentView === 'week') {
          weekStartDate.setDate(weekStartDate.getDate() + 7);
          currentYear = weekStartDate.getFullYear();
          currentMonth = weekStartDate.getMonth();
        } else {
          dayViewDate.setDate(dayViewDate.getDate() + 1);
          currentYear = dayViewDate.getFullYear();
          currentMonth = dayViewDate.getMonth();
          selectedDate = toDateStr(dayViewDate);
        }
        render();
      });
      document.getElementById('cal-today').addEventListener('click', function () {
        var n = new Date();
        currentYear = n.getFullYear();
        currentMonth = n.getMonth();
        weekStartDate = getWeekStart(n);
        dayViewDate = new Date(n);
        selectedDate = toDateStr(n);
        render();
        if (currentView === 'month') selectDay(toDateStr(n));
      });

      // Filter toggles
      document.getElementById('cal-filters').addEventListener('click', function (e) {
        var btn = e.target.closest('.cal-filter');
        if (!btn) return;
        var layer = btn.dataset.layer;
        activeLayers[layer] = !activeLayers[layer];
        btn.classList.toggle('active', activeLayers[layer]);
        render();
        if (selectedDate && currentView === 'month') renderDetail(selectedDate);
      });

      addTaskBtn.addEventListener('click', function () {
        if (!selectedDate) return;
        quickAddTask(selectedDate);
      });
      addReminderBtn.addEventListener('click', function () {
        if (!selectedDate) return;
        quickAddReminder(selectedDate);
      });

      // ── Calendar Search ──
      var calSearchInput = document.getElementById('cal-search-input');
      var calSearchCount = document.getElementById('cal-search-count');
      var calSearchResults = document.getElementById('cal-search-results');
      var _calSearchTimer;

      function calSearch(query) {
        var q = (query || '').toLowerCase().trim();
        if (!q) {
          calSearchResults.classList.remove('active');
          calSearchResults.innerHTML = '';
          if (calSearchCount) calSearchCount.textContent = '';
          return;
        }
        var results = [];
        var dates = Object.keys(calData).sort();
        for (var di = 0; di < dates.length; di++) {
          var dateStr = dates[di];
          var day = calData[dateStr];
          var layers = ['tasks', 'content', 'social', 'reminders', 'activity'];
          for (var li = 0; li < layers.length; li++) {
            var layer = layers[li];
            var items = day[layer] || [];
            for (var ii = 0; ii < items.length; ii++) {
              var item = items[ii];
              var haystack = ((item.title || '') + ' ' + (item.status || '') + ' ' + (item.assignee || '') + ' ' + (item.platform || '') + ' ' + (item.type || '')).toLowerCase();
              if (haystack.indexOf(q) !== -1) {
                results.push({ date: dateStr, layer: layer, item: item });
              }
            }
          }
        }
        if (calSearchCount) calSearchCount.textContent = results.length + ' result' + (results.length !== 1 ? 's' : '');
        if (results.length === 0) {
          calSearchResults.classList.add('active');
          calSearchResults.innerHTML = '<div style="opacity:0.3;font-size:0.65rem;padding:0.4rem;">No items match "' + esc(q) + '"</div>';
          return;
        }
        var shown = results.slice(0, 20);
        calSearchResults.classList.add('active');
        calSearchResults.innerHTML = shown.map(function (r) {
          var color = LAYER_COLORS[r.layer] || '#888';
          var d = new Date(r.date + 'T12:00:00');
          var dateLabel = d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
          return '<div class="cal-search-result" data-date="' + r.date + '">' +
            '<span class="cal-sr-dot" style="background:' + color + ';"></span>' +
            '<span class="cal-sr-title">' + esc(r.item.title || '?') + '</span>' +
            '<span class="cal-sr-type">' + r.layer + '</span>' +
            '<span class="cal-sr-date">' + dateLabel + '</span>' +
            '</div>';
        }).join('') + (results.length > 20 ? '<div style="opacity:0.3;font-size:0.55rem;padding:0.3rem;text-align:center;">Showing 20 of ' + results.length + '</div>' : '');
      }

      if (calSearchInput) {
        calSearchInput.addEventListener('input', function () {
          clearTimeout(_calSearchTimer);
          _calSearchTimer = setTimeout(function () { calSearch(calSearchInput.value); }, 150);
        });
      }
      if (calSearchResults) {
        calSearchResults.addEventListener('click', function (e) {
          var row = e.target.closest('.cal-search-result');
          if (!row || !row.dataset.date) return;
          var targetDate = row.dataset.date;
          var d = new Date(targetDate + 'T12:00:00');
          currentYear = d.getFullYear();
          currentMonth = d.getMonth();
          selectedDate = targetDate;
          if (currentView === 'week') weekStartDate = getWeekStart(d);
          if (currentView === 'day') dayViewDate = new Date(d);
          render();
          if (currentView === 'month') selectDay(targetDate);
        });
      }

      // Re-render on sync
      AgentEngine.on('sync-complete', function () {
        loadAllData().then(function () {
          render();
          if (selectedDate && currentView === 'month') renderDetail(selectedDate);
        });
      });

      // Cross-tab/local updates — listen for storage changes on key datasets
      window.addEventListener('storage', function (e) {
        if (!e.key) return;
        var watched = ['ap_tasks', 'ap_actions', 'ap_documents', 'ap_workspace_dates', 'ap_standup_log'];
        if (watched.indexOf(e.key) === -1) return;
        loadAllData().then(function () {
          render();
          if (selectedDate && currentView === 'month') renderDetail(selectedDate);
        });
      });

      // ── Data Loading ──
      function loadAllData() {
        calData = {};
        return Promise.all([
          loadTasks(),
          loadContent(),
          loadSocial(),
          loadReminders(),
          loadActivity()
        ]);
      }

      function addItem(dateStr, layer, item) {
        if (!dateStr) return;
        dateStr = dateStr.substring(0, 10); // normalize to YYYY-MM-DD
        if (!calData[dateStr]) calData[dateStr] = { tasks: [], content: [], social: [], reminders: [], activity: [] };
        calData[dateStr][layer].push(item);
      }

      function loadTasks() {
        var tasks = AgentEngine.getTasks();
        var todayStr = toDateStr(new Date());
        tasks.forEach(function (t) {
          if (t.dueDate) {
            var agent = t.assignee ? AgentEngine.getAgent(t.assignee) : null;
            var isOverdue = t.status !== 'done' && t.dueDate < todayStr;
            addItem(t.dueDate, 'tasks', {
              id: t.id,
              title: t.title,
              meta: (agent ? agent.name : 'unassigned') + ' · ' + (t.priority || 'medium'),
              status: t.status,
              priority: t.priority,
              assignee: t.assignee || null,
              assigneeName: agent ? agent.name : null,
              badge: isOverdue ? 'overdue' : t.status,
              badgeColor: isOverdue ? '#f87171' : t.status === 'done' ? '#34d399' : t.status === 'review' ? '#a78bfa' : t.status === 'in-progress' ? '#60a5fa' : '#fbbf24',
              link: '/modules/company/tasks.html?task=' + t.id
            });
          }
        });
        return Promise.resolve();
      }

      function loadContent() {
        return fetch(API_BASE + '/company-state?key=documents', {
          headers: { 'x-company-secret': 'pixelpusher' }
        }).then(function (r) { return r.json(); }).then(function (docs) {
          if (!Array.isArray(docs)) return;
          docs.forEach(function (d) {
            if (d.status === 'published' && d.published_at) {
              addItem(d.published_at, 'content', {
                id: d.id,
                title: d.title,
                meta: (d.kind || 'doc') + ' · published',
                badge: d.kind || 'doc',
                badgeColor: '#34d399',
                slug: d.slug,
                link: '/modules/company/documents.html#doc-' + d.id
              });
            } else if (d.created_at) {
              addItem(d.created_at, 'content', {
                id: d.id,
                title: d.title,
                meta: (d.kind || 'doc') + ' · ' + (d.status || 'draft'),
                badge: d.status || 'draft',
                badgeColor: d.status === 'published' ? '#34d399' : d.status === 'review' ? '#a855f7' : '#60a5fa',
                link: '/modules/company/documents.html#doc-' + d.id
              });
            }
          });
        }).catch(function () {});
      }

      function loadSocial() {
        var actions = AgentEngine.getActions ? AgentEngine.getActions() : [];
        actions.forEach(function (a) {
          var type = a.type || a.action_type || '';
          if (type.indexOf('social_post') === -1) return;
          var payload = a.payload || a.action_payload || {};
          var platform = a.platform || 'x';
          var text = (payload.text || '').substring(0, 60);
          var date = (payload.scheduled_for) || a.created_at;
          var approvalStatus = (a.approval && a.approval.status) || '';
          var execStatus = a.execution_status || 'pending';
          addItem(date, 'social', {
            id: a.id,
            title: text || 'Social post',
            meta: platform + ' · ' + (a.created_by || a.origin_agent || '?'),
            badge: approvalStatus === 'approved' ? execStatus : approvalStatus,
            badgeColor: execStatus === 'success' ? '#34d399' : approvalStatus === 'approved' ? '#60a5fa' : approvalStatus === 'rejected' ? '#ef4444' : '#fbbf24',
            platform: platform,
            link: '/modules/company/actions.html?action=' + a.id
          });
        });
        return Promise.resolve();
      }

      function loadReminders() {
        var dates = AgentEngine.getDates ? AgentEngine.getDates() : [];
        dates.forEach(function (d) {
          if (d.date) {
            addItem(d.date, 'reminders', {
              id: d.id,
              title: d.title || 'Reminder',
              meta: (d.type || 'event') + (d.description ? ' · ' + d.description.substring(0, 60) : ''),
              badge: d.type || 'event',
              badgeColor: d.type === 'deadline' ? '#f87171' : d.type === 'milestone' ? '#FFD700' : d.type === 'recurring' ? '#a855f7' : '#fbbf24'
            });
          }
        });
        return Promise.resolve();
      }

      function loadActivity() {
        // Standups
        var standups = AgentEngine.getStandupLog ? AgentEngine.getStandupLog() : [];
        standups.forEach(function (s) {
          if (s.dateLabel) {
            addItem(s.dateLabel, 'activity', {
              title: 'Daily Standup',
              meta: (s.entries ? s.entries.length : 0) + ' agents reported',
              badge: 'standup',
              badgeColor: '#FFA500'
            });
          }
        });
        return Promise.resolve();
      }

      // ── Render Dispatch ──
      function render() {
        // Hide detail unless a day is actively selected
        if (!selectedDate) {
          detailEl.style.display = 'none';
          detailEl.classList.add('cal-detail--collapsed');
        }
        // Clean up day container when leaving day view
        var dayContainer = document.getElementById('cal-day-container');
        if (dayContainer && currentView !== 'day') dayContainer.remove();
        if (currentView === 'week') { renderWeek(); }
        else if (currentView === 'day') { renderDayView(); }
        else { renderMonth(); }
        renderStats();
        renderCalIntel();
        renderCalRecommendations();
      }

      // ── Calendar Intelligence (shared results) ──
      var _intelVisibleDates = {};
      var _intelOverload = null;
      var _intelCluster = null;
      var _intelBurst = null;
      var _intelBooking = null;

      function renderCalIntel() {
        var el = document.getElementById('cal-intel-alerts');
        if (!el) return;

        // Determine visible date range based on current view
        _intelVisibleDates = {};
        if (currentView === 'day') {
          _intelVisibleDates[toDateStr(dayViewDate)] = true;
        } else if (currentView === 'week') {
          for (var wi = 0; wi < 7; wi++) {
            var wd = new Date(weekStartDate);
            wd.setDate(wd.getDate() + wi);
            _intelVisibleDates[toDateStr(wd)] = true;
          }
        } else {
          // Month: all days in current month
          var daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
          for (var mi = 1; mi <= daysInMonth; mi++) {
            _intelVisibleDates[toDateStr(new Date(currentYear, currentMonth, mi))] = true;
          }
        }

        // Reset shared results
        _intelOverload = null;
        _intelCluster = null;
        _intelBurst = null;
        _intelBooking = null;

        // Single pass over visible dates
        var worstOverload = null;
        var worstCluster = null;
        var worstBurst = null;
        var worstBooking = null;

        Object.keys(_intelVisibleDates).forEach(function (ds) {
          var items = calData[ds];
          if (!items) return;

          // 1) Overloaded day: total visible item count
          var totalCount = 0;
          ['tasks', 'content', 'social', 'reminders', 'activity'].forEach(function (layer) {
            if (activeLayers[layer]) totalCount += (items[layer] || []).length;
          });
          if (totalCount >= 8) {
            var olSev = totalCount >= 12 ? 2 : 1;
            if (!worstOverload || olSev > worstOverload.sev || (olSev === worstOverload.sev && totalCount > worstOverload.count) || (olSev === worstOverload.sev && totalCount === worstOverload.count && ds < worstOverload.date)) {
              worstOverload = { date: ds, count: totalCount, sev: olSev };
            }
          }

          // Tasks-specific detections (only when Tasks layer active)
          if (activeLayers.tasks) {
            var taskArr = items.tasks || [];

            // 2) Deadline cluster: task count per day
            if (taskArr.length >= 3) {
              var dcSev = taskArr.length >= 5 ? 2 : 1;
              if (!worstCluster || dcSev > worstCluster.sev || (dcSev === worstCluster.sev && taskArr.length > worstCluster.count) || (dcSev === worstCluster.sev && taskArr.length === worstCluster.count && ds < worstCluster.date)) {
                worstCluster = { date: ds, count: taskArr.length, sev: dcSev };
              }
            }

            // 4) Agent overbooking: group tasks by assignee
            var agentCounts = {};
            taskArr.forEach(function (t) {
              if (t.assignee) {
                if (!agentCounts[t.assignee]) agentCounts[t.assignee] = { count: 0, name: t.assigneeName || t.assignee };
                agentCounts[t.assignee].count++;
              }
            });
            Object.keys(agentCounts).forEach(function (agentId) {
              var ac = agentCounts[agentId];
              if (ac.count >= 3) {
                var abSev = ac.count >= 5 ? 2 : 1;
                if (!worstBooking || abSev > worstBooking.sev || (abSev === worstBooking.sev && ac.count > worstBooking.count) || (abSev === worstBooking.sev && ac.count === worstBooking.count && ds < worstBooking.date)) {
                  worstBooking = { date: ds, agent: agentId, agentName: ac.name, count: ac.count, sev: abSev };
                }
              }
            });
          }

          // 3) Social burst (only when Social layer active)
          if (activeLayers.social) {
            var socialArr = items.social || [];
            if (socialArr.length >= 4) {
              var sbSev = socialArr.length >= 6 ? 2 : 1;
              if (!worstBurst || sbSev > worstBurst.sev || (sbSev === worstBurst.sev && socialArr.length > worstBurst.count) || (sbSev === worstBurst.sev && socialArr.length === worstBurst.count && ds < worstBurst.date)) {
                worstBurst = { date: ds, count: socialArr.length, sev: sbSev };
              }
            }
          }
        });

        // Store to shared scope for recommendations
        _intelOverload = worstOverload;
        _intelCluster = worstCluster;
        _intelBurst = worstBurst;
        _intelBooking = worstBooking;

        // Build prioritized alert list: red first, then amber, in type priority order
        var candidates = [];
        if (worstOverload) candidates.push({ type: 'overload', sev: worstOverload.sev, priority: 1, data: worstOverload });
        if (worstCluster) candidates.push({ type: 'cluster', sev: worstCluster.sev, priority: 2, data: worstCluster });
        if (worstBurst) candidates.push({ type: 'burst', sev: worstBurst.sev, priority: 3, data: worstBurst });
        if (worstBooking) candidates.push({ type: 'booking', sev: worstBooking.sev, priority: 4, data: worstBooking });

        // Sort: severity desc, then priority asc
        candidates.sort(function (a, b) {
          if (b.sev !== a.sev) return b.sev - a.sev;
          return a.priority - b.priority;
        });

        // Render top 3
        var html = '';
        var max = Math.min(candidates.length, 3);
        for (var ci = 0; ci < max; ci++) {
          var c = candidates[ci];
          var cls = c.sev === 2 ? 'cal-intel-alert--red' : 'cal-intel-alert--amber';
          var icon = c.sev === 2 ? 'fas fa-exclamation-circle' : 'fas fa-exclamation-triangle';
          var dateLabel = _formatIntelDate(c.data.date);
          var text = '';
          var linkText = 'Open day →';

          if (c.type === 'overload') {
            text = 'Overloaded day: ' + dateLabel + ' has ' + c.data.count + ' items scheduled.';
          } else if (c.type === 'cluster') {
            text = 'Deadline cluster: ' + c.data.count + ' task deadlines on ' + dateLabel + '.';
            linkText = 'Review tasks →';
          } else if (c.type === 'burst') {
            text = 'Social burst: ' + c.data.count + ' posts scheduled on ' + dateLabel + '.';
            linkText = 'Review posts →';
          } else if (c.type === 'booking') {
            text = 'Agent overbooked: ' + esc(c.data.agentName) + ' has ' + c.data.count + ' task deadlines on ' + dateLabel + '.';
          }

          html += '<div class="cal-intel-alert ' + cls + '"><i class="' + icon + '"></i><span>' + text + '</span>';
          html += '<button class="cal-intel-link" data-intel-date="' + c.data.date + '">' + linkText + '</button>';
          html += '</div>';
        }

        el.innerHTML = html;

        // Bind alert links
        el.querySelectorAll('.cal-intel-link').forEach(function (link) {
          link.addEventListener('click', function () {
            var ds = link.dataset.intelDate;
            if (ds) selectDay(ds);
          });
        });
      }

      function _formatIntelDate(ds) {
        var d = new Date(ds + 'T12:00:00');
        return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
      }

      // ── Calendar Recommendations ──
      function renderCalRecommendations() {
        var el = document.getElementById('cal-recommendations');
        if (!el) return;

        var recs = [];

        // Helper: count visible items for a date
        function _dayItemCount(ds) {
          var items = calData[ds];
          if (!items) return 0;
          var c = 0;
          ['tasks', 'content', 'social', 'reminders', 'activity'].forEach(function (layer) {
            if (activeLayers[layer]) c += (items[layer] || []).length;
          });
          return c;
        }

        // 1) Overloaded Day → suggest moving items to adjacent lighter day
        if (_intelOverload) {
          var srcDate = _intelOverload.date;
          var srcD = new Date(srcDate + 'T12:00:00');
          var monthStr = currentYear + '-' + String(currentMonth + 1).padStart(2, '0');
          var bestTarget = null;
          for (var offset = 1; offset <= 2; offset++) {
            var offsets = [-offset, offset];
            for (var oi = 0; oi < offsets.length; oi++) {
              var td = new Date(srcD);
              td.setDate(td.getDate() + offsets[oi]);
              var tds = toDateStr(td);
              if (tds.substring(0, 7) !== monthStr) continue;
              if (!_intelVisibleDates[tds]) continue;
              var tc = _dayItemCount(tds);
              if (tc <= 3) {
                if (!bestTarget || tc < bestTarget.count || (tc === bestTarget.count && Math.abs(offsets[oi]) < Math.abs(bestTarget.offset))) {
                  bestTarget = { date: tds, count: tc, offset: offsets[oi] };
                }
              }
            }
          }
          if (bestTarget) {
            recs.push({
              priority: 1,
              text: 'Consider moving 1\u20132 items from ' + _formatIntelDate(srcDate) + ' to ' + _formatIntelDate(bestTarget.date) + ' to reduce overload.',
              links: [
                { label: 'Open ' + _formatIntelDate(srcDate), date: srcDate },
                { label: 'Open ' + _formatIntelDate(bestTarget.date), date: bestTarget.date }
              ]
            });
          }
        }

        // 2) Deadline Cluster → suggest rescheduling lowest-priority non-critical task
        if (_intelCluster && activeLayers.tasks) {
          var clusterItems = (calData[_intelCluster.date] || {}).tasks || [];
          var prioOrder = { low: 0, medium: 1, high: 2, critical: 3 };
          var candidate = null;
          clusterItems.forEach(function (t) {
            var p = (t.priority || 'medium').toLowerCase();
            if (p === 'critical') return;
            var pVal = prioOrder[p] !== undefined ? prioOrder[p] : 1;
            if (!candidate || pVal < candidate.pVal) {
              candidate = { title: t.title, id: t.id, link: t.link, pVal: pVal };
            }
          });
          if (candidate) {
            recs.push({
              priority: 2,
              text: 'Consider rescheduling \u201c' + esc(candidate.title) + '\u201d to reduce deadline clustering on ' + _formatIntelDate(_intelCluster.date) + '.',
              links: [
                { label: 'Open task', url: candidate.link }
              ]
            });
          }
        }

        // 3) Agent Overbooking → suggest reassigning one non-critical task
        if (_intelBooking && activeLayers.tasks) {
          var bookingItems = (calData[_intelBooking.date] || {}).tasks || [];
          var agentTasks = bookingItems.filter(function (t) { return t.assignee === _intelBooking.agent; });
          var nonCritical = agentTasks.filter(function (t) { return (t.priority || 'medium').toLowerCase() !== 'critical'; });
          if (nonCritical.length > 0) {
            recs.push({
              priority: 3,
              text: 'Consider reassigning 1 task from ' + esc(_intelBooking.agentName) + ' on ' + _formatIntelDate(_intelBooking.date) + ' to balance workload.',
              links: [
                { label: 'Open ' + _formatIntelDate(_intelBooking.date), date: _intelBooking.date }
              ]
            });
          }
        }

        // 4) Social Burst → suggest spacing out
        if (_intelBurst && activeLayers.social) {
          recs.push({
            priority: 4,
            text: 'Consider spacing out social posts on ' + _formatIntelDate(_intelBurst.date) + '.',
            links: [
              { label: 'Open ' + _formatIntelDate(_intelBurst.date), date: _intelBurst.date }
            ]
          });
        }

        // Sort by priority, show max 2
        recs.sort(function (a, b) { return a.priority - b.priority; });
        var html = '';
        var maxRecs = Math.min(recs.length, 2);
        for (var ri = 0; ri < maxRecs; ri++) {
          var r = recs[ri];
          html += '<div class="cal-rec"><i class="fas fa-lightbulb"></i><span>' + r.text + '</span>';
          html += '<div class="cal-rec-actions">';
          r.links.forEach(function (lnk) {
            if (lnk.url) {
              html += '<a class="cal-rec-link" href="' + lnk.url + '">' + lnk.label + '</a>';
            } else if (lnk.date) {
              html += '<button class="cal-rec-link" data-rec-date="' + lnk.date + '">' + lnk.label + '</button>';
            }
          });
          html += '</div></div>';
        }

        el.innerHTML = html;

        // Bind recommendation links
        el.querySelectorAll('[data-rec-date]').forEach(function (btn) {
          btn.addEventListener('click', function () {
            var ds = btn.dataset.recDate;
            if (ds) selectDay(ds);
          });
        });
      }

      // ── Month View ──
      function renderMonth() {
        gridEl.style.display = '';
        gridEl.className = 'cal-grid';
        var first = new Date(currentYear, currentMonth, 1);
        var last = new Date(currentYear, currentMonth + 1, 0);
        var startDay = first.getDay();
        var daysInMonth = last.getDate();
        var prevLast = new Date(currentYear, currentMonth, 0).getDate();
        var todayStr = toDateStr(new Date());

        monthLabel.textContent = first.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });

        var html = '';
        ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].forEach(function (d) {
          html += '<div class="cal-weekday">' + d + '</div>';
        });
        for (var p = startDay - 1; p >= 0; p--) {
          var pDay = prevLast - p;
          html += cellHtml(toDateStr(new Date(currentYear, currentMonth - 1, pDay)), pDay, true);
        }
        for (var d = 1; d <= daysInMonth; d++) {
          var ds = toDateStr(new Date(currentYear, currentMonth, d));
          html += cellHtml(ds, d, false, ds === todayStr, ds === selectedDate);
        }
        var totalCells = startDay + daysInMonth;
        var remaining = (7 - (totalCells % 7)) % 7;
        for (var n = 1; n <= remaining; n++) {
          html += cellHtml(toDateStr(new Date(currentYear, currentMonth + 1, n)), n, true);
        }
        gridEl.innerHTML = html;
        gridEl.querySelectorAll('.cal-cell').forEach(function (cell) {
          cell.addEventListener('click', function () { selectDay(cell.dataset.date); });
        });
      }

      // ── Week View ──
      function renderWeek() {
        gridEl.style.display = '';
        gridEl.className = 'cal-grid cal-grid--week';
        var todayStr = toDateStr(new Date());
        var weekEnd = new Date(weekStartDate);
        weekEnd.setDate(weekEnd.getDate() + 6);
        var startLabel = weekStartDate.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
        var endLabel = weekEnd.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
        monthLabel.textContent = startLabel + ' — ' + endLabel;

        var html = '';
        ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].forEach(function (d) {
          html += '<div class="cal-weekday">' + d + '</div>';
        });
        for (var i = 0; i < 7; i++) {
          var d = new Date(weekStartDate);
          d.setDate(d.getDate() + i);
          var ds = toDateStr(d);
          html += cellHtml(ds, d.getDate(), false, ds === todayStr, ds === selectedDate, 6);
        }
        gridEl.innerHTML = html;
        gridEl.querySelectorAll('.cal-cell').forEach(function (cell) {
          cell.addEventListener('click', function () {
            selectDay(cell.dataset.date);
            // Double-click enters day view
          });
          cell.addEventListener('dblclick', function () {
            dayViewDate = new Date(cell.dataset.date + 'T12:00:00');
            selectedDate = cell.dataset.date;
            currentView = 'day';
            document.querySelectorAll('.cal-view-btn').forEach(function (b) {
              b.classList.toggle('active', b.dataset.view === 'day');
            });
            render();
          });
        });
      }

      // ── Day View ──
      function renderDayView() {
        gridEl.style.display = 'none';
        var ds = toDateStr(dayViewDate);
        selectedDate = ds;
        var todayStr = toDateStr(new Date());
        var d = new Date(ds + 'T12:00:00');
        monthLabel.textContent = d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });

        var items = calData[ds] || {};
        var sections = [
          { key: 'tasks', label: 'Task Deadlines', icon: 'fa-tasks' },
          { key: 'content', label: 'Content', icon: 'fa-file-alt' },
          { key: 'social', label: 'Social Posts', icon: 'fa-share-alt' },
          { key: 'reminders', label: 'Reminders & Dates', icon: 'fa-bell' },
          { key: 'activity', label: 'Activity', icon: 'fa-history' }
        ];

        var bodyHtml = '';
        var hasItems = false;
        sections.forEach(function (sec) {
          if (!activeLayers[sec.key]) return;
          var arr = items[sec.key] || [];
          if (arr.length === 0) return;
          hasItems = true;
          bodyHtml += '<div class="cal-day-view-section">';
          bodyHtml += '<div class="cal-day-view-section-title"><i class="fas ' + sec.icon + '"></i> ' + sec.label + ' (' + arr.length + ')</div>';
          arr.forEach(function (item) {
            bodyHtml += '<div class="cal-day-view-item">';
            bodyHtml += '<span class="cal-dot" style="background:' + LAYER_COLORS[sec.key] + ';"></span>';
            bodyHtml += '<div class="cal-day-view-item-info">';
            bodyHtml += '<div class="cal-day-view-item-title">' + esc(item.title) + '</div>';
            if (item.meta) bodyHtml += '<div class="cal-day-view-item-meta">' + esc(item.meta) + '</div>';
            bodyHtml += '</div>';
            if (item.badge) {
              bodyHtml += '<span class="cal-day-view-item-badge" style="background:' + item.badgeColor + '22;color:' + item.badgeColor + ';">' + esc(item.badge) + '</span>';
            }
            bodyHtml += '</div>';
          });
          bodyHtml += '</div>';
        });
        if (!hasItems) bodyHtml = '<div class="cal-day-view-empty"><i class="fas fa-calendar-day" style="font-size:1.5rem; display:block; margin-bottom:0.5rem;"></i>Nothing scheduled for this day.</div>';

        var isToday = ds === todayStr;
        var dayHtml =
          '<div class="cal-day-view">' +
            '<div class="cal-day-view-head">' +
              '<div>' +
                '<div class="cal-day-view-date">' + d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' }) + (isToday ? ' <span style="font-size:0.55rem;padding:0.1rem 0.3rem;border-radius:3px;background:rgba(52,211,153,0.15);color:#34d399;font-weight:600;vertical-align:middle;">TODAY</span>' : '') + '</div>' +
                '<div class="cal-day-view-sub">' + d.getFullYear() + '</div>' +
              '</div>' +
              '<div style="display:flex;gap:0.3rem;">' +
                '<button class="cal-nav-btn" onclick="document.getElementById(\'cal-prev\').click();" style="font-size:0.6rem;"><i class="fas fa-chevron-left"></i> Prev Day</button>' +
                '<button class="cal-nav-btn" onclick="document.getElementById(\'cal-next\').click();" style="font-size:0.6rem;">Next Day <i class="fas fa-chevron-right"></i></button>' +
              '</div>' +
            '</div>' +
            '<div class="cal-day-view-body">' + bodyHtml + '</div>' +
          '</div>';

        // Use the grid element area to render day view
        gridEl.insertAdjacentHTML('afterend', '<div id="cal-day-container">' + dayHtml + '</div>');
        // Clean up previous day container if any
        var prev = document.querySelectorAll('#cal-day-container');
        if (prev.length > 1) prev[0].remove();
      }

      function cellHtml(dateStr, dayNum, isOther, isToday, isSelected, maxItems) {
        maxItems = maxItems || 3;
        var classes = 'cal-cell';
        if (isOther) classes += ' cal-cell--other';
        if (isToday) classes += ' cal-cell--today cal-today-enhanced';
        if (isSelected) classes += ' cal-cell--selected';

        var items = calData[dateStr] || {};

        // Density + overdue detection (single pass)
        var count = 0;
        var hasOverdue = false;
        var dots = '';
        var itemHtml = '';
        ['tasks', 'content', 'social', 'reminders', 'activity'].forEach(function (layer) {
          if (!activeLayers[layer]) return;
          var arr = items[layer] || [];
          arr.forEach(function (item) {
            dots += '<span class="cal-cell-dot" style="background:' + LAYER_COLORS[layer] + ';"></span>';
            var tooltip = attrEsc(item.meta ? item.title + ' — ' + item.meta : item.title);
            if (count < maxItems) {
              itemHtml += '<div class="cal-cell-item" title="' + tooltip + '" style="background:' + LAYER_COLORS[layer] + '22;color:' + LAYER_COLORS[layer] + ';">' + esc(item.title) + '</div>';
            }
            if (layer === 'tasks' && item.badge === 'overdue') hasOverdue = true;
            count++;
          });
        });

        // Density class
        if (!isOther) {
          if (count >= 10) classes += ' cal-density-4';
          else if (count >= 6) classes += ' cal-density-3';
          else if (count >= 3) classes += ' cal-density-2';
          else if (count >= 1) classes += ' cal-density-1';
        }
        // Overdue dot
        if (hasOverdue && !isOther) classes += ' cal-overdue';

        var html = '<div class="' + classes + '" data-date="' + dateStr + '">';
        html += '<div class="cal-day-num">' + dayNum;
        if (isToday) html += '<span class="cal-today-badge">TODAY</span>';
        html += '</div>';

        if (dots) html += '<div class="cal-dots">' + dots + '</div>';
        html += itemHtml;
        var stats = getDayStats(items);
        var flags = '';
        if (stats.overdue) flags += '<span class="cal-flag cal-flag--alert"><i class="fas fa-exclamation-triangle"></i> ' + stats.overdue + '</span>';
        if (stats.pendingSocial) flags += '<span class="cal-flag cal-flag--social"><i class="fas fa-share-alt"></i> ' + stats.pendingSocial + '</span>';
        if (stats.reminders) flags += '<span class="cal-flag cal-flag--reminder"><i class="fas fa-bell"></i> ' + stats.reminders + '</span>';
        if (flags) html += '<div class="cal-cell-flags">' + flags + '</div>';
        if (count > maxItems) html += '<div style="font-size:0.4rem;opacity:0.3;">+' + (count - maxItems) + ' more</div>';
        html += '</div>';
        return html;
      }

      function selectDay(dateStr) {
        selectedDate = dateStr;
        localStorage.setItem('ap_calendar_open_day', dateStr);
        // Update selection visuals
        gridEl.querySelectorAll('.cal-cell').forEach(function (c) {
          c.classList.toggle('cal-cell--selected', c.dataset.date === dateStr);
        });
        if (currentView === 'month' || currentView === 'week') {
          detailEl.classList.remove('cal-detail--collapsed');
          renderDetail(dateStr);
        }
      }

      // ── Day Detail Panel ──
      function renderDetail(dateStr) {
        var items = calData[dateStr] || {};
        var d = new Date(dateStr + 'T12:00:00');
        detailDate.textContent = d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
        detailEl.style.display = '';

        var html = '';
        var hasItems = false;

        var sections = [
          { key: 'tasks', label: 'Task Deadlines', icon: 'fa-tasks' },
          { key: 'content', label: 'Content', icon: 'fa-file-alt' },
          { key: 'social', label: 'Social Posts', icon: 'fa-share-alt' },
          { key: 'reminders', label: 'Reminders & Dates', icon: 'fa-bell' },
          { key: 'activity', label: 'Activity', icon: 'fa-history' }
        ];

        sections.forEach(function (sec) {
          if (!activeLayers[sec.key]) return;
          var arr = items[sec.key] || [];
          if (arr.length === 0) return;
          hasItems = true;

          html += '<div class="cal-detail-section">';
          html += '<div class="cal-detail-section-title"><i class="fas ' + sec.icon + '" style="margin-right:0.3rem;"></i>' + sec.label + ' (' + arr.length + ')</div>';

          arr.forEach(function (item) {
            html += '<div class="cal-detail-item">';
            html += '<span class="cal-dot" style="background:' + LAYER_COLORS[sec.key] + ';"></span>';
            html += '<div class="cal-detail-item-info">';
            html += '<div class="cal-detail-item-title">' + esc(item.title) + '</div>';
            if (item.meta) html += '<div class="cal-detail-item-meta">' + esc(item.meta) + '</div>';
            html += '</div>';
            if (item.badge) {
              html += '<span class="cal-detail-item-badge" style="background:' + item.badgeColor + '22;color:' + item.badgeColor + ';">' + esc(item.badge) + '</span>';
            }
            if (item.link) {
              html += '<button class="cal-nav-btn" style="margin-left:auto;font-size:0.5rem;padding:0.15rem 0.4rem;" onclick="window.location.href=\'' + item.link + '\'">Open</button>';
            }
            html += '</div>';
          });

          html += '</div>';
        });

        if (!hasItems) {
          html = '<div class="cal-detail-empty">Nothing scheduled for this day.</div>';
        }

        detailBody.innerHTML = html;
      }

      // ── Stats (view-aware) ──
      function renderStats() {
        var taskCount = 0, contentCount = 0, socialCount = 0, reminderCount = 0;

        // Determine which dates to count based on current view
        var datesToCount = {};
        if (currentView === 'day') {
          var ds = toDateStr(dayViewDate);
          datesToCount[ds] = true;
        } else if (currentView === 'week') {
          for (var i = 0; i < 7; i++) {
            var wd = new Date(weekStartDate);
            wd.setDate(wd.getDate() + i);
            datesToCount[toDateStr(wd)] = true;
          }
        } else {
          var monthPrefix = currentYear + '-' + String(currentMonth + 1).padStart(2, '0');
          Object.keys(calData).forEach(function (ds) {
            if (ds.substring(0, 7) === monthPrefix) datesToCount[ds] = true;
          });
        }

        Object.keys(calData).forEach(function (dateStr) {
          if (!datesToCount[dateStr]) return;
          var d = calData[dateStr];
          taskCount += d.tasks.length;
          contentCount += d.content.length;
          socialCount += d.social.length;
          reminderCount += d.reminders.length;
        });

        var periodLabel = currentView === 'day' ? 'Today' : currentView === 'week' ? 'This Week' : 'This Month';
        statsEl.innerHTML =
          statHtml(taskCount, 'Task Deadlines', '#60a5fa') +
          statHtml(contentCount, 'Content Items', '#34d399') +
          statHtml(socialCount, 'Social Posts', '#a78bfa') +
          statHtml(reminderCount, 'Reminders', '#fbbf24');
      }

      function statHtml(val, label, color) {
        return '<div class="cal-stat"><div class="cal-stat-val" style="color:' + color + ';">' + val + '</div><div class="cal-stat-label">' + label + '</div></div>';
      }

      // ── Helpers ──
      function toDateStr(d) {
        return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
      }
      function esc(s) {
        if (!s) return '';
        var d = document.createElement('div');
        d.textContent = String(s);
        return d.innerHTML;
      }
      function attrEsc(s) {
        if (!s) return '';
        return esc(s).replace(/"/g, '&quot;');
      }
      function getDayStats(items) {
        var stats = { overdue: 0, pendingSocial: 0, reminders: 0 };
        (items.tasks || []).forEach(function (t) {
          if (t.badge === 'overdue') stats.overdue++;
        });
        (items.social || []).forEach(function (s) {
          if (s.badge !== 'success' && s.badge !== 'approved') stats.pendingSocial++;
        });
        stats.reminders = (items.reminders || []).length;
        return stats;
      }
      function quickAddTask(dateStr) {
        var title = prompt('Task title for ' + dateStr + ':');
        if (!title) return;
        AgentEngine.addTask({ title: title, dueDate: dateStr, status: 'todo', priority: 'medium' });
        loadAllData().then(function () {
          render();
          selectDay(dateStr);
        });
      }
      function quickAddReminder(dateStr) {
        var title = prompt('Reminder title for ' + dateStr + ':');
        if (!title) return;
        AgentEngine.addDate({ title: title, date: dateStr, type: 'reminder' });
        loadAllData().then(function () {
          render();
          selectDay(dateStr);
        });
      }
    })();
  </script>

  <script src="/modules/company/js/sidebar.js"></script>
</body>
</html>
