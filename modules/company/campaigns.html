<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Campaigns — AmbientPixels HQ" />
  <link rel="icon" href="/images/favicon.ico" type="image/x-icon" />
  <title>Campaigns — AmbientPixels HQ</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/base.css" />

  <link rel="stylesheet" href="/css/nav.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/theme.css" />
  <link rel="stylesheet" href="/css/banner.css" />

  <link rel="stylesheet" href="/modules/company/css/dashboard.css" />
  <link rel="stylesheet" href="/modules/company/css/objectives.css" />
  <link rel="stylesheet" href="/modules/company/css/sidebar.css" />
  <link rel="stylesheet" href="/modules/company/css/quick-chat.css" />
  <style>
    .cmp-grid { display:grid; grid-template-columns: 1fr; gap: 0.8rem; }
    .cmp-create, .cmp-panel { border:1px solid rgba(255,255,255,0.08); border-radius:10px; background:rgba(255,255,255,0.02); padding:0.75rem 1rem 1rem; }
    .cmp-title { font-size:0.78rem; font-weight:600; opacity:0.82; margin-bottom:0.55rem; }
    .cmp-create input, .cmp-create textarea, .cmp-create select {
      width:100%; background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.08); color:inherit; border-radius:6px;
      padding:0.5rem 0.7rem; font-size:0.8rem; margin-bottom:0.5rem; font-family:inherit; box-sizing:border-box;
    }
    .cmp-create textarea { min-height:60px; resize:vertical; }
    .cmp-create input[type="date"] { -webkit-appearance:none; appearance:none; color-scheme:dark; }
    .cmp-btn { border:1px solid rgba(255,255,255,0.12); background:rgba(255,255,255,0.06); color:rgba(255,255,255,0.7); border-radius:6px; padding:0.35rem 0.75rem; font-size:0.68rem; cursor:pointer; margin-top:0.5rem; }
    .cmp-list-row { display:flex; gap:0.5rem; align-items:center; flex-wrap:wrap; margin-bottom:0.5rem; }
    .cmp-list-row input { flex:1; min-width:200px; background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.08); border-radius:6px; color:inherit; padding:0.38rem 0.55rem; font-size:0.72rem; }
    .cmp-pill { font-size:0.58rem; padding:0.12rem 0.38rem; border-radius:999px; border:1px solid rgba(255,255,255,0.1); opacity:0.85; }
    .cmp-pill--active { color:#34d399; border-color:rgba(52,211,153,0.35); background:rgba(52,211,153,0.08); }
    .cmp-pill--complete { color:rgba(255,255,255,0.45); border-color:rgba(255,255,255,0.15); background:rgba(255,255,255,0.06); }
    .cmp-card--complete { border-color:rgba(255,255,255,0.08); opacity:0.7; }
    .cmp-pill--archived { color:#94a3b8; border-color:rgba(148,163,184,0.35); background:rgba(148,163,184,0.08); }
    .cmp-card { border:1px solid rgba(255,255,255,0.08); background:rgba(255,255,255,0.02); border-radius:8px; padding:0.6rem; margin-bottom:0.45rem; }
    .cmp-card:hover { border-color:rgba(255,255,255,0.15); }
    .cmp-card h4 { margin:0 0 0.25rem; font-size:0.76rem; display:flex; align-items:center; justify-content:space-between; gap:0.5rem; }
    .cmp-card p { margin:0 0 0.35rem; font-size:0.67rem; opacity:0.58; line-height:1.35; }
    .cmp-meta { font-size:0.58rem; opacity:0.45; display:flex; gap:0.4rem; flex-wrap:wrap; }
    .cmp-card-actions { display:flex; gap:0.3rem; flex-wrap:wrap; margin-top:0.45rem; }
    .cmp-card-actions button, .cmp-card-actions a {
      font-size:0.6rem; padding:0.22rem 0.5rem; border-radius:5px;
      border:1px solid rgba(255,255,255,0.1); background:rgba(255,255,255,0.05);
      color:#fff; cursor:pointer; text-decoration:none;
    }
    .cmp-card-actions .cmp-edit-btn {
      border-color:rgba(255,255,255,0.12); background:rgba(255,255,255,0.05); color:rgba(255,255,255,0.6);
    }
    .cmp-card-actions .danger { border-color:rgba(248,113,113,0.4); background:rgba(248,113,113,0.05); color:#f87171; }
    .cmp-progress-bar { height:4px; border-radius:2px; background:rgba(255,255,255,0.06); margin:0.35rem 0 0.25rem; overflow:hidden; }
    .cmp-progress-fill { height:100%; border-radius:2px; transition:width 0.3s; }
    .cmp-task-breakdown { font-size:0.6rem; font-weight:500; margin-bottom:0.15rem; }
    .cmp-empty { font-size:0.7rem; opacity:0.3; padding:0.8rem 0.25rem; }
    .cmp-detail { border:1px solid rgba(255,255,255,0.08); background:rgba(255,255,255,0.02); border-radius:10px; padding:0.75rem; }
    .cmp-detail-head { display:flex; justify-content:space-between; align-items:center; gap:0.5rem; margin-bottom:0.5rem; }
    .cmp-detail h3 { margin:0; font-size:0.82rem; }
    .cmp-actions { display:flex; gap:0.3rem; flex-wrap:wrap; }
    .cmp-actions button { font-size:0.6rem; padding:0.22rem 0.5rem; border-radius:5px; border:1px solid rgba(255,255,255,0.15); background:rgba(255,255,255,0.05); color:inherit; cursor:pointer; }
    .cmp-actions .danger { border-color:rgba(248,113,113,0.4); color:#f87171; }
    .cmp-detail-list li { list-style:none; margin:0 0 0.25rem; padding:0.38rem 0.5rem; border:1px solid rgba(255,255,255,0.08); border-radius:6px; font-size:0.66rem; display:flex; justify-content:space-between; gap:0.4rem; }
    .cmp-mini-create { margin-top:0.6rem; border-top:1px solid rgba(255,255,255,0.08); padding-top:0.6rem; }
    .cmp-mini-create input, .cmp-mini-create textarea, .cmp-mini-create select {
      width:100%; background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.1); color:inherit; border-radius:6px;
      padding:0.4rem 0.5rem; font-size:0.68rem; margin-bottom:0.35rem;
    }
    .cmp-modal-backdrop {
      position: fixed; inset: 0; background: rgba(0, 0, 0, 0.55);
      display: none; align-items: center; justify-content: center; z-index: 1200;
      padding: 1rem;
    }
    .cmp-modal-backdrop.visible { display: flex; }
    .cmp-modal {
      width: min(560px, 100%);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 10px;
      background: #1c1c1e;
      padding: 0.9rem;
      box-shadow: 0 18px 50px rgba(0,0,0,0.45);
    }
    .cmp-modal h3 { margin: 0 0 0.65rem; font-size: 0.82rem; color:rgba(255,255,255,0.85); }
    .cmp-modal label { display:block; font-size:0.66rem; opacity:0.72; margin-bottom:0.25rem; }
    .cmp-modal input, .cmp-modal textarea, .cmp-modal select {
      width:100%; background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.12);
      color:inherit; border-radius:6px; padding:0.45rem 0.55rem; font-size:0.72rem; margin-bottom:0.45rem; box-sizing:border-box;
    }
    .cmp-modal textarea { min-height:76px; resize:vertical; }
    .cmp-modal-actions { display:flex; justify-content:flex-end; gap:0.35rem; margin-top:0.35rem; }
    .cmp-modal-actions button { font-size:0.62rem; padding:0.25rem 0.62rem; border-radius:5px; cursor:pointer; }
    .cmp-modal-cancel { border:1px solid rgba(255,255,255,0.15); background:rgba(255,255,255,0.05); color:inherit; }
    .cmp-modal-save { border:1px solid rgba(255,255,255,0.15); background:rgba(255,255,255,0.08); color:rgba(255,255,255,0.85); }
    .cmp-pill--paused { background:rgba(251,191,36,0.12); color:#fbbf24; border-color:rgba(251,191,36,0.3); }
    .cmp-card--paused { border-color:rgba(251,191,36,0.2); opacity:0.85; }
    .cmp-card--paused .cmp-progress-fill { opacity:0.4; }
    .cmp-pause-btn { background:rgba(251,191,36,0.1) !important; border-color:rgba(251,191,36,0.3) !important; color:#fbbf24 !important; }
    .cmp-resume-btn { background:rgba(52,211,153,0.1) !important; border-color:rgba(52,211,153,0.3) !important; color:#34d399 !important; }
    .cmp-view-btn { background:transparent; border:1px solid rgba(255,255,255,0.1); color:rgba(255,255,255,0.4); border-radius:5px; padding:0.25rem 0.4rem; font-size:0.65rem; cursor:pointer; }
    .cmp-view-btn:hover { border-color:rgba(255,255,255,0.25); color:rgba(255,255,255,0.7); }
    .cmp-view-btn--active { background:rgba(255,255,255,0.1); border-color:rgba(255,255,255,0.25); color:rgba(255,255,255,0.9); }
    .cmp-list-table { width:100%; border-collapse:collapse; font-size:0.68rem; }
    .cmp-list-table th { text-align:left; font-size:0.58rem; text-transform:uppercase; letter-spacing:0.5px; opacity:0.4; padding:0.4rem 0.5rem; border-bottom:1px solid rgba(255,255,255,0.06); font-weight:600; }
    .cmp-list-table td { padding:0.45rem 0.5rem; border-bottom:1px solid rgba(255,255,255,0.03); vertical-align:middle; }
    .cmp-list-table tr:hover { background:rgba(255,255,255,0.03); }
    .cmp-list-table .cmp-tbl-bar { height:4px; border-radius:2px; background:rgba(255,255,255,0.06); min-width:60px; overflow:hidden; }
    .cmp-list-table .cmp-tbl-fill { height:100%; border-radius:2px; }

    /* ── Inline Style Replacements ── */
    #cmp-main { max-width: 900px; margin: 0 auto; padding: 1rem; }
    .cmp-header-sub { font-size: 0.8rem; opacity: 0.45; margin-top: 0.3rem; margin-bottom: 0.75rem; }
    .cmp-types-outer { display: flex; gap: 0.5rem; margin-top: 0.35rem; }
    .cmp-field-col--full { flex: 1; display: flex; flex-direction: column; gap: 0.15rem; }
    .cmp-field-col { display: flex; flex-direction: column; gap: 0.15rem; }
    .cmp-field-label { font-size: 0.6rem; opacity: 0.5; text-transform: uppercase; letter-spacing: 0.5px; }
    #cmp-task-types, #cmp-edit-task-types { display: flex; gap: 0.4rem 0.6rem; flex-wrap: wrap; font-size: 0.65rem; }
    .cmp-check-label { display: flex; align-items: center; gap: 3px; cursor: pointer; }
    .cmp-settings-row { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 0.3rem; }
    .cmp-settings-row--edit { margin-top: 0.4rem; }
    #cmp-frequency, #cmp-edit-frequency { width: 5.5rem; margin-bottom: 0; }
    #cmp-cadence, #cmp-edit-cadence { width: 6.5rem; margin-bottom: 0; }
    #cmp-start-date, #cmp-end-date, #cmp-edit-start-date, #cmp-edit-end-date { width: 8rem; margin-bottom: 0; }
    #cmp-search { min-width: 140px; }
    .cmp-view-btns { display: flex; align-items: center; gap: 0.35rem; }
    .cmp-archive-toggle { font-size: 0.66rem; opacity: 0.6; display: flex; align-items: center; gap: 0.25rem; }
    .cmp-edit-types-wrap { margin-top: 0.5rem; }
    .cmp-autocomplete-row { display: flex; align-items: center; gap: 0.25rem; margin-top: 1.1rem; }
    .cmp-autocomplete-label { font-size: 0.65rem; opacity: 0.7; }
  </style>
</head>
<body data-theme="dark">
  <main class="content-section" id="cmp-main">
    <div class="company-header obj-header">
      <div>
        <h1><i class="fas fa-layer-group co-icon-mr-lg dash-icon-orange"></i>Campaigns</h1>
        <p class="cmp-header-sub">Goal → Campaign → Task</p>
      </div>
      <div class="obj-header-pills">
        <span class="obj-pill obj-pill--active" id="cmp-active-count">0 active</span>
        <span class="obj-pill obj-pill--complete" id="cmp-archived-count">0 archived</span>
      </div>
    </div>

    <div class="cmp-grid">
      <section class="cmp-create">
        <div class="cmp-title"><i class="fas fa-plus-circle dash-icon-mr dash-icon-orange"></i>New Campaign</div>
        <input id="cmp-title" type="text" placeholder="Campaign title..." />
        <textarea id="cmp-desc" placeholder="Description (optional)..."></textarea>
        <select id="cmp-objective"><option value="">No goal</option></select>
        <div class="cmp-types-outer">
          <div class="cmp-field-col--full">
            <span class="cmp-field-label">Allowed Types</span>
            <div id="cmp-task-types">
              <label class="cmp-check-label"><input type="checkbox" value="blog_post" />Blog</label>
              <label class="cmp-check-label"><input type="checkbox" value="research" />Research</label>
              <label class="cmp-check-label"><input type="checkbox" value="social_linkedin" />LinkedIn</label>
              <label class="cmp-check-label"><input type="checkbox" value="social_x" />X</label>
              <label class="cmp-check-label"><input type="checkbox" value="social_bluesky" />Bluesky</label>
              <label class="cmp-check-label"><input type="checkbox" value="social_reddit" />Reddit</label>
              <label class="cmp-check-label"><input type="checkbox" value="social_facebook" />Facebook</label>
              <label class="cmp-check-label"><input type="checkbox" value="internal_doc" />Doc</label>
              <label class="cmp-check-label"><input type="checkbox" value="ops" />Ops</label>
              <label class="cmp-check-label"><input type="checkbox" value="financial" />Financial</label>
            </div>
          </div>
        </div>
        <div class="cmp-settings-row">
          <div class="cmp-field-col">
            <span class="cmp-field-label">Frequency</span>
            <input id="cmp-frequency" type="number" min="1" placeholder="per period" title="Posts per cadence period per platform" />
          </div>
          <div class="cmp-field-col">
            <span class="cmp-field-label">Cadence</span>
            <select id="cmp-cadence">
              <option value="">None</option>
              <option value="daily">Daily</option>
              <option value="weekly">Weekly</option>
              <option value="biweekly">Biweekly</option>
            </select>
          </div>
          <div class="cmp-field-col">
            <span class="cmp-field-label">Start Date</span>
            <input id="cmp-start-date" type="date" />
          </div>
          <div class="cmp-field-col">
            <span class="cmp-field-label">End Date</span>
            <input id="cmp-end-date" type="date" />
          </div>
        </div>
        <button class="cmp-btn" id="cmp-create-btn">Create Campaign</button>
      </section>

      <section class="cmp-panel">
        <div class="cmp-list-row">
          <input id="cmp-search" type="text" placeholder="Search campaigns..." />
          <div class="cmp-view-btns">
            <button id="cmp-view-card" class="cmp-view-btn cmp-view-btn--active" title="Card view"><i class="fas fa-th-large"></i></button>
            <button id="cmp-view-list" class="cmp-view-btn" title="List view"><i class="fas fa-list"></i></button>
          </div>
          <label class="cmp-archive-toggle">
            <input type="checkbox" id="cmp-show-archived" /> Show completed &amp; archived
          </label>
        </div>
        <div id="cmp-list"></div>
      </section>

    </div>
  </main>

  <div class="cmp-modal-backdrop" id="cmp-edit-modal">
    <div class="cmp-modal">
      <h3>Edit Campaign</h3>
      <label for="cmp-edit-title">Title</label>
      <input type="text" id="cmp-edit-title" />

      <label for="cmp-edit-desc">Description</label>
      <textarea id="cmp-edit-desc"></textarea>

      <label for="cmp-edit-objective">Linked Goal</label>
      <select id="cmp-edit-objective"></select>

      <label for="cmp-edit-status">Status</label>
      <select id="cmp-edit-status">
        <option value="active">Active</option>
        <option value="complete">Complete</option>
        <option value="archived">Archived</option>
      </select>

      <div class="cmp-edit-types-wrap">
        <span class="cmp-field-label">Allowed Types</span>
        <div id="cmp-edit-task-types">
          <label class="cmp-check-label"><input type="checkbox" value="blog_post" />Blog</label>
          <label class="cmp-check-label"><input type="checkbox" value="research" />Research</label>
          <label class="cmp-check-label"><input type="checkbox" value="social_linkedin" />LinkedIn</label>
          <label class="cmp-check-label"><input type="checkbox" value="social_x" />X</label>
          <label class="cmp-check-label"><input type="checkbox" value="social_bluesky" />Bluesky</label>
          <label class="cmp-check-label"><input type="checkbox" value="social_reddit" />Reddit</label>
          <label class="cmp-check-label"><input type="checkbox" value="social_facebook" />Facebook</label>
          <label class="cmp-check-label"><input type="checkbox" value="internal_doc" />Doc</label>
          <label class="cmp-check-label"><input type="checkbox" value="ops" />Ops</label>
          <label class="cmp-check-label"><input type="checkbox" value="financial" />Financial</label>
        </div>
      </div>
      <div class="cmp-settings-row cmp-settings-row--edit">
        <div class="cmp-field-col">
          <span class="cmp-field-label">Frequency</span>
          <input type="number" id="cmp-edit-frequency" min="1" placeholder="per period" title="Posts per cadence period per platform" />
        </div>
        <div class="cmp-field-col">
          <span class="cmp-field-label">Cadence</span>
          <select id="cmp-edit-cadence">
            <option value="">None</option>
            <option value="daily">Daily</option>
            <option value="weekly">Weekly</option>
            <option value="biweekly">Biweekly</option>
          </select>
        </div>
        <div class="cmp-field-col">
          <span class="cmp-field-label">Start Date</span>
          <input type="date" id="cmp-edit-start-date" />
        </div>
        <div class="cmp-field-col">
          <span class="cmp-field-label">End Date</span>
          <input type="date" id="cmp-edit-end-date" />
        </div>
        <div class="cmp-autocomplete-row">
          <input type="checkbox" id="cmp-edit-auto-complete" checked />
          <label for="cmp-edit-auto-complete" class="cmp-autocomplete-label">Auto-complete</label>
        </div>
      </div>

      <div class="cmp-modal-actions">
        <button class="cmp-modal-cancel" id="cmp-edit-cancel">Cancel</button>
        <button class="cmp-modal-save" id="cmp-edit-save">Save</button>
      </div>
    </div>
  </div>

  <script src="/modules/company/js/demo-toast.js"></script>
  <script src="/js/company-store.js"></script>
  <script src="/js/agent-engine.js"></script>
  <script src="/modules/company/js/quick-chat.js"></script>
  <script>
    (function () {
      'use strict';

      var editingCampaignId = null;

      var listEl = document.getElementById('cmp-list');
      var searchEl = document.getElementById('cmp-search');
      var archivedToggleEl = document.getElementById('cmp-show-archived');

      var titleEl = document.getElementById('cmp-title');
      var descEl = document.getElementById('cmp-desc');
      var objectiveEl = document.getElementById('cmp-objective');
      var editModal = document.getElementById('cmp-edit-modal');
      var editTitleEl = document.getElementById('cmp-edit-title');
      var editDescEl = document.getElementById('cmp-edit-desc');
      var editObjectiveEl = document.getElementById('cmp-edit-objective');
      var editStatusEl = document.getElementById('cmp-edit-status');
      var editCancelBtn = document.getElementById('cmp-edit-cancel');
      var editSaveBtn = document.getElementById('cmp-edit-save');


      function esc(str) {
        var d = document.createElement('div');
        d.textContent = str == null ? '' : String(str);
        return d.innerHTML;
      }

      function getVisibleCampaigns() {
        var q = (searchEl.value || '').trim().toLowerCase();
        var showArchived = !!archivedToggleEl.checked;
        var all = (typeof AgentEngine.getCampaigns === 'function' ? AgentEngine.getCampaigns() : []).filter(function (c) {
          return c && !c.deletedAt;
        });
        return all.filter(function (c) {
          if (!showArchived && (c.status === 'archived' || c.status === 'complete' || c.status === 'completed')) return false;
          if (!q) return true;
          var hay = ((c.title || '') + ' ' + (c.description || '') + ' ' + (c.id || '')).toLowerCase();
          return hay.indexOf(q) !== -1;
        }).sort(function (a, b) {
          // Active first, then complete, then archived
          var statusOrder = { active: 0, paused: 1, complete: 2, archived: 3 };
          var aOrd = statusOrder[a.status] !== undefined ? statusOrder[a.status] : 1;
          var bOrd = statusOrder[b.status] !== undefined ? statusOrder[b.status] : 1;
          if (aOrd !== bOrd) return aOrd - bOrd;
          return (b.createdAt || '').localeCompare(a.createdAt || '');
        });
      }

      function objectiveTitle(id) {
        if (!id || typeof AgentEngine.getObjectives !== 'function') return null;
        var obj = AgentEngine.getObjectives().find(function (o) { return o.id === id; });
        return obj ? obj.title : null;
      }

      function renderCounts() {
        var all = (typeof AgentEngine.getCampaigns === 'function' ? AgentEngine.getCampaigns() : []).filter(function (c) { return c && !c.deletedAt; });
        var active = all.filter(function (c) { return c.status === 'active'; }).length;
        var completed = all.filter(function (c) { return c.status === 'complete' || c.status === 'completed'; }).length;
        var archived = all.filter(function (c) { return c.status === 'archived'; }).length;
        document.getElementById('cmp-active-count').textContent = active + ' active';
        document.getElementById('cmp-archived-count').textContent = (completed + archived) + ' completed/archived';
      }

      function dateRangeHtml(startDate, endDate) {
        if (!startDate && !endDate) return '';
        var now = Date.now();
        var fmt = function (iso) { return new Date(iso).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }); };
        var startMs = startDate ? new Date(startDate).getTime() : now;
        var endMs = endDate ? new Date(endDate).getTime() : null;

        var dateText = '';
        if (startDate && endDate) dateText = fmt(startDate) + ' → ' + fmt(endDate);
        else if (startDate) dateText = 'Started ' + fmt(startDate);
        else if (endDate) dateText = 'Ends ' + fmt(endDate);

        var rightText = '';
        var rightColor = 'rgba(255,255,255,0.35)';
        if (endMs) {
          var daysLeft = Math.ceil((endMs - now) / 86400000);
          if (daysLeft > 0) { rightText = daysLeft + 'd left'; rightColor = daysLeft <= 7 ? '#fbbf24' : 'rgba(255,255,255,0.35)'; }
          else if (daysLeft === 0) { rightText = 'Ends today'; rightColor = '#ef4444'; }
          else { rightText = Math.abs(daysLeft) + 'd ago'; rightColor = '#c084fc'; }
        }
        if (startMs > now) {
          var daysUntil = Math.ceil((startMs - now) / 86400000);
          rightText = 'Starts in ' + daysUntil + 'd';
          rightColor = '#60a5fa';
        }

        // Timeline position
        var timelineHtml = '';
        if (startDate && endDate && startMs < endMs) {
          var elapsed = Math.max(0, Math.min(1, (now - startMs) / (endMs - startMs)));
          var pct = Math.round(elapsed * 100);
          timelineHtml = '<div style="flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,0.06);position:relative;min-width:40px;">' +
            '<div style="height:100%;width:' + pct + '%;border-radius:2px;background:rgba(255,255,255,0.15);"></div>' +
            '<div style="position:absolute;top:-2px;left:' + pct + '%;width:7px;height:7px;border-radius:50%;background:' + rightColor + ';transform:translateX(-50%);"></div>' +
          '</div>';
        }

        return '<div style="display:flex;align-items:center;gap:0.5rem;font-size:0.62rem;margin:0.15rem 0 0.3rem;opacity:0.7;">' +
          '<span style="color:rgba(255,255,255,0.5);"><i class="fas fa-calendar-alt" style="font-size:0.5rem;margin-right:3px;"></i>' + dateText + '</span>' +
          timelineHtml +
          (rightText ? '<span style="color:' + rightColor + ';font-weight:600;white-space:nowrap;">' + rightText + '</span>' : '') +
        '</div>';
      }

      // Compute campaign container metrics
      function campaignMetrics(c) {
        var progress = (typeof AgentEngine.getCampaignProgress === 'function') ? AgentEngine.getCampaignProgress(c.id) : null;
        var taskCount = progress ? progress.total : 0;
        var pctComplete = progress ? progress.pct : 0;
        var donePct = progress ? progress.donePct : 0;
        // Health: based on task signal, fallback to neutral if no tasks
        var health = 'neutral';
        if (progress && progress.signal === 'complete') health = 'good';
        else if (progress && progress.signal === 'on_track') health = 'good';
        else if (progress && (progress.signal === 'at_risk' || progress.signal === 'stale' || progress.signal === 'behind')) health = 'warn';
        else if (progress && progress.signal === 'blocked') health = 'bad';
        else if (taskCount > 0) health = pctComplete >= 75 ? 'good' : pctComplete >= 40 ? 'warn' : 'bad';
        return { taskCount: taskCount, pctComplete: pctComplete, donePct: donePct, health: health, signal: progress ? progress.signal : 'no_tasks' };
      }

      function healthChip(health) {
        var colors = { good: '#34d399', warn: '#fbbf24', bad: '#ef4444', neutral: '#64748b' };
        var labels = { good: 'Healthy', warn: 'At Risk', bad: 'Critical', neutral: 'Empty' };
        var icons = { good: 'fa-check-circle', warn: 'fa-exclamation-triangle', bad: 'fa-times-circle', neutral: 'fa-minus-circle' };
        var c = colors[health] || colors.neutral;
        return '<span style="display:inline-flex;align-items:center;gap:3px;font-size:0.54rem;padding:0.08rem 0.35rem;border-radius:4px;' +
          'background:' + c + '1a;border:1px solid ' + c + '33;color:' + c + ';font-weight:500;"><i class="fas ' + icons[health] + '" style="font-size:0.48rem;"></i>' + labels[health] + '</span>';
      }

      function lifecycleBadges(c, m) {
        var badges = [];
        var bStyle = 'display:inline-flex;align-items:center;gap:3px;font-size:0.52rem;padding:0.08rem 0.35rem;border-radius:4px;font-weight:500;';
        var dimStyle = bStyle + 'background:rgba(148,163,184,0.1);border:1px solid rgba(148,163,184,0.2);color:#94a3b8;';
        if (c.frequency && c.cadence) {
          var _bSocialTypes = (Array.isArray(c.allowedTaskTypes) ? c.allowedTaskTypes : []).filter(function(tt) { return /^social_/.test(tt); });
          var _bPlatformCount = _bSocialTypes.length || 1;
          var _bCadenceDays = { daily: 1, weekly: 7, biweekly: 14 };
          var _bPeriodDays = _bCadenceDays[c.cadence] || 7;
          var _bStartMs = c.startDate ? new Date(c.startDate).getTime() : Date.now();
          var _bEndMs = c.endDate ? new Date(c.endDate).getTime() : (_bStartMs + 90 * 86400000);
          var _bPeriods = Math.ceil(Math.max(1, Math.ceil((_bEndMs - _bStartMs) / 86400000)) / _bPeriodDays);
          var _bDerived = c.frequency * _bPeriods * _bPlatformCount;
          var used = m ? m.taskCount : 0;
          var full = used >= _bDerived;
          var s = full ? bStyle + 'background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.25);color:#ef4444;' : dimStyle;
          badges.push('<span style="' + s + '"><i class="fas fa-bolt" style="font-size:0.44rem;"></i>' + c.frequency + '\u00d7/' + c.cadence + '/platform (' + used + '/' + _bDerived + ')' + (full ? ' FULL' : '') + '</span>');
        } else if (c.maxTasks) {
          var used = m ? m.taskCount : 0;
          var full = used >= c.maxTasks;
          var s = full ? bStyle + 'background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.25);color:#ef4444;' : dimStyle;
          badges.push('<span style="' + s + '"><i class="fas fa-layer-group" style="font-size:0.44rem;"></i>' + used + '/' + c.maxTasks + (full ? ' FULL' : '') + '</span>');
        }
        if (c.cadence) badges.push('<span style="' + dimStyle + '"><i class="fas fa-clock" style="font-size:0.44rem;"></i>' + c.cadence + '</span>');
        var _types = Array.isArray(c.allowedTaskTypes) && c.allowedTaskTypes.length > 0 ? c.allowedTaskTypes : (c.taskType ? [c.taskType] : []);
        if (_types.length > 0) badges.push('<span style="' + dimStyle + '"><i class="fas fa-filter" style="font-size:0.44rem;"></i>' + _types.join(', ') + '</span>');
        // Dates now shown in dateRangeHtml above the card body
        if (c.autoComplete === false) badges.push('<span style="' + dimStyle + '"><i class="fas fa-infinity" style="font-size:0.44rem;"></i>Ongoing</span>');
        if (badges.length === 0) return '';
        return '<div style="display:flex;gap:0.3rem;flex-wrap:wrap;margin-top:0.25rem;">' + badges.join('') + '</div>';
      }

      var _cmpViewMode = 'card';

      function renderListView() {
        var campaigns = getVisibleCampaigns();
        renderCounts();
        if (campaigns.length === 0) { listEl.innerHTML = '<div class="cmp-empty">No campaigns found.</div>'; return; }
        var fmt = function (iso) { return iso ? new Date(iso).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) : '—'; };
        var now = Date.now();
        var html = '<table class="cmp-list-table"><thead><tr>' +
          '<th>Campaign</th><th>Status</th><th>Progress</th><th>Tasks</th><th>Dates</th><th>Goal</th><th></th>' +
          '</tr></thead><tbody>';
        campaigns.forEach(function (c) {
          var m = campaignMetrics(c);
          var p = (typeof AgentEngine.getCampaignProgress === 'function') ? AgentEngine.getCampaignProgress(c.id) : null;
          var barColor = m.health === 'good' ? '#34d399' : m.health === 'warn' ? '#fbbf24' : m.health === 'bad' ? '#ef4444' : '#64748b';
          var statusColor = c.status === 'active' ? '#34d399' : c.status === 'complete' ? '#c084fc' : c.status === 'paused' ? '#fbbf24' : '#94a3b8';
          var objTitle = objectiveTitle(c.objective_id);
          var primaryDone = p && p.primaryDone !== undefined ? p.primaryDone : (p ? p.done : 0);
          var expected = p ? (p.expectedTotal || p.total) : 0;
          var daysLeft = '';
          if (c.endDate) {
            var dl = Math.ceil((new Date(c.endDate).getTime() - now) / 86400000);
            daysLeft = dl > 0 ? dl + 'd left' : dl === 0 ? 'Today' : Math.abs(dl) + 'd ago';
          }
          html += '<tr>' +
            '<td><strong>' + esc(c.title) + '</strong></td>' +
            '<td><span style="color:' + statusColor + ';font-size:0.62rem;font-weight:600;">' + esc(c.status) + '</span></td>' +
            '<td style="min-width:100px;"><div class="cmp-tbl-bar"><div class="cmp-tbl-fill" style="width:' + m.pctComplete + '%;background:' + barColor + ';"></div></div><span style="font-size:0.58rem;color:' + barColor + ';font-weight:600;">' + m.pctComplete + '%</span></td>' +
            '<td style="font-size:0.62rem;">' + primaryDone + '/' + expected + '</td>' +
            '<td style="font-size:0.6rem;opacity:0.5;white-space:nowrap;">' + fmt(c.startDate) + ' → ' + fmt(c.endDate) + (daysLeft ? '<br><span style="font-size:0.55rem;opacity:0.7;">' + daysLeft + '</span>' : '') + '</td>' +
            '<td style="font-size:0.6rem;color:rgba(255,255,255,0.5);max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + (objTitle ? esc(objTitle) : '<span style="opacity:0.2;">—</span>') + '</td>' +
            '<td><button class="cmp-edit-btn" data-id="' + esc(c.id) + '" style="font-size:0.55rem;padding:0.15rem 0.35rem;border:1px solid rgba(255,255,255,0.1);background:transparent;color:rgba(255,255,255,0.5);border-radius:4px;cursor:pointer;"><i class="fas fa-pen"></i></button></td>' +
          '</tr>';
        });
        html += '</tbody></table>';
        listEl.innerHTML = html;
        listEl.querySelectorAll('.cmp-edit-btn').forEach(function (btn) {
          btn.addEventListener('click', function () { openEditModal(btn.getAttribute('data-id')); });
        });
      }

      function renderList() {
        if (_cmpViewMode === 'list') { renderListView(); return; }
        var campaigns = getVisibleCampaigns();
        renderCounts();
        if (campaigns.length === 0) {
          listEl.innerHTML = '<div class="cmp-empty">No campaigns found.</div>';
          return;
        }
        var html = '';
        campaigns.forEach(function (c) {
          var objTitle = objectiveTitle(c.objective_id);
          var m = campaignMetrics(c);
          // Build progress bar color
          var barColor = m.health === 'good' ? '#34d399' : m.health === 'warn' ? '#fbbf24' : m.health === 'bad' ? '#ef4444' : '#64748b';
          var progress = (typeof AgentEngine.getCampaignProgress === 'function') ? AgentEngine.getCampaignProgress(c.id) : null;
          var breakdownParts = [];
          if (progress && progress.total > 0) {
            breakdownParts.push((progress.primaryDone !== undefined ? progress.primaryDone : progress.done) + '/' + (progress.expectedTotal || progress.total) + ' done');
            if (progress.inProgress > 0) breakdownParts.push(progress.inProgress + ' active');
            if (progress.review > 0) breakdownParts.push(progress.review + ' in review');
          }
          // Status pill class
          var pillCls = 'cmp-pill--active';
          if (c.status === 'archived') pillCls = 'cmp-pill--archived';
          else if (c.status === 'complete') pillCls = 'cmp-pill--complete';
          else if (c.status === 'paused') pillCls = 'cmp-pill--paused';

          var cardCls = 'cmp-card';
          if (c.status === 'paused') cardCls += ' cmp-card--paused';
          else if (c.status === 'complete') cardCls += ' cmp-card--complete';

          html += '<div class="' + cardCls + '" data-id="' + esc(c.id) + '">'
            + '<h4>' + esc(c.title) + '<span class="cmp-pill ' + pillCls + '">' + esc(c.status) + '</span></h4>'
            + dateRangeHtml(c.startDate, c.endDate)
            + (c.description ? '<p>' + esc(c.description) + '</p>' : '')
            + '<div class="cmp-progress-bar"><div class="cmp-progress-fill" style="width:' + m.pctComplete + '%; background:' + barColor + ';"></div></div>'
            + '<div class="cmp-task-breakdown" style="color:' + barColor + ';">'
            + '<span style="font-weight:700;">' + m.pctComplete + '%</span> '
            + (breakdownParts.length > 0 ? breakdownParts.join('  ') : (m.taskCount === 0 ? 'No tasks yet' : m.taskCount + ' tasks'))
            + '</div>'
            + '<div class="cmp-meta" style="gap:0.55rem;">'
            + '<span><i class="fas fa-tasks" style="margin-right:2px;"></i>' + m.taskCount + ' tasks</span>'
            + healthChip(m.health)
            + (objTitle ? '<span style="display:inline-flex;align-items:center;gap:3px;font-size:0.54rem;padding:0.08rem 0.35rem;border-radius:4px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);color:rgba(255,255,255,0.5);"><i class="fas fa-bullseye" style="font-size:0.48rem;"></i>' + esc(objTitle) + '</span>' : '')
            + '</div>'
            + lifecycleBadges(c, m)
            + '<div class="cmp-card-actions">'
            + '<button class="cmp-edit-btn" data-id="' + esc(c.id) + '"><i class="fas fa-pen"></i> Edit</button>'
            + '<a href="/modules/company/tasks.html?campaign=' + encodeURIComponent(c.id) + '"><i class="fas fa-tasks"></i> View Tasks</a>'
            + (c.status === 'paused'
                ? '<button class="cmp-resume-btn" data-id="' + esc(c.id) + '"><i class="fas fa-play"></i> Resume</button>'
                : (c.status !== 'archived' ? '<button class="cmp-pause-btn" data-id="' + esc(c.id) + '"><i class="fas fa-pause"></i> Pause</button>' : ''))
            + (c.status === 'archived'
                ? '<button class="cmp-unarchive-btn" data-id="' + esc(c.id) + '"><i class="fas fa-box-open"></i> Unarchive</button>'
                : '<button class="cmp-archive-btn" data-id="' + esc(c.id) + '"><i class="fas fa-box"></i> Archive</button>')
            + '<button class="cmp-delete-btn danger" data-id="' + esc(c.id) + '"><i class="fas fa-trash"></i> Delete</button>'
            + '</div>'
            + '</div>';
        });
        listEl.innerHTML = html;

        listEl.querySelectorAll('.cmp-edit-btn').forEach(function (btn) {
          btn.addEventListener('click', function () {
            openEditModal(btn.getAttribute('data-id'));
          });
        });

        listEl.querySelectorAll('.cmp-archive-btn').forEach(function (btn) {
          btn.addEventListener('click', function () {
            var id = btn.getAttribute('data-id');
            AgentEngine.archiveCampaign(id);
            persistCampaigns();
            renderAll();
          });
        });

        listEl.querySelectorAll('.cmp-unarchive-btn').forEach(function (btn) {
          btn.addEventListener('click', function () {
            var id = btn.getAttribute('data-id');
            AgentEngine.unarchiveCampaign(id);
            persistCampaigns();
            renderAll();
          });
        });

        listEl.querySelectorAll('.cmp-pause-btn').forEach(function (btn) {
          btn.addEventListener('click', function () {
            var id = btn.getAttribute('data-id');
            if (!confirm('Pause this campaign? All task mutations will be frozen until resumed.')) return;
            AgentEngine.updateCampaign(id, { status: 'paused' });
            persistCampaigns();
            renderAll();
          });
        });

        listEl.querySelectorAll('.cmp-resume-btn').forEach(function (btn) {
          btn.addEventListener('click', function () {
            var id = btn.getAttribute('data-id');
            AgentEngine.updateCampaign(id, { status: 'active' });
            persistCampaigns();
            renderAll();
          });
        });

        listEl.querySelectorAll('.cmp-delete-btn').forEach(function (btn) {
          btn.addEventListener('click', function () {
            var id = btn.getAttribute('data-id');
            if (!confirm('Soft-delete this campaign? Active children will block deletion.')) return;
            var r = AgentEngine.deleteCampaign(id);
            if (!r || !r.ok) {
              alert('Delete blocked. Archive child tasks first.');
              return;
            }
            persistCampaigns();
            renderAll();
          });
        });
      }

      function closeEditModal() {
        editModal.classList.remove('visible');
        editingCampaignId = null;
      }

      function populateModalObjectiveSelect(selectedId) {
        var opts = '<option value="">No goal</option>';
        var objectives = typeof AgentEngine.getObjectives === 'function' ? AgentEngine.getObjectives() : [];
        objectives.forEach(function (o) {
          if (!o || !o.id || o.status === 'canceled') return;
          var sel = selectedId && selectedId === o.id ? ' selected' : '';
          opts += '<option value="' + esc(o.id) + '"' + sel + '>' + esc(o.title || o.id) + '</option>';
        });
        editObjectiveEl.innerHTML = opts;
      }

      function openEditModal(campaignId) {
        var c = AgentEngine.getCampaigns().find(function (x) { return x.id === campaignId && !x.deletedAt; });
        if (!c) return;
        editingCampaignId = campaignId;
        editTitleEl.value = c.title || '';
        editDescEl.value = c.description || '';
        editStatusEl.value = c.status || 'active';
        populateModalObjectiveSelect(c.objective_id || '');
        var _editTypes = Array.isArray(c.allowedTaskTypes) ? c.allowedTaskTypes : (c.taskType ? [c.taskType] : []);
        document.getElementById('cmp-edit-task-types').querySelectorAll('input[type="checkbox"]').forEach(function (cb) { cb.checked = _editTypes.indexOf(cb.value) !== -1; });
        document.getElementById('cmp-edit-frequency').value = c.frequency || '';
        document.getElementById('cmp-edit-cadence').value = c.cadence || '';
        document.getElementById('cmp-edit-start-date').value = c.startDate ? c.startDate.substring(0, 10) : '';
        document.getElementById('cmp-edit-end-date').value = c.endDate ? c.endDate.substring(0, 10) : '';
        document.getElementById('cmp-edit-auto-complete').checked = c.autoComplete !== false;
        editModal.classList.add('visible');
        editTitleEl.focus();
      }

      function persistCampaigns() {
        if (typeof CompanyStore !== 'undefined' && CompanyStore.setState) {
          CompanyStore.setState('ap_campaigns', AgentEngine.getCampaigns());
        }
      }

      function persistDirectives() {
        if (typeof CompanyStore !== 'undefined' && CompanyStore.setState) {
          CompanyStore.setState('ap_directives', AgentEngine.getDirectives());
        }
      }

      function populateObjectiveSelect() {
        var opts = '<option value="">No goal</option>';
        var objectives = typeof AgentEngine.getObjectives === 'function' ? AgentEngine.getObjectives() : [];
        objectives.forEach(function (o) {
          if (!o || !o.id || o.status === 'canceled') return;
          opts += '<option value="' + esc(o.id) + '">' + esc(o.title || o.id) + '</option>';
        });
        objectiveEl.innerHTML = opts;
      }

      function renderAll() {
        try { renderList(); } catch(e) { console.warn('[Campaigns] renderList error:', e); }
      }

      editCancelBtn.addEventListener('click', closeEditModal);
      editModal.addEventListener('click', function (e) {
        if (e.target === editModal) closeEditModal();
      });
      editSaveBtn.addEventListener('click', function () {
        if (!editingCampaignId) return;
        var _editAllowedTypes = []; document.getElementById('cmp-edit-task-types').querySelectorAll('input[type="checkbox"]:checked').forEach(function (cb) { _editAllowedTypes.push(cb.value); });
        var _editFrequency = document.getElementById('cmp-edit-frequency').value;
        var _editCadence = document.getElementById('cmp-edit-cadence').value;
        var _editStartDate = document.getElementById('cmp-edit-start-date').value;
        var _editEndDate = document.getElementById('cmp-edit-end-date').value;
        var _editAutoComplete = document.getElementById('cmp-edit-auto-complete').checked;
        var payload = {
          title: (editTitleEl.value || '').trim() || 'Untitled Campaign',
          description: (editDescEl.value || '').trim(),
          objective_id: editObjectiveEl.value || null,
          status: editStatusEl.value || 'active',
          allowedTaskTypes: _editAllowedTypes.length > 0 ? _editAllowedTypes : null,
          taskType: null,
          frequency: _editFrequency ? parseInt(_editFrequency, 10) : null,
          maxTasks: null,
          cadence: _editCadence || null,
          startDate: _editStartDate || null,
          endDate: _editEndDate || null,
          autoComplete: _editAutoComplete
        };
        AgentEngine.updateCampaign(editingCampaignId, payload);
        persistCampaigns();
        closeEditModal();
        renderAll();
      });

      document.getElementById('cmp-create-btn').addEventListener('click', function () {
        var t = (titleEl.value || '').trim();
        var d = (descEl.value || '').trim();
        if (!t) return;
        var _allowedTypes = []; document.getElementById('cmp-task-types').querySelectorAll('input[type="checkbox"]:checked').forEach(function (cb) { _allowedTypes.push(cb.value); });
        var _frequency = document.getElementById('cmp-frequency').value;
        var _cadence = document.getElementById('cmp-cadence').value;
        var _startDate = document.getElementById('cmp-start-date').value;
        var _endDate = document.getElementById('cmp-end-date').value;
        var c = AgentEngine.addCampaign({
          title: t,
          description: d,
          objective_id: objectiveEl.value || null,
          provenance: 'Manual: Campaign UI',
          allowedTaskTypes: _allowedTypes.length > 0 ? _allowedTypes : null,
          frequency: _frequency ? parseInt(_frequency, 10) : null,
          cadence: _cadence || null,
          startDate: _startDate || null,
          endDate: _endDate || null
        });
        persistCampaigns();
        titleEl.value = '';
        descEl.value = '';
        objectiveEl.value = '';
        document.getElementById('cmp-task-types').querySelectorAll('input[type="checkbox"]').forEach(function (cb) { cb.checked = false; });
        document.getElementById('cmp-frequency').value = '';
        document.getElementById('cmp-cadence').value = '';
        document.getElementById('cmp-start-date').value = '';
        document.getElementById('cmp-end-date').value = '';
        renderAll();
      });

      searchEl.addEventListener('input', renderList);
      archivedToggleEl.addEventListener('change', renderList);

      var viewCardBtn = document.getElementById('cmp-view-card');
      var viewListBtn = document.getElementById('cmp-view-list');
      viewCardBtn.addEventListener('click', function () {
        _cmpViewMode = 'card';
        viewCardBtn.classList.add('cmp-view-btn--active'); viewListBtn.classList.remove('cmp-view-btn--active');
        renderList();
      });
      viewListBtn.addEventListener('click', function () {
        _cmpViewMode = 'list';
        viewListBtn.classList.add('cmp-view-btn--active'); viewCardBtn.classList.remove('cmp-view-btn--active');
        renderList();
      });

      AgentEngine.loadRegistry().then(function () {
        populateObjectiveSelect();
        renderAll();
      });
      AgentEngine.on('sync-complete', function () { populateObjectiveSelect(); renderAll(); });
      var _storeReady = false;
      window.addEventListener('companystoreready', function () { _storeReady = true; populateObjectiveSelect(); renderAll(); });
      setTimeout(function () {
        if (!_storeReady) {
          console.warn('[Campaigns] companystoreready timeout (8s) — rendering with local data');
          populateObjectiveSelect(); renderAll();
        }
      }, 8000);
    })();
  </script>

  <script src="/modules/company/js/sidebar.js"></script>
</body>
</html>
