<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="AmbientPixels Memory Stack Explorer — runtime memory layer diagnostics." />
  <link rel="icon" href="/images/favicon.ico" type="image/x-icon" />
  <title>Memory Stack — AmbientPixels HQ</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/grid.css" />
  <link rel="stylesheet" href="/css/nav.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/theme.css" />
  <link rel="stylesheet" href="/css/banner.css" />
  <link rel="stylesheet" href="/modules/company/css/company.css" />
  <link rel="stylesheet" href="/modules/company/css/sidebar.css" />
  <link rel="stylesheet" href="/modules/company/css/memory-stack.css" />
  <link rel="stylesheet" href="/modules/company/css/quick-chat.css" />
</head>
<body data-theme="dark">
  <main id="ms-main" class="content-section">
    <div class="ms-hero">
      <h1><i class="fas fa-layer-group co-icon-mr-lg dash-icon-gold"></i>Memory Stack Explorer</h1>
      <p>Read-only diagnostics for agent prompt memory layers (L1–L6), freshness, and payload previews.</p>
      <div class="ms-hero-row">
        <div class="ms-meta" id="ms-meta">Loading memory stack...</div>
        <div class="ms-hero-actions">
          <label class="ms-auto-label"><input type="checkbox" id="ms-auto-refresh" /> Auto-refresh (60s)</label>
          <button id="ms-compare-toggle" class="ms-btn ms-btn--ghost ms-btn--sm" type="button"><i class="fas fa-arrows-left-right"></i> Compare</button>
          <button id="ms-download" class="ms-btn ms-btn--ghost ms-btn--sm" type="button"><i class="fas fa-download"></i> Export All</button>
        </div>
      </div>
    </div>

    <!-- ═══ Stack Health Dashboard ═══ -->
    <div class="ms-health" id="ms-health"></div>

    <!-- ═══ Injection Flow ═══ -->
    <div class="ms-flow" id="ms-flow"></div>

    <!-- ═══ Agent Compare (hidden by default) ═══ -->
    <section class="ms-compare-section" id="ms-compare-section" style="display:none">
      <div class="ms-panel-title"><i class="fas fa-arrows-left-right ms-compare-icon dash-icon-gold co-icon-mr"></i> Agent Comparison <button class="ms-btn ms-btn--ghost ms-btn--sm" id="ms-compare-close" type="button"><i class="fas fa-xmark"></i></button></div>
      <div class="ms-compare-controls">
        <select id="ms-cmp-layer" class="ms-agent-select"></select>
        <select id="ms-cmp-agent-a" class="ms-agent-select"></select>
        <span class="ms-compare-vs">vs</span>
        <select id="ms-cmp-agent-b" class="ms-agent-select"></select>
        <button id="ms-cmp-run" class="ms-btn" type="button"><i class="fas fa-play"></i> Compare</button>
      </div>
      <div class="ms-compare-grid" id="ms-compare-grid"></div>
    </section>

    <div class="ms-layout">
      <section class="ms-panel">
        <div class="ms-panel-title">Layers</div>
        <div id="ms-layers" class="ms-layers"></div>
      </section>

      <section class="ms-panel">
        <div class="ms-panel-title">Layer Detail</div>
        <div id="ms-detail" class="ms-detail"></div>
      </section>

      <section class="ms-panel">
        <div class="ms-panel-title">Preview
          <span class="ms-tree-actions">
            <button id="ms-expand-all" class="ms-btn ms-btn--ghost ms-btn--xs" type="button" title="Expand all (E)"><i class="fas fa-angles-down"></i></button>
            <button id="ms-collapse-all" class="ms-btn ms-btn--ghost ms-btn--xs" type="button" title="Collapse all (C)"><i class="fas fa-angles-up"></i></button>
          </span>
        </div>
        <div class="ms-preview-tools">
          <input id="ms-search" type="text" placeholder="Search keys or values..." />
          <span class="ms-search-count" id="ms-search-count"></span>
          <button id="ms-copy" class="ms-btn" type="button"><i class="fas fa-copy"></i> Copy</button>
          <button id="ms-curl" class="ms-btn ms-btn--ghost" type="button"><i class="fas fa-terminal"></i> cURL</button>
        </div>
        <div id="ms-preview-summary" class="ms-summary"></div>
        <div id="ms-tree" class="ms-tree"></div>
        <pre id="ms-preview" class="ms-preview" style="display:none"></pre>
        <div class="ms-path-toast" id="ms-path-toast"></div>
      </section>
    </div>

    <div class="ms-kbd-hint" id="ms-kbd-hint"><kbd>1</kbd>-<kbd>8</kbd> layers · <kbd>E</kbd> expand · <kbd>C</kbd> collapse · <kbd>/</kbd> search · <kbd>D</kbd> compare</div>
  </main>

  <script src="/js/storage-manager.js"></script>
  <script src="/modules/company/js/demo-toast.js"></script>
  <script src="/js/company-store.js"></script>
  <script src="/modules/company/js/memory-stack.js"></script>
  <script src="/js/agent-engine.js"></script>
  <script src="/modules/company/js/quick-chat.js"></script>
  <script src="/modules/company/js/sidebar.js"></script>
</body>
</html>
