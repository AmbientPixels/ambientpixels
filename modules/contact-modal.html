<!-- /modules/contact-modal.html
     DS-compliant rewrite. Behavioral class names preserved for JS:
       .modal, .modal-overlay, .modal-close, .hidden, .active,
       .form-group, .form-status, data-ambientos-intake="true".
     .ap-modal parent class scopes the DS styling from ap-components.css §2.16.
     No Font Awesome, no glass-panel, no legacy forms.css required. -->
<div id="contact-modal" class="modal ap-modal hidden">
  <div class="modal-overlay" onclick="closeModal('contact-modal')"></div>
  <div class="modal-content">
    <button type="button" class="modal-close" onclick="closeModal('contact-modal')" aria-label="Close">Close</button>

    <h2>Start a <em>project.</em></h2>
    <p class="ap-modal-sub">Share the rough shape. We&rsquo;ll reply within a business day.</p>

    <form id="contact-form" method="POST" class="contact-form" data-ambientos-intake="true">
      <input type="hidden" name="type" value="contact">
      <input type="hidden" name="form_started_at_ms" value="">
      <input type="text" name="hp" tabindex="-1" autocomplete="off" style="position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;opacity:0;pointer-events:none;">

      <div class="form-group">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" required>
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
      </div>

      <div class="form-group">
        <label for="project-type">Type</label>
        <select id="project-type" name="project-type" required>
          <option value="" disabled selected>Select one</option>
          <option value="ai-systems">AI systems / automation</option>
          <option value="web">Website development</option>
          <option value="design">UI / UX design</option>
          <option value="infrastructure">Infrastructure / APIs</option>
          <option value="consulting">Consulting</option>
          <option value="other">Something else</option>
        </select>
      </div>

      <div class="form-group">
        <label for="message">Message</label>
        <textarea id="message" name="message" rows="5" required></textarea>
      </div>

      <label class="ap-form-consent">
        <input type="checkbox" name="privacyAccepted" required>
        <span>I agree to the <a href="/privacy.html" target="_blank">privacy policy</a>.</span>
      </label>

      <div class="ap-form-actions">
        <button type="submit" class="ap-btn ap-btn--primary">Send &rarr;</button>
        <p class="ap-form-helper">Include timeline + budget if you have them.</p>
      </div>

      <div class="form-status" role="status" aria-live="polite"></div>
    </form>
  </div>
</div>
