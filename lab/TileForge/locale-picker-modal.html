<!-- Locale Picker Modal -->
<div id="localePickerModal" class="modal-overlay" style="display:none;">
  <div class="modal small">
    <div class="modal-header">
      <h3 class="modal-title">Select Locales</h3>
      <button class="modal-close" onclick="TileForgeLocalesUI.close()">✕</button>
    </div>
    <div class="modal-body">
      <input type="text" id="localeSearchInput" placeholder="Search language or country..." style="width:100%;margin-bottom:10px;">
      <div id="localeList" style="max-height:250px;overflow:auto;"></div>
      <div style="margin:10px 0;">
        <button class="modal-btn" onclick="TileForgeLocalesUI.selectAll()">Select All</button>
        <button class="modal-btn" onclick="TileForgeLocalesUI.clearAll()">Clear All</button>
        <button class="modal-btn" onclick="TileForgeLocalesUI.loadDefault('toh')">Load ToH Locales</button>
        <button class="modal-btn" onclick="TileForgeLocalesUI.loadDefault('mobile')">Load Mobile Locales</button>
      </div>
    </div>
    <div class="modal-footer">
      <button class="modal-btn primary" onclick="TileForgeLocalesUI.apply()">Apply</button>
    </div>
  </div>
</div>
