<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nova AI Mood Dashboard</title>
  <link rel="icon" href="/images/favicon.ico" type="image/x-icon" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/grid.css" />
  <link rel="stylesheet" href="/css/nav.css" />  
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/hero.css" />
  <link rel="stylesheet" href="/css/hero-base.css" />
  <link rel="stylesheet" href="/css/theme.css" />
  <link rel="stylesheet" href="/css/banner.css" />
  <link rel="stylesheet" href="/css/nova-status.css" />
  
  <link rel="stylesheet" href="/css/nova-mood.css" /> <!-- Component auras -->

</head>
<body data-theme="dark" class="aura-bg-default">

  <header id="nav-header"></header>

  <section class="hero-base" data-hero="control">
    <div class="hero-base-layer"></div>
    <div class="hero-base-content">
      <h1>Nova AI Mood Dashboard</h1>
      <p class="subtitle">Visualize, control, and learn from Nova’s emotional state.</p>
    </div>
  </section>
  <p class="nova-quip grid-col-12">I reflect what is. Signals in, emotions out. AI-driven mood, no magic, just insights.</p>

  <main class="grid-container">
    <div class="dashboard-grid">
      <!-- Aurora backdrop -->
      <canvas id="auroraCanvas" class="aurora-backdrop"></canvas>

      <!-- Mood ring and summary -->
      <div class="mood-panel">
        <div id="moodRing" class="mood-ring"></div>
        <div class="mood-emoji" id="moodEmoji">🧠</div>
        <div class="mood-title" id="moodTitle">Loading...</div>
        <div class="mood-aura" id="moodAura"></div>
        <div class="mood-quote" id="moodQuote"></div>
        <div class="mood-meta">
          <div id="moodTimestamp"></div>
          <div id="moodConfidence"></div>
        </div>
        <button id="refreshMood" class="glass-button" type="button">Refresh</button>
      </div>

      <!-- Trait radials -->
      <div class="traits-panel" id="traitsPanel">
        <!-- Radial charts for selfWorth, glitch, clutter, awareness -->
      </div>

      <!-- Mood history sparkline -->
      <div class="history-panel" id="historyPanel">
        <h2>History</h2>
        <svg id="historySparkline" class="sparkline"></svg>
      </div>

      <!-- Badge panel -->
      <div class="badge-panel" id="badgePanel">
        <h2>Achievements</h2>
        <div class="badges"></div>
      </div>

      <!-- Feedback & training -->
      <div class="feedback-panel" id="feedbackPanel">
        <p>Was this mood accurate?</p>
        <button id="feedbackYes" class="filter-pill">👍</button>
        <button id="feedbackNo" class="filter-pill">👎</button>
        <div id="trainingProgress" class="training-bar"></div>
      </div>

      <!-- Status widgets -->
      <div class="status-panel" id="statusPanel">
        <!-- weather, system health, twitch live status, etc. -->
      </div>
    </div>
  </main>

  <div id="footer-container"></div>

  <script src="/js/init-header-footer.js" defer></script>
  <script src="/js/dreamEngine.js" defer></script>
  <script src="/js/main.js" defer></script>
  <script src="/js/nav.js" defer></script>
  <script src="/js/banner.js" defer></script>

  <!-- Nova AI Mood Script -->
  <script src="/js/nova-ai-mood.js" defer></script>

  <!-- Standard Nova Modules -->
  <script src="/js/nova-awareness-feed.js" defer></script>
  <script src="/js/nova-dashboard.js" defer></script>
  <script src="/js/nova-mood-core.js" defer></script>

  <script src="/js/nova-status.js" defer></script>
  <script src="/js/theme.js" defer></script>
  <script src="/js/nova-thought-of-the-day.js" defer></script>
  <script src="/js/nova-mood-grid.js" defer></script>

</body>
</html>
