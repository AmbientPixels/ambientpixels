<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conversion Audit Report . AmbientScore</title>
  <link rel="icon" href="/images/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;0,8..60,700;1,8..60,400;1,8..60,500&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/ambientscore/css/ambientscore.css">
  <script src="/js/telemetry-config.js"></script>
  <script src="/js/telemetry-appinsights.js" defer></script>
  <script src="/js/product-analytics.js" defer></script>
</head>
<body>

  <!-- Masthead -->
  <header class="as-mast">
    <div class="as-container">
      <div class="as-mast-row">
        <a href="/ambientscore/" class="as-mast-brand">Ambient<em>Score</em></a>
        <div class="as-mast-meta">
          <span>Vol. IX</span>
          <span>Est. 2024</span>
          <span>By AmbientPixels</span>
        </div>
      </div>
    </div>
    <div class="as-mast-sub">
      <div class="as-container">
        <span>Conversion Audit &amp; Revenue Review</span>
        <span>Confidential . For the site owner</span>
      </div>
    </div>
  </header>

  <!-- Loading -->
  <div id="as-report-loading" class="as-report-loading">
    <div class="as-container">
      <div class="as-loading-eyebrow">Loading report</div>
      <p class="as-loading-text"><span class="as-spinner"></span>Retrieving your audit.</p>
    </div>
  </div>

  <!-- Report Content (injected by JS) -->
  <main id="as-report-content" class="as-container" style="display:none;"></main>

  <!-- Footer -->
  <footer class="as-footer">
    <div class="as-container">
      <span>&copy; 2026 AmbientScore</span>
      <span>Published by <a href="https://ambientpixels.ai">AmbientPixels</a></span>
      <span>ambientpixels.ai/ambientscore</span>
    </div>
  </footer>

  <script src="/ambientscore/js/report.js"></script>
</body>
</html>
