<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Strategy Session — AmbientScore</title>
  <link rel="icon" href="/images/favicon.ico">
  <link rel="stylesheet" href="/ambientscore/css/ambientscore.css">
  <style>
    .as-strategy-header { text-align: center; padding: 48px 0 32px; }
    .as-strategy-header h1 { font-size: 24px; color: var(--as-accent); margin-bottom: 8px; }
    .as-strategy-header p { font-size: 15px; color: var(--as-text-secondary); max-width: 540px; margin: 0 auto; }

    .as-strategy-form { max-width: 560px; margin: 0 auto 48px; }

    .as-field { margin-bottom: 20px; }
    .as-field label { display: block; font-size: 13px; font-weight: 600; color: var(--as-text); margin-bottom: 6px; }
    .as-field label .as-optional { font-weight: 400; color: var(--as-text-muted); }

    .as-field input[type="text"],
    .as-field input[type="email"],
    .as-field input[type="url"],
    .as-field select,
    .as-field textarea {
      width: 100%;
      padding: 12px 14px;
      font-size: 14px;
      font-family: var(--as-font);
      background: var(--as-surface);
      color: var(--as-text);
      border: 1px solid var(--as-border);
      border-radius: var(--as-radius-sm);
      outline: none;
      transition: border-color 0.2s;
    }
    .as-field input:focus,
    .as-field select:focus,
    .as-field textarea:focus { border-color: var(--as-accent); }
    .as-field textarea { min-height: 100px; resize: vertical; }
    .as-field select { appearance: none; cursor: pointer; }

    .as-field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (max-width: 600px) { .as-field-row { grid-template-columns: 1fr; } }

    .as-consent { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 24px; font-size: 13px; color: var(--as-text-secondary); }
    .as-consent input[type="checkbox"] { margin-top: 2px; accent-color: var(--as-accent); }

    .as-hp-field { position: absolute; left: -9999px; opacity: 0; height: 0; }

    .as-form-status { text-align: center; margin-top: 16px; font-size: 14px; }
    .as-form-status.as-error { color: var(--as-danger); }
    .as-form-status.as-success { color: var(--as-accent); }

    .as-strategy-form .as-buy-btn { width: 100%; text-align: center; }
    .as-strategy-form .as-buy-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>

  <!-- Brand Bar -->
  <header class="as-brand-bar">
    <div class="as-container">
      <a href="/ambientscore/" class="as-brand-name" style="text-decoration:none;">AmbientScore</a>
      <a href="https://ambientpixels.ai" class="as-brand-link">by AmbientPixels</a>
    </div>
  </header>

  <div class="as-container">
    <div class="as-strategy-header">
      <h1>Turn Your AmbientScore Audit Into an Implementation Plan</h1>
      <p>Submit this form. We'll review your audit and email 2-3 proposed times to meet.</p>
    </div>

    <form id="as-strategy-form" class="as-strategy-form" novalidate>
      <div class="as-field">
        <label for="as-name">Full Name</label>
        <input type="text" id="as-name" name="name" required autocomplete="name">
      </div>

      <div class="as-field">
        <label for="as-email">Email</label>
        <input type="email" id="as-email" name="email" required autocomplete="email">
      </div>

      <div class="as-field">
        <label for="as-company">Company</label>
        <input type="text" id="as-company" name="company" required autocomplete="organization">
      </div>

      <div class="as-field">
        <label for="as-website">Website</label>
        <input type="url" id="as-website" name="website" required autocomplete="url" placeholder="https://">
      </div>

      <div class="as-field">
        <label for="as-goal">Primary Goal</label>
        <select id="as-goal" name="primaryGoal" required>
          <option value="" disabled selected>Select your primary goal</option>
          <option value="Increase signups / trials">Increase signups / trials</option>
          <option value="Improve lead quality">Improve lead quality</option>
          <option value="Reduce funnel drop-off">Reduce funnel drop-off</option>
          <option value="Redesign / relaunch">Redesign / relaunch</option>
          <option value="Other">Other</option>
        </select>
      </div>

      <div class="as-field">
        <label for="as-traffic">Monthly Traffic</label>
        <select id="as-traffic" name="monthlyTraffic" required>
          <option value="" disabled selected>Estimated monthly visitors</option>
          <option value="Under 1,000">Under 1,000</option>
          <option value="1,000-10,000">1,000-10,000</option>
          <option value="10,000-100,000">10,000-100,000</option>
          <option value="100,000+">100,000+</option>
        </select>
      </div>

      <div class="as-field-row">
        <div class="as-field">
          <label for="as-budget">Budget Range <span class="as-optional">(optional)</span></label>
          <select id="as-budget" name="budgetRange">
            <option value="" selected>Select budget</option>
            <option value="Under $5K">Under $5K</option>
            <option value="$5K-$15K">$5K-$15K</option>
            <option value="$15K-$50K">$15K-$50K</option>
            <option value="$50K+">$50K+</option>
          </select>
        </div>
        <div class="as-field">
          <label for="as-timeline">Timeline <span class="as-optional">(optional)</span></label>
          <select id="as-timeline" name="timeline">
            <option value="" selected>Select timeline</option>
            <option value="ASAP">ASAP</option>
            <option value="1-2 months">1-2 months</option>
            <option value="3-6 months">3-6 months</option>
            <option value="Exploratory">Exploratory</option>
          </select>
        </div>
      </div>

      <div class="as-field">
        <label for="as-notes">What stood out most in your audit? <span class="as-optional">(optional)</span></label>
        <textarea id="as-notes" name="notes" placeholder="Any context that will help us prepare for the call..."></textarea>
      </div>

      <!-- Hidden fields -->
      <input type="hidden" id="as-reportId" name="reportId">
      <input type="hidden" id="as-score" name="score">
      <input type="hidden" id="as-siteType" name="siteType">

      <!-- Honeypot -->
      <div class="as-hp-field">
        <label for="as-hp">Leave this blank</label>
        <input type="text" id="as-hp" name="hp" tabindex="-1" autocomplete="off">
      </div>

      <div class="as-consent">
        <input type="checkbox" id="as-privacy" name="privacyAccepted" required>
        <label for="as-privacy">I agree to the <a href="https://ambientpixels.ai/privacy" target="_blank">Privacy Policy</a>. AmbientPixels will use this information to contact me about the strategy session.</label>
      </div>

      <button type="submit" class="as-buy-btn" id="as-submit-btn">Request Strategy Session</button>
    </form>
    <div id="as-form-status" class="as-form-status"></div>
  </div>

  <!-- Footer -->
  <footer class="as-footer">
    <div class="as-container">
      <p>&copy; 2026 AmbientScore by <a href="https://ambientpixels.ai">AmbientPixels</a></p>
    </div>
  </footer>

  <script src="/ambientscore/js/strategy.js"></script>
</body>
</html>
