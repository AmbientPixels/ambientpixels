<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Contact the Pixel Agents team — bug reports, feature requests, partnerships." />
  <link rel="icon" href="/images/favicon.ico" type="image/x-icon" />
  <title>Contact — Pixel Agents</title>

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" />

  <!-- Shared site CSS -->
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/grid.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/theme.css" />

  <!-- Pixel Agents v2 design system + layout -->
  <link rel="stylesheet" href="/pixel-agents/css/pixel-agents-design-system.css" />
  <link rel="stylesheet" href="/pixel-agents/css/pixel-agents-layout.css" />
  <link rel="stylesheet" href="/pixel-agents/css/pixel-agents-components.css" />

  <style>
    .pa-contact-form { max-width: 560px; }
    .pa-contact-field { margin-bottom: 1.25rem; }
    .pa-contact-field label { display: block; font-family: var(--pa-font-display); font-size: 0.72rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: var(--pa-text-muted); margin-bottom: 0.4rem; }
    .pa-contact-field input, .pa-contact-field select, .pa-contact-field textarea { width: 100%; padding: 0.75rem 1rem; font-size: 0.9rem; font-family: var(--pa-font-body); border: 1px solid var(--pa-sep-strong); border-radius: var(--pa-radius-md); background: var(--pa-surface); color: var(--pa-text); outline: none; transition: border-color 0.2s; box-sizing: border-box; }
    .pa-contact-field input:focus, .pa-contact-field select:focus, .pa-contact-field textarea:focus { border-color: var(--pa-primary-border); box-shadow: 0 0 0 3px var(--pa-primary-dim); }
    .pa-contact-field textarea { resize: vertical; min-height: 120px; }
    .pa-contact-consent { margin-bottom: 1.25rem; font-size: 0.8rem; color: var(--pa-text-muted); display: flex; align-items: flex-start; gap: 0.5rem; }
    .pa-contact-consent input[type="checkbox"] { margin-top: 0.2rem; }
    .form-status { margin-bottom: 1rem; font-size: 0.85rem; }
    .form-status.success { color: var(--pa-success); }
    .form-status.error { color: var(--pa-danger); }
  </style>
</head>
<body class="pa-shell" data-theme="dark">

  <!-- ═══════════════════════════════════
       SIDEBAR (Desktop)
       ═══════════════════════════════════ -->
  <aside class="pa-sidebar">
    <div class="pa-sidebar-logo">
      <span class="pa-logo-accent">Pixel</span><br>Agents
    </div>

    <div class="pa-sidebar-operator">
      <span class="pa-sidebar-operator-dot" id="pa-operator-dot"></span>
      <span id="pa-operator-label">Operator</span>
    </div>

    <nav class="pa-sidebar-nav">
      <a href="/pixel-agents/" data-nav="explore">
        <i class="fas fa-compass"></i><span>Explore</span>
      </a>
      <a href="/pixel-agents/#agent-grid" data-nav="agents">
        <i class="fas fa-robot"></i><span>Agents</span>
      </a>
      <a href="/agent-forge/" data-nav="forge">
        <i class="fas fa-hammer"></i><span>Forge</span>
      </a>
      <a href="#" aria-disabled="true" data-nav="vault">
        <i class="fas fa-vault"></i><span>Vault</span>
        <span class="pa-coming-soon">Soon</span>
      </a>
      <a href="/pixel-agents/analytics.html" data-nav="activity">
        <i class="fas fa-chart-line"></i><span>Activity</span>
      </a>
    </nav>

    <div class="pa-sidebar-resources">
      <a href="/pixel-agents/docs.html" data-nav="docs"><i class="fas fa-book"></i><span>Docs</span></a>
      <a href="/pixel-agents/faq.html" data-nav="faq"><i class="fas fa-circle-question"></i><span>FAQ</span></a>
      <a href="/pixel-agents/changelog.html" data-nav="changelog"><i class="fas fa-clock-rotate-left"></i><span>Changelog</span></a>
      <a href="/pixel-agents/contact.html" class="active" data-nav="contact"><i class="fas fa-envelope"></i><span>Contact</span></a>
    </div>

    <div class="pa-sidebar-footer">
      <a href="/agent-forge/" class="pa-sidebar-cta">
        <i class="fas fa-plus"></i><span>New Agent</span>
      </a>
    </div>
  </aside>

  <!-- ═══════════════════════════════════
       TOP BAR
       ═══════════════════════════════════ -->
  <header class="pa-topbar-v2">
    <span class="pa-wordmark">Contact</span>
    <div class="pa-topbar-actions">
      <button class="pa-btn-icon" id="pa-theme-toggle" title="Toggle theme">
        <i class="fas fa-moon"></i>
      </button>
      <button class="pa-btn-icon" title="Notifications">
        <i class="fas fa-bell"></i>
      </button>
      <div class="pa-avatar" id="pa-avatar" title="Account">
        <i class="fas fa-user"></i>
      </div>
      <div class="pa-avatar-menu" id="pa-avatar-menu">
        <a id="pa-login-btn" href="/pages/login.html?redirect=/pixel-agents/contact.html">
          <i class="fas fa-sign-in-alt"></i> Sign In
        </a>
        <div id="pa-user-status" style="display:none;">
          <span class="pa-avatar-menu-text">
            Signed in as <strong id="pa-user-name"></strong>
          </span>
          <button id="pa-logout-btn">
            <i class="fas fa-sign-out-alt"></i> Sign Out
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- ═══════════════════════════════════
       MAIN CONTENT
       ═══════════════════════════════════ -->
  <main class="pa-main">

    <div class="pa-section">
      <div class="pa-section-header">
        <div>
          <span class="pa-section-label">Get in Touch</span>
          <h2>Contact Us</h2>
        </div>
      </div>

      <form id="contact-form" method="POST" class="pa-contact-form" data-ambientos-intake="true">
        <input type="hidden" name="type" value="contact">
        <input type="hidden" name="form_started_at_ms" value="">
        <!-- Honeypot -->
        <input type="text" name="hp" tabindex="-1" autocomplete="off" style="position:absolute;left:-9999px;top:-9999px;opacity:0;height:0;width:0;">

        <div class="pa-contact-field">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" required placeholder="Your name">
        </div>

        <div class="pa-contact-field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required placeholder="you@example.com">
        </div>

        <div class="pa-contact-field">
          <label for="subject">Subject</label>
          <select id="subject" name="subject" required>
            <option value="">Select a topic...</option>
            <option value="bug-report">Bug Report</option>
            <option value="feature-request">Feature Request</option>
            <option value="partnership">Partnership</option>
            <option value="general">General Question</option>
          </select>
        </div>

        <div class="pa-contact-field">
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="6" required placeholder="Tell us what's on your mind..."></textarea>
        </div>

        <div class="pa-contact-consent">
          <label>
            <input type="checkbox" name="privacyAccepted" required>
            I agree to the processing of my data for this inquiry.
          </label>
        </div>

        <div class="form-status"></div>

        <button type="submit" class="pa-btn-primary">
          <i class="fas fa-paper-plane"></i> Send Message
        </button>
      </form>
    </div>

    <!-- Footer -->
    <footer class="pa-footer-v2">
      <span>&copy; 2026 Pixel Agents</span>
      <div class="pa-footer-links">
        <a href="/pixel-agents/">Pixel Agents</a>
        <a href="/agent-forge/">Agent Forge</a>
        <a href="/storyforge/">StoryForge</a>
        <a href="/cardforge/">CardForge</a>
        <a href="/blindspot/">Blindspot</a>
      </div>
    </footer>

  </main>

  <!-- ═══════════════════════════════════
       BOTTOM NAV (Mobile)
       ═══════════════════════════════════ -->
  <nav class="pa-bottom-nav">
    <a href="/pixel-agents/"><i class="fas fa-compass"></i><span>Explore</span></a>
    <a href="/pixel-agents/#agent-grid"><i class="fas fa-robot"></i><span>Agents</span></a>
    <a href="/agent-forge/"><i class="fas fa-hammer"></i><span>Forge</span></a>
    <a href="#" aria-disabled="true"><i class="fas fa-vault"></i><span>Vault</span></a>
    <a href="/pixel-agents/analytics.html"><i class="fas fa-chart-line"></i><span>Activity</span></a>
  </nav>

  <!-- ═══════════════════════════════════
       SCRIPTS
       ═══════════════════════════════════ -->
  <script src="/js/form-intake.js"></script>
  <script>
  // Avatar menu + theme toggle (shared pattern)
  (function() {
    var avatar = document.getElementById('pa-avatar');
    var menu = document.getElementById('pa-avatar-menu');
    if (avatar && menu) {
      avatar.addEventListener('click', function(e) { e.stopPropagation(); menu.classList.toggle('open'); });
      document.addEventListener('click', function() { menu.classList.remove('open'); });
    }

    var savedTheme = localStorage.getItem('preferred-theme');
    if (savedTheme) {
      document.body.setAttribute('data-theme', savedTheme);
      var icon = document.querySelector('#pa-theme-toggle i');
      if (icon) icon.className = savedTheme === 'light' ? 'fas fa-sun' : 'fas fa-moon';
    }
    var themeBtn = document.getElementById('pa-theme-toggle');
    if (themeBtn) {
      themeBtn.addEventListener('click', function() {
        var isDark = document.body.getAttribute('data-theme') === 'dark';
        var next = isDark ? 'light' : 'dark';
        document.body.setAttribute('data-theme', next);
        localStorage.setItem('preferred-theme', next);
        this.querySelector('i').className = next === 'light' ? 'fas fa-sun' : 'fas fa-moon';
      });
    }
  })();
  
  // Update operator badge with subscription tier
  (function() {
    var _cached = sessionStorage.getItem("pa_tier");
    if (_cached) _applyTier(_cached);
    // Only fetch tier if authenticated
    var _authData = sessionStorage.getItem("pa_auth");
    if (!_authData) return;
    try { if (!JSON.parse(_authData).isAuthenticated) return; } catch(e) { return; }
    var _ab = "/api";
    fetch(_ab + "/pixel-agent-entitlements")
      .then(function(r) { return r.ok ? r.json() : null; })
      .then(function(d) { if (!d) return; var t = d.tier || "free"; sessionStorage.setItem("pa_tier", t); _applyTier(t); })
      .catch(function() {});
    function _applyTier(t) {
      var c = document.querySelector(".pa-sidebar-operator");
      var l = document.getElementById("pa-operator-label");
      if (!l) return;
      if (t === "pro") { l.textContent = "Pro Creator"; if (c) c.classList.add("pa-sidebar-operator--pro"); }
      else { l.textContent = "Free Creator"; if (c) c.classList.remove("pa-sidebar-operator--pro"); }
    }
  })();
  </script>
</body>
</html>
