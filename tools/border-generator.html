<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; display: flex; flex-wrap: wrap; gap: 30px; padding: 30px; justify-content: center; }

  .border-frame {
    width: 375px;
    height: 525px;
    position: relative;
    background: transparent;
    border-radius: 16px;
    overflow: hidden;
  }

  /* 1. Gold Filigree — uses outline+box-shadow instead of border-image (which kills border-radius) */
  .border--gold-filigree {
    border: 4px solid #b8860b;
    background: linear-gradient(135deg, rgba(255,215,0,0.06), transparent 30%, rgba(255,215,0,0.04) 50%, transparent 70%, rgba(255,215,0,0.06)) border-box;
    box-shadow: inset 0 0 0 2px #1a1000, inset 0 0 0 6px rgba(255,215,0,0.15), inset 0 0 0 8px #1a1000, 0 0 12px rgba(255,215,0,0.15);
  }
  .border--gold-filigree::before {
    content: '';
    position: absolute;
    inset: 10px;
    border: 1px solid rgba(255,215,0,0.3);
    border-radius: 2px;
  }
  .border--gold-filigree::after {
    content: '';
    position: absolute;
    inset: 14px;
    border: 1px solid rgba(255,215,0,0.12);
  }
  /* Corner ornaments */
  .border--gold-filigree .corner {
    position: absolute;
    width: 40px;
    height: 40px;
    border: 2px solid rgba(255,215,0,0.5);
  }
  .border--gold-filigree .corner--tl { top: 12px; left: 12px; border-right: none; border-bottom: none; }
  .border--gold-filigree .corner--tr { top: 12px; right: 12px; border-left: none; border-bottom: none; }
  .border--gold-filigree .corner--bl { bottom: 12px; left: 12px; border-right: none; border-top: none; }
  .border--gold-filigree .corner--br { bottom: 12px; right: 12px; border-left: none; border-top: none; }
  .border--gold-filigree .corner::before {
    content: '';
    position: absolute;
    width: 8px;
    height: 8px;
    background: radial-gradient(circle, #ffd700 30%, transparent 70%);
  }
  .border--gold-filigree .corner--tl::before { top: -1px; left: -1px; }
  .border--gold-filigree .corner--tr::before { top: -1px; right: -1px; }
  .border--gold-filigree .corner--bl::before { bottom: -1px; left: -1px; }
  .border--gold-filigree .corner--br::before { bottom: -1px; right: -1px; }

  /* 2. Arcane Runes */
  .border--arcane {
    border: 3px solid #6a0dad;
    background: transparent;
    position: relative;
  }
  .border--arcane::before {
    content: '';
    position: absolute;
    inset: -3px;
    border: 3px solid transparent;
    background: linear-gradient(180deg, #6a0dad, #9b30ff 25%, #6a0dad 50%, #9b30ff 75%, #6a0dad) border-box;
    mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    mask-composite: exclude;
    -webkit-mask-composite: xor;
    padding: 3px;
  }
  .border--arcane::after {
    content: '⬡ ◇ ⬡ ◇ ⬡ ◇ ⬡ ◇ ⬡ ◇ ⬡ ◇ ⬡ ◇ ⬡ ◇ ⬡';
    position: absolute;
    top: 8px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 10px;
    letter-spacing: 4px;
    color: rgba(155,48,255,0.4);
  }
  .border--arcane .rune-bottom {
    position: absolute;
    bottom: 8px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 10px;
    letter-spacing: 4px;
    color: rgba(155,48,255,0.4);
  }
  .border--arcane .rune-left,
  .border--arcane .rune-right {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    writing-mode: vertical-lr;
    font-size: 10px;
    letter-spacing: 6px;
    color: rgba(155,48,255,0.3);
  }
  .border--arcane .rune-left { left: 6px; }
  .border--arcane .rune-right { right: 6px; transform: translateY(-50%) rotate(180deg); }
  .border--arcane .glow-orb {
    position: absolute;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(155,48,255,0.8), transparent 70%);
    box-shadow: 0 0 8px rgba(155,48,255,0.6);
  }

  /* 3. Frost/Ice */
  .border--frost {
    border: 3px solid rgba(135,206,250,0.6);
    position: relative;
    overflow: hidden;
  }
  .border--frost::before {
    content: '';
    position: absolute;
    inset: 0;
    border: 8px solid transparent;
    border-image: linear-gradient(180deg,
      rgba(200,230,255,0.3) 0%,
      rgba(135,206,250,0.1) 20%,
      transparent 40%,
      transparent 60%,
      rgba(135,206,250,0.1) 80%,
      rgba(200,230,255,0.3) 100%
    ) 1;
  }
  .border--frost::after {
    content: '';
    position: absolute;
    inset: 4px;
    border: 1px solid rgba(200,230,255,0.2);
    border-radius: 1px;
  }
  .border--frost .ice-crystal {
    position: absolute;
    font-size: 16px;
    color: rgba(200,230,255,0.25);
  }

  /* 4. Ember/Fire */
  .border--ember {
    border: 3px solid #c0392b;
    position: relative;
  }
  .border--ember::before {
    content: '';
    position: absolute;
    inset: -3px;
    background: linear-gradient(180deg, #e74c3c, #c0392b 30%, #922b21 60%, #e74c3c) border-box;
    mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    mask-composite: exclude;
    -webkit-mask-composite: xor;
    padding: 3px;
  }
  .border--ember::after {
    content: '';
    position: absolute;
    inset: 6px;
    border: 1px solid rgba(231,76,60,0.25);
  }
  .border--ember .ember-dot {
    position: absolute;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: radial-gradient(circle, #ff6b35, transparent 70%);
    box-shadow: 0 0 4px rgba(255,107,53,0.5);
  }

  /* 5. Shadow/Void */
  .border--shadow {
    border: 3px solid #2c2c2c;
    position: relative;
    box-shadow: inset 0 0 30px rgba(0,0,0,0.8), inset 0 0 0 1px rgba(100,100,100,0.2);
  }
  .border--shadow::before {
    content: '';
    position: absolute;
    inset: 4px;
    border: 1px solid rgba(100,100,100,0.15);
  }
  .border--shadow::after {
    content: '';
    position: absolute;
    inset: 8px;
    border: 1px dashed rgba(80,80,80,0.15);
  }
  .border--shadow .shadow-wisp {
    position: absolute;
    width: 60px;
    height: 2px;
    background: linear-gradient(90deg, transparent, rgba(100,100,100,0.3), transparent);
  }

  /* 6. Nature/Verdant */
  .border--nature {
    border: 3px solid #2d6a4f;
    position: relative;
  }
  .border--nature::before {
    content: '';
    position: absolute;
    inset: -3px;
    background: linear-gradient(180deg, #52b788, #2d6a4f 40%, #1b4332 60%, #52b788) border-box;
    mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    mask-composite: exclude;
    -webkit-mask-composite: xor;
    padding: 3px;
  }
  .border--nature::after {
    content: '';
    position: absolute;
    inset: 6px;
    border: 1px solid rgba(82,183,136,0.2);
    border-radius: 3px;
  }
  .border--nature .vine {
    position: absolute;
    font-size: 14px;
    color: rgba(82,183,136,0.3);
  }

  /* 7. Circuit/Cyber */
  .border--circuit {
    border: 2px solid #0ff;
    position: relative;
    box-shadow: inset 0 0 0 1px rgba(0,255,255,0.05);
  }
  .border--circuit::before {
    content: '';
    position: absolute;
    inset: 6px;
    border: 1px solid rgba(0,255,255,0.12);
  }
  .border--circuit .trace {
    position: absolute;
    background: rgba(0,255,255,0.2);
  }
  .border--circuit .trace--h { height: 1px; }
  .border--circuit .trace--v { width: 1px; }
  .border--circuit .node {
    position: absolute;
    width: 6px;
    height: 6px;
    border: 1px solid rgba(0,255,255,0.4);
    border-radius: 50%;
  }

  /* 8. Royal/Ornate */
  .border--royal {
    border: 5px solid #c9a84c;
    box-shadow: 0 0 10px rgba(201,168,76,0.2);
    position: relative;
  }
  .border--royal::before {
    content: '';
    position: absolute;
    inset: 3px;
    border: 2px solid rgba(201,168,76,0.3);
  }
  .border--royal::after {
    content: '';
    position: absolute;
    inset: 8px;
    border: 1px solid rgba(201,168,76,0.15);
  }
  .border--royal .crown {
    position: absolute;
    top: -2px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 18px;
    color: rgba(201,168,76,0.6);
  }
  .border--royal .flourish {
    position: absolute;
    font-size: 20px;
    color: rgba(201,168,76,0.25);
  }

  /* Label overlay */
  .border-label {
    position: absolute;
    bottom: 12px;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    color: rgba(255,255,255,0.3);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    white-space: nowrap;
  }
</style>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>

<!-- 1. Gold Filigree -->
<div class="border-frame border--gold-filigree" id="border-gold-filigree">
  <div class="corner corner--tl"></div>
  <div class="corner corner--tr"></div>
  <div class="corner corner--bl"></div>
  <div class="corner corner--br"></div>
  <div class="border-label">Gold Filigree</div>
</div>

<!-- 2. Arcane Runes -->
<div class="border-frame border--arcane" id="border-arcane">
  <div class="rune-bottom">⬡ ◇ ⬡ ◇ ⬡ ◇ ⬡ ◇ ⬡ ◇ ⬡ ◇ ⬡ ◇ ⬡ ◇ ⬡</div>
  <div class="rune-left">◇ ⬡ ◇ ⬡ ◇ ⬡ ◇ ⬡ ◇</div>
  <div class="rune-right">◇ ⬡ ◇ ⬡ ◇ ⬡ ◇ ⬡ ◇</div>
  <div class="glow-orb" style="top:0;left:0;"></div>
  <div class="glow-orb" style="top:0;right:0;"></div>
  <div class="glow-orb" style="bottom:0;left:0;"></div>
  <div class="glow-orb" style="bottom:0;right:0;"></div>
  <div class="border-label">Arcane Runes</div>
</div>

<!-- 3. Frost/Ice -->
<div class="border-frame border--frost" id="border-frost">
  <span class="ice-crystal" style="top:8px;left:12px;">❄</span>
  <span class="ice-crystal" style="top:8px;right:12px;">❄</span>
  <span class="ice-crystal" style="bottom:8px;left:12px;">❄</span>
  <span class="ice-crystal" style="bottom:8px;right:12px;">❄</span>
  <span class="ice-crystal" style="top:50%;left:6px;transform:translateY(-50%);">❅</span>
  <span class="ice-crystal" style="top:50%;right:6px;transform:translateY(-50%);">❅</span>
  <div class="border-label">Frost</div>
</div>

<!-- 4. Ember/Fire -->
<div class="border-frame border--ember" id="border-ember">
  <div class="ember-dot" style="top:8px;left:8px;"></div>
  <div class="ember-dot" style="top:8px;right:8px;"></div>
  <div class="ember-dot" style="bottom:8px;left:8px;"></div>
  <div class="ember-dot" style="bottom:8px;right:8px;"></div>
  <div class="ember-dot" style="top:8px;left:50%;"></div>
  <div class="ember-dot" style="bottom:8px;left:50%;"></div>
  <div class="border-label">Ember</div>
</div>

<!-- 5. Shadow/Void -->
<div class="border-frame border--shadow" id="border-shadow">
  <div class="shadow-wisp" style="top:20px;left:10px;"></div>
  <div class="shadow-wisp" style="top:40px;right:10px;width:40px;"></div>
  <div class="shadow-wisp" style="bottom:20px;left:10px;width:50px;"></div>
  <div class="shadow-wisp" style="bottom:40px;right:10px;"></div>
  <div class="border-label">Shadow</div>
</div>

<!-- 6. Nature/Verdant -->
<div class="border-frame border--nature" id="border-nature">
  <span class="vine" style="top:6px;left:10px;">🌿</span>
  <span class="vine" style="top:6px;right:10px;">🍃</span>
  <span class="vine" style="bottom:30px;left:10px;">🌱</span>
  <span class="vine" style="bottom:30px;right:10px;">🌿</span>
  <div class="border-label">Nature</div>
</div>

<!-- 7. Circuit/Cyber -->
<div class="border-frame border--circuit" id="border-circuit">
  <div class="trace trace--h" style="top:15px;left:10px;width:60px;"></div>
  <div class="trace trace--v" style="top:15px;left:70px;height:30px;"></div>
  <div class="trace trace--h" style="top:45px;left:70px;width:40px;"></div>
  <div class="trace trace--h" style="top:15px;right:10px;width:60px;"></div>
  <div class="trace trace--v" style="top:15px;right:70px;height:30px;"></div>
  <div class="trace trace--h" style="bottom:15px;left:10px;width:50px;"></div>
  <div class="trace trace--v" style="bottom:15px;left:60px;height:25px;"></div>
  <div class="trace trace--h" style="bottom:15px;right:10px;width:50px;"></div>
  <div class="trace trace--v" style="bottom:15px;right:60px;height:25px;"></div>
  <div class="node" style="top:12px;left:7px;"></div>
  <div class="node" style="top:12px;right:7px;"></div>
  <div class="node" style="bottom:12px;left:7px;"></div>
  <div class="node" style="bottom:12px;right:7px;"></div>
  <div class="border-label">Circuit</div>
</div>

<!-- 8. Royal/Ornate -->
<div class="border-frame border--royal" id="border-royal">
  <div class="crown">♛</div>
  <div class="flourish" style="top:50%;left:4px;transform:translateY(-50%);">❧</div>
  <div class="flourish" style="top:50%;right:4px;transform:translateY(-50%) scaleX(-1);">❧</div>
  <div class="flourish" style="bottom:4px;left:50%;transform:translateX(-50%);">⚜</div>
  <div class="border-label">Royal</div>
</div>

</body>
</html>
