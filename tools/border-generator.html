<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; display: flex; flex-wrap: wrap; gap: 30px; padding: 30px; justify-content: center; }

  .border-frame {
    width: 375px;
    height: 525px;
    position: relative;
    background: transparent;
    border-radius: 16px;
    overflow: hidden;
  }

  /* ══════════════════════════════════════
     1. GOLD FILIGREE — ornate triple border with corner flourishes
     ══════════════════════════════════════ */
  .border--gold-filigree {
    border: 5px solid #b8860b;
    box-shadow:
      inset 0 0 0 3px #0d0800,
      inset 0 0 0 5px rgba(255,215,0,0.25),
      inset 0 0 0 7px #0d0800,
      inset 0 0 0 9px rgba(255,215,0,0.12),
      0 0 20px rgba(255,215,0,0.15);
  }
  .border--gold-filigree .inner-frame {
    position: absolute;
    inset: 14px;
    border: 1px solid rgba(255,215,0,0.25);
    border-radius: 6px;
  }
  .border--gold-filigree .inner-frame::before {
    content: '';
    position: absolute;
    inset: 4px;
    border: 1px solid rgba(255,215,0,0.1);
    border-radius: 4px;
  }
  .border--gold-filigree .corner {
    position: absolute;
    width: 50px;
    height: 50px;
  }
  .border--gold-filigree .corner::before,
  .border--gold-filigree .corner::after {
    content: '';
    position: absolute;
  }
  .border--gold-filigree .corner::before {
    width: 100%;
    height: 100%;
    border: 2px solid rgba(255,215,0,0.4);
  }
  .border--gold-filigree .corner::after {
    width: 10px;
    height: 10px;
    background: radial-gradient(circle, #ffd700 20%, rgba(255,215,0,0.3) 60%, transparent 70%);
    border-radius: 50%;
  }
  .border--gold-filigree .corner--tl { top: 12px; left: 12px; }
  .border--gold-filigree .corner--tl::before { border-right: none; border-bottom: none; border-top-left-radius: 4px; }
  .border--gold-filigree .corner--tl::after { top: -3px; left: -3px; }
  .border--gold-filigree .corner--tr { top: 12px; right: 12px; }
  .border--gold-filigree .corner--tr::before { border-left: none; border-bottom: none; border-top-right-radius: 4px; }
  .border--gold-filigree .corner--tr::after { top: -3px; right: -3px; }
  .border--gold-filigree .corner--bl { bottom: 12px; left: 12px; }
  .border--gold-filigree .corner--bl::before { border-right: none; border-top: none; border-bottom-left-radius: 4px; }
  .border--gold-filigree .corner--bl::after { bottom: -3px; left: -3px; }
  .border--gold-filigree .corner--br { bottom: 12px; right: 12px; }
  .border--gold-filigree .corner--br::before { border-left: none; border-top: none; border-bottom-right-radius: 4px; }
  .border--gold-filigree .corner--br::after { bottom: -3px; right: -3px; }
  /* Center diamonds on each edge */
  .border--gold-filigree .edge-gem {
    position: absolute;
    width: 12px;
    height: 12px;
    background: radial-gradient(circle, #ffd700 25%, rgba(255,215,0,0.2) 60%, transparent);
    border-radius: 50%;
  }
  .border--gold-filigree .edge-gem--top { top: 10px; left: 50%; transform: translateX(-50%); }
  .border--gold-filigree .edge-gem--bottom { bottom: 10px; left: 50%; transform: translateX(-50%); }
  .border--gold-filigree .edge-gem--left { left: 10px; top: 50%; transform: translateY(-50%); }
  .border--gold-filigree .edge-gem--right { right: 10px; top: 50%; transform: translateY(-50%); }
  /* Filigree line accents */
  .border--gold-filigree .filigree {
    position: absolute;
    background: linear-gradient(90deg, transparent, rgba(255,215,0,0.2), transparent);
    height: 1px;
  }
  .border--gold-filigree .filigree--top { top: 20px; left: 60px; right: 60px; }
  .border--gold-filigree .filigree--bottom { bottom: 20px; left: 60px; right: 60px; }

  /* ══════════════════════════════════════
     2. ARCANE RUNES — glowing rune border with sigil corners
     ══════════════════════════════════════ */
  .border--arcane {
    border: 3px solid rgba(106,13,173,0.7);
    box-shadow:
      inset 0 0 0 2px rgba(155,48,255,0.08),
      inset 0 0 15px rgba(155,48,255,0.1),
      0 0 20px rgba(155,48,255,0.15);
  }
  .border--arcane .inner-frame {
    position: absolute;
    inset: 8px;
    border: 1px solid rgba(155,48,255,0.15);
    border-radius: 8px;
  }
  .border--arcane .rune-row {
    position: absolute;
    font-size: 9px;
    letter-spacing: 8px;
    color: rgba(155,48,255,0.35);
    text-align: center;
  }
  .border--arcane .rune-row--top { top: 5px; left: 40px; right: 40px; }
  .border--arcane .rune-row--bottom { bottom: 5px; left: 40px; right: 40px; }
  .border--arcane .rune-col {
    position: absolute;
    writing-mode: vertical-lr;
    font-size: 9px;
    letter-spacing: 10px;
    color: rgba(155,48,255,0.25);
  }
  .border--arcane .rune-col--left { left: 5px; top: 40px; bottom: 40px; }
  .border--arcane .rune-col--right { right: 5px; top: 40px; bottom: 40px; transform: rotate(180deg); }
  .border--arcane .sigil {
    position: absolute;
    width: 28px;
    height: 28px;
    border: 2px solid rgba(155,48,255,0.3);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    color: rgba(155,48,255,0.5);
  }
  .border--arcane .sigil::after {
    content: '';
    position: absolute;
    inset: -6px;
    border: 1px solid rgba(155,48,255,0.12);
    border-radius: 50%;
  }
  .border--arcane .sigil--tl { top: 8px; left: 8px; }
  .border--arcane .sigil--tr { top: 8px; right: 8px; }
  .border--arcane .sigil--bl { bottom: 8px; left: 8px; }
  .border--arcane .sigil--br { bottom: 8px; right: 8px; }
  .border--arcane .arcane-line {
    position: absolute;
    background: linear-gradient(90deg, transparent, rgba(155,48,255,0.15), transparent);
    height: 1px;
  }
  .border--arcane .arcane-line--mid-top { top: 38px; left: 35px; right: 35px; }
  .border--arcane .arcane-line--mid-bottom { bottom: 38px; left: 35px; right: 35px; }

  /* ══════════════════════════════════════
     3. FROST/ICE — crystalline border with ice formations
     ══════════════════════════════════════ */
  .border--frost {
    border: 3px solid rgba(135,206,250,0.5);
    box-shadow:
      inset 0 0 0 2px rgba(200,230,255,0.08),
      inset 0 0 20px rgba(135,206,250,0.08),
      0 0 15px rgba(135,206,250,0.12);
  }
  .border--frost .inner-frame {
    position: absolute;
    inset: 6px;
    border: 1px solid rgba(200,230,255,0.15);
    border-radius: 10px;
  }
  .border--frost .inner-frame::before {
    content: '';
    position: absolute;
    inset: 4px;
    border: 1px solid rgba(200,230,255,0.07);
    border-radius: 8px;
  }
  .border--frost .crystal {
    position: absolute;
    color: rgba(200,230,255,0.3);
    text-shadow: 0 0 4px rgba(135,206,250,0.3);
  }
  .border--frost .crystal--lg { font-size: 18px; }
  .border--frost .crystal--sm { font-size: 12px; }
  .border--frost .frost-line {
    position: absolute;
    background: linear-gradient(90deg, transparent, rgba(200,230,255,0.15), rgba(200,230,255,0.08), transparent);
  }
  .border--frost .frost-line--h { height: 1px; }
  .border--frost .frost-line--v { width: 1px; }

  /* ══════════════════════════════════════
     4. EMBER/FIRE — molten border with heat shimmer
     ══════════════════════════════════════ */
  .border--ember {
    border: 4px solid #922b21;
    box-shadow:
      inset 0 0 0 2px rgba(231,76,60,0.15),
      inset 0 0 15px rgba(231,76,60,0.08),
      0 0 20px rgba(231,76,60,0.2),
      0 0 40px rgba(231,76,60,0.08);
  }
  .border--ember .inner-frame {
    position: absolute;
    inset: 8px;
    border: 1px solid rgba(231,76,60,0.2);
    border-radius: 8px;
  }
  .border--ember .ember-dot {
    position: absolute;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,107,53,0.8), rgba(255,107,53,0.2) 50%, transparent 70%);
    box-shadow: 0 0 6px rgba(255,107,53,0.4);
  }
  .border--ember .ember-dot--lg { width: 10px; height: 10px; }
  .border--ember .ember-dot--sm { width: 6px; height: 6px; }
  .border--ember .ember-line {
    position: absolute;
    background: linear-gradient(90deg, transparent, rgba(231,76,60,0.2), rgba(255,107,53,0.15), transparent);
    height: 1px;
  }

  /* ══════════════════════════════════════
     5. SHADOW/VOID — layered darkness with wisp details
     ══════════════════════════════════════ */
  .border--shadow {
    border: 4px solid #1a1a1a;
    box-shadow:
      inset 0 0 0 2px rgba(80,80,80,0.12),
      inset 0 0 40px rgba(0,0,0,0.6),
      inset 0 0 0 6px rgba(60,60,60,0.08),
      0 0 20px rgba(0,0,0,0.5);
  }
  .border--shadow .inner-frame {
    position: absolute;
    inset: 10px;
    border: 1px solid rgba(100,100,100,0.1);
    border-radius: 6px;
  }
  .border--shadow .inner-frame::before {
    content: '';
    position: absolute;
    inset: 5px;
    border: 1px dashed rgba(80,80,80,0.08);
    border-radius: 4px;
  }
  .border--shadow .wisp {
    position: absolute;
    background: linear-gradient(90deg, transparent, rgba(100,100,100,0.2), transparent);
    height: 1px;
  }
  .border--shadow .wisp--v {
    width: 1px;
    height: auto;
    background: linear-gradient(180deg, transparent, rgba(100,100,100,0.15), transparent);
  }
  .border--shadow .void-dot {
    position: absolute;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: rgba(80,80,80,0.25);
    box-shadow: 0 0 4px rgba(60,60,60,0.3);
  }

  /* ══════════════════════════════════════
     6. NATURE/VERDANT — vine border with leaf accents
     ══════════════════════════════════════ */
  .border--nature {
    border: 4px solid #2d6a4f;
    box-shadow:
      inset 0 0 0 2px rgba(82,183,136,0.1),
      inset 0 0 15px rgba(82,183,136,0.06),
      0 0 15px rgba(82,183,136,0.12);
  }
  .border--nature .inner-frame {
    position: absolute;
    inset: 8px;
    border: 1px solid rgba(82,183,136,0.18);
    border-radius: 8px;
  }
  .border--nature .vine {
    position: absolute;
    color: rgba(82,183,136,0.35);
    text-shadow: 0 0 3px rgba(82,183,136,0.2);
  }
  .border--nature .vine--lg { font-size: 18px; }
  .border--nature .vine--sm { font-size: 13px; }
  .border--nature .vine-line {
    position: absolute;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(82,183,136,0.15), transparent);
  }
  .border--nature .vine-line--v {
    width: 1px;
    height: auto;
    background: linear-gradient(180deg, transparent, rgba(82,183,136,0.12), transparent);
  }

  /* ══════════════════════════════════════
     7. CIRCUIT/CYBER — PCB trace border with node details
     ══════════════════════════════════════ */
  .border--circuit {
    border: 2px solid rgba(0,255,255,0.6);
    box-shadow:
      inset 0 0 0 1px rgba(0,255,255,0.08),
      inset 0 0 12px rgba(0,255,255,0.04),
      0 0 15px rgba(0,255,255,0.12);
  }
  .border--circuit .inner-frame {
    position: absolute;
    inset: 8px;
    border: 1px solid rgba(0,255,255,0.1);
    border-radius: 6px;
  }
  .border--circuit .trace {
    position: absolute;
    background: rgba(0,255,255,0.2);
  }
  .border--circuit .trace--h { height: 1px; }
  .border--circuit .trace--v { width: 1px; }
  .border--circuit .node {
    position: absolute;
    width: 8px;
    height: 8px;
    border: 1.5px solid rgba(0,255,255,0.5);
    border-radius: 50%;
    box-shadow: 0 0 4px rgba(0,255,255,0.3);
  }
  .border--circuit .node::after {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    width: 3px;
    height: 3px;
    background: rgba(0,255,255,0.6);
    border-radius: 50%;
    transform: translate(-50%, -50%);
  }
  .border--circuit .chip {
    position: absolute;
    width: 14px;
    height: 14px;
    border: 1px solid rgba(0,255,255,0.25);
    border-radius: 2px;
  }

  /* ══════════════════════════════════════
     8. ROYAL/ORNATE — heavy ornamental with crown + flourishes
     ══════════════════════════════════════ */
  .border--royal {
    border: 6px solid #c9a84c;
    box-shadow:
      inset 0 0 0 2px #1a1400,
      inset 0 0 0 4px rgba(201,168,76,0.2),
      inset 0 0 0 6px #1a1400,
      inset 0 0 0 8px rgba(201,168,76,0.1),
      0 0 20px rgba(201,168,76,0.15);
    position: relative;
  }
  .border--royal .inner-frame {
    position: absolute;
    inset: 12px;
    border: 1.5px solid rgba(201,168,76,0.25);
    border-radius: 4px;
  }
  .border--royal .inner-frame::before {
    content: '';
    position: absolute;
    inset: 5px;
    border: 1px solid rgba(201,168,76,0.1);
    border-radius: 3px;
  }
  .border--royal .crown {
    position: absolute;
    top: 4px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 20px;
    color: rgba(201,168,76,0.6);
    text-shadow: 0 0 6px rgba(201,168,76,0.3);
  }
  .border--royal .flourish {
    position: absolute;
    font-size: 22px;
    color: rgba(201,168,76,0.3);
    text-shadow: 0 0 4px rgba(201,168,76,0.15);
  }
  .border--royal .royal-line {
    position: absolute;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(201,168,76,0.2), rgba(201,168,76,0.3), rgba(201,168,76,0.2), transparent);
  }
  .border--royal .royal-dot {
    position: absolute;
    width: 6px;
    height: 6px;
    background: radial-gradient(circle, rgba(201,168,76,0.5), transparent 70%);
    border-radius: 50%;
  }

  /* Label — only for preview, hidden during capture */
  .border-label {
    position: absolute;
    bottom: -24px;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    color: rgba(255,255,255,0.3);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    white-space: nowrap;
  }
</style>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>

<!-- 1. Gold Filigree -->
<div class="border-frame border--gold-filigree" id="border-gold-filigree">
  <div class="inner-frame"></div>
  <div class="corner corner--tl"></div>
  <div class="corner corner--tr"></div>
  <div class="corner corner--bl"></div>
  <div class="corner corner--br"></div>
  <div class="edge-gem edge-gem--top"></div>
  <div class="edge-gem edge-gem--bottom"></div>
  <div class="edge-gem edge-gem--left"></div>
  <div class="edge-gem edge-gem--right"></div>
  <div class="filigree filigree--top"></div>
  <div class="filigree filigree--bottom"></div>
  <div class="border-label">Gold Filigree</div>
</div>

<!-- 2. Arcane Runes -->
<div class="border-frame border--arcane" id="border-arcane">
  <div class="inner-frame"></div>
  <div class="rune-row rune-row--top">⬡ ◆ ⬡ ◆ ⬡ ◆ ⬡ ◆ ⬡ ◆ ⬡</div>
  <div class="rune-row rune-row--bottom">⬡ ◆ ⬡ ◆ ⬡ ◆ ⬡ ◆ ⬡ ◆ ⬡</div>
  <div class="rune-col rune-col--left">◆ ⬡ ◆ ⬡ ◆ ⬡ ◆ ⬡ ◆</div>
  <div class="rune-col rune-col--right">◆ ⬡ ◆ ⬡ ◆ ⬡ ◆ ⬡ ◆</div>
  <div class="sigil sigil--tl">✦</div>
  <div class="sigil sigil--tr">✦</div>
  <div class="sigil sigil--bl">✦</div>
  <div class="sigil sigil--br">✦</div>
  <div class="arcane-line arcane-line--mid-top"></div>
  <div class="arcane-line arcane-line--mid-bottom"></div>
  <div class="border-label">Arcane Runes</div>
</div>

<!-- 3. Frost -->
<div class="border-frame border--frost" id="border-frost">
  <div class="inner-frame"></div>
  <span class="crystal crystal--lg" style="top:6px;left:14px;">❄</span>
  <span class="crystal crystal--lg" style="top:6px;right:14px;">❄</span>
  <span class="crystal crystal--lg" style="bottom:6px;left:14px;">❄</span>
  <span class="crystal crystal--lg" style="bottom:6px;right:14px;">❄</span>
  <span class="crystal crystal--sm" style="top:6px;left:50%;transform:translateX(-50%);">❅</span>
  <span class="crystal crystal--sm" style="bottom:6px;left:50%;transform:translateX(-50%);">❅</span>
  <span class="crystal crystal--sm" style="top:50%;left:6px;transform:translateY(-50%);">❅</span>
  <span class="crystal crystal--sm" style="top:50%;right:6px;transform:translateY(-50%);">❅</span>
  <span class="crystal crystal--sm" style="top:25%;left:6px;">✧</span>
  <span class="crystal crystal--sm" style="top:75%;left:6px;">✧</span>
  <span class="crystal crystal--sm" style="top:25%;right:6px;">✧</span>
  <span class="crystal crystal--sm" style="top:75%;right:6px;">✧</span>
  <div class="frost-line frost-line--h" style="top:18px;left:40px;right:40px;"></div>
  <div class="frost-line frost-line--h" style="bottom:18px;left:40px;right:40px;"></div>
  <div class="border-label">Frost</div>
</div>

<!-- 4. Ember -->
<div class="border-frame border--ember" id="border-ember">
  <div class="inner-frame"></div>
  <div class="ember-dot ember-dot--lg" style="top:8px;left:10px;"></div>
  <div class="ember-dot ember-dot--lg" style="top:8px;right:10px;"></div>
  <div class="ember-dot ember-dot--lg" style="bottom:8px;left:10px;"></div>
  <div class="ember-dot ember-dot--lg" style="bottom:8px;right:10px;"></div>
  <div class="ember-dot ember-dot--sm" style="top:8px;left:50%;transform:translateX(-50%);"></div>
  <div class="ember-dot ember-dot--sm" style="bottom:8px;left:50%;transform:translateX(-50%);"></div>
  <div class="ember-dot ember-dot--sm" style="top:50%;left:8px;"></div>
  <div class="ember-dot ember-dot--sm" style="top:50%;right:8px;"></div>
  <div class="ember-dot ember-dot--sm" style="top:25%;left:8px;"></div>
  <div class="ember-dot ember-dot--sm" style="top:75%;right:8px;"></div>
  <div class="ember-line" style="top:20px;left:45px;right:45px;"></div>
  <div class="ember-line" style="bottom:20px;left:45px;right:45px;"></div>
  <div class="border-label">Ember</div>
</div>

<!-- 5. Shadow -->
<div class="border-frame border--shadow" id="border-shadow">
  <div class="inner-frame"></div>
  <div class="wisp" style="top:25px;left:15px;width:70px;"></div>
  <div class="wisp" style="top:50px;right:15px;width:50px;"></div>
  <div class="wisp" style="bottom:25px;left:15px;width:60px;"></div>
  <div class="wisp" style="bottom:50px;right:15px;width:45px;"></div>
  <div class="wisp wisp--v" style="top:50px;left:15px;bottom:50px;"></div>
  <div class="wisp wisp--v" style="top:50px;right:15px;bottom:50px;"></div>
  <div class="void-dot" style="top:14px;left:14px;"></div>
  <div class="void-dot" style="top:14px;right:14px;"></div>
  <div class="void-dot" style="bottom:14px;left:14px;"></div>
  <div class="void-dot" style="bottom:14px;right:14px;"></div>
  <div class="void-dot" style="top:14px;left:50%;"></div>
  <div class="void-dot" style="bottom:14px;left:50%;"></div>
  <div class="border-label">Shadow</div>
</div>

<!-- 6. Nature -->
<div class="border-frame border--nature" id="border-nature">
  <div class="inner-frame"></div>
  <span class="vine vine--lg" style="top:4px;left:10px;">🌿</span>
  <span class="vine vine--sm" style="top:4px;left:50%;transform:translateX(-50%);">🍃</span>
  <span class="vine vine--lg" style="top:4px;right:10px;">🌿</span>
  <span class="vine vine--lg" style="bottom:28px;left:10px;">🌱</span>
  <span class="vine vine--sm" style="bottom:28px;left:50%;transform:translateX(-50%);">🍃</span>
  <span class="vine vine--lg" style="bottom:28px;right:10px;">🌱</span>
  <span class="vine vine--sm" style="top:50%;left:4px;transform:translateY(-50%);">🌿</span>
  <span class="vine vine--sm" style="top:50%;right:4px;transform:translateY(-50%);">🌿</span>
  <span class="vine vine--sm" style="top:25%;left:4px;">🍃</span>
  <span class="vine vine--sm" style="top:75%;left:4px;">🍃</span>
  <span class="vine vine--sm" style="top:25%;right:4px;">🌱</span>
  <span class="vine vine--sm" style="top:75%;right:4px;">🌱</span>
  <div class="vine-line" style="top:22px;left:40px;right:40px;"></div>
  <div class="vine-line" style="bottom:22px;left:40px;right:40px;"></div>
  <div class="vine-line vine-line--v" style="left:22px;top:40px;bottom:40px;"></div>
  <div class="vine-line vine-line--v" style="right:22px;top:40px;bottom:40px;"></div>

<!-- 7. Circuit -->
<div class="border-frame border--circuit" id="border-circuit">
  <div class="inner-frame"></div>
  <!-- Top traces -->
  <div class="trace trace--h" style="top:12px;left:14px;width:70px;"></div>
  <div class="trace trace--v" style="top:12px;left:84px;height:35px;"></div>
  <div class="trace trace--h" style="top:47px;left:84px;width:30px;"></div>
  <div class="trace trace--h" style="top:12px;right:14px;width:70px;"></div>
  <div class="trace trace--v" style="top:12px;right:84px;height:35px;"></div>
  <div class="trace trace--h" style="top:47px;right:84px;width:30px;"></div>
  <!-- Bottom traces -->
  <div class="trace trace--h" style="bottom:12px;left:14px;width:60px;"></div>

  <div class="trace trace--v" style="bottom:12px;right:74px;height:28px;"></div>

  <div class="trace trace--v" style="left:12px;top:60px;height:40px;"></div>
  <div class="trace trace--h" style="top:100px;left:12px;width:20px;"></div>
  <div class="trace trace--v" style="right:12px;top:60px;height:40px;"></div>
  <div class="trace trace--h" style="top:100px;right:12px;width:20px;"></div>

  <div class="node" style="top:8px;left:10px;"></div>
  <div class="node" style="top:8px;right:10px;"></div>
  <div class="node" style="bottom:8px;left:10px;"></div>
  <div class="node" style="bottom:8px;right:10px;"></div>
  <!-- Mid nodes -->
  <div class="node" style="top:8px;left:50%;transform:translateX(-50%);"></div>
  <div class="node" style="bottom:8px;left:50%;transform:translateX(-50%);"></div>
  <!-- Chips -->
  <div class="chip" style="top:43px;left:80px;"></div>
  <div class="chip" style="top:43px;right:80px;"></div>
  <div class="chip" style="bottom:36px;left:70px;"></div>
  <div class="chip" style="bottom:36px;right:70px;"></div>
  <div class="border-label">Circuit</div>
</div>

<!-- 8. Royal -->
<div class="border-frame border--royal" id="border-royal">
  <div class="inner-frame"></div>
  <div class="crown">♛</div>
  <div class="flourish" style="top:50%;left:6px;transform:translateY(-50%);">❧</div>

  <div class="flourish" style="top:30%;right:6px;font-size:14px;transform:scaleX(-1);">❦</div>
  <div class="flourish" style="top:70%;right:6px;font-size:14px;transform:scaleX(-1);">❦</div>
  <div class="royal-line" style="top:28px;left:50px;right:50px;"></div>
  <div class="royal-line" style="bottom:28px;left:50px;right:50px;"></div>
